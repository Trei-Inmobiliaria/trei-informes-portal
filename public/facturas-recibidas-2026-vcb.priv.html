  h1{font:700 20px var(--f);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
  p{color:var(--t3);margin-bottom:12px}
  .ico{font-size:48px;margin-bottom:16px}
  a{color:var(--rojo);text-decoration:none;font-weight:500}
  a:hover{text-decoration:underline}
</style>
