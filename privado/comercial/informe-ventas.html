  if (t) t.innerHTML = buildProyTable();
}

// Marca/desmarca una reserva y persiste el cambio en Supabase (upsert por id_producto).
function toggleMarcaReserva(id, checked) {
  id = String(id);
  if (checked) PROY_MARCADAS.add(id); else PROY_MARCADAS.delete(id);
  const rec = (RES_BACKLOG_LIST || []).find(r => String(r.id) === id) || {};
  fetch(`${SB_URL}/rest/v1/proyeccion_reservas`, {
    method: 'POST',
    headers: { ...HEADERS, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({
      id_producto: id, proyecto: rec.proyecto || null, subagrupacion: rec.subagrupacion || null,
      propiedad: rec.propiedad || null, marcada: checked, updated_at: new Date().toISOString()
    })
  }).catch(() => {});
  // refrescar fila (fondo), resumen y cuadro de proyección
  const ps = document.getElementById('proy-summary'); if (ps) ps.innerHTML = proySummaryText();
  const pc = document.getElementById('cuadro-proyeccion'); if (pc) pc.innerHTML = buildCuadroProyeccion();
  const t = document.getElementById('proy-table'); if (t) t.innerHTML = buildProyTable();
}

// Carga las marcas guardadas desde Supabase.
async function fetchMarcadas() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/proyeccion_reservas?select=id_producto,marcada&marcada=eq.true`, { headers: HEADERS });
    if (r.ok) { const rows = await r.json(); PROY_MARCADAS = new Set(rows.map(x => String(x.id_producto))); }
  } catch (e) { /* si falla, queda vacío */ }
}

// Carga la superficie de terraza por unidad (para el UF/m² del Scanner).
// Fuente: vista terraza_por_producto (desde cotizaciones_pok). m² efectivo = útil + ½ terraza.
async function fetchTerrazas() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/terraza_por_producto?select=id_producto,sup_terraza`, { headers: { ...HEADERS, 'Range': '0-99999' } });
    if (r.ok) {
      const rows = await r.json();
      TERRAZA_BY_ID = {};
      for (const x of rows) { const t = parseFloat(x.sup_terraza); if (t > 0) TERRAZA_BY_ID[String(x.id_producto)] = t; }
    }
  } catch (e) { /* si falla, el scanner usa solo m² útil */ }
}

// ── PROMESAS EMITIDAS, FIRMA POR CARGAR ──────────────────────────────────────
// Detalle de las operaciones que entran al mes por su fecha de emision porque la
// firma del comprador todavia no se carga en PlanOk. Vienen de v_promesas_sin_firma.
// Si no hay ninguna, no se pinta nada.
let ALL_PROM_SIN_FIRMA = [];
function renderPromesasPorFirmar(fecha_corte) {
  const items = (ALL_PROM_SIN_FIRMA || []).filter(r => inMonthFull(r.fecha_evento, fecha_corte));
  if (!items.length) return '';
  const ufTot = items.reduce((a, r) => a + (parseFloat(r.total_venta_uf) || 0), 0);
  const filas = items.map(r => {
    const d = parseInt(r.dias_sin_firma, 10) || 0;
    const alerta = d >= 10 ? 'color:#E1093F;font-weight:600' : '';
    return '<tr>' +
      '<td style="padding:6px 8px">' + (r.proyecto || '') + '</td>' +
      '<td style="padding:6px 8px">' + (r.producto || '') + '</td>' +
      '<td style="padding:6px 8px">' + (r.cliente || '') + '</td>' +
      '<td style="padding:6px 8px;text-align:right">' + fmtUF(Math.round(parseFloat(r.total_venta_uf) || 0)) + '</td>' +
      '<td style="padding:6px 8px">' + String(r.fecha_evento || '').substring(0, 10).split('-').reverse().join('-') + '</td>' +
      '<td style="padding:6px 8px;text-align:right;' + alerta + '">' + d + '</td>' +
      '<td style="padding:6px 8px">' + (r.borrador_usuario || '-') + '</td>' +
      '</tr>';
  }).join('');
  return '<div class="proj-box" style="margin-top:18px">' +
    '<h3 style="margin:0 0 4px">Promesas emitidas, firma por cargar</h3>' +
    '<p style="color:#666;font-size:13px;margin:0 0 12px;line-height:1.5">' + items.length + ' ' +
      (items.length === 1 ? 'operacion' : 'operaciones') + ' &middot; ' + fmtUF(Math.round(ufTot)) +
      ' UF &middot; ya contadas en las promesas del mes por su fecha de emision. En PlanOk la unidad ' +
      'sigue como reservada hasta que se cargue la firma del comprador.</p>' +
    '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
    '<thead><tr style="text-align:left;border-bottom:1px solid #ddd">' +
    '<th style="padding:6px 8px">Proyecto</th><th style="padding:6px 8px">Unidad</th>' +
    '<th style="padding:6px 8px">Cliente</th><th style="padding:6px 8px;text-align:right">UF</th>' +
    '<th style="padding:6px 8px">Emitida</th><th style="padding:6px 8px;text-align:right">Dias</th>' +
    '<th style="padding:6px 8px">Ejecutivo</th></tr></thead><tbody>' + filas + '</tbody></table></div>';
}

function renderResumen(fecha_corte, port, mov, movSub, ytd, ytdSub, vendedorMap, desis) {
  // FIX 07-09-2026: referencia al mes REAL (calendario actual) antes de que el
  // override de "mes en foco" (más abajo) pueda reasignar mov/movSub a un mes
  // anterior reabierto. Se usa solo para no perder la inyección en vivo del mes
  // real en el Acumulado Año (ver bloque "injectCurrentMonthAcum(realMesYM..." ).
  const movReal = mov, movSubReal = movSub;
  let { desisMes={}, desisYtd={}, desisHistoria={},
          totDesisMesUN=0, totDesisMesUF=0,
          totDesisYtdUN=0, totDesisYtdUF=0 } = desis || {};

  // ── FIX 07-09-2026: "mes en foco" para Resumen Mes / Escrituras Mes ────────
  // Si hay un mes ya terminado sin cierre oficial (ej. agosto reabierto para
  // cargar promesas faltantes -- ver injectMesesSinCierre), estas dos vistas se
  // quedan mostrando ESE mes en vez de saltar solas al mes calendario más
  // reciente. Los movimientos se recalculan desde el snapshot MÁS FRESCO
  // (ALL_DATA_MOV / ALL_PROM_SIN_FIRMA), así que las promesas que se sigan
  // cargando con fecha de ese mes aparecen igual. Apenas el mes se cierre
  // oficialmente (cerrar_mes), ACUM_MESES_SIN_CIERRE vuelve a quedar vacío y
  // la vista retoma sola el corte más reciente. No toca ninguna otra pestaña:
  // Proyectos, Backlog, Detalle Operaciones, Desistimientos y Acumulado Año
  // siguen usando fecha_corte real (en vivo), sin cambios.
  let fechaCorteFoco = fecha_corte;
  const mesFocoYM = (ACUM_MESES_SIN_CIERRE && ACUM_MESES_SIN_CIERRE.length) ? ACUM_MESES_SIN_CIERRE[0] : null;
  if (mesFocoYM && mesFocoYM !== fecha_corte.slice(0, 7)) {
    const [yFoco, mFoco] = mesFocoYM.split('-').map(Number);
    fechaCorteFoco = `${mesFocoYM}-${String(new Date(yFoco, mFoco, 0).getDate()).padStart(2, '0')}`;
    const movFoco = {}, movSubFoco = {};
    for (const p of PROYECTOS) { movFoco[p] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 }; movSubFoco[p] = {}; }
    for (const row of (ALL_DATA_MOV || [])) {
      const p = row.proyecto; if (!movFoco[p]) continue;
      const uf = parseFloat(row.precio_total_operacion_uf) || 0;
      const sub = row.subagrupacion || '—';
      if (!movSubFoco[p][sub]) movSubFoco[p][sub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
      const ms = movSubFoco[p][sub];
      if (inMonthFull(row.fecha_reserva, fechaCorteFoco))   { movFoco[p].resUN++;  movFoco[p].resUF += uf;  ms.resUN++;  ms.resUF += uf; }
      if (inMonthFull(row.fecha_promesa, fechaCorteFoco))   { movFoco[p].promUN++; movFoco[p].promUF += uf; ms.promUN++; ms.promUF += uf; }
      if (inMonthFull(row.fecha_escritura, fechaCorteFoco) && row.estado_corte === 'ESCRITURADO')
        { movFoco[p].escrUN++; movFoco[p].escrUF += uf; ms.escrUN++; ms.escrUF += uf; }
    }
    for (const row of (ALL_PROM_SIN_FIRMA || [])) {
      const p = row.proyecto; if (!movFoco[p]) continue;
      if (!inMonthFull(row.fecha_evento, fechaCorteFoco)) continue;
      const uf = parseFloat(row.total_venta_uf) || 0;
      const sub = row.subagrupacion || '—';
      if (!movSubFoco[p][sub]) movSubFoco[p][sub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
      movFoco[p].promUN++; movFoco[p].promUF += uf;
      movSubFoco[p][sub].promUN++; movSubFoco[p][sub].promUF += uf;
    }
    mov = movFoco; movSub = movSubFoco;
    // Desistimientos del mes en foco (mismo criterio que injectMesesSinCierre).
    let focoDesUN = 0, focoDesUF = 0;
    for (const d of (ALL_DESIS || [])) {
      if (!d.fecha_cancelacion || d.fecha_cancelacion.slice(0, 7) !== mesFocoYM) continue;
      focoDesUN++; focoDesUF += (parseFloat(d.precio_uf) || 0);
    }
    totDesisMesUN = focoDesUN; totDesisMesUF = focoDesUF;
  }
  MOV_CORTE_FOCO = fechaCorteFoco;

  // ── Contar RESERVAS como PROMESAS (solo en esta vista Resumen Mes) ──
  // Cromático y Mirador Santa Teresita aún no tienen permiso de edificación, por lo que
  // sus operaciones se ingresan como reservas en el CRM. Para el reporte de gestión se
  // presentan como promesas (mismo criterio que el consolidado anual/cierre oficial).
  // Se reclasifica sobre CLONES de los agregados para NO afectar la pestaña del proyecto
  // ni velocidad.
  const RECLAS_PROY = ['CROMATICO', 'MIRADOR SANTA TERESITA'];
  port   = JSON.parse(JSON.stringify(port));
  mov    = JSON.parse(JSON.stringify(mov));
  movSub = JSON.parse(JSON.stringify(movSub));
  ytd    = JSON.parse(JSON.stringify(ytd));
  ytdSub = JSON.parse(JSON.stringify(ytdSub));
  for (const _RECLAS of RECLAS_PROY) {
    const pp = port[_RECLAS];
    if (pp) { pp.P += pp.R; pp.ufP += pp.ufR; pp.R = 0; pp.ufR = 0; }
    const mv = mov[_RECLAS];
    if (mv) { mv.promUN += mv.resUN; mv.promUF += mv.resUF; mv.resUN = 0; mv.resUF = 0; }
    const yt = ytd[_RECLAS];
    if (yt) { yt.promUN += yt.resUN; yt.promUF += yt.resUF; yt.resUN = 0; yt.resUF = 0; }
    for (const s in (movSub[_RECLAS] || {})) {
      const m = movSub[_RECLAS][s];
      m.promUN += m.resUN; m.promUF += m.resUF; m.resUN = 0; m.resUF = 0;
    }
    for (const s in (ytdSub[_RECLAS] || {})) {
      const y = ytdSub[_RECLAS][s];
      y.promUN += y.resUN; y.promUF += y.resUF; y.resUN = 0; y.resUF = 0;
    }
  }

  const totalMov = PROYECTOS.reduce((a,p) => ({
    resUN: a.resUN + mov[p].resUN, resUF: a.resUF + mov[p].resUF,
    promUN: a.promUN + mov[p].promUN, promUF: a.promUF + mov[p].promUF,
    escrUN: a.escrUN + mov[p].escrUN, escrUF: a.escrUF + mov[p].escrUF
  }), {resUN:0,resUF:0,promUN:0,promUF:0,escrUN:0,escrUF:0});

  const totVendMes = totalMov.resUN + totalMov.promUN + totalMov.escrUN;
  const totUFMes   = totalMov.resUF + totalMov.promUF + totalMov.escrUF;

  // mes label
  const corteD = new Date(fechaCorteFoco);
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesLabel = meses[corteD.getMonth()] + ' ' + corteD.getFullYear();

  // portafolio totales
  let totInv=0,totE=0,totP=0,totR=0,totD=0,totUFE=0,totUFP=0,totUFR=0,totUFD=0;
  for (const p of PROYECTOS) {
    const pp = port[p];
    totInv += pp.E+pp.P+pp.R+pp.D;
    totE+=pp.E; totP+=pp.P; totR+=pp.R; totD+=pp.D;
    totUFE+=pp.ufE; totUFP+=pp.ufP; totUFR+=pp.ufR; totUFD+=pp.ufD;
  }
  const totBacklog = totP+totR;
  const totUFBack  = totUFP+totUFR;

  // tabla desglose movimientos (con sub-filas expandibles por subagrupación)
  MOV_CORTE = fecha_corte;
  // Reservas vigentes con <30 días de antigüedad (para la Proyección de Cierre)
  const resLt30 = {}, resLt30Sub = {};
  for (const p of PROYECTOS) { resLt30[p] = { un:0, uf:0 }; resLt30Sub[p] = {}; }
  for (const row of (ALL_DATA || [])) {
    const p = row.proyecto;
    if (!resLt30[p] || row.estado_corte !== 'RESERVADO' || !row.fecha_reserva) continue;
    if (daysDiff(new Date(row.fecha_reserva), CORTE_DATE) >= 30) continue;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    resLt30[p].un++; resLt30[p].uf += uf;
    const sub = row.subagrupacion || '—';
    if (!resLt30Sub[p][sub]) resLt30Sub[p][sub] = { un:0, uf:0 };
    resLt30Sub[p][sub].un++; resLt30Sub[p][sub].uf += uf;
  }
  // Proyección de Cierre = Promesas del mes + Reservas backlog <30 días
  const proyCell = (promUN, promUF, r, excl) => {
    if (excl) return `<td style="background:#eef3f8;color:#bbb" title="No aplica a Cromático (preconstrucción)">—</td><td style="background:#eef3f8;color:#bbb">—</td>`;
    const un = promUN + (r ? r.un : 0), uf = promUF + (r ? r.uf : 0);
    return `<td style="background:#eef3f8;font-weight:700;color:#111111">${un||'—'}</td><td style="background:#eef3f8;color:#111111">${uf?fmtUF(uf):'—'}</td>`;
  };
  // Celda Un hoverable → tooltip con el detalle de unidades (qué deptos)
  const movCell = (n, proy, sub, tipo) => n > 0
    ? `<td class="bk-clickable" data-proy="${proy}" data-sub="${(sub||'').replace(/"/g,'&quot;')}" data-tipo="${tipo}" onmouseenter="showMovTip(event,this)" onmouseleave="hideBkTip()" title="Ver unidades">${n}</td>`
    : `<td>${n||'—'}</td>`;
  let rowsMov = PROYECTOS.map(p => {
    const m = mov[p];
    const subs = Object.keys(movSub[p] || {});
    const hasMulti = subs.length > 1;
    const gid = 'mov-' + (PROY_TAB[p] || p);
    const mainRow = `<tr class="${hasMulti ? 'proj-expandable' : ''}" ${hasMulti ? `onclick="toggleSub('${gid}')"` : ''}>
      <td><span class="toggle-icon" id="icon-${gid}">${hasMulti ? '▶' : ''}</span>${PROY_LABEL[p]}</td>
      ${movCell(m.resUN,p,'','res')}<td>${m.resUF?fmtUF(m.resUF):'—'}</td>
      ${movCell(m.promUN,p,'','prom')}<td>${m.promUF?fmtUF(m.promUF):'—'}</td>
      ${proyCell(m.promUN, m.promUF, resLt30[p], p==='CROMATICO')}
      ${movCell(m.escrUN,p,'','escr')}<td>${m.escrUF?fmtUF(m.escrUF):'—'}</td>
    </tr>`;
    const subRows = hasMulti ? subs.sort().map(sub => {
      const s = movSub[p][sub];
      const hasAny = s.resUN||s.promUN||s.escrUN;
      if (!hasAny) return '';
      return `<tr class="sub-row ${gid}" style="display:none">
        <td>${sub}</td>
        ${movCell(s.resUN,p,sub,'res')}<td>${s.resUF?fmtUF(s.resUF):'—'}</td>
        ${movCell(s.promUN,p,sub,'prom')}<td>${s.promUF?fmtUF(s.promUF):'—'}</td>
        ${proyCell(s.promUN, s.promUF, resLt30Sub[p][sub], p==='CROMATICO')}
        ${movCell(s.escrUN,p,sub,'escr')}<td>${s.escrUF?fmtUF(s.escrUF):'—'}</td>
      </tr>`;
    }).join('') : '';
    return mainRow + subRows;
  }).join('');
  // Totales Proyección de Cierre (portafolio, excluye Cromático)
  const totProyUN = PROYECTOS.filter(p=>p!=='CROMATICO').reduce((a,p)=>a + mov[p].promUN + resLt30[p].un, 0);
  const totProyUF = PROYECTOS.filter(p=>p!=='CROMATICO').reduce((a,p)=>a + mov[p].promUF + resLt30[p].uf, 0);

  // ── YTD: label y totales ─────────────────────────────────────────────────
  const mesAnterior = new Date(corteD.getFullYear(), corteD.getMonth() - 1, 1);
  const mesAntLabel = meses[mesAnterior.getMonth()] + ' ' + mesAnterior.getFullYear();
  const ytdLabel    = corteD.getMonth() > 1
    ? `Enero – ${mesAntLabel}`
    : mesAntLabel; // si estamos en febrero, solo muestra "Enero YYYY"

  const totalYTD = PROYECTOS.reduce((a,p) => ({
    resUN: a.resUN + ytd[p].resUN, resUF: a.resUF + ytd[p].resUF,
    promUN: a.promUN + ytd[p].promUN, promUF: a.promUF + ytd[p].promUF,
    escrUN: a.escrUN + ytd[p].escrUN, escrUF: a.escrUF + ytd[p].escrUF
  }), {resUN:0,resUF:0,promUN:0,promUF:0,escrUN:0,escrUF:0});

  let rowsYTD = PROYECTOS.map(p => {
    const y = ytd[p];
    const subs = Object.keys(ytdSub[p] || {});
    const hasMulti = subs.length > 1;
    const gid = 'ytd-' + (PROY_TAB[p] || p);
    const mainRow = `<tr class="${hasMulti ? 'proj-expandable' : ''}" ${hasMulti ? `onclick="toggleSub('${gid}')"` : ''}>
      <td><span class="toggle-icon" id="icon-${gid}">${hasMulti ? '▶' : ''}</span>${PROY_LABEL[p]}</td>
      <td>${y.resUN||'—'}</td><td>${y.resUF?fmtUF(y.resUF):'—'}</td>
      <td>${y.promUN||'—'}</td><td>${y.promUF?fmtUF(y.promUF):'—'}</td>
      <td>${y.escrUN||'—'}</td><td>${y.escrUF?fmtUF(y.escrUF):'—'}</td>
    </tr>`;
    const subRows = hasMulti ? subs.sort().map(sub => {
      const s = ytdSub[p][sub];
      const hasAny = s.resUN||s.promUN||s.escrUN;
      if (!hasAny) return '';
      return `<tr class="sub-row ${gid}" style="display:none">
        <td>${sub}</td>
        <td>${s.resUN||'—'}</td><td>${s.resUF?fmtUF(s.resUF):'—'}</td>
        <td>${s.promUN||'—'}</td><td>${s.promUF?fmtUF(s.promUF):'—'}</td>
        <td>${s.escrUN||'—'}</td><td>${s.escrUF?fmtUF(s.escrUF):'—'}</td>
      </tr>`;
    }).join('') : '';
    return mainRow + subRows;
  }).join('');

  // tabla portafolio
  let rowsPort = PROYECTOS.map(p => {
    const pp = port[p]; const inv = pp.E+pp.P+pp.R+pp.D;
    const vend = pp.E+pp.P+pp.R; const pctV = pct(vend,inv);
    const back = pp.P+pp.R; const ufBack = pp.ufP+pp.ufR;
    const color = barColor(pctV);
    const escrBadge = pp.E ? `<span class="badge b-escr">${pp.E}</span>` : '<span class="badge b-escr">—</span>';
    return `<tr>
      <td>${PROY_LABEL[p]}</td>
      <td>${fmt(inv)}</td>
      <td>${escrBadge}</td>
      <td><span class="badge b-prom">${back}</span></td>
      <td><span class="badge b-disp">${pp.D}</span></td>
      <td>${pp.ufE?fmtMUF(pp.ufE):'—'}</td>
      <td>${fmtMUF(ufBack)}</td>
      <td>${bar(pctV,color)}</td>
    </tr>`;
  }).join('');

  const totPct = pct(totE+totBacklog, totInv);

  // ── Reservas vigentes al corte (stock), separadas por mes de reserva ─────────
  //   Reservas Meses Anteriores = reservadas en meses anteriores al mes del corte
  //   Reservas Mes              = reservadas dentro del mes del corte
  const mesYM = fechaCorteFoco.slice(0, 7);
  // % Avance Año (columna del cuadro Promesas) compara el acumulado real SOLO
  // hasta este mismo mes contra el presupuesto de esos mismos meses — no el año
  // completo — para que sea comparable al "acumulado ene-mes" que ya se reporta
  // en el correo de cierre mensual. Se autoajusta: si agosto está reabierto y en
  // foco, el corte queda en agosto (igual que hoy); una vez recerrado, vuelve a
  // seguir el mes real en curso sin tocar código.
  RES_AVANCE_ANIO_MES = mesYM;
  const safeTab = (p) => 'x' + String(PROY_TAB[p] || p).replace(/[^a-z0-9]/gi, '');
  // Reservas vigentes (stock RESERVADO) por proyecto y por subagrupación, separadas por mes.
  const resBack = {}, resBackSub = {};
  for (const p of PROYECTOS) { resBack[p] = { totUN:0, totUF:0, mesUN:0, mesUF:0 }; resBackSub[p] = {}; }
  for (const row of (ALL_DATA || [])) {
    if (row.estado_corte !== 'RESERVADO') continue;
    const p = row.proyecto; if (!resBack[p]) continue;
    const uf  = parseFloat(row.precio_total_operacion_uf) || 0;
    const sub = row.subagrupacion || '—';
    const rym = row.fecha_reserva ? String(row.fecha_reserva).slice(0, 7) : '';
    if (!resBackSub[p][sub]) resBackSub[p][sub] = { totUN:0, totUF:0, mesUN:0, mesUF:0 };
    if (rym === mesYM) { resBack[p].mesUN++; resBack[p].mesUF += uf; resBackSub[p][sub].mesUN++; resBackSub[p][sub].mesUF += uf; }
    else               { resBack[p].totUN++; resBack[p].totUF += uf; resBackSub[p][sub].totUN++; resBackSub[p][sub].totUF += uf; }
  }
  // Backlog de reservas vigentes al corte (para la vista Proyección Cierre y su selección).
  RES_BACKLOG_LIST = (ALL_DATA || [])
    .filter(r => r.estado_corte === 'RESERVADO')
    .map(r => ({
      id: String(r.id_producto), proyecto: r.proyecto, subagrupacion: r.subagrupacion || '—',
      propiedad: r.propiedad || '—', nombre: r.nombre || '', apellidos: r.apellidos || '',
      uf: parseFloat(r.precio_total_operacion_uf) || 0, fecha_reserva: r.fecha_reserva || ''
    }))
    .sort((a, b) => (a.proyecto || '').localeCompare(b.proyecto || '') ||
      String(a.propiedad).localeCompare(String(b.propiedad), 'es', { numeric: true }));

  // Presupuesto del mes por proyecto y por subagrupación (ya cargados antes de renderResumen).
  const pptoMes    = (p)   => (ACUM_PPTO_PROY[p] && ACUM_PPTO_PROY[p][mesYM]) || { promUN:0, promUF:0, escrUN:0, escrUF:0 };
  const pptoMesSub = (p,s) => (ACUM_PPTO_SUB[p] && ACUM_PPTO_SUB[p][s] && ACUM_PPTO_SUB[p][s][mesYM]) || { promUN:0, promUF:0, escrUN:0, escrUF:0 };

  // ── Cuadro PROMESAS ─────────────────────────────────────────────────────────
  // Proyectos en venta especial (Cromático, Mirador Sta. Teresita): solo reservan y
  // esa reserva se cuenta como promesa. En el cuadro Promesas NO se muestran sus
  // columnas de reservas (stock) — van con nota al pie.
  const proms = PROYECTOS.map(p => {
    const rb = resBack[p], m = mov[p], pp = pptoMes(p);
    const especial = RECLAS_PROY.includes(p);
    const subKeys = Array.from(new Set([...Object.keys(resBackSub[p]||{}), ...Object.keys(movSub[p]||{})])).sort();
    const subs = subKeys.map(s => {
      const sb = resBackSub[p][s] || { totUN:0,totUF:0,mesUN:0,mesUF:0 };
      const ms = (movSub[p]||{})[s] || { promUN:0,promUF:0 };
      const ps = pptoMesSub(p, s);
      return {
        sub: s,
        resTotUN: especial ? 0 : sb.totUN, resTotUF: especial ? 0 : sb.totUF,
        resMesUN: especial ? 0 : sb.mesUN, resMesUF: especial ? 0 : sb.mesUF,
        promUN: ms.promUN, promUF: ms.promUF,
        pptoPromUN: ps.promUN, pptoPromUF: ps.promUF
      };
    }).filter(s => s.resTotUN||s.resTotUF||s.resMesUN||s.resMesUF||s.promUN||s.promUF||s.pptoPromUN||s.pptoPromUF);
    return {
      p, gid: 'pm-' + safeTab(p), label: PROY_LABEL[p] || p, especial,
      resTotUN: especial ? 0 : rb.totUN, resTotUF: especial ? 0 : rb.totUF,
      resMesUN: especial ? 0 : rb.mesUN, resMesUF: especial ? 0 : rb.mesUF,
      promUN: m.promUN, promUF: m.promUF,
      pptoPromUN: pp.promUN, pptoPromUF: pp.promUF,
      subs
    };
  });
  const promTot = proms.reduce((a, r) => ({
    resTotUN: a.resTotUN + r.resTotUN, resTotUF: a.resTotUF + r.resTotUF,
    resMesUN: a.resMesUN + r.resMesUN, resMesUF: a.resMesUF + r.resMesUF,
    promUN: a.promUN + r.promUN, promUF: a.promUF + r.promUF,
    pptoPromUN: a.pptoPromUN + r.pptoPromUN, pptoPromUF: a.pptoPromUF + r.pptoPromUF
  }), { resTotUN:0,resTotUF:0,resMesUN:0,resMesUF:0,promUN:0,promUF:0,pptoPromUN:0,pptoPromUF:0 });

  // ── Cuadro ESCRITURAS (solo proyectos con escrituras del mes o ppto de escrituras) ──
  const escrs = PROYECTOS.map(p => {
    const m = mov[p], pp = pptoMes(p);
    const subKeys = Array.from(new Set([...Object.keys(movSub[p]||{}), ...Object.keys((ACUM_PPTO_SUB[p]||{}))])).sort();
    const subs = subKeys.map(s => {
      const ms = (movSub[p]||{})[s] || { escrUN:0,escrUF:0 };
      const ps = pptoMesSub(p, s);
      return { sub: s, escrUN: ms.escrUN, escrUF: ms.escrUF, pptoEscrUN: ps.escrUN, pptoEscrUF: ps.escrUF };
    }).filter(s => s.escrUN||s.escrUF||s.pptoEscrUN||s.pptoEscrUF);
    return { p, gid: 'em-' + safeTab(p), label: PROY_LABEL[p] || p, escrUN: m.escrUN, escrUF: m.escrUF, pptoEscrUN: pp.escrUN, pptoEscrUF: pp.escrUF, subs };
  }).filter(r => r.escrUN || r.escrUF || r.pptoEscrUN || r.pptoEscrUF);
  const escrTot = escrs.reduce((a, r) => ({
    escrUN: a.escrUN + r.escrUN, escrUF: a.escrUF + r.escrUF,
    pptoEscrUN: a.pptoEscrUN + r.pptoEscrUN, pptoEscrUF: a.pptoEscrUF + r.pptoEscrUF
  }), { escrUN:0,escrUF:0,pptoEscrUN:0,pptoEscrUF:0 });

  // ── Cuadro RESERVAS MES (gestión) = flujo RAW de reservas del mes, SIN RECLAS ──
  // (así Cromático y Mirador Sta. Teresita SÍ aparecen como reservas en esta vista).
  const rawResMes = {}, rawResMesSub = {};
  for (const p of PROYECTOS) { rawResMes[p] = { un:0, uf:0 }; rawResMesSub[p] = {}; }
  for (const row of (ALL_DATA_MOV || [])) {
    const p = row.proyecto; if (!rawResMes[p]) continue;
    if (!inMonthFull(row.fecha_reserva, fechaCorteFoco)) continue;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    const sub = row.subagrupacion || '—';
    rawResMes[p].un++; rawResMes[p].uf += uf;
    if (!rawResMesSub[p][sub]) rawResMesSub[p][sub] = { un:0, uf:0 };
    rawResMesSub[p][sub].un++; rawResMesSub[p][sub].uf += uf;
  }
  const reservas = PROYECTOS.map(p => {
    const subs = Object.keys(rawResMesSub[p]).sort().map(s => ({ sub: s, resUN: rawResMesSub[p][s].un, resUF: rawResMesSub[p][s].uf }));
    return { p, gid: 'rm-' + safeTab(p), label: PROY_LABEL[p] || p, resUN: rawResMes[p].un, resUF: rawResMes[p].uf, subs };
  });
  const reservasTot = reservas.reduce((a, r) => ({
    resUN: a.resUN + r.resUN, resUF: a.resUF + r.resUF
  }), { resUN:0, resUF:0 });

  RESUMEN_MES_DATA = {
    mesYM, mesLabel, reservas, reservasTot, proms, promTot, escrs, escrTot,
    desis: { mesUN: totDesisMesUN, mesUF: totDesisMesUF }
  };

  // FIX 07-09-2026: si Resumen Mes está mostrando un "mes en foco" reabierto
  // (mesFocoYM != null), mesYM/RESUMEN_MES_DATA de aquí abajo ya corresponden a
  // ESE mes, no al mes calendario real -- así que la inyección de más abajo
  // (pensada para el mes en curso) quedaría apuntando al mes equivocado (en la
  // práctica no hace nada porque el mes en foco ya está en ACUM_CIERRE_MESES,
  // ver injectMesesSinCierre). Para que el Acumulado Año no deje de recibir el
  // mes calendario real en vivo mientras tanto, se inyecta acá aparte, con los
  // datos REALES (movReal/movSubReal, capturados antes del override).
  if (mesFocoYM) {
    const realMesYM = fecha_corte.slice(0, 7);
    const rawResMesReal = {};
    for (const p of PROYECTOS) rawResMesReal[p] = { un: 0, uf: 0, sub: {} };
    for (const row of (ALL_DATA_MOV || [])) {
      const p = row.proyecto; if (!rawResMesReal[p]) continue;
      if (!inMonthFull(row.fecha_reserva, fecha_corte)) continue;
      const uf = parseFloat(row.precio_total_operacion_uf) || 0;
      const sub = row.subagrupacion || '—';
      rawResMesReal[p].un++; rawResMesReal[p].uf += uf;
      if (!rawResMesReal[p].sub[sub]) rawResMesReal[p].sub[sub] = { un: 0, uf: 0 };
      rawResMesReal[p].sub[sub].un++; rawResMesReal[p].sub[sub].uf += uf;
    }
    // Cromático/Mirador Sta. Teresita: su reserva cuenta como promesa (venta
    // especial, mismo criterio que RECLAS_PROY más abajo e injectMesesSinCierre).
    const RECLAS_SIN_CIERRE = ['CROMATICO', 'MIRADOR SANTA TERESITA'];
    const promUNReal = (p) => movReal[p].promUN + (RECLAS_SIN_CIERRE.includes(p) ? movReal[p].resUN : 0);
    const promUFReal = (p) => movReal[p].promUF + (RECLAS_SIN_CIERRE.includes(p) ? movReal[p].resUF : 0);
    const promUNRealSub = (p,s) => movSubReal[p][s].promUN + (RECLAS_SIN_CIERRE.includes(p) ? movSubReal[p][s].resUN : 0);
    const promUFRealSub = (p,s) => movSubReal[p][s].promUF + (RECLAS_SIN_CIERRE.includes(p) ? movSubReal[p][s].resUF : 0);
    const realData = {
      proms: PROYECTOS.map(p => ({ p, promUN: promUNReal(p), promUF: promUFReal(p),
        subs: Object.keys(movSubReal[p]||{}).map(s => ({ sub: s, promUN: promUNRealSub(p,s), promUF: promUFRealSub(p,s) })) })),
      escrs: PROYECTOS.map(p => ({ p, escrUN: movReal[p].escrUN, escrUF: movReal[p].escrUF,
        subs: Object.keys(movSubReal[p]||{}).map(s => ({ sub: s, escrUN: movSubReal[p][s].escrUN, escrUF: movSubReal[p][s].escrUF })) })),
      reservas: PROYECTOS.map(p => ({ p, resUN: rawResMesReal[p].un, resUF: rawResMesReal[p].uf,
        subs: Object.keys(rawResMesReal[p].sub).map(s => ({ sub: s, resUN: rawResMesReal[p].sub[s].un, resUF: rawResMesReal[p].sub[s].uf })) }))
    };
    injectCurrentMonthAcum(realMesYM, realData);
  }

  // Agrega el mes en curso (datos vivos) a la serie del Acumulado Año.
  injectCurrentMonthAcum(mesYM, RESUMEN_MES_DATA);
  buildAcumResFlujo(fecha_corte);  // Reservas del Acumulado = flujo por fecha_reserva (gestión)

  const toggleBtns = (which, active) => `
    <div style="display:flex;gap:6px">
      <button class="chart-filter-btn ${active==='UN'?'metric-active':''}" onclick="setResMetric('${which}','UN',this)">Un</button>
      <button class="chart-filter-btn ${active==='UF'?'metric-active':''}" onclick="setResMetric('${which}','UF',this)">UF</button>
    </div>`;


  // FIX 07-09-2026: aviso visible cuando Resumen Mes / Escrituras Mes están
  // mostrando un mes anterior reabierto (sin cierre oficial) en vez del mes
  // calendario actual — para que no se confunda con el mes en curso real.
  const focoBadge = mesFocoYM ? `<span style="display:inline-block;background:#fff0dc;color:#b07800;font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;margin-left:10px;vertical-align:middle" title="Mes reabierto en Supabase: aún falta cargar promesas antes de recerrarlo oficialmente">Mes reabierto — pendiente de cierre</span>` : '';

  // ── Vista RESUMEN MES (antes "Promesas Mes") ────────────────────────────────
  const promesasHTML = `
  <div class="section-block">
    <div class="section-title">Resumen del Mes ${mesLabel} — Promesas${focoBadge}</div>
    <div class="kpi-row" style="grid-template-columns:repeat(2,1fr);gap:7px">
      <div class="kpi kpi-sm c-red">
        <div class="kpi-label">Promesas — Unidades</div>
        <div class="kpi-value">${totalMov.promUN}</div>
        <div class="kpi-sub">unidades</div>
        ${METAS ? metaBar(totalMov.promUN, METAS.promUN, false) : ''}
      </div>
      <div class="kpi kpi-sm c-red">
        <div class="kpi-label">Promesas — UF</div>
        <div class="kpi-value">${fmtUF(totalMov.promUF)}</div>
        <div class="kpi-sub">UF</div>
        ${METAS ? metaBar(totalMov.promUF, METAS.promUF, true) : ''}
      </div>
    </div>
  </div>
  <div class="section-block">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span>Resumen Promesas — ${mesLabel}</span>
      ${toggleBtns('prom', RES_PROM_METRIC)}
    </div>
    <div id="cuadro-promesas">${buildCuadroPromesas(RES_PROM_METRIC)}</div>
  </div>
  <div class="section-block">
    <div class="section-title">Proyección de Cierre del Mes — ${mesLabel}</div>
    <div id="cuadro-proyeccion">${buildCuadroProyeccion()}</div>
  </div>
`;

  // ── Vista ESCRITURAS MES ────────────────────────────────────────────────────
  const escriturasHTML = `
  <div class="section-block">
    <div class="section-title">Escrituras del Mes ${mesLabel}${focoBadge}</div>
    <div class="kpi-row" style="grid-template-columns:repeat(2,1fr);gap:7px">
      <div class="kpi kpi-sm c-green">
        <div class="kpi-label">Escrituras — Unidades</div>
        <div class="kpi-value">${totalMov.escrUN}</div>
        <div class="kpi-sub">unidades</div>
        ${METAS ? metaBar(totalMov.escrUN, METAS.escrUN, false) : ''}
      </div>
      <div class="kpi kpi-sm c-green">
        <div class="kpi-label">Escrituras — UF</div>
        <div class="kpi-value">${fmtUF(totalMov.escrUF)}</div>
        <div class="kpi-sub">UF</div>
        ${METAS ? metaBar(totalMov.escrUF, METAS.escrUF, true) : ''}
      </div>
    </div>
  </div>
  <div class="section-block">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span>Escrituras — ${mesLabel}</span>
      ${toggleBtns('escr', RES_ESCR_METRIC)}
    </div>
    <div id="cuadro-escrituras">${buildCuadroEscrituras(RES_ESCR_METRIC)}</div>
  </div>
`;

  document.getElementById('tab-resumen').innerHTML = `<div class="res-layout">
    <div class="res-sidebar">
      <div class="res-sidebar-title">Vista</div>
      <button class="sidenav-btn active" onclick="showResSec('promesas-mes',this)">
        <span class="sidenav-icon">📊</span>Resumen Mes
      </button>
      <button class="sidenav-btn" onclick="showResSec('escrituras-mes',this)">
        <span class="sidenav-icon">✒️</span>Escrituras Mes
      </button>
      <button class="sidenav-btn" onclick="showResSec('proyeccion',this)">
        <span class="sidenav-icon">🎯</span>Proyección Cierre
      </button>
      <button class="sidenav-btn" onclick="showResSec('backlog',this)">
        <span class="sidenav-icon">🗂️</span>Backlog Cartera
      </button>
      <button class="sidenav-btn" onclick="showResSec('detalle-ops',this)">
        <span class="sidenav-icon">📋</span>Detalle Operaciones
      </button>
      <button class="sidenav-btn" onclick="showResSec('acumulado',this)">
        <span class="sidenav-icon">📈</span>Acumulado Año
      </button>
      <button class="sidenav-btn" onclick="showResSec('presupuesto',this)">
        <span class="sidenav-icon">💰</span>Presupuesto
      </button>
      <button class="sidenav-btn" onclick="showResSec('desist',this)">
        <span class="sidenav-icon">⬇️</span>Desistimientos
      </button>
      <button class="sidenav-btn" onclick="showResSec('cierres',this)">
        <span class="sidenav-icon">🗓️</span>Cierre de Mes
      </button>
      <button id="btn-export-ventas-xlsx" class="sidenav-btn" onclick="exportarDetalleVentasXLSX()"
        title="Descargar el detalle de Reservas, Promesas, Escrituras, Secundarios vendidos, Desistimientos y Alertas de Consistencia en Excel"
        style="color:#1D6F42;border-top:1px solid #f0f0f0;margin-top:6px;padding-top:12px">
        <span class="sidenav-icon">💾</span>Descargar Excel
      </button>

    </div>
    <div class="res-main">
      <div id="res-promesas-mes" class="res-sec active">` + promesasHTML + renderPromesasPorFirmar(fechaCorteFoco) + `</div>
      <div id="res-escrituras-mes" class="res-sec">` + escriturasHTML + `</div>
      <div id="res-proyeccion" class="res-sec">` + renderProyeccionView() + `</div>
      <div id="res-acumulado" class="res-sec">` + renderAcumulado(fecha_corte) + `</div>
      <div id="res-presupuesto" class="res-sec">` + renderPresupuesto(fecha_corte) + `</div>
      <div id="res-detalle-ops" class="res-sec">` + renderDetalleOps(fecha_corte, ALL_DATA_MOV) + `</div>
      <div id="res-backlog" class="res-sec"></div>
      <div id="res-desist" class="res-sec">` + renderDesistimientos(fecha_corte) + `</div>
      <div id="res-cierres" class="res-sec"></div>
    </div>
  </div>`;
}


// ─── BACKLOG TOOLTIP ─────────────────────────────────────────────────────────
function showBkTip(event, el) {
  event.stopPropagation();
  const proy   = el.dataset.proy;
  const sub    = el.dataset.sub;
  const est    = el.dataset.est;    // 'res' | 'prom'
  const bucket = el.dataset.bucket; // 'lt30' | 'd30_60' | 'gt60'

  const corteD = CORTE_DATE || new Date((ACUM_FECHA_CORTE || '2026-05-31') + 'T12:00:00');
  const estadoCorte = est === 'res' ? 'RESERVADO' : 'PROMESADO';
  const fechaField  = est === 'res' ? 'fecha_reserva' : 'fecha_promesa';
  // Mismo criterio que el aging de la tabla: el reloj de una promesa parte en el inicio de escrituracion.
  const diasDesde = (row, fv) => Math.floor((corteD - new Date((est === 'prom' ? anclaInicio(proy, row.subagrupacion, fv) : fv) + 'T12:00:00')) / 86400000); 

  const units = ALL_DATA.filter(row => {
    if (row.proyecto !== proy) return false;
    if (row.estado_corte !== estadoCorte) return false;
    if (sub && row.subagrupacion !== sub) return false;
    const fv = row[fechaField];
    if (!fv) return false;
    const days = diasDesde(row, fv);
    if (bucket === 'lt30')   return days < 30;
    if (bucket === 'd30_60') return days >= 30 && days <= 60;
    if (bucket === 'gt60')   return days > 60;
    return false;
  });

  if (!units.length) return;

  const bLabel = bucket === 'lt30' ? '<30 días' : bucket === 'd30_60' ? '30–60 días' : '>60 días';
  const tLabel = est === 'res' ? 'Reservas' : 'Promesas';
  const proyLabel = PROY_LABEL[proy] || proy;

  let html = `<div style="font-weight:700;font-size:13px;border-bottom:1px solid rgba(255,255,255,.18);
      padding-bottom:7px;margin-bottom:8px">
    ${proyLabel}${sub ? ' · <span style="font-size:11px;color:#aaa">'+sub+'</span>' : ''}
    <br><span style="font-size:10px;font-weight:400;color:#aaa">${tLabel} ${bLabel} — ${units.length} unidad${units.length!==1?'es':''}</span>
  </div>`;

  // Ordenar por propiedad
  units.sort((a,b) => String(a.propiedad).localeCompare(String(b.propiedad), 'es', {numeric:true}));

  for (const u of units) {
    const nombre = ((u.nombre||'').trim() + ' ' + (u.apellidos||'').trim()).trim() || '—';
    const uf = u.precio_total_operacion_uf
      ? Math.round(u.precio_total_operacion_uf).toLocaleString('es-CL') + ' UF'
      : '—';
    const fv = u[fechaField] || '';
    const days = fv ? diasDesde(u, fv) : '?';
    html += `<div style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:700;color:#E1093F;font-size:13px">Und. ${u.propiedad||'—'}</span>
        <span style="color:#00B050;font-weight:600;font-size:12px">${uf}</span>
      </div>
      <div style="color:#ddd;font-size:11px;margin-top:2px">${nombre}</div>
      <div style="color:#888;font-size:10px;margin-top:1px">${tLabel.slice(0,-1)} ${fv} · <strong style="color:#FFC000">${days}d</strong></div>
    </div>`;
  }

  const tip = document.getElementById('bk-tip');
  tip.innerHTML = html;
  const tw = 340, th = Math.min(units.length * 68 + 60, 420);
  const x = Math.min(event.clientX + 14, window.innerWidth - tw - 20);
  const y = Math.min(event.clientY + 14, window.innerHeight - th - 20);
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
  tip.style.display = 'block';
  tip.style.pointerEvents = 'auto';
}
function hideBkTip() {
  const t = document.getElementById('bk-tip');
  if (t) t.style.display = 'none';
  if (t) t.style.pointerEvents = 'none';
}

// Tooltip de la tarjeta Conversión Reserva→Promesa (desglose por proyecto vigente)
function showConvTip(event) {
  const tip = document.getElementById('bk-tip');
  if (!tip || !CONV_TIP_HTML) return;
  if (tip.innerHTML !== CONV_TIP_HTML) tip.innerHTML = CONV_TIP_HTML;
  const tw = 300, th = 360;
  const x = Math.min(event.clientX + 16, window.innerWidth  - tw - 20);
  const y = Math.min(event.clientY + 16, window.innerHeight - th - 20);
  tip.style.left = x + 'px';
  tip.style.top  = Math.max(12, y) + 'px';
  tip.style.display = 'block';
  tip.style.pointerEvents = 'none';
}
function hideConvTip() {
  const t = document.getElementById('bk-tip');
  if (t) t.style.display = 'none';
}

// Tooltip de Resumen Mes: muestra las unidades (deptos) de una celda Reservas/Promesas/Escrituras
function showMovTip(event, el) {
  const proy = el.dataset.proy, sub = el.dataset.sub, tipo = el.dataset.tipo;
  const corte = MOV_CORTE_FOCO || MOV_CORTE; if (!corte) return;
  const mes = corte.substring(0,7), corteD = corte.substring(0,10);
  let field = tipo==='res' ? 'fecha_reserva' : tipo==='prom' ? 'fecha_promesa' : 'fecha_escritura';
  // Cromático y Mirador presentan sus RESERVAS como Promesas en Resumen Mes: la celda
  // "Promesas" se llena con operaciones que en el CRM tienen fecha_reserva (no fecha_promesa).
  if ((proy === 'CROMATICO' || proy === 'MIRADOR SANTA TERESITA') && tipo === 'prom') field = 'fecha_reserva';
  const tLabel = tipo==='res' ? 'Reservas' : tipo==='prom' ? 'Promesas' : 'Escrituras';
  const tColor = tipo==='res' ? '#a83232' : tipo==='prom' ? '#274b73' : '#1b5e34';
  const units = (ALL_DATA_MOV||[]).filter(r => {
    if (r.proyecto !== proy) return false;
    if (sub && (r.subagrupacion||'—') !== sub) return false;
    const f = r[field]; if (!f) return false;
    const d = f.substring(0,10);
    if (!(d.substring(0,7) === mes && d <= corteD)) return false;
    if (tipo==='escr' && r.estado_corte !== 'ESCRITURADO') return false;
    return true;
  });
  if (!units.length) return;
  units.sort((a,b) => String(a.propiedad).localeCompare(String(b.propiedad),'es',{numeric:true}));
  const proyLabel = PROY_LABEL[proy] || proy;
  let html = `<div style="font-weight:700;font-size:13px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:7px;margin-bottom:8px">

    <br><span style="font-size:10px;font-weight:400;color:#aaa">${tLabel} del mes — ${units.length} unidad${units.length!==1?'es':''}</span></div>`;

    const uf = u.precio_total_operacion_uf ? Math.round(u.precio_total_operacion_uf).toLocaleString('es-CL')+' UF' : '—';
    const fv = (u[field]||'').substring(0,10).split('-').reverse().join('/');
    html += `<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:700;color:${tColor==='#1b5e34'?'#bfe0c8':tColor};font-size:13px">Und. ${u.propiedad||'—'}</span>
        <span style="color:#00B050;font-weight:600;font-size:12px">${uf}</span>
      </div>
      <div style="color:#ddd;font-size:11px;margin-top:2px">${u.modelo?u.modelo+' · ':''}${nombre}</div>
      <div style="color:#888;font-size:10px;margin-top:1px">${tLabel.slice(0,-1)}: ${fv}</div>
    </div>`;
  }
  const tip = document.getElementById('bk-tip');
  if (!tip) return;
  tip.innerHTML = html;
  const tw = 320, th = Math.min(units.length*64+70, 420);
  tip.style.left = Math.min(event.clientX+14, window.innerWidth-tw-20)+'px';
  tip.style.top  = Math.max(12, Math.min(event.clientY+14, window.innerHeight-th-20))+'px';
  tip.style.display = 'block';
}

// Tooltip de RESERVAS vigentes (stock RESERVADO al corte): clientes por proyecto/sub y bucket.
// bucket 'tot' = reservadas en meses anteriores · 'mes' = reservadas en el mes del corte.
function showResStockTip(event, el) {
  const proy = el.dataset.proy, sub = el.dataset.sub, bucket = el.dataset.bucket;
  const corte = MOV_CORTE_FOCO || MOV_CORTE; if (!corte) return;

  const units = (ALL_DATA || []).filter(r => {

    const rym = r.fecha_reserva ? String(r.fecha_reserva).substring(0, 7) : '';
    return bucket === 'mes' ? (rym === mes) : (rym !== mes);
  });
  if (!units.length) return;
  units.sort((a, b) => String(a.propiedad).localeCompare(String(b.propiedad), 'es', { numeric: true }));
  const proyLabel = PROY_LABEL[proy] || proy;
  const bLabel = bucket === 'mes' ? 'reservadas en el mes' : 'reservadas en meses anteriores';
  let html = `<div style="font-weight:700;font-size:13px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:7px;margin-bottom:8px">

    <br><span style="font-size:10px;font-weight:400;color:#aaa">Reservas vigentes — ${units.length} unidad${units.length !== 1 ? 'es' : ''} (${bLabel})</span></div>`;

    const uf = u.precio_total_operacion_uf ? Math.round(u.precio_total_operacion_uf).toLocaleString('es-CL') + ' UF' : '—';
    const fv = (u.fecha_reserva || '').substring(0, 10).split('-').reverse().join('/');

      <div style="display:flex;justify-content:space-between;align-items:baseline">

      <div style="color:#888;font-size:10px;margin-top:1px">Reserva: ${fv}</div>
    </div>`;
  }

  if (!tip) return;
  tip.innerHTML = html;
  const tw = 320, th = Math.min(units.length * 64 + 70, 420);

  tip.style.top  = Math.max(12, Math.min(event.clientY + 14, window.innerHeight - th - 20)) + 'px';
  tip.style.display = 'block';
}

// ─── RENDER RESERVAS ─────────────────────────────────────────────────────────
// Wrapper para forzar render del backlog en el sidebar (llamado lazy)
let _agingResGlobal = null, _agingResSubGlobal = null, _agingPromGlobal = null, _agingPromSubGlobal = null;
function renderReservasIntoSidebar() {
  if (_agingResGlobal) renderReservas(_agingResGlobal, _agingResSubGlobal, _agingPromGlobal, _agingPromSubGlobal);
}

function renderReservas(agingRes, agingResSub, agingProm, agingPromSub) {
  _agingResGlobal = agingRes; _agingResSubGlobal = agingResSub;
  _agingPromGlobal = agingProm; _agingPromSubGlobal = agingPromSub;
  const proyRes = Object.keys(agingRes).filter(p => agingRes[p].tot > 0);
  let totRes = {tot:0,totUF:0,lt30:0,lt30UF:0,d30_60:0,d30_60UF:0,gt60:0,gt60UF:0};
  for (const p of proyRes) { for (const k of Object.keys(totRes)) totRes[k] += agingRes[p][k]; }

  const rowsRes = proyRes.map(p => {
    const a    = agingRes[p];
    const subs = Object.keys(agingResSub[p] || {});
    const hasMulti = subs.length > 1;
    const gid  = 'bkres-' + (PROY_TAB[p] || p);
    const agRow = (obj, label, isMain, rowProy, rowSub) => {
      const mkC = (n, bucket, cls) => n > 0
        ? `<td class="${cls} bk-clickable" data-proy="${rowProy}" data-sub="${rowSub||''}" data-est="res" data-bucket="${bucket}"
               onclick="showBkTip(event,this)" title="Ver detalle">${n}</td>`
        : `<td class="${cls}">${n||'—'}</td>`;
      return `
      <td class="${isMain && hasMulti ? 'proj-expandable' : ''}">${label}</td>
      <td>${obj.tot}</td><td>${fmtUF(obj.totUF)}</td>
      ${mkC(obj.lt30,  'lt30',  'ok'  )}<td>${obj.lt30UF ?fmtUF(obj.lt30UF) :'—'}</td>
      ${mkC(obj.d30_60,'d30_60','warn' )}<td>${obj.d30_60UF?fmtUF(obj.d30_60UF):'—'}</td>
      ${mkC(obj.gt60,  'gt60',  'crit' )}<td>${obj.gt60UF ?fmtUF(obj.gt60UF) :'—'}</td>`;
    };
    const mainRow = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${gid}')"`:''}>${agRow(a,`<span class="toggle-icon" id="icon-${gid}">${hasMulti?'▶':''}</span>${PROY_LABEL[p]||p}`,true,p,'')}</tr>`;
    const subRows = hasMulti ? subs.sort().map(sub => {
      const s = agingResSub[p][sub];
      return `<tr class="sub-row ${gid}" style="display:none">${agRow(s, sub, false, p, sub)}</tr>`;
    }).join('') : '';
    return mainRow + subRows;
  }).join('');

  const pLt30 = totRes.tot ? pct(totRes.lt30,totRes.tot) : 0;
  const p3060 = totRes.tot ? pct(totRes.d30_60,totRes.tot) : 0;
  const pGt60 = totRes.tot ? pct(totRes.gt60,totRes.tot) : 0;

  // Aging promesas
  const proyProm = Object.keys(agingProm).filter(p => agingProm[p] && agingProm[p].tot > 0);
  let totProm = {tot:0,totUF:0,lt30:0,lt30UF:0,d30_60:0,d30_60UF:0,gt60:0,gt60UF:0};
  for (const p of proyProm) { for (const k of Object.keys(totProm)) totProm[k] += agingProm[p][k]; }

  const rowsProm = proyProm.map(p => {
    const a    = agingProm[p];
    const subs = Object.keys(agingPromSub[p] || {});
    const hasMulti = subs.length > 1;
    const gid  = 'bkprom-' + (PROY_TAB[p] || p);
    const agRow = (obj, label, rowProy, rowSub) => {
      const mkC = (n, bucket, cls) => n > 0
        ? `<td class="${cls} bk-clickable" data-proy="${rowProy}" data-sub="${rowSub||''}" data-est="prom" data-bucket="${bucket}"
               onclick="showBkTip(event,this)" title="Ver detalle">${n}</td>`
        : `<td class="${cls}">${n||'—'}</td>`;
      return `
      <td>${label}</td>
      <td>${obj.tot}</td><td>${fmtUF(obj.totUF)}</td>
      ${mkC(obj.lt30,  'lt30',  'ok'  )}<td>${obj.lt30UF ?fmtUF(obj.lt30UF) :'—'}</td>
      ${mkC(obj.d30_60,'d30_60','warn' )}<td>${obj.d30_60UF?fmtUF(obj.d30_60UF):'—'}</td>
      ${mkC(obj.gt60,  'gt60',  'crit' )}<td>${obj.gt60UF ?fmtUF(obj.gt60UF) :'—'}</td>`;
    };
    const mainRow = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${gid}')"`:''}>${agRow(a,`<span class="toggle-icon" id="icon-${gid}">${hasMulti?'▶':''}</span>${PROY_LABEL[p]||p}`,p,'')}</tr>`;
    const subRows = hasMulti ? subs.sort().map(sub => {
      const s = agingPromSub[p][sub];
      return `<tr class="sub-row ${gid}" style="display:none">${agRow(s, sub, p, sub)}</tr>`;
    }).join('') : '';
    return mainRow + subRows;
  }).join('');

  const pp60 = totProm.tot ? pct(totProm.gt60, totProm.tot) : 0;
  const alertMsg = '';

  // ── KPIs de Backlog de Reservas ──────────────────────────────────────────
  // % de reservas vigentes con más de 30 días de antigüedad
  const pctRes30 = totRes.tot ? Math.round((totRes.d30_60 + totRes.gt60) / totRes.tot * 100) : 0;
  // Días de conversión Reserva → Promesa: promedio de (fecha_promesa − fecha_reserva)
  // Solo operaciones que llegaron a promesa (ambas fechas presentes) y con diferencia válida (≥0).
  let convSum = 0, convN = 0;
  const convP = {};   // por proyecto vigente: { proyecto: { sum, n } }
  for (const row of (ALL_DATA_MOV || [])) {
    if (!row.fecha_reserva || !row.fecha_promesa) continue;
    const dias = Math.round((new Date(row.fecha_promesa + 'T12:00:00') - new Date(row.fecha_reserva + 'T12:00:00')) / 86400000);
    if (dias < 0) continue;  // fechas desajustadas → no se considera
    convSum += dias; convN++;
    if (PROYECTOS.includes(row.proyecto)) {
      if (!convP[row.proyecto]) convP[row.proyecto] = { sum:0, n:0 };
      convP[row.proyecto].sum += dias; convP[row.proyecto].n++;
    }
  }
  const convProm = convN ? Math.round(convSum / convN) : null;

  // Tooltip: conversión por proyecto vigente (orden ascendente por días)
  const convRows = PROYECTOS.filter(p => convP[p] && convP[p].n)
    .map(p => ({ p, dias: Math.round(convP[p].sum / convP[p].n), n: convP[p].n }))
    .sort((a,b) => a.dias - b.dias);
  CONV_TIP_HTML =
    `<div style="font-weight:700;font-size:13px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:7px;margin-bottom:8px">Conversión Reserva → Promesa<br><span style="font-size:10px;font-weight:400;color:#aaa">Días promedio por proyecto vigente</span></div>`
    + (convRows.length
        ? convRows.map(r => `<div style="display:flex;justify-content:space-between;gap:18px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span style="color:#ddd">${PROY_LABEL[r.p]||r.p}</span><span style="white-space:nowrap"><strong style="color:#FFC000">${r.dias}</strong> <span style="color:#888;font-size:10px">d · ${r.n} ops</span></span></div>`).join('')
        : '<div style="color:#aaa">Sin datos</div>')
    + `<div style="display:flex;justify-content:space-between;gap:18px;padding-top:7px;margin-top:4px;border-top:1px solid rgba(255,255,255,.18);font-weight:700"><span>Total portafolio</span><span style="white-space:nowrap"><span style="color:#00B050">${convProm!=null?convProm:'—'}</span> <span style="color:#888;font-size:10px">d · ${convN} ops</span></span></div>`;

  // ── KPIs de Backlog de Promesas ──────────────────────────────────────────
  const pctProm30 = totProm.tot ? Math.round((totProm.d30_60 + totProm.gt60) / totProm.tot * 100) : 0;
  // Conversión Promesa → Escritura: promedio de (fecha_escritura − fecha_promesa), ambas fechas y diff ≥ 0
  let convESum = 0, convEN = 0;
  const convEP = {};
  for (const row of (ALL_DATA_MOV || [])) {
    if (!row.fecha_promesa || !row.fecha_escritura) continue;
    // Reloj parte en máx(fecha_promesa, inicio escrituración) → no carga el tiempo de construcción
    const inicio = anclaInicio(row.proyecto, row.subagrupacion, row.fecha_promesa);
    const dias = Math.round((new Date(row.fecha_escritura + 'T12:00:00') - new Date(inicio + 'T12:00:00')) / 86400000);
    if (dias < 0) continue;  // fechas desajustadas → no se considera
    convESum += dias; convEN++;
    if (PROYECTOS.includes(row.proyecto)) {
      if (!convEP[row.proyecto]) convEP[row.proyecto] = { sum:0, n:0 };
      convEP[row.proyecto].sum += dias; convEP[row.proyecto].n++;
    }
  }
  const convEProm = convEN ? Math.round(convESum / convEN) : null;
  const convERows = PROYECTOS.filter(p => convEP[p] && convEP[p].n)
    .map(p => ({ p, dias: Math.round(convEP[p].sum / convEP[p].n), n: convEP[p].n }))
    .sort((a,b) => a.dias - b.dias);
  CONV_ESCR_TIP_HTML =
    `<div style="font-weight:700;font-size:13px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:7px;margin-bottom:8px">Conversión Promesa → Escritura<br><span style="font-size:10px;font-weight:400;color:#aaa">Días promedio desde inicio de escrituración (o promesa) · por proyecto</span></div>`
    + (convERows.length
        ? convERows.map(r => `<div style="display:flex;justify-content:space-between;gap:18px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span style="color:#ddd">${PROY_LABEL[r.p]||r.p}</span><span style="white-space:nowrap"><strong style="color:#bfe0c8">${r.dias}</strong> <span style="color:#888;font-size:10px">d · ${r.n} ops</span></span></div>`).join('')
        : '<div style="color:#aaa">Sin datos (aún sin escrituras con promesa)</div>')
    + `<div style="display:flex;justify-content:space-between;gap:18px;padding-top:7px;margin-top:4px;border-top:1px solid rgba(255,255,255,.18);font-weight:700"><span>Total portafolio</span><span style="white-space:nowrap"><span style="color:#00B050">${convEProm!=null?convEProm:'—'}</span> <span style="color:#888;font-size:10px">d · ${convEN} ops</span></span></div>`;

  const el_backlog = document.getElementById('res-backlog') || document.getElementById('tab-reservas');

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">

      <div class="kpi c-amber"><div class="kpi-label">UF en reservas</div><div class="kpi-value">${totRes.totUF ? fmtUF(totRes.totUF) : '—'}</div><div class="kpi-label">backlog reservas</div></div>
      <div class="kpi c-navy"><div class="kpi-label">% reservas &gt; 30 días</div><div class="kpi-value">${pctRes30}%</div><div class="kpi-label">${totRes.d30_60 + totRes.gt60} de ${totRes.tot} un.</div></div>
      <div class="kpi c-navy" style="cursor:help" onmousemove="showConvTip(event)" onmouseleave="hideConvTip()"><div class="kpi-label">Conversión Reserva→Promesa <span style="opacity:.55">ⓘ</span></div><div class="kpi-value">${convProm != null ? convProm : '—'}</div><div class="kpi-label">${convProm != null ? 'días prom. · ' + convN + ' ops · por proyecto ↗' : 'sin datos'}</div></div>
    </div>
  </div>
  <div class="section-block">
    <div class="section-title">Backlog — Aging de Reservas Vigentes</div>
    <p class="nota" style="margin-bottom:10px">Unidades en estado RESERVADO — todos los proyectos del portafolio</p>
    <table>
      <thead><tr>
        <th class="left">Proyecto</th>
        <th>Vigentes (Un)</th><th>Vigentes (UF)</th>
        <th>&lt;30 días (Un)</th><th>&lt;30 días (UF)</th>
        <th>30–60 días (Un)</th><th>30–60 días (UF)</th>
        <th>&gt;60 días (Un)</th><th>&gt;60 días (UF)</th>
      </tr></thead>
      <tbody>
        ${rowsRes}
        <tr class="total-row"><td>TOTAL</td><td>${totRes.tot}</td><td>${fmtUF(totRes.totUF)}</td><td>${totRes.lt30||'—'}</td><td>${totRes.lt30UF?fmtUF(totRes.lt30UF):'—'}</td><td>${totRes.d30_60||'—'}</td><td>${totRes.d30_60UF?fmtUF(totRes.d30_60UF):'—'}</td><td class="${totRes.gt60>0?'crit':''}">${totRes.gt60||'—'}</td><td>${totRes.gt60UF?fmtUF(totRes.gt60UF):'—'}</td></tr>
        <tr class="pct-row"><td>% Distribución</td><td>100%</td><td></td><td class="ok">${pLt30}% ${pctEmoji(100-pLt30)}</td><td></td><td class="warn">${p3060}% ${pctEmoji(p3060*2)}</td><td></td><td class="${pGt60>20?'crit':'ok'}">${pGt60}% ${pctEmoji(pGt60)}</td><td></td></tr>

      <div class="kpi c-green" style="cursor:help" onmousemove="showConvEscrTip(event)" onmouseleave="hideConvTip()"><div class="kpi-label">Conversión Promesa→Escritura <span style="opacity:.55">ⓘ</span></div><div class="kpi-value">${convEProm != null ? convEProm : '—'}</div><div class="kpi-label">${convEProm != null ? 'días prom. · ' + convEN + ' ops · por proyecto ↗' : 'sin datos'}</div></div>

        <tr class="total-row"><td>TOTAL</td><td>${totProm.tot}</td><td>${fmtUF(totProm.totUF)}</td><td>${totProm.lt30||'—'}</td><td>${totProm.lt30UF?fmtUF(totProm.lt30UF):'—'}</td><td>${totProm.d30_60||'—'}</td><td>${totProm.d30_60UF?fmtUF(totProm.d30_60UF):'—'}</td><td class="${totProm.gt60>0?'crit':''}">${totProm.gt60||'—'}</td><td>${totProm.gt60UF?fmtUF(totProm.gt60UF):'—'}</td></tr>
        <tr class="pct-row"><td>% Distribución</td><td>100%</td><td>100%</td><td class="ok">${pct(totProm.lt30,totProm.tot)}%</td><td></td><td class="warn">${pct(totProm.d30_60,totProm.tot)}%</td><td></td><td class="${pp60>50?'crit':'warn'}">${pp60}% ${pctEmoji(pp60)}</td><td></td></tr>
