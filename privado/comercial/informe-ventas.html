    + '</tr></thead><tbody>'+body+'</tbody></table></div>';
}



// ─── Botón "PNG" en cada bloque del informe ──────────────────────────────────
// Descarga el bloque como imagen lista para pegar en una presentación.
// Los gráficos se exportan del propio canvas (calidad exacta, sin librería);
// el resto se rasteriza con html2canvas, que se carga recién al primer clic.
//
// El informe no tiene un contenedor único por dashboard: 11 bloques viven en
// .section-block, pero varios títulos son "huérfanos" (no tienen wrapper). Para
// esos se captura el rango título → siguiente título sobre un clon fuera de
// pantalla, así no se toca el DOM vivo.
const PNG_LIB_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const PNG_TITULOS = '.section-title, .sc-sec, .ms-band-h';
let _pngLibProm = null;
function pngCargarLib(){
  if (_pngLibProm) return _pngLibProm;
  _pngLibProm = new Promise(function(ok, bad){
    if (window.html2canvas) return ok(window.html2canvas);
    const s = document.createElement('script');
    s.src = PNG_LIB_URL;
    s.onload  = function(){ window.html2canvas ? ok(window.html2canvas) : bad(new Error('lib vacía')); };
    s.onerror = function(){ bad(new Error('no se pudo cargar html2canvas')); };
    document.head.appendChild(s);
  });
  return _pngLibProm;
}
function pngSlug(s){
  return String(s || 'informe').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 64);
}
function pngNombreArchivo(texto){
  const m = document.body.innerText.match(/Datos al\s*([\d\/]+)/);
  const fecha = m ? m[1].split('/').reverse().join('-') : '';
  return ['trei', pngSlug(texto), fecha].filter(Boolean).join('_') + '.png';
}
function pngBajar(dataURL, nombre){
  const a = document.createElement('a');
  a.href = dataURL; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
}
// Los <canvas> no se copian al clonar: se reemplazan por su imagen.
function pngFijarCanvas(origen, clon){
  const co = origen.querySelectorAll('canvas'), cc = clon.querySelectorAll('canvas');
  for (let i = 0; i < cc.length && i < co.length; i++){
    try{
      const img = document.createElement('img');
      img.src = co[i].toDataURL('image/png');
      img.style.width  = co[i].offsetWidth  + 'px';
      img.style.height = co[i].offsetHeight + 'px';
      cc[i].replaceWith(img);
    }catch(e){ /* canvas contaminado: se deja como esté */ }
  }
}
// html2canvas recorta lo que no se ve: los contenedores con scroll se abren
// durante la captura y se restauran después.
function pngAbrirScrolls(el){
  const tocados = [];
  [el].concat([].slice.call(el.querySelectorAll('*'))).forEach(function(n){
    if (!n.style) return;
    const cs = getComputedStyle(n);
    if (/(auto|scroll)/.test(cs.overflowX + cs.overflowY)
        && (n.scrollWidth > n.clientWidth + 2 || n.scrollHeight > n.clientHeight + 2)){
      tocados.push({n: n, ox: n.style.overflow, mh: n.style.maxHeight, w: n.style.width});
      n.style.overflow = 'visible';
      n.style.maxHeight = 'none';
      if (n.scrollWidth > n.clientWidth + 2) n.style.width = n.scrollWidth + 'px';
    }
  });
  return function(){ tocados.forEach(function(t){
    t.n.style.overflow = t.ox; t.n.style.maxHeight = t.mh; t.n.style.width = t.w; }); };
}
async function pngRasterizar(el, nombre){
  const h2c = await pngCargarLib();
  const restaurar = pngAbrirScrolls(el);
  await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
  try{
    const lienzo = await h2c(el, {
      backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false,
      width: el.scrollWidth, height: el.scrollHeight,
      windowWidth: Math.max(document.documentElement.clientWidth, el.scrollWidth + 80),
      ignoreElements: function(n){ return n.hasAttribute && n.hasAttribute('data-no-png'); }
    });
    pngBajar(lienzo.toDataURL('image/png'), nombre);
  } finally { restaurar(); }
}
// Captura el rango título → siguiente título, sobre un clon fuera de pantalla.
async function pngRango(tit, nombre){
  const jaula = document.createElement('div');
  const ancho = Math.max((tit.parentElement || document.body).clientWidth || 0, 1000);
  jaula.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1;background:#fff;'
    + 'padding:14px 18px 18px;width:' + ancho + 'px';
  let n = tit, fuentes = [];
  while (n){
    fuentes.push(n);
    jaula.appendChild(n.cloneNode(true));
    n = n.nextElementSibling;
    if (!n || (n.matches && n.matches(PNG_TITULOS))) break;
  }
  document.body.appendChild(jaula);
  try{
    fuentes.forEach(function(src, i){ if (jaula.children[i]) pngFijarCanvas(src, jaula.children[i]); });
    await pngRasterizar(jaula, nombre);
  } finally { jaula.remove(); }
}
async function pngDescargar(btn){
  const el = btn.parentElement;
  const modo = btn.getAttribute('data-png-modo');
  const titEl = btn._pngTit;
  const nombre = pngNombreArchivo(btn.getAttribute('data-png-nombre') || 'bloque');
  const original = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Generando…';
  const tip = document.getElementById('sc-tip');
  const tipVis = tip ? tip.style.display : null;
  if (tip) tip.style.display = 'none';
  try{
    if (modo === 'canvas'){
      pngBajar(el.querySelector('canvas').toDataURL('image/png'), nombre);
    } else if (modo === 'rango'){
      await pngRango(titEl, nombre);
    } else {
      await pngRasterizar(el, nombre);
    }
  }catch(e){
    console.error('PNG:', e);
    alert('No se pudo generar la imagen.\n\n' + (e && e.message ? e.message : e));
  }finally{
    if (tip) tip.style.display = tipVis;
    btn.disabled = false; btn.innerHTML = original;
  }
}
function pngPonerBoton(host, nombre, modo, titEl, extraCls){
  return; /* PNG deshabilitado: se eliminaron los botones de descarga PNG */
  if (!host || host.querySelector(':scope > .png-btn')) return;
  host.classList.add('png-host');
  const b = document.createElement('button');
  b.className = 'png-btn' + (extraCls ? ' ' + extraCls : ''); b.type = 'button';
  b.setAttribute('data-no-png', '1');
  b.setAttribute('data-png-modo', modo || 'bloque');
  b.setAttribute('data-png-nombre', nombre || 'bloque');
  b._pngTit = titEl || null;
  b.title = 'Descargar como PNG para pegar en una presentación';
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M4 20h16"/></svg>PNG';
  b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); pngDescargar(b); });
  host.appendChild(b);
}
// Título más cercano hacia atrás, para nombrar el archivo de una tabla.
function pngTituloCercano(el){
  let n = el;
  while (n && n !== document.body){
    let p = n.previousElementSibling;
    while (p){
      if (p.matches && p.matches(PNG_TITULOS) && p.textContent.trim()) return p.textContent.trim();
      const dentro = p.querySelector && p.querySelector(PNG_TITULOS);
      if (dentro && dentro.textContent.trim()) return dentro.textContent.trim();
      p = p.previousElementSibling;
    }
    n = n.parentElement;
  }
  return 'tabla';
}
// Envuelve el rango título → siguiente título en un contenedor real, para que el
// botón cuelgue del bloque y la captura sea exactamente ese bloque, sin arrastrar
// al vecino ni repetir lo que ya descarga otro botón.
function pngEnvolverRango(tit){
  const padre = tit.parentElement;
  if (!padre) return null;
  // En un contenedor flex/grid, agrupar hijos cambiaria el layout: se deja sin envolver.
  if (/flex|grid/.test(getComputedStyle(padre).display)) return null;
  if (padre.classList.contains('png-blk') && padre.firstElementChild === tit) return padre;
  const caja = document.createElement('div');
  caja.className = 'png-blk';
  padre.insertBefore(caja, tit);
  let n = tit;
  while (n){
    const sig = n.nextElementSibling;      // se lee antes de mover el nodo
    caja.appendChild(n);
    if (!sig || (sig.matches && sig.matches(PNG_TITULOS))) break;
    n = sig;
  }
  return caja;
}
// Envoltorio fijo para una tabla con scroll horizontal: el botón no puede colgar
// del contenedor scrolleable (quedaría fuera de pantalla al no estar scrolleado).
function pngCajaTabla(tbl){
  const scroll = tbl.closest('.mx-wrap');
  if (!scroll){
    const p = tbl.parentElement;
    if (!p || p.querySelector(':scope > .png-btn')) return null;
    return p;
  }
  const padre = scroll.parentElement;
  if (!padre) return null;
  if (padre.classList.contains('png-tblbox')) return padre;
  const caja = document.createElement('div');
  caja.className = 'png-tblbox';
  padre.insertBefore(caja, scroll);
  caja.appendChild(scroll);
  return caja;
}
function pngInyectarBotones(){
  // 1) Un botón por bloque, siempre en la esquina superior derecha del bloque.
  document.querySelectorAll(PNG_TITULOS).forEach(function(tit){
    // Los títulos que colapsan la sección no llevan botón: el clic es para abrir
    // y cerrar, y además capturarían el scanner completo en vez de una parte.
    if (tit.classList.contains('sc-toggle')) return;
    const nombre = (tit.textContent || '').trim();
    const wrap = tit.closest('.section-block') || tit.closest('.ms-banda');
    if (wrap){ pngPonerBoton(wrap, nombre, 'bloque'); return; }
    const blk = pngEnvolverRango(tit);
    if (blk) pngPonerBoton(blk, nombre, 'bloque');
    else pngPonerBoton(tit, nombre, 'rango', tit);   // respaldo: captura por rango
  });
  // 1b) El plano de Raíces no tiene título propio dentro: botón aparte.
  document.querySelectorAll('.ra-view').forEach(function(el){
    const tab = el.closest('[id^="tab-"]');
    const proy = tab ? tab.id.replace(/^tab-/, '').replace(/-precios$/, '') : '';
    pngPonerBoton(el, ('masterplan ' + proy).trim(), 'bloque');
  });
  // 2) Cada tabla se baja sola, aparte del bloque que la contiene.
  document.querySelectorAll('table').forEach(function(tbl){
    if (!tbl.rows || tbl.rows.length < 2) return;
    const caja = pngCajaTabla(tbl);
    if (caja) pngPonerBoton(caja, 'tabla ' + pngTituloCercano(tbl), 'bloque');
  });
  // 3) Gráficos que no quedaron dentro de ningún bloque descargable.
  document.querySelectorAll('canvas').forEach(function(cv){
    const cont = cv.closest('.chart-wrap') || cv.parentElement;
    if (!cont) return;
    if (cont.querySelector(':scope > .png-btn')) return;
    if (cont.closest('.png-host')) return;
    pngPonerBoton(cont, (cv.id || 'grafico').replace(/-/g, ' '), 'canvas');
  });
}
let _pngTimer = null;
function pngProgramar(){ clearTimeout(_pngTimer); _pngTimer = setTimeout(pngInyectarBotones, 200); }
document.addEventListener('click', pngProgramar, true);
if (window.MutationObserver){
  new MutationObserver(pngProgramar).observe(document.documentElement, {childList: true, subtree: true});
}
setTimeout(pngInyectarBotones, 1200);

// ─── Scanner Mirador Santa Teresita: elevación de unidades vendibles ─────────
// 120 deptos en 15 edificios de 3 a 5 pisos, 2 unidades por piso. El layout
// replica la lámina "Elevación unidades vendibles": dos hileras escalonadas
// siguiendo el terreno. OJO: en esa lámina la columna izquierda es la unidad 2
// y la derecha la unidad 1. El sufijo 01/02 del rótulo NO coincide con PlanOk
// (verificado en los pisos de una sola unidad de los edificios 9, 10 y 11).
const MST_TIPO = {1:'Tipo 1 · 120 m²',7:'Tipo 1 · 120 m²',8:'Tipo 1 · 120 m²',
  5:'Tipo 2 · 130 m²',6:'Tipo 2 · 130 m²',
  9:'Tipo 3 · 120 m²',12:'Tipo 3 · 120 m²',13:'Tipo 3 · 120 m²',14:'Tipo 3 · 120 m²',15:'Tipo 3 · 120 m²',
  2:'Tipo 4 · 140 m²',3:'Tipo 4 · 140 m²',4:'Tipo 4 · 140 m²',10:'Tipo 4 · 140 m²',11:'Tipo 4 · 140 m²'};
// [edificio, escalón de terreno en px] — leídos de la elevación
const MST_BANDAS = [
  {nom:'Hilera superior', sub:'Edificios 9 a 15 · al fondo, sobre la Subida Santa Teresita',
   eds:[[15,0],[14,0],[13,0],[12,0],[11,16],[10,16],[9,16]]},
  {nom:'Hilera inferior', sub:'Edificios 1 a 8 · al frente, bajando por el terreno',
   eds:[[8,0],[7,0],[6,6],[5,12],[4,46],[3,46],[2,46],[1,92]]}
];
function mstEd(u){
  // ALL_DATA llega con subagrupacion colapsada a 'DEPARTAMENTOS' (ver COLAPSAR_SUB),
  // asi que el edificio se toma de subagrupacion_real. Respaldo: el numero de depto
  // es <edificio><piso><unidad>, o sea DEPTO 1552 = edificio 15, piso 5, unidad 2.
  const s = u.subagrupacion_real || u.subagrupacion || '';
  const n = parseInt(String(s).replace(/\D/g,''),10);
  if (n) return n;
  const p = String(u.propiedad||'').replace(/\D/g,'');
  return p.length >= 3 ? parseInt(p.slice(0, p.length - 2), 10) : NaN;
}
function mstUn(u){ return parseInt(String(u.propiedad||'').slice(-1),10); }
function mstPi(u){ return parseInt(u.piso,10); }

function scBuildElevacion(titulo, subData, tabId){
  const gid = 'scg'+(++SC_GIDX);
  const precPrinc = u => scVend(u)
    ? Math.round((u.precio_total_operacion_uf||0)-(u.precio_bodega_uf||0)-(u.precio_estacionamiento_uf||0))
    : (u.precio_total_operacion_uf||0);
  const terr = u => {
    const own = parseFloat(u.m2_terraza);
    if(own>0) return own;
    const t = TERRAZA_BY_ID[String(u.id_producto)];
    return (t!=null&&t>0)?t:0;
  };
  const U = {};                     // ed -> piso -> unidad
  const info = [];
  for(const d of subData){
    const e=mstEd(d), p=mstPi(d), un=mstUn(d);
    if(!e||!p||!un) continue;
    const suid='su'+(++SC_UIDX); SC_UNITS[suid]=d;
    const pr=precPrinc(d), m2=(parseFloat(d.m2)||0)+terr(d)/2;
    const o={ed:e,piso:p,un:un,suid:suid,raw:d,precio:pr,ufm2:(m2>0&&pr>0)?Math.round(pr/m2):null};
    (U[e]=U[e]||{}); (U[e][p]=U[e][p]||{})[un]=o;
    info.push(o);
  }
  if(!info.length)
    return '<div class="sc-sec">'+titulo+'</div><p style="color:#999;padding:10px 0;font-size:12px">Sin unidades para mostrar.</p>';

  const tot=subData.length, ve=subData.filter(scVend).length;
  const es=subData.filter(scEscr).length, pr=subData.filter(scProm).length, re=subData.filter(scRes).length;
  const ufV=subData.filter(scVend).reduce((s,d)=>s+(d.precio_total_operacion_uf||0),0);
  const ufD=subData.filter(d=>!scVend(d)).reduce((s,d)=>s+(d.precio_total_operacion_uf||0),0);

  function celda(o){
    if(!o) return '<div class="ms-c emp"></div>';
    return '<div class="ms-c '+scCls(o.raw.estado_corte)+'" data-suid="'+o.suid+'"'
      + ' onmouseenter="scShowTip(this,event)" onmouseleave="scHideTip()">'
      + '<span class="up">UF '+fmtUF(o.precio)+'</span>'
      + '<span class="um2">'+(o.ufm2?fmtUF(o.ufm2)+' UF/m²':'')+'</span>'
      + '<span class="uid">Depto '+o.ed+''+o.piso+''+o.un+'</span></div>';
  }
  function banda(b){
    const cols = b.eds.filter(x=>U[x[0]]).map(function(x){
      const e=x[0], off=x[1], pisos=Object.keys(U[e]).map(Number);
      const maxp=Math.max.apply(null,pisos);
      let st='';
      for(let p=1;p<=maxp;p++){
        const f=U[e][p]||{};
        st += '<div class="ms-piso">'+celda(f[2])+celda(f[1])+'</div>';
      }
      return '<div style="margin-bottom:'+off+'px">'
        + '<div class="ms-ed-h"><b>EDIFICIO '+e+'</b><span>'+(MST_TIPO[e]||'')+'</span></div>'
        + '<div class="ms-stack">'+st+'</div></div>';
    }).join('');
    return '<div class="ms-banda"><div class="ms-band-h">'+b.nom+'<span>'+b.sub+'</span></div>'
      + '<div class="ms-scroll"><div class="ms-row">'+cols+'</div></div></div>';
  }
  function resumen(){
    const prom=(a,f)=> a.length ? a.reduce((s,u)=>s+f(u),0)/a.length : null;
    const eds=Object.keys(U).map(Number).sort((a,b)=>a-b);
    const filas=eds.map(function(e){
      return {nom:'Edificio '+e, sub:(MST_TIPO[e]||'').replace(' · ',' — '), us:info.filter(o=>o.ed===e)};
    }).concat([{nom:'TOTAL PROYECTO', sub:'15 edificios', us:info, tot:true}]);
    const body=filas.map(function(f){
      const v=f.us.filter(o=>scVend(o.raw)), d=f.us.filter(o=>!scVend(o.raw));
      return '<tr class="'+(f.tot?'tot':'')+'">'
        + '<td>'+f.nom+'<span style="font-weight:400;color:#888"> · '+f.sub+'</span></td>'
        + '<td>'+f.us.length+'</td>'
        + '<td class="b">'+(v.length||'—')+'</td>'
        + '<td>'+(v.length?fmtUF(prom(v,o=>o.precio)):'—')+'</td>'
        + '<td>'+(v.length?fmtUF(prom(v,o=>o.ufm2)):'—')+'</td>'
        + '<td class="b">'+(d.length||'—')+'</td>'
        + '<td>'+(d.length?fmtUF(prom(d,o=>o.precio)):'—')+'</td>'
        + '<td>'+(d.length?fmtUF(prom(d,o=>o.ufm2)):'—')+'</td>'
        + '<td>'+fmtUF(f.us.reduce((s,o)=>s+(o.precio||0),0))+'</td></tr>';
    }).join('');
    return '<div class="sc-sec">Resumen por edificio</div>'
      + '<div class="mx-wrap" style="max-height:none"><table class="ra-rs"><thead><tr>'
      + '<th>Edificio</th><th>Uds</th>'
      + '<th>Vendidas</th><th>Ticket Prom. UF</th><th>UF/m² Prom.</th>'
      + '<th>Disponibles</th><th>Ticket Prom. UF</th><th>UF/m² Prom.</th>'
      + '<th>PxQ (UF)</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  return '<div class="sc-sec sc-toggle" onclick="scToggle(\'' + gid + '\')"><span class="sc-arrow" id="arr-'+gid+'">▼</span>'+titulo+'</div>'
    + '<div class="sc-group" id="'+gid+'">'
    + '<div class="sc-stats"><span class="sc-flow">'
    +   '<span class="sc-chip sc-chip-tot">'+tot+' uds</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-vend">'+ve+' vendidas ('+(tot?Math.round(ve/tot*100):0)+'%)</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-res">'+re+' reservas</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-prom">'+pr+' promesas</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-escr">'+es+' escrituras</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-disp">'+(tot-ve)+' disponibles</span>'
    +   '<span class="sc-bar"></span><span class="sc-uf">UF '+fmtUF(Math.round(ufV))+' vendidas</span>'
    +   '<span style="color:#bbb;font-size:11px">vs</span><span class="sc-uf-disp">UF '+fmtUF(Math.round(ufD))+' disponibles</span>'
    + '</span></div>'
    + '<div class="sc-nota">Nota: cada columna es un edificio y cada fila un piso, con las dos unidades lado a lado según la elevación de unidades vendibles (izquierda = unidad 2, derecha = unidad 1). Precio de operación en unidades vendidas y precio base en disponibles. UF/m² sobre superficie útil + ½ terraza.</div>'
    + MST_BANDAS.map(banda).join('')
    + resumen()
    + '</div>';
}

function scBuildMasterplan(titulo, subData, tabId){
  const gid = 'scg'+(++SC_GIDX);

  // mismo criterio de precio y de m² efectivo que scBuildMatrix / scShowTip
  const precPrinc = u => scVend(u)
    ? Math.round((u.precio_total_operacion_uf||0)-(u.precio_bodega_uf||0)-(u.precio_estacionamiento_uf||0))
    : (u.precio_total_operacion_uf||0);
  const terr = u => {
    const own = parseFloat(u.m2_terraza);
    if(own>0) return own;
    const t = TERRAZA_BY_ID[String(u.id_producto)];
    return (t!=null&&t>0)?t:0;
  };

  const units = [];
  for(const d of subData){
    const casa = raNum(d);
    if(!casa || !RA_COORDS[casa]) continue;
    const suid = 'su'+(++SC_UIDX);

  const vals=units.filter(u=>!u.bloq).map(u=>u.ufm2).filter(Boolean);

  let h = '<div class="sc-leyenda" style="margin:-4px 0 10px">'
    + '<div class="sc-leg"><div class="sc-leg-dot" style="background:#d9d9d9;border:1px solid #8c8c8c"></div>Etapa 2 sin vender (precio base, fuera del embudo)</div><div class="sc-leg"><div class="sc-leg-dot" style="background:#d4e3f5;border:2px solid #4a4a4a"></div>Etapa 2 vendida</div>'
    + '</div>'
    + '<div class="sc-sec sc-toggle" onclick="scToggle(\'' + gid + '\')"><span class="sc-arrow" id="arr-'+gid+'">▼</span>'+titulo+'</div>'
    + '<div class="sc-group" id="'+gid+'">'
    + '<div class="sc-stats"><span class="sc-flow">'
    +   '<span class="sc-chip sc-chip-tot">'+tot+' uds</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-vend">'+ve+' vendidas ('+(tot?Math.round(ve/tot*100):0)+'%)</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-res">'+re+' reservas</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-prom">'+pr+' promesas</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-escr">'+es+' escrituras</span><span class="sc-arw">→</span>'
    +   '<span class="sc-chip sc-chip-disp">'+(tot-ve)+' disponibles</span>'
    +   (nBloq ? '<span class="sc-bar"></span><span class="sc-chip sc-chip-nd">'+nBloq+' bloqueadas · Etapa 2 · UF '+fmtUF(Math.round(ufBloq))+'</span>' : '')
    +   '<span class="sc-bar"></span><span class="sc-uf">UF '+fmtUF(Math.round(ufV))+' vendidas</span>'
    +   '<span style="color:#bbb;font-size:11px">vs</span><span class="sc-uf-disp">UF '+fmtUF(Math.round(ufD))+' disponibles</span>'
    + '</span></div>'
    + '<div class="sc-nota" style="background:#f4f4f4;border-left:3px solid #E1093F;padding:6px 8px;margin:0 0 6px">Proyecto completo (Etapa 1 + Etapa 2): <b>'+subData.length+' uds</b> &middot; <b>'+subData.filter(scVend).length+' vendidas</b> &middot; '+subData.filter(d=>!scVend(d)).length+' disponibles &middot; UF '+fmtUF(Math.round(subData.filter(scVend).reduce((s,d)=>s+(d.precio_total_operacion_uf||0),0)))+'</div>'
    + '<div class="sc-nota">Nota: sobre el plano, la cifra grande de cada lote es el precio en UF y la chica el UF/m² (útil + ½ terraza), con el color del estado comercial. Precio de operación en unidades vendidas y precio base en disponibles. Las casas 1–28 y 114–121 son de Etapa 2: las vendidas se marcan con el color de su estado y contorno oscuro; las que siguen disponibles van en gris tramado y a precio base, fuera del embudo y de las UF de esta franja. El total del proyecto va en la franja de arriba.</div>'

    +   '<span class="ra-esc"><span>'+fmtUF(Math.min.apply(null,vals))+'</span><span class="g"></span><span>'+fmtUF(Math.max.apply(null,vals))+' UF/m²</span></span>'
    +   '<span class="ra-sp"></span>'

    +   '<input class="ra-find" placeholder="Ir a casa nº…" inputmode="numeric" oninput="raBuscar(\'' + gid + '\',this.value)">'
    + '</div>'
    + '<div class="ra-view"><div class="ra-wrap" id="'+gid+'-mp">'
    +   '<img src="'+RA_IMG+'" alt="Masterplan Raíces Peñablanca">'
    +   '<div class="ra-dim"></div>'
    +   raSectores(units)
    +   '<div id="'+gid+'-mks" style="position:absolute;inset:0">'+raMarcadores(gid)+'</div>'
    + '</div></div>'
    + raTarjetas(units)
    + raResumen(units)

  setTimeout(function(){ raScale(gid); }, 0);
  return h;
}

function scBuildMatrix(titulo, subData, tabId){
  const pisos=[...new Set(subData.map(d=>d.piso).filter(p=>p!=null))].sort((a,b)=>b-a);
  const mods=scSortMods([...new Set(subData.map(d=>d.modelo).filter(m=>m!=null))]);
  if(!pisos.length||!mods.length)
    return `<div class="sc-sec">${titulo}</div><p style="color:#999;padding:10px 0;font-size:12px">Sin datos de piso/modelo para este grupo.</p>`;

  const meta={};
  for(const d of subData){if(d.modelo&&!meta[d.modelo])meta[d.modelo]={p:d.programa,m:d.m2};}
  const lk={};
  for(const d of subData){const k=d.piso+'_'+d.modelo;if(!lk[k])lk[k]=d;}

  // m² efectivo para UF/m² = m² útil (principal) + ½ terraza (desde cotizaciones_pok).
  // Si la unidad no tiene terraza cargada, se usa el promedio de terraza de su modelo.
  const modTerraza={};
  for(const m of mods){
    const vals=subData.filter(d=>d.modelo===m).map(d=>TERRAZA_BY_ID[String(d.id_producto)]).filter(t=>t!=null&&t>0);
    modTerraza[m]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  }
  const scTerr=(u)=>{
    const own=parseFloat(u.m2_terraza);              // dato oficial de ventas_pok (API PlanOk)
    if(own>0) return own;
    const t=TERRAZA_BY_ID[String(u.id_producto)];    // respaldo: cotizaciones
    return (t!=null&&t>0)?t:(modTerraza[u.modelo]||0);
  };
  const scM2=(u)=>(parseFloat(u.m2)||0)+scTerr(u)/2;

  const pctM={};
  for(const m of mods){
    const all=subData.filter(d=>d.modelo===m);
    pctM[m]=all.length?Math.round(all.filter(scVend).length/all.length*100):0;
  }

  const tot=subData.length,ve=subData.filter(scVend).length;
  const es=subData.filter(scEscr).length,pr=subData.filter(scProm).length,re=subData.filter(scRes).length;
  const ufV=subData.filter(scVend).reduce((s,d)=>s+(d.precio_total_operacion_uf||0),0);
  const ufD=subData.filter(d=>!scVend(d)).reduce((s,d)=>s+(d.precio_total_operacion_uf||0),0);

  const gid='scg'+(++SC_GIDX);
  let h=`<div class="sc-sec sc-toggle" onclick="scToggle('${gid}')"><span class="sc-arrow" id="arr-${gid}">▼</span>${titulo}</div>
  <div class="sc-group" id="${gid}">
  <div class="sc-stats">
    <span class="sc-flow">
      <span class="sc-chip sc-chip-tot">${tot} uds</span>
      <span class="sc-arw">→</span>
      <span class="sc-chip sc-chip-vend">${ve} vendidas (${tot?Math.round(ve/tot*100):0}%)</span>
      <span class="sc-arw">→</span>
      <span class="sc-chip sc-chip-res">${re} reservas</span>
      <span class="sc-arw">→</span>
      <span class="sc-chip sc-chip-prom">${pr} promesas</span>
      <span class="sc-arw">→</span>
      <span class="sc-chip sc-chip-escr">${es} escrituras</span>
      <span class="sc-arw">→</span>
      <span class="sc-chip sc-chip-disp">${tot-ve} disponibles</span>
      <span class="sc-bar"></span>
      <span class="sc-uf">UF ${fmtUF(ufV)} vendidas</span>
      <span style="color:#bbb;font-size:10px">vs</span>
      <span class="sc-uf-disp">UF ${fmtUF(ufD)} disponibles</span>
    </span>
  </div>
  <p class="sc-nota">Nota: sólo considera precios de unidades principales (no incluye estacionamientos ni bodegas). El resumen PxQ va al final de la misma tabla — el título del modelo y la columna de la izquierda quedan fijos al hacer scroll.</p>`;

  // ── Métricas por modelo (para el resumen integrado, mismas columnas) ────────
  const precPrinc = u => scVend(u)
    ? Math.round((u.precio_total_operacion_uf||0)-(u.precio_bodega_uf||0)-(u.precio_estacionamiento_uf||0))
    : (u.precio_total_operacion_uf || 0);
  const perMod = mods.map(m => {
    const us  = subData.filter(d => d.modelo === m);
    const vus = us.filter(scVend), dus = us.filter(u=>!scVend(u));
    const vP = vus.reduce((a,u)=>a+precPrinc(u),0);
    const dP = dus.reduce((a,u)=>a+precPrinc(u),0);
    const vM2 = vus.reduce((a,u)=>a+scM2(u),0);
    const dM2 = dus.reduce((a,u)=>a+scM2(u),0);
    let secVUn = 0, secVUf = 0;
    for (const u of vus) {
      const e = u.precio_estacionamiento_uf||0, b = u.precio_bodega_uf||0;
      if (e>0) secVUn++; if (b>0) secVUn++; secVUf += e + b;
    }
    return { m, ve:vus.length, di:dus.length, vP, dP, vM2, dM2, secVUn, secVUf,
      ticketV: vus.length ? vP/vus.length : 0, ufm2V: vM2 ? vP/vM2 : 0,
      ticketD: dus.length ? dP/dus.length : 0, ufm2D: dM2 ? dP/dM2 : 0,
      pxq: vP + dP + secVUf };
  });
  const T = perMod.reduce((a,x)=>({ ve:a.ve+x.ve, di:a.di+x.di, vP:a.vP+x.vP, dP:a.dP+x.dP,
    vM2:a.vM2+x.vM2, dM2:a.dM2+x.dM2, secVUn:a.secVUn+x.secVUn, secVUf:a.secVUf+x.secVUf }),
    { ve:0,di:0,vP:0,dP:0,vM2:0,dM2:0,secVUn:0,secVUf:0 });
  const proyecto = subData[0] ? subData[0].proyecto : '';
  const secP = SEC_DISP[proyecto] || {};
  const secDN = (tipo) => (((secP[tipo]||{})[titulo])||{}).UN || 0;
  const secDF = (tipo) => (((secP[tipo]||{})[titulo])||{}).UF || 0;
  const secDispUn = secDN('estacionamiento') + secDN('bodega') + secDN('otros');
  const secDispUf = secDF('estacionamiento') + secDF('bodega') + secDF('otros');
  const totPxQ = T.vP + T.dP + T.secVUf + secDispUf;
  const fUF = n => n ? fmtUF(Math.round(n)) : '—';

  // Fila de resumen dentro de la matriz (columnas = modelos, alineadas 1:1)
  const sumRow = (label, cells, total, opts) => {
    const o = opts || {};
    const rowCls = 'sc-sum' + (o.cls ? ' '+o.cls : '');
    const svb = o.strong ? ' sc-sv-b' : '';
    return `<tr class="${rowCls}"><td class="sc-sl">${label}</td>`
      + cells.map(c=>`<td class="sc-sv${svb}">${c}</td>`).join('')
      + `<td class="sc-sv sc-sv-tot${svb}">${total}</td></tr>`;
  };
  const sumHdr = (txt) => `<tr class="sc-sum-hdr"><td class="sc-sl">${txt}</td>`
    + mods.map(()=>'<td></td>').join('') + '<td></td></tr>';

  // ── MATRIZ + RESUMEN en una sola tabla (header de modelos y col. izquierda fijos) ──
  h += `<div class="mx-wrap"><table class="mx-table"><thead><tr><td class="mx-corner"></td>`;
  for(const m of mods){
    const mt=meta[m]||{};
    h+=`<th class="th-mod"><span class="mc">${m}</span><span class="mp">${mt.p||''}</span><span class="mm">${mt.m?mt.m+' m²':''}</span></th>`;
  }
  h+=`<th class="th-mod th-tot">TOTAL</th></tr></thead><tbody>`;

  for(const p of pisos){
    h+=`<tr><td class="th-fl">Piso ${parseInt(p,10)}</td>`;
    for(const m of mods){
      const u=lk[p+'_'+m];
      if(!u){h+='<td class="uc emp"></td>';continue;}
      const suid='su'+(++SC_UIDX);
      SC_UNITS[suid]=u;
      const cls=scCls(u.estado_corte);
      const precPrincipal = precPrinc(u);
      const precio = fmtUF(precPrincipal);
      const m2v = scM2(u);   // m² efectivo = útil + ½ terraza
      const ufm2 = (m2v > 0 && precPrincipal > 0) ? Math.round(precPrincipal / m2v) : null;
      h+=`<td class="uc uc-xl ${cls}" data-suid="${suid}" onmouseenter="scShowTip(this,event)" onmouseleave="scHideTip()">
        <span class="up">UF ${precio}</span>
        <span class="um2">${ufm2!=null ? fmtUF(ufm2)+' UF/m²' : ''}</span>
      </td>`;
    }
    h+='<td class="uc emp"></td></tr>';   // celda vacía bajo la columna TOTAL
  }

  // Resumen PxQ (mismas columnas de modelo)
  h += sumHdr('Vendidas');
  h += sumRow('Unidades Vendidas',  perMod.map(x=>x.ve||'—'),                    T.ve||'—',                     {strong:true});
  h += sumRow('Ticket Promedio UF', perMod.map(x=>x.ve?fUF(x.ticketV):'—'),      T.ve?fUF(T.vP/T.ve):'—');
  h += sumRow('UF/m² Promedio',     perMod.map(x=>x.vM2?fUF(x.ufm2V):'—'),       T.vM2?fUF(T.vP/T.vM2):'—');
  h += sumHdr('Disponibles');
  h += sumRow('Unidades Disponibles', perMod.map(x=>x.di||'—'),                  T.di||'—',                     {strong:true});
  h += sumRow('Ticket Promedio UF', perMod.map(x=>x.di?fUF(x.ticketD):'—'),      T.di?fUF(T.dP/T.di):'—');
  h += sumRow('UF/m² Promedio',     perMod.map(x=>x.dM2?fUF(x.ufm2D):'—'),       T.dM2?fUF(T.dP/T.dM2):'—');
  h += sumHdr('Secundarios y PxQ');
  h += sumRow('Sec. Vendidos (Un)', perMod.map(x=>x.secVUn||'—'),                T.secVUn||'—');
  h += sumRow('Sec. Vendidos (UF)', perMod.map(x=>fUF(x.secVUf)),                fUF(T.secVUf));
  h += sumRow('Sec. Disp. (Un)',    mods.map(()=>'—'),                           secDispUn||'—');
  h += sumRow('Sec. Disp. (UF)',    mods.map(()=>'—'),                           fUF(secDispUf));
  h += sumRow('PxQ (UF)',           perMod.map(x=>fUF(x.pxq)),                   fUF(totPxQ),                   {cls:'sc-pxq', strong:true});

  h += '</tbody></table></div>';   // cierra matriz + resumen + mx-wrap
  h += `<p class="sc-nota">PxQ = precio × cantidad. Ticket = UF principal / unidades · UF/m² = UF principal / m² <b>efectivo (útil + ½ terraza)</b>, ponderado. Vendidas a precio efectivo, disponibles a precio base. "Sec. Disp." (estac.+bodega disponibles) se suma solo en la columna TOTAL para llegar al PxQ del proyecto.</p>`;

  // ── UF/m² por Tipología en el Tiempo (evolución del precio de venta) ───────
  // Cromático / Mirador Sta. Teresita (en reserva): fecha_reserva / estado RESERVADO.
  const velResSC = proyecto === 'CROMATICO' || proyecto === 'MIRADOR SANTA TERESITA';
  const fldSC = velResSC ? 'fecha_reserva' : 'fecha_promesa';
  const okEstadoSC = d => velResSC ? d.estado_corte==='RESERVADO'
                                   : (d.estado_corte==='PROMESADO'||d.estado_corte==='ESCRITURADO');
  const ventasHistSC = subData.filter(d => okEstadoSC(d) && d[fldSC]);
  if (ventasHistSC.length && tabId) {
    const ym = s => s.substring(0,7);
    const todosYM = ventasHistSC.map(d=>ym(d[fldSC])).sort();
    const desde = todosYM[0], hasta = todosYM[todosYM.length-1];
    const mesesSC = [];
    let [ay,am] = desde.split('-').map(Number); const [hy,hm] = hasta.split('-').map(Number);
    while (ay<hy || (ay===hy && am<=hm)) { mesesSC.push(String(ay)+'-'+String(am).padStart(2,'0')); am++; if(am>12){am=1;ay++;} }
    const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const labelsSC = mesesSC.map(m=>{const [y,mm]=m.split('-');return MESES_ES[+mm-1]+' '+y.substring(2);});
    const dsSC = mods.filter(m => ventasHistSC.some(d=>d.modelo===m)).map((m,i) => {
      const us = ventasHistSC.filter(d=>d.modelo===m).sort((a,b)=> a[fldSC] < b[fldSC] ? -1 : 1);
      let cumP=0, cumM2=0, idx=0, last=null;
      const data = mesesSC.map(mes => {
        while (idx<us.length && ym(us[idx][fldSC])<=mes) { cumP += precPrinc(us[idx]); cumM2 += scM2(us[idx]); idx++; }
        if (cumM2>0) last = cumP/cumM2;
        return last;
      });
      const mt = meta[m]||{};
      const color = VEL_COLORS[i % VEL_COLORS.length];
      return { label:`${m}${mt.p?' ('+mt.p+')':''}`, data, borderColor:color, backgroundColor:color,
        tension:0.25, borderWidth:2, spanGaps:true, pointRadius:2, pointHoverRadius:5 };
    });
    // Línea "Promedio" (ponderada, no promedio simple de tipologías): se muestra al elegir "Todas",
    // en vez de superponer una línea por cada tipología.
    const usAllSC = ventasHistSC.slice().sort((a,b)=> a[fldSC] < b[fldSC] ? -1 : 1);
    let cumPAll=0, cumM2All=0, idxAll=0, lastAll=null;
    const dataAllSC = mesesSC.map(mes => {
      while (idxAll<usAllSC.length && ym(usAllSC[idxAll][fldSC])<=mes) { cumPAll += precPrinc(usAllSC[idxAll]); cumM2All += scM2(usAllSC[idxAll]); idxAll++; }
      if (cumM2All>0) lastAll = cumPAll/cumM2All;
      return lastAll;
    });
    const promedioDS = { label:'Promedio', data: dataAllSC, borderColor:'#111111', backgroundColor:'#111111',
      tension:0.25, borderWidth:3, borderDash:[6,3], spanGaps:true, pointRadius:2, pointHoverRadius:5, isPromedio:true };
    const canvasIdSC = 'ufm2chart-' + gid;
    const ufm2FiltHTML = `<div class="chart-filters" id="ufm2filt-${canvasIdSC}" style="margin:10px 0 4px">
      <span class="filter-label">Tipología</span>
      <div class="filter-group">
        ${dsSC.map((ds,i)=>`<button class="chart-filter-btn${i===0?' metric-active':''}" onclick="scUfm2Filter('${canvasIdSC}',${i},this)">${ds.label}</button>`).join('')}
        <button class="chart-filter-btn" onclick="scUfm2Filter('${canvasIdSC}',-1,this)">Todas</button>
      </div>
    </div>`;
    h += `
    <div class="sc-sec" style="margin-top:10px">UF/m² por Tipología en el Tiempo</div>
    <p class="sc-nota">Promedio acumulado de UF/m² (útil + ½ terraza) de unidades vendidas, según fecha de ${velResSC?'reserva':'promesa'}. Muestra cómo ha ido aumentando el valor de venta a medida que avanza la comercialización. Selecciona una tipología para verla sola, o "Todas" para ver el promedio ponderado del proyecto.</p>
    ${dsSC.length > 1 ? ufm2FiltHTML : ''}
    <div style="position:relative;height:300px;margin:8px 0 16px"><canvas id="${canvasIdSC}"></canvas></div>`;
    if (!SC_UFM2_SPECS[tabId]) SC_UFM2_SPECS[tabId] = [];
    SC_UFM2_SPECS[tabId].push({ canvasId: canvasIdSC, labels: labelsSC, datasets: [...dsSC, promedioDS] });
  }

  h+='</div>';   // cierra sc-group
  return h;
}
function scToggle(gid){
  const g=document.getElementById(gid);
  const a=document.getElementById('arr-'+gid);
  if(!g)return;
  const oculto=g.style.display==='none';
  g.style.display=oculto?'block':'none';
  if(a)a.textContent=oculto?'▼':'▶';
}

// ─── COTIZACIONES — por canal de llegada y por tipología ─────────────────────
const COTIZ_STATE  = {}; // tabId -> { periodo, ventana, canalVista }
const COTIZ_CHARTS = {}; // canvasId -> instancia Chart

// Mapeo oficial de los medios de llegada de PlanOK a 3 macro-canales.
// Lo que no esté mapeado (incl. sin dato) cae en CANAL_OTROS — no existe un 4º bucket "Otros".
const CANAL_GRUPO = {
  'SALA DE VENTA': ['LETRERO VÍA PÚBLICA', 'PASA POR EL SECTOR', 'REFERIDO'],
  'DIGITAL':       ['COTIZADOR WEB POK', 'WEB INMOBILIARIA', 'FACEBOOK', 'INSTAGRAM', 'WHATSAPP', 'LIDZ'],
  'PORTALES':      ['PORTAL INMOBILIARIO.COM', 'PORTAL PM', 'PORTAL PROPIEDADES EJÉRCITO', 'MERCADO LIBRE', 'MERCADO LIBRE (PLANOK)'],
};
const CANAL_OTROS = 'SALA DE VENTA';
const _CANAL_LOOKUP = {};
for (const grupo of Object.keys(CANAL_GRUPO))
  for (const medio of CANAL_GRUPO[grupo]) _CANAL_LOOKUP[medio.toUpperCase().trim()] = grupo;

function cotizCanal3(medio){
  const m = (medio || '').toUpperCase().trim();
  return _CANAL_LOOKUP[m] || CANAL_OTROS;
}
function cotizTipologia(programa){
  const p = (programa || '').toUpperCase();
  if (!p) return 'Sin tipología';
  if (/STUDIO/.test(p)) return '1D-1B';
  if (/OFICINA/.test(p)) return 'Oficina';
  const md = p.match(/(\d)\s*D/), mb = p.match(/(\d)\s*B/);
  if (md && mb) return `${md[1]}D-${mb[1]}B`;
  return 'Sin tipología';
}
// Bucket de período (semanas/meses/años) — mismo criterio para cotizaciones y reservas
function cotizBucketOf(fechaStr, periodo){
  const d = new Date(String(fechaStr).substring(0,10) + 'T12:00:00');   // mediodia local: si se parsea como UTC, en Chile la fecha se corre un dia
  const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if (periodo === 'semanas') {
    const dow = (d.getDay() + 6) % 7;               // 0 = lunes
    const monday = new Date(d); monday.setDate(d.getDate() - dow);
    const key = monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2,'0') + '-' + String(monday.getDate()).padStart(2,'0');
    return { key, label: monday.toLocaleDateString('es-CL', { day:'2-digit', month:'short' }) };
  }
  if (periodo === 'anios') { const y = d.getFullYear(); return { key:String(y), label:String(y) }; }
  const y = d.getFullYear(), m = d.getMonth() + 1;
  return { key:`${y}-${String(m).padStart(2,'0')}`, label:`${MESES_ES[m-1]} ${String(y).substring(2)}` };
}
function setCotiz(tabId, proyecto, grupo, valor, btn){
  const st = COTIZ_STATE[tabId] || (COTIZ_STATE[tabId] = { periodo:'meses', ventana:'historica', canalVista:'3' });
  st[grupo] = valor;
  if (btn && btn.parentElement) {
    btn.parentElement.querySelectorAll('.chart-filter-btn').forEach(b => b.classList.remove('metric-active'));
    btn.classList.add('metric-active');
  }
  renderCotizCharts(tabId, proyecto);
}
function buildCotizChart(canvasId, cotizRows, resRows, periodo, classifier, fixedOrder, rango){
  const cv = document.getElementById(canvasId);
  if (!cv || typeof Chart === 'undefined') return;
  if (!cotizRows.length) { cv.parentElement.innerHTML = '<p style="color:#999;font-size:12px;padding:20px 0">Sin cotizaciones en la ventana seleccionada.</p>'; return; }

  const buckets = {};
  const touch = (fecha) => {
    const b = cotizBucketOf(fecha, periodo);
    if (!buckets[b.key]) buckets[b.key] = { label:b.label, cats:{}, reservas:0 };
    return buckets[b.key];
  };
  for (const d of cotizRows) { const b = touch(d.fecha_cotizacion); const cat = classifier(d) || 'Otros'; b.cats[cat] = (b.cats[cat]||0) + 1; }
  for (const d of resRows)   { touch(d.fecha_reserva).reservas++; }

  // Los periodos sin cotizaciones deben verse en 0, no desaparecer del eje.
  (function rellenarPeriodosVaciosCotiz(){
    const fechas = [];
    for (const d of cotizRows) if (d.fecha_cotizacion) fechas.push(String(d.fecha_cotizacion).substring(0,10));
    for (const d of resRows)   if (d.fecha_reserva)    fechas.push(String(d.fecha_reserva).substring(0,10));
    if (!fechas.length) return;
    let desde = fechas[0], hasta = fechas[0];
    for (const f of fechas) { if (f < desde) desde = f; if (f > hasta) hasta = f; }
    if (rango) {
      if (rango.desde && rango.desde < desde) desde = rango.desde;
      if (rango.hasta && rango.hasta > hasta) hasta = rango.hasta;
    }
    const add = (fechaStr) => {
      const b = cotizBucketOf(fechaStr, periodo);
      if (!buckets[b.key]) buckets[b.key] = { label:b.label, cats:{}, reservas:0 };
    };
    let guard = 0;
    if (periodo === 'semanas') {
      const paso = new Date(desde + 'T12:00:00'), fin = new Date(hasta + 'T12:00:00');
      while (paso <= fin && guard++ < 1200) {
        add(paso.getFullYear() + '-' + String(paso.getMonth()+1).padStart(2,'0') + '-' + String(paso.getDate()).padStart(2,'0'));
        paso.setDate(paso.getDate() + 7);
      }
      add(hasta);
    } else if (periodo === 'anios') {
      let y = Number(desde.substring(0,4)); const yF = Number(hasta.substring(0,4));
      while (y <= yF && guard++ < 200) { add(y + '-07-15'); y++; }
    } else {
      let y = Number(desde.substring(0,4)), m = Number(desde.substring(5,7));
      const yF = Number(hasta.substring(0,4)), mF = Number(hasta.substring(5,7));
      while ((y < yF || (y === yF && m <= mF)) && guard++ < 1200) {
        add(y + '-' + String(m).padStart(2,'0') + '-15');
        m++; if (m > 12) { m = 1; y++; }
      }
    }
  })();
  const keys = Object.keys(buckets).sort();
  const labels = keys.map(k => buckets[k].label);
  let cats = fixedOrder;
  if (!cats) {
    const totals = {};
    for (const k of keys) for (const c in buckets[k].cats) totals[c] = (totals[c]||0) + buckets[k].cats[c];
    cats = Object.keys(totals).sort((a,b) => totals[b]-totals[a]).slice(0,8);
  }
  const palette = { 'PORTALES':'#E1093F', 'DIGITAL':'#2E4057', 'SALA DE VENTA':'#00B050' };
  const datasets = cats.map((cat,i) => ({
    type:'bar', label: palette[cat] ? cat.charAt(0)+cat.slice(1).toLowerCase() : cat,
    data: keys.map(k => buckets[k].cats[cat] || 0),
    backgroundColor: palette[cat] || VEL_COLORS[i % VEL_COLORS.length], stack:'s'
  }));
  const totalReservas = resRows.length;
  datasets.push({ type:'line', label:`Reservas (${totalReservas})`, data: keys.map(k => buckets[k].reservas),
    borderColor:'#111111', backgroundColor:'#111111', borderWidth:2, tension:0.25, pointRadius:2, pointHoverRadius:5, yAxisID:'y1' });

  if (COTIZ_CHARTS[canvasId]) COTIZ_CHARTS[canvasId].destroy();
  COTIZ_CHARTS[canvasId] = new Chart(cv, {
    data: { labels, datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'top', labels:{ font:{size:10}, boxWidth:12 } } },
      scales:{
        x:{ stacked:true, ticks:{ font:{size:10}, maxRotation:60, minRotation:0 }, grid:{ display:false } },
        y:{ stacked:true, beginAtZero:true, position:'left', title:{ display:true, text:'Cotizaciones' }, ticks:{ precision:0, font:{size:10} } },
        y1:{ beginAtZero:true, position:'right', title:{ display:true, text:'Reservas' }, ticks:{ precision:0, font:{size:10} }, grid:{ drawOnChartArea:false } }
      }
    }
  });
}
function renderCotizCharts(tabId, proyecto){
  const st = COTIZ_STATE[tabId] || (COTIZ_STATE[tabId] = { periodo:'meses', ventana:'historica', canalVista:'3' });
  const rowsAll = ALL_COTIZ.filter(d => d.proyecto === proyecto && d.fecha_cotizacion);
  let resAll = (ALL_DATA_MOV || []).filter(d => d.proyecto === proyecto && d.fecha_reserva && !/LOCAL|PLACA/i.test(d.subagrupacion || ''));

  let rows = rowsAll, res = resAll;
  if (st.ventana !== 'historica') {
    const nMeses = st.ventana === '24m' ? 24 : 12;
    const hoy = CORTE_DATE || new Date();
    const desde = new Date(hoy.getTime()); desde.setMonth(desde.getMonth() - nMeses);
    const desdeStr = desde.toISOString().substring(0,10);

// ─── MARKETING — costo por lead (cotización) por canal ───────────────────────
// ADVERTENCIA de alcance: el pedido original ("pestaña mktg de pptos y cruzado
// con pagos para ver las eficiencias reales por canal") pide cruzar presupuesto
// de marketing con pagos/ventas por canal, pero ese cruce no es posible hoy con
// los datos disponibles:
//   • No hay ninguna fuente de gasto/presupuesto de marketing conectada (ni
//     Supabase, ni una planilla, ni una API de Google/Meta Ads) — por eso el
//     presupuesto se ingresa AQUÍ manualmente, en el navegador, y NO se guarda
//     al recargar la página (no hay dónde persistirlo todavía).
//   • ventas_pok no registra canal de origen de la venta -> no se puede saber
//     qué reservas/promesas vinieron de qué canal, así que no hay forma de
//     calcular ROI real a venta ni "pagos cruzados por canal".
// Lo que SÍ es real y queda calculado con datos en vivo: volumen de
// cotizaciones (leads) por canal desde cotizaciones_pok, y con el presupuesto
// que el usuario ingrese, el Costo por Lead (CPL) — una métrica de eficiencia
// legítima aunque parcial. Si más adelante se conecta gasto real y/o se agrega
// atribución de canal a las ventas, esto se puede extender a CPA/ROI real.
const MKT_STATE  = {};   // tabId -> { ventana }
const MKT_BUDGET = {};   // tabId -> { PORTALES:n, DIGITAL:n, 'SALA DE VENTA':n }
const MKT_CANALES = ['PORTALES','DIGITAL','SALA DE VENTA'];
function mktSlug(s){ return String(s).toUpperCase().replace(/[^A-Z0-9]+/g,'-'); }
function mktRows(tabId, proyecto){
  const st = MKT_STATE[tabId] || (MKT_STATE[tabId] = { ventana:'historica' });
  let rows = ALL_COTIZ.filter(d => d.proyecto === proyecto && d.fecha_cotizacion);
  if (st.ventana !== 'historica') {
    const nMeses = st.ventana === '24m' ? 24 : 12;
    const hoy = CORTE_DATE || new Date();
    const desde = new Date(hoy.getTime()); desde.setMonth(desde.getMonth() - nMeses);
    const desdeStr = desde.toISOString().substring(0,10);
    rows = rows.filter(d => d.fecha_cotizacion >= desdeStr);
  }
  return rows;
}
function fmtCLP(n){ return '$' + Math.round(n||0).toLocaleString('es-CL'); }
function mktRecalc(tabId, proyecto){
  const rows = mktRows(tabId, proyecto);
  const bud = MKT_BUDGET[tabId] || (MKT_BUDGET[tabId] = {});
  const leadsBy = {}; MKT_CANALES.forEach(c => leadsBy[c] = 0);
  for (const d of rows) leadsBy[cotizCanal3(d.medio_llegada)]++;
  let totLeads = 0, totBud = 0;
  MKT_CANALES.forEach(c => {
    const leads = leadsBy[c] || 0;
    const presup = bud[c] || 0;
    totLeads += leads; totBud += presup;
    const cpl = leads > 0 ? presup / leads : null;
    const elLeads = document.getElementById('mkt-leads-'+tabId+'-'+mktSlug(c));
    const elCpl   = document.getElementById('mkt-cpl-'+tabId+'-'+mktSlug(c));
    if (elLeads) elLeads.textContent = leads.toLocaleString('es-CL');
    if (elCpl)   elCpl.textContent   = cpl!=null ? fmtCLP(cpl) : '—';
  });
  const elTotLeads = document.getElementById('mkt-leads-'+tabId+'-TOTAL');
  const elTotBud   = document.getElementById('mkt-bud-'+tabId+'-TOTAL');
  const elTotCpl   = document.getElementById('mkt-cpl-'+tabId+'-TOTAL');
  if (elTotLeads) elTotLeads.textContent = totLeads.toLocaleString('es-CL');
  if (elTotBud)   elTotBud.textContent   = fmtCLP(totBud);
  if (elTotCpl)   elTotCpl.textContent   = totLeads>0 ? fmtCLP(totBud/totLeads) : '—';
}
function setMktBudget(tabId, proyecto, canal, valor){
  const bud = MKT_BUDGET[tabId] || (MKT_BUDGET[tabId] = {});

// ─── PRICING — SIMULADOR DE PRECIOS SOBRE EL STOCK DISPONIBLE ────────────────
const PRICING_DATA = {};  // gid -> { mods, meta, pisos, lk, perModBase:[{m,n,lista,final,dscto}] }
let   PR_GIDX = 0;
function pricingDeltaColor(pct){
  if (pct > 0.05) return { bg:'#e6f2eb', fg:'#1b5e34', border:'#8cc4a0' };   // sube
  if (pct < -0.05) return { bg:'#fdeaea', fg:'#c00030', border:'#e3a9a9' }; // baja
  return { bg:'#ffffff', fg:'#9a9a9a', border:'#e6e6e6' };                  // sin cambio / disponible sin simular
}
// ── UF/m2 en la matriz simulada ───────────────────────────────────────────────
// Superficie efectiva = util + 1/2 terraza (regla oficial Trei), la misma convencion que usa el Scanner de
// Precios (m2 + m2_terraza/2, con respaldo en TERRAZA_BY_ID). Asi el UF/m2 de las dos
// vistas es el mismo numero y se pueden comparar.
function pricingM2Ef(u){
  var t = parseFloat(u.m2_terraza);
  if (!(t > 0) && typeof TERRAZA_BY_ID !== "undefined") t = TERRAZA_BY_ID[String(u.id_producto)];
  return (parseFloat(u.m2) || 0) + (parseFloat(t) || 0) / 2;
}
// Una decimal a proposito: el Scanner redondea a entero, pero aca se simulan cambios
// de pocos puntos porcentuales y con entero no se notarian. Si falta superficie o el
// precio es 0, devuelve vacio y la celda queda como estaba.
function pricingUFm2(u, precio){
  var m2 = pricingM2Ef(u);
  if (!(m2 > 0) || !(precio > 0)) return "";
  var v = (precio / m2).toLocaleString("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return '<span class="um2" style="font-size:9.5px;opacity:.8">' + v + ' UF/m\u00b2</span>';
}
function pricingRenderProyecto(proyecto, tabId){
  const pd = ALL_DATA.filter(d => d.proyecto === proyecto);
  if (!pd.length) return '<p style="color:#999;padding:20px;font-size:13px">Sin datos para simular precios en este proyecto.</p>';
  // Estos dos no entran por la matriz piso x modelo: ver pricingBuildRaices /
  // pricingBuildMirador, que reusan la disposicion que cada uno tiene en el Scanner.
  if (proyecto === 'RAICES DE PEÑABLANCA')   return pricingBuildRaices(pd);
  if (proyecto === 'MIRADOR SANTA TERESITA') return pricingBuildMirador(pd);
  const subs = [...new Set(pd.map(d => d.subagrupacion))].filter(Boolean)
    .filter(s => SC_SCANNER.has(proyecto + '|' + s)).sort();
  if (!subs.length) return '<p style="color:#999;padding:20px;font-size:13px">El simulador de Pricing no aplica a este proyecto (sin departamentos/oficinas en altura).</p>';
  return subs.map(s => pricingBuildGroup(s, pd.filter(d => d.subagrupacion === s))).join('');
}
function pricingBuildGroup(titulo, subData){
  const gid = 'prg' + (++PR_GIDX);
  const mods = scSortMods([...new Set(subData.map(d => d.modelo).filter(Boolean))]);
  const pisos = [...new Set(subData.map(d => d.piso).filter(p => p != null))].sort((a,b) => b - a);
  if (!mods.length || !pisos.length)
    return `<div class="sc-sec">${titulo}</div><p style="color:#999;padding:10px 0;font-size:12px">Sin datos de piso/modelo para este grupo.</p>`;
  const meta = {}; for (const d of subData) { if (d.modelo && !meta[d.modelo]) meta[d.modelo] = { p:d.programa, m:d.m2 }; }
  const lk = {}; for (const d of subData) { const k = d.piso+'_'+d.modelo; if (!lk[k]) lk[k] = d; }
  // El descuento se aplica sobre el precio de LISTA (el publicado), no sobre el
  // precio base: el base ya viene 8-16% mas abajo, asi que descontar desde ahi
  // significaba que un "0%" en pantalla ya era un 15% real.
  const lista = u => parseFloat(u.precio_lista_uf) || parseFloat(u.precio_total_operacion_uf) || 0;
  const final = u => parseFloat(u.precio_total_operacion_uf) || 0;
  // Precio efectivamente pagado por el departamento. En una unidad vendida la
  // operacion incluye bodega y estacionamiento; el precio de lista es solo del
  // depto, asi que se descuentan para que la comparacion sea entre iguales.
  const real = u => u.estado_corte === 'DISPONIBLE' ? final(u)
    : (parseFloat(u.precio_total_operacion_uf) || 0)
      - (parseFloat(u.precio_bodega_uf) || 0)
      - (parseFloat(u.precio_estacionamiento_uf) || 0);
  const perModBase = mods.map(m => {
    const us = subData.filter(d => d.modelo === m && d.estado_corte === 'DISPONIBLE');
    const sL = us.reduce((a,u) => a + lista(u), 0), sF = us.reduce((a,u) => a + final(u), 0);
    const dscto = sL > 0 ? Math.round((1 - sF/sL) * 1000) / 10 : 0;
    return { m, n:us.length, lista:sL, final:sF, dscto };
  });
  PRICING_DATA[gid] = { mods, meta, pisos, lk, perModBase, lista, final, real };

  const rowsHTML = perModBase.map((x,i) => `<tr>
    <td>${x.m}</td><td class="left" style="font-weight:400;color:#666">${(meta[x.m]||{}).p||''}</td>
    <td>${x.n}</td>
    <td><input type="number" step="0.1" id="pr-desc-${gid}-${i}" value="${x.dscto}" oninput="pricingRedraw('${gid}')" style="width:56px;border:1.5px solid #d0d0d8;border-radius:4px;padding:3px 5px;font-size:11px;text-align:right"></td>
    <td><input type="number" step="0.1" id="pr-alza-${gid}-${i}" value="0" oninput="pricingRedraw('${gid}')" style="width:56px;border:1.5px solid #d0d0d8;border-radius:4px;padding:3px 5px;font-size:11px;text-align:right"></td>
  </tr>`).join('');

  let h = `<div class="sc-sec sc-toggle" onclick="scToggle('${gid}')"><span class="sc-arrow" id="arr-${gid}">▼</span>${titulo}</div>
  <div class="sc-group" id="${gid}">
  <div class="sc-sec" style="border:none;margin:0 0 8px;padding:0;color:#111111;font-size:11px;letter-spacing:0">
    Precio lista → descto → Precio final (vendedor) → alza → Precio simulado
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">
    <span style="display:flex;flex-direction:column;gap:3px">
      <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.6px">Descuento general</span>
      <span style="display:flex;gap:4px;align-items:center">
        <input type="number" step="0.1" id="pr-descgen-${gid}" value="0" style="width:64px;border:1.5px solid #d0d0d8;border-radius:4px;padding:4px 6px;font-size:12px;text-align:right">
        <span style="font-size:12px;color:#888">%</span>
        <button class="chart-filter-btn" onclick="pricingApplyGeneral('${gid}','desc')">Aplicar a todos</button>
      </span>
    </span>
    <span style="display:flex;flex-direction:column;gap:3px">
      <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.6px">Alza general</span>
      <span style="display:flex;gap:4px;align-items:center">
        <input type="number" step="0.1" id="pr-alzagen-${gid}" value="0" style="width:64px;border:1.5px solid #d0d0d8;border-radius:4px;padding:4px 6px;font-size:12px;text-align:right">
        <span style="font-size:12px;color:#888">%</span>
        <button class="chart-filter-btn" onclick="pricingApplyGeneral('${gid}','alza')">Aplicar a todos</button>
        <button class="chart-filter-btn" onclick="pricingResetAlza('${gid}')">Reset</button>
      </span>
    </span>
  </div>
  <table style="box-shadow:none;max-width:520px">
    <thead><tr><th class="left">Modelo</th><th class="left">Tipología</th><th>Disp.</th><th>Descuento %</th><th>Alza %</th></tr></thead>
    <tbody>${rowsHTML}</tbody>
  </table>
  <p class="sc-nota" style="margin-top:8px">Descuento % parte precargado con el descuento promedio ya vigente en la data (precio lista vs. precio final actual). Alza % es la simulación adicional sobre el precio final. El descuento y el alza se aplican por modelo a todas sus unidades disponibles.</p>
  <div id="pr-result-${gid}" style="margin-top:16px"></div>
  <div id="pr-matrix-${gid}" style="margin-top:20px"></div>
  </div>`;
  PRICING_INIT.push(gid);
  return h;
}
const PRICING_INIT = [];  // gids pendientes de primer pintado (se resuelve tras insertar el HTML en el DOM)
function pricingReadInputs(gid){
  const pd = PRICING_DATA[gid];
  return pd.perModBase.map((x,i) => ({
    m: x.m,
    descto: parseFloat((document.getElementById(`pr-desc-${gid}-${i}`)||{}).value) || 0,
    alza: parseFloat((document.getElementById(`pr-alza-${gid}-${i}`)||{}).value) || 0
  }));
}
function pricingApplyGeneral(gid, campo){
  const pd = PRICING_DATA[gid];
  const val = parseFloat((document.getElementById(`pr-${campo==='desc'?'descgen':'alzagen'}-${gid}`)||{}).value) || 0;
  pd.perModBase.forEach((x,i) => {
    const el = document.getElementById(`pr-${campo==='desc'?'desc':'alza'}-${gid}-${i}`);
    if (el) el.value = val;
  });
  pricingRedraw(gid);
}
function pricingResetAlza(gid){
  const pd = PRICING_DATA[gid];
  pd.perModBase.forEach((x,i) => { const el = document.getElementById(`pr-alza-${gid}-${i}`); if (el) el.value = 0; });
  const gen = document.getElementById(`pr-alzagen-${gid}`); if (gen) gen.value = 0;
  pricingRedraw(gid);
}
function pricingRedraw(gid){
  const pd = PRICING_DATA[gid];
  if (!pd) return;
  const inputs = pricingReadInputs(gid);          // [{m, descto, alza}]
  const byModel = {}; inputs.forEach(x => byModel[x.m] = x);

  // ── Resultado por modelo (stock disponible) ─────────────────────────────
  let TL=0, TF=0, TS=0, TN=0;
  const resRows = pd.perModBase.map(x => {
    const p = byModel[x.m] || { descto:0, alza:0 };
    // Mismo calculo que la matriz: lista → descuento → alza. Antes partia de x.final
    // e ignoraba el descuento, asi que los KPI no se movian al cambiarlo.
    const simulado = x.lista * (1 - p.descto/100) * (1 + p.alza/100);
    TL += x.lista; TF += x.final; TS += simulado; TN += x.n;
    return { ...x, alza:p.alza, descto:p.descto, simulado };
  });
  const ganancia = TS - TF, gananciaPct = TF > 0 ? (ganancia/TF*100) : 0;
  const fUF = n => n ? fmtUF(Math.round(n)) : '—';
  // Formatea un % con signo correcto (evita el "-0.0%" cuando el valor es 0)
  const pctSigned = (n, posColor, negColor, zeroColor) => {
    const v = Math.round(n*10)/10;
    if (v === 0) return `<span style="color:${zeroColor||'#888'}">0.0%</span>`;
    const sign = v > 0 ? '+' : '';
    return `<span style="color:${v>0?(posColor||'#1b5e34'):(negColor||'#c00030')}">${sign}${v.toFixed(1)}%</span>`;
  };
  const gananciaTxt = ganancia === 0 ? '—' : `${ganancia>0?'+':''}${fUF(ganancia)}`;
  const kpiHTML = `<div class="kpi-row kpi-row-4">
    <div class="kpi kpi-sm c-navy"><div class="kpi-label">UF a precio lista</div><div class="kpi-value">${fUF(TL)}</div><div class="kpi-sub">${TN} unidades</div></div>
    <div class="kpi kpi-sm c-red"><div class="kpi-label">UF a precio final</div><div class="kpi-value">${fUF(TF)}</div><div class="kpi-sub">hoy, con descuento</div></div>
    <div class="kpi kpi-sm c-navy"><div class="kpi-label">UF simulado</div><div class="kpi-value">${fUF(TS)}</div><div class="kpi-sub">con las alzas</div></div>
    <div class="kpi kpi-sm ${ganancia>=0?'c-green':'c-red'}"><div class="kpi-label">Ganancia vs. precio final</div><div class="kpi-value">${gananciaTxt}</div><div class="kpi-sub">${ganancia===0?'0.0':(gananciaPct>0?'+':'')+gananciaPct.toFixed(1)}%</div></div>
  </div>`;
  let tbl = `<table style="box-shadow:none"><thead><tr>
    <th class="left">Modelo</th><th>Disp.</th><th>UF lista</th><th>Dscto</th><th>UF final (hoy)</th><th>Alza</th><th>UF simulado</th></tr></thead><tbody>`;
  for (const r of resRows) {
    tbl += `<tr><td>${r.m}</td><td>${r.n||'—'}</td><td>${fUF(r.lista)}</td>` +
      `<td>${r.n?pctSigned(-r.descto,'#1b5e34','#c00030'):'—'}</td><td>${fUF(r.final)}</td>` +
      `<td>${r.n?pctSigned(r.alza,'#1b5e34','#c00030'):'—'}</td><td>${fUF(r.simulado)}</td></tr>`;
  }
  const dsctoTotPct = TL ? (1-TF/TL)*100 : 0;
  tbl += `<tr class="total-row"><td>TOTAL STOCK DISPONIBLE</td><td>${TN}</td><td>${fUF(TL)}</td>` +
    `<td>${TL?pctSigned(-dsctoTotPct,'#1b5e34','#c00030'):'—'}</td><td>${fUF(TF)}</td>` +
    `<td>${TF?pctSigned(ganancia/TF*100,'#1b5e34','#c00030'):'—'}</td><td>${fUF(TS)}</td></tr>`;
  tbl += '</tbody></table>';
  const resBox = document.getElementById('pr-result-' + gid);
  if (resBox) resBox.innerHTML = `<div class="sc-sec" style="margin-top:0">Resultado — Valor del Stock Disponible</div>${kpiHTML}<div style="margin-top:10px">${tbl}</div>`;

  // Raices y Mirador traen su propia grilla (pd.grid): la matriz piso x modelo no
  // representa su inventario. El resumen y los KPI de arriba son los mismos.
  if (pd.grid) {
    const gridBox = document.getElementById('pr-matrix-' + gid);
    if (gridBox) gridBox.innerHTML = pd.grid(byModel);
    return;
  }

  // ── Matriz simulada — precio final por unidad (piso x modelo) ───────────
  let mx = `<div class="sc-sec">Matriz Simulada — Precio Final por Unidad</div>
  <div class="sc-leyenda">
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#e6f2eb;border:1px solid #8cc4a0"></div>Sube el precio final</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#fdeaea;border:1px solid #e3a9a9"></div>Baja el precio final</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#f4f4f6;border:1px solid #ddd"></div>Sin cambio</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#e0e0e0;border:1px solid #ccc"></div>Vendida — arriba lista, abajo precio final</div>
  </div>
  <div class="mx-wrap"><table class="mx-table"><thead><tr><td class="mx-corner"></td>`;
  for (const m of pd.mods) {
    const mt = pd.meta[m] || {};
    mx += `<th class="th-mod"><span class="mc">${m}</span><span class="mp">${mt.p||''}</span></th>`;
  }
  mx += '</tr></thead><tbody>';
  for (const p of pd.pisos) {
    mx += `<tr><td class="th-fl">Piso ${parseInt(p,10)}</td>`;
    for (const m of pd.mods) {
      const u = pd.lk[p+'_'+m];
      if (!u) { mx += '<td class="uc emp"></td>'; continue; }
      const isDisp = u.estado_corte === 'DISPONIBLE';
      const listaU = pd.lista(u);
      if (!isDisp) {
        mx += `<td class="uc" style="background:#e0e0e0;color:#888">
          <span class="up" style="text-decoration:line-through;font-size:10px">UF ${fmtUF(listaU)}</span>
          <span class="um2">UF ${fmtUF(pd.real(u))}</span>
          ${pricingUFm2(u, pd.real(u))}
          <span class="uid">Vendida</span></td>`;
        continue;
      }
      const cfg = byModel[m] || { descto:0, alza:0 };
      const finalU = listaU * (1 - cfg.descto/100);
      const simU = finalU * (1 + cfg.alza/100);
      const pct = listaU > 0 ? (simU - listaU) / listaU : 0;
      const col = pricingDeltaColor(pct);
      mx += `<td class="uc" style="background:${col.bg};color:${col.fg};box-shadow:inset 0 0 0 1px ${col.border}">
        <span class="up" style="text-decoration:line-through;font-size:10px;opacity:.7">UF ${fmtUF(listaU)}</span>
        <span class="up">UF ${fmtUF(simU)}</span>
        ${pricingUFm2(u, simU)}
        <span class="uid">${pct!==0?((pct>0?'+':'')+(pct*100).toFixed(1)+'%'):'Disponible'}</span></td>`;
    }
    mx += '</tr>';
  }
  mx += '</tbody></table></div>';
  mx += `<p class="sc-nota">Simulación local — no modifica precios reales en Planok. Precio simulado = precio lista × (1 − descuento%) × (1 + alza%). Vendidas se muestran de referencia (lista tachada arriba / precio final real abajo) y no se simulan.</p>`;
  const mxBox = document.getElementById('pr-matrix-' + gid);
  if (mxBox) mxBox.innerHTML = mx;
}
// ─── PRICING con disposicion propia (Raices por corrida, Mirador por edificio) ──
// La matriz piso x modelo no sirve en estos dos: en Raices las casas no tienen piso
// (las 121 caian en una sola celda) y en Mirador los 15 edificios comparten pisos y
// tipologias (se perdian 85 de 120 unidades). Cada uno reusa la disposicion que ya
// tiene en el Scanner. El resumen y los KPI son los mismos: solo cambia la grilla.

// Precios: mismo criterio que pricingBuildGroup. El descuento va sobre el precio de
// LISTA, y en una unidad vendida se descuentan bodega y estacionamiento para que el
// precio pagado sea comparable con el de lista, que es solo de la unidad principal.
function pricingLista(u){ return parseFloat(u.precio_lista_uf) || parseFloat(u.precio_total_operacion_uf) || 0; }
function pricingFinal(u){ return parseFloat(u.precio_total_operacion_uf) || 0; }
function pricingReal(u){
  if (u.estado_corte === 'DISPONIBLE') return pricingFinal(u);
  return (parseFloat(u.precio_total_operacion_uf) || 0)
       - (parseFloat(u.precio_bodega_uf) || 0)
       - (parseFloat(u.precio_estacionamiento_uf) || 0);
}

// Celda simulada. tag/cls permiten usarla como <td class="uc"> en una tabla (Raices)
// o como <div class="ms-c"> dentro de la elevacion (Mirador).
function pricingCelda(u, suid, cfg, etiqueta, tag, cls){
  var abre = '<' + tag + ' class="' + cls;
  var cierra = '</' + tag + '>';
  var L0 = pricingLista(u);
  if (u.estado_corte !== 'DISPONIBLE'){
    return abre + '" style="background:#e0e0e0;color:#888">'
      + '<span class="up" style="text-decoration:line-through;font-size:10px">UF ' + fmtUF(L0) + '</span>'
      + '<span class="um2">UF ' + fmtUF(pricingReal(u)) + '</span>'
      + pricingUFm2(u, pricingReal(u))
      + '<span class="uid">' + etiqueta + '</span>' + cierra;
  }
  var fin = L0 * (1 - (cfg.descto || 0) / 100);
  var sim = fin * (1 + (cfg.alza || 0) / 100);
  var pct = L0 > 0 ? (sim - L0) / L0 : 0;
  var col = pricingDeltaColor(pct);
  var delta = Math.abs(pct) < 0.0005 ? '—' : ((pct > 0 ? '+' : '') + (pct * 100).toFixed(1) + '%');
  return abre + '" style="background:' + col.bg + ';color:' + col.fg
    + ';box-shadow:inset 0 0 0 1px ' + col.border + '" data-suid="' + suid + '"'
    + ' onmouseenter="scShowTip(this,event)" onmouseleave="scHideTip()">'
    + '<span class="up">UF ' + fmtUF(sim) + '</span>'
    + pricingUFm2(u, sim)
    + '<span class="um2">' + delta + '</span>'
    + '<span class="uid">' + etiqueta + '</span>' + cierra;
}

    + '<span style="display:flex;flex-direction:column;gap:4px"><span class="filter-label">Alza general %</span>'
    + '<span><input type="number" step="0.1" id="pr-alzagen-' + gid + '" value="0" style="width:70px"> '

    + '<div id="pr-result-' + gid + '" style="margin-top:16px"></div>'
