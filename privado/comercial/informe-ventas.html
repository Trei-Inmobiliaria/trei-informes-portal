// Totales por grupo sobre el stock disponible. Formato identico al de la matriz
// generica, asi la tabla de resumen y los KPI de pricingRedraw no distinguen si el
// grupo es un modelo, una corrida o una tipologia.
function pricingPorGrupo(nombres, unidades, grupoDe){
  return nombres.map(function(g){
    var us = unidades.filter(function(o){
      return grupoDe(o.raw) === g && o.raw.estado_corte === 'DISPONIBLE';
    });
    var sL = us.reduce(function(a, o){ return a + pricingLista(o.raw); }, 0);
    var sF = us.reduce(function(a, o){ return a + pricingFinal(o.raw); }, 0);
    return { m: g, n: us.length, lista: sL, final: sF,
             dscto: sL > 0 ? Math.round((1 - sF / sL) * 1000) / 10 : 0 };
  });
}

// Indexa las unidades del proyecto y las registra para el tooltip compartido.
function pricingUnidades(subData){
  return subData.map(function(d){
    var suid = 'su' + (++SC_UIDX);
    SC_UNITS[suid] = d;
    return { raw: d, suid: suid };
  });
}

// ── Raices de Penablanca: una fila por corrida, una celda por casa ──────────────
function pricingBuildRaices(subData){
  var gid = 'prg' + (++PR_GIDX);
  var unidades = pricingUnidades(subData).map(function(o){
    o.casa = raNum(o.raw);
    return o;
  }).filter(function(o){ return o.casa; });
  if (!unidades.length)
    return '<div class="sc-sec">Casas</div><p style="color:#999;padding:10px 0;font-size:12px">Sin casas para simular.</p>';

  // La corrida hace de "grupo": es la unica agrupacion util, porque las 121 casas
  // comparten un solo modelo.
  var corridaDe = function(u){
    var n = raNum(u);
    var s = RA_SECTORES.filter(function(x){ return n >= x.de && n <= x.a; })[0];
    return s ? s.nom : 'Otras';
  };
  var nombres = RA_SECTORES.map(function(s){ return s.nom; }).filter(function(nom){
    return unidades.some(function(o){ return corridaDe(o.raw) === nom; });
  });
  var perModBase = pricingPorGrupo(nombres, unidades, corridaDe);

  var grid = function(byGrupo){
    var h = '<div class="sc-sec">Simulación por corrida</div>'
          + '<div class="mx-wrap"><table class="mx-table"><tbody>';
    RA_SECTORES.forEach(function(s){
      var cs = unidades.filter(function(o){ return o.casa >= s.de && o.casa <= s.a; })
                       .sort(function(a, b){ return a.casa - b.casa; });
      if (!cs.length) return;
      var cfg = byGrupo[s.nom] || { descto: 0, alza: 0 };
      h += '<tr><td class="sc-sl">' + s.nom
         + '<br><span style="font-weight:400;color:#777">Casas ' + s.de + '–' + s.a + '</span></td>';
      cs.forEach(function(o){
        h += pricingCelda(o.raw, o.suid, cfg, 'Casa ' + o.casa, 'td', 'uc');
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>'
       + '<p class="sc-nota">Simulación local — no modifica precios reales en PlanOk.</p>';
    return h;
  };

  PRICING_DATA[gid] = { perModBase: perModBase, grid: grid };
  PRICING_INIT.push(gid);
  return pricingShell(gid, 'CASAS', 'Corrida', perModBase);
}

// ── Mirador Santa Teresita: elevacion por edificio, los 15 ─────────────────────
function pricingBuildMirador(subData){
  var gid = 'prg' + (++PR_GIDX);
  var unidades = pricingUnidades(subData);

  // U[edificio][piso][unidad] -> misma indexacion que la elevacion del Scanner.
  var U = {};
  unidades.forEach(function(o){
    var e = mstEd(o.raw), p = mstPi(o.raw), un = mstUn(o.raw);
    if (!e || !p || !un) return;
    o.ed = e; o.piso = p; o.un = un;
    if (!U[e]) U[e] = {};
    if (!U[e][p]) U[e][p] = {};
    U[e][p][un] = o;
  });

  var modeloDe = function(u){ return u.modelo || '—'; };
  var nombres = scSortMods([...new Set(subData.map(function(d){ return d.modelo; }).filter(Boolean))]);
  var perModBase = pricingPorGrupo(nombres, unidades, modeloDe);

  var celda = function(o, byGrupo){
    if (!o) return '<div class="ms-c emp"></div>';
    var cfg = byGrupo[modeloDe(o.raw)] || { descto: 0, alza: 0 };
    return pricingCelda(o.raw, o.suid, cfg, 'Depto ' + o.ed + '' + o.piso + '' + o.un, 'div', 'ms-c');
  };

  var grid = function(byGrupo){
    var h = '<div class="sc-sec">Simulación por edificio</div>';
    MST_BANDAS.forEach(function(b){
      var cols = b.eds.filter(function(x){ return U[x[0]]; }).map(function(x){
        var e = x[0], off = x[1];
        var pisos = Object.keys(U[e]).map(Number);
        var maxp = Math.max.apply(null, pisos);
        var st = '';
        for (var p = 1; p <= maxp; p++){
          var f = U[e][p] || {};
          st += '<div class="ms-piso">' + celda(f[2], byGrupo) + celda(f[1], byGrupo) + '</div>';
        }
        return '<div style="margin-bottom:' + off + 'px">'
             + '<div class="ms-ed-h"><b>EDIFICIO ' + e + '</b><span>' + (MST_TIPO[e] || '') + '</span></div>'
             + '<div class="ms-stack">' + st + '</div></div>';
      }).join('');
      if (!cols) return;
      h += '<div class="ms-banda"><div class="ms-band-h">' + b.nom + '<span>' + b.sub + '</span></div>'
         + '<div class="ms-scroll"><div class="ms-row">' + cols + '</div></div></div>';
    });
    h += '<p class="sc-nota">Simulación local — no modifica precios reales en PlanOk. '
       + 'El descuento de cada tipología se aplica en los 15 edificios.</p>';
    return h;
  };

  PRICING_DATA[gid] = { perModBase: perModBase, grid: grid };
  PRICING_INIT.push(gid);
  return pricingShell(gid, 'DEPARTAMENTOS', 'Tipología', perModBase);
}

function pricingInitAll(){
  PRICING_INIT.forEach(gid => pricingRedraw(gid));
  PRICING_INIT.length = 0;
}

function scRenderProyecto(proyecto, tabId){
  if (tabId) SC_UFM2_SPECS[tabId] = [];
  const pd=ALL_DATA.filter(d=>d.proyecto===proyecto);
  if(!pd.length) return '<p style="color:#999;padding:20px;font-size:13px">Sin datos de matriz para este proyecto.</p>';
  // Solo subagrupaciones marcadas con scanner en subagrupaciones_config (Supabase)
  const subs=[...new Set(pd.map(d=>d.subagrupacion))].filter(Boolean)
    .filter(s=>SC_SCANNER.has(proyecto+'|'+s)).sort();
  if(!subs.length) return '<p style="color:#999;padding:20px;font-size:13px">El Scanner de Precios no aplica a este proyecto (sin departamentos/oficinas en altura).</p>';
  const leyenda=`<div class="sc-leyenda">
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#bfe0c8;border:1px solid #8cc4a0"></div>Escriturada</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#d4e3f5;border:1px solid #a9c6e8"></div>Promesa</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#f7d4d4;border:1px solid #e3a9a9"></div>Reserva</div>
    <div class="sc-leg"><div class="sc-leg-dot" style="background:#ffffff;border:1px solid #ccc"></div>Disponible</div>
  </div>`;
    if (proyecto === 'MIRADOR SANTA TERESITA')
      return leyenda + scBuildElevacion('DEPARTAMENTOS', pd.filter(d=>subs.indexOf(d.subagrupacion)>=0), tabId);
    if (proyecto === 'RAICES DE PEÑABLANCA')
      return leyenda + subs.map(s=>scBuildMasterplan(s, pd.filter(d=>d.subagrupacion===s), tabId)).join('');
    return leyenda + subs.map(s=>scBuildMatrix(s, pd.filter(d=>d.subagrupacion===s), tabId)).join('');
}

// ─── MAIN ────────────────────────────────────────────────────────────────────


function renderDetalleOps(fecha_corte, data) {
  const mes = fecha_corte.substring(0,7);
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const d = new Date(fecha_corte + 'T12:00:00');
  const mesNombre = meses[d.getMonth()] + ' ' + d.getFullYear();

  function inMes(dateStr) {
    if(!dateStr) return false;
    return dateStr.substring(0,7) === mes && dateStr.substring(0,10) <= fecha_corte;
  }
  function fmtFecha(dateStr) {
    if(!dateStr) return '<span class="fecha-null">—</span>';
    const dd = dateStr.substring(0,10);
    const esMes = dd.substring(0,7) === mes;
    return '<span class="' + (esMes?'fecha-mes':'fecha-otro') + '">' + dd.split('-').reverse().join('/') + '</span>';
  }
  function ufVal(n) {
    if(!n||n===0) return '—';
    return Math.round(n).toLocaleString('es-CL');
  }
  function ufDec(n) {
    if(!n||n===0) return '—';
    return n.toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function proy(p) {
    return p.replace('TERRAZAS DE SANTA MARIA','TSM')
            .replace('PLAZA LOS PINOS','PLP')
            .replace('RAICES DE PEÑABLANCA','RAÍCES')
            .replace('CROMATICO','CROMÁTICO');
  }
  function nombreCliente(row) {
    const n = (row.nombre||'').trim(), a = (row.apellidos||'').trim();
    if(!n&&!a) return '<span style="color:#ccc">—</span>';
    return (n+' '+a).trim();
  }

  // Promesas emitidas cuya firma del comprador todavia no se carga en PlanOk:
  // en ventas_pok siguen RESERVADO y sin fecha_promesa, pero la promesa ya existe.
  // Se les pone su fecha de emision para que aparezcan en la pestaña Promesas, con
  // la marca 'por firmar'. Se trabaja sobre COPIAS de las filas: compute() ya las
  // suma desde v_promesas_sin_firma y mutar el original las contaria dos veces.
  const _emitidasSinFirma = {};
  for (const e of (ALL_PROM_SIN_FIRMA || [])) _emitidasSinFirma[String(e.id_producto)] = e;
  data = (data || []).map(r => {
    const e = _emitidasSinFirma[String(r.id_producto)];
    return (e && !r.fecha_promesa) ? { ...r, fecha_promesa: e.fecha_evento, _promesaSinFirma: true } : r;
  });

  const reservas   = data.filter(r => inMes(r.fecha_reserva));
  const promesas   = data.filter(r => inMes(r.fecha_promesa));
  const escrituras = data.filter(r => inMes(r.fecha_escritura) && r.estado_corte==='ESCRITURADO');

  const HOY = new Date();
  function diasDesde(fr){
    if(!fr) return null;
    return Math.floor((HOY - new Date(fr.substring(0,10) + 'T12:00:00')) / 86400000);
  }
  function diasCell(fr){
    const dd = diasDesde(fr);
    if(dd==null) return '<span class="fecha-null">—</span>';
    return `<strong>${dd}</strong> d`;
  }
  function tblRows(rows) {
    if(!rows.length) return '<tr><td colspan="14" style="text-align:center;padding:24px;color:#aaa">Sin operaciones en el período</td></tr>';
    let html = '';
    let sD=0,sB=0,sE=0,sT=0,sDias=0,nDias=0;
    for(const r of rows){
      const b=r.precio_bodega_uf||0;
      const e=r.precio_estacionamiento_uf||0, t=r.precio_total_operacion_uf||0;
      const d=Math.max(0, t-e-b);   // depto = total − estac − bodega (precio_depto_uf no viene en la base)
      sD+=d;sB+=b;sE+=e;sT+=t;
      const dia = diasDesde(r.fecha_reserva); if(dia!=null){ sDias+=dia; nDias++; }
      html+=`<tr>
        <td><span style="background:#EEF2F7;color:#111111;border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700">${proy(r.proyecto)}</span></td>
        <td>${r.subagrupacion||'—'}</td>
        <td class="c" style="font-weight:700">${r.propiedad||'—'}</td>
        <td class="c">${r.modelo||'—'}</td>
        <td>${nombreCliente(r)}</td>
        <td class="mono">${r.rut_cliente||'—'}</td>
        <td class="c">${fmtFecha(r.fecha_reserva)}</td>
        <td class="c">${fmtFecha(r.fecha_promesa)}${r._promesaSinFirma?'<span title="Promesa emitida; falta cargar la firma del comprador en PlanOk" style="margin-left:5px;font-size:9px;background:#FDECEF;color:#E1093F;border-radius:3px;padding:1px 5px;font-weight:700;letter-spacing:.02em">por firmar</span>':''}</td>
        <td class="c">${fmtFecha(r.fecha_escritura)}</td>
        <td class="r">${ufDec(d)}</td>
        <td class="r" style="color:#999;font-size:11px">${ufDec(b)}</td>
        <td class="r" style="color:#999;font-size:11px">${ufDec(e)}</td>
        <td class="r" style="font-weight:700">${ufDec(t)}</td>
        <td class="c">${diasCell(r.fecha_reserva)}</td>
      </tr>`;
    }
    const promDias = nDias ? Math.round(sDias/nDias) : null;
    html+=`<tr class="tot-row">
      <td colspan="9">TOTAL ${rows.length} operaciones</td>
      <td class="r">${ufVal(sD)}</td><td class="r">${ufVal(sB)}</td>
      <td class="r">${ufVal(sE)}</td><td class="r" style="font-weight:700">${ufVal(sT)}</td>
      <td class="c">${promDias!=null?'prom. '+promDias+' d':'—'}</td>
    </tr>`;
    return html;
  }

  function kpis(rows, tipo, cls, diaField, diaLabel) {
    const total = rows.reduce((s,r)=>s+(r.precio_total_operacion_uf||0),0);
    const tEst  = rows.reduce((s,r)=>s+(r.precio_estacionamiento_uf||0),0);
    const tBod  = rows.reduce((s,r)=>s+(r.precio_bodega_uf||0),0);
    const tDep  = Math.max(0, total - tEst - tBod);
    let diaCard = '';
    if (diaField) {
      let sum=0, n=0;
      for (const r of rows){ const d=diasDesde(r[diaField]); if(d!=null && d>=0){ sum+=d; n++; } }
      const prom = n ? Math.round(sum/n) : null;
      diaCard = `<div class="ops-kpi k-tot">
        <div class="kl">${diaLabel}</div>
        <div class="kv">${prom!=null?prom:'—'}</div>
        <div class="ks">días promedio · ${n} ops</div>
      </div>`;
    }
    return `<div class="ops-kpi-row">
      <div class="ops-kpi ${cls}">
        <div class="kl">${tipo} del Mes</div>
        <div class="kv">${rows.length}</div>
        <div class="ks">operaciones</div>
      </div>
      <div class="ops-kpi k-tot">
        <div class="kl">UF Total Op.</div>
        <div class="kv" style="font-size:30px">${ufVal(total)}</div>
        <div class="ks">Depto ${ufVal(tDep)} · Estac ${ufVal(tEst)} · Bodega ${ufVal(tBod)}</div>
      </div>
      ${diaCard}
    </div>`;
  }

  const thead = `<thead><tr>
    <th>Proyecto</th><th>Subagrupación</th><th class="c">Unidad</th><th class="c">Modelo</th>
    <th>Cliente</th><th>RUT</th>
    <th class="c">F. Reserva</th><th class="c">F. Promesa</th><th class="c">F. Escritura</th>
    <th class="r">UF Depto</th><th class="r">UF Bodega</th><th class="r">UF Estac.</th><th class="r">UF Total Op.</th>
    <th class="c">Días desde Reserva</th>
  </tr></thead>`;

  return `
  <div style="margin-bottom:14px">
    <div class="section-title">Detalle Operaciones — ${mesNombre}</div>
  </div>
  <div class="ops-tabs">
    <button class="ops-tab active" onclick="showOpsTab('res',this)">🟡 Reservas <span style="background:#FFC000;color:#333;border-radius:9px;padding:1px 6px;font-size:10px;margin-left:3px">${reservas.length}</span></button>
    <button class="ops-tab" onclick="showOpsTab('prom',this)">🟢 Promesas <span style="background:#00B050;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;margin-left:3px">${promesas.length}</span></button>
    <button class="ops-tab" onclick="showOpsTab('escr',this)">✅ Escrituras <span style="background:#006400;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;margin-left:3px">${escrituras.length}</span></button>
  </div>
  <div id="ops-res" class="ops-panel active">
    ${kpis(reservas,'Reservas','k-res','fecha_reserva','Prom. días desde Reserva')}
    <div class="ops-tbl-wrap"><table class="ops-tbl">${thead}<tbody>${tblRows(reservas)}</tbody></table></div>
  </div>
  <div id="ops-prom" class="ops-panel">
    ${kpis(promesas,'Promesas','k-prom','fecha_promesa','Prom. días desde Promesa')}
    <div class="ops-tbl-wrap"><table class="ops-tbl">${thead}<tbody>${tblRows(promesas)}</tbody></table></div>
  </div>
  <div id="ops-escr" class="ops-panel">
    ${kpis(escrituras,'Escrituras','k-escr')}
    <div class="ops-tbl-wrap"><table class="ops-tbl">${thead}<tbody>${tblRows(escrituras)}</tbody></table></div>
  </div>`;
}



// Mapea el nombre de proyecto del presupuesto al proyecto canónico de ventas
function mapPptoProy(p) {
  p = (p || '').toString();
  if (/Plaza\s+los\s+Pinos/i.test(p)) return 'PLAZA LOS PINOS';
  if (/Terrazas/i.test(p))            return 'TERRAZAS DE SANTA MARIA';
  if (/Wind/i.test(p))                return 'WIND';
  if (/Condell/i.test(p))             return 'CONDELL';
  if (/Crom[aá]tico/i.test(p))        return 'CROMATICO';
  if (/Ra[ií]ces|Boldos/i.test(p))    return 'RAICES DE PEÑABLANCA';
  if (/Santa\s+Teresita/i.test(p))    return 'MIRADOR SANTA TERESITA';
  if (/Lilenes/i.test(p))             return 'LILENES';
  return p.toUpperCase();
}

async function fetchCierreMensual(yr) {
  // REAL oficial = cierres mensuales congelados (cierre_mensual), NO el snapshot vivo.
  const r = await fetch(
    `${SB_URL}/rest/v1/cierre_mensual?select=periodo,proyecto,subagrupacion,reservas_cant,reservas_uf,promesas_cant,promesas_uf,escrituras_cant,escrituras_uf,desistimientos_cant,desistimientos_uf&periodo=gte.${yr}-01-01&periodo=lte.${yr}-12-31`,
    { headers: { ...HEADERS, 'Range': '0-9999', 'Prefer': 'count=none' } }
  );
  if (!r.ok) return;
  const rows = await r.json();
  ACUM_CIERRE = {};
  ACUM_CIERRE_SUB = {};
  const mesesSet = new Set();
  const zero = () => ({ resUN:0, resUF:0, promUN:0, promUF:0, escrUN:0, escrUF:0, desUN:0, desUF:0 });
  const addTo = (obj, row) => {
    obj.resUN  += parseFloat(row.reservas_cant)       || 0;
    obj.resUF  += parseFloat(row.reservas_uf)         || 0;
    obj.promUN += parseFloat(row.promesas_cant)       || 0;
    obj.promUF += parseFloat(row.promesas_uf)         || 0;
    obj.escrUN += parseFloat(row.escrituras_cant)     || 0;
    obj.escrUF += parseFloat(row.escrituras_uf)       || 0;
    obj.desUN  += parseFloat(row.desistimientos_cant) || 0;
    obj.desUF  += parseFloat(row.desistimientos_uf)   || 0;
  };
  for (const row of rows) {
    const ym = String(row.periodo).substring(0, 7);
    mesesSet.add(ym);
    const p = row.proyecto;
    const s = (row.subagrupacion && String(row.subagrupacion).trim()) ? row.subagrupacion.trim() : '(Sin subagrupación)';
    if (!ACUM_CIERRE[p]) ACUM_CIERRE[p] = {};
    if (!ACUM_CIERRE[p][ym]) ACUM_CIERRE[p][ym] = zero();
    addTo(ACUM_CIERRE[p][ym], row);
    if (!ACUM_CIERRE_SUB[p]) ACUM_CIERRE_SUB[p] = {};
    if (!ACUM_CIERRE_SUB[p][s]) ACUM_CIERRE_SUB[p][s] = {};
    if (!ACUM_CIERRE_SUB[p][s][ym]) ACUM_CIERRE_SUB[p][s][ym] = zero();
    addTo(ACUM_CIERRE_SUB[p][s][ym], row);
  }
  ACUM_CIERRE_MESES = [...mesesSet].sort();
}

async function fetchPresupuestoAnual(yr) {
  // Descarga el presupuesto del año, indexado por mes (agregado) y por proyecto+mes
  const r = await fetch(
    `${SB_URL}/rest/v1/presupuesto_comercial?select=proyecto,subagrupacion,fecha,tipo,tipo2,venta_ppto&fecha=gte.${yr}-01-01&fecha=lte.${yr}-12-31`,
    { headers: { ...HEADERS, 'Range': '0-9999', 'Prefer': 'count=none' } }
  );
  if (!r.ok) return;
  const rows = await r.json();
  ACUM_PPTO = {};
  ACUM_PPTO_PROY = {};
  ACUM_PPTO_SUB = {};
  for (const row of rows) {
    const mes = row.fecha.substring(0, 7);
    const v   = parseFloat(row.venta_ppto) || 0;
    let key = null;
    if (row.tipo === 'Promesas'   && row.tipo2 === 'UN') key = 'promUN';
    else if (row.tipo === 'Promesas'   && row.tipo2 === 'UF') key = 'promUF';
    else if (row.tipo === 'Escrituras' && row.tipo2 === 'UN') key = 'escrUN';
    else if (row.tipo === 'Escrituras' && row.tipo2 === 'UF') key = 'escrUF';
    if (!key) continue;
    if (!ACUM_PPTO[mes]) ACUM_PPTO[mes] = { promUN:0, promUF:0, escrUN:0, escrUF:0 };
    ACUM_PPTO[mes][key] += v;
    const proj = mapPptoProy(row.proyecto);
    if (!ACUM_PPTO_PROY[proj]) ACUM_PPTO_PROY[proj] = {};
    if (!ACUM_PPTO_PROY[proj][mes]) ACUM_PPTO_PROY[proj][mes] = { promUN:0, promUF:0, escrUN:0, escrUF:0 };
    ACUM_PPTO_PROY[proj][mes][key] += v;
    const s = (row.subagrupacion && String(row.subagrupacion).trim()) ? row.subagrupacion.trim() : '(Sin subagrupación)';
    if (!ACUM_PPTO_SUB[proj]) ACUM_PPTO_SUB[proj] = {};
    if (!ACUM_PPTO_SUB[proj][s]) ACUM_PPTO_SUB[proj][s] = {};
    if (!ACUM_PPTO_SUB[proj][s][mes]) ACUM_PPTO_SUB[proj][s][mes] = { promUN:0, promUF:0, escrUN:0, escrUF:0 };
    ACUM_PPTO_SUB[proj][s][mes][key] += v;
  }
}


// ─── ACUMULADO AÑO EN CURSO — selector dinámico de meses ────────────────────
let ACUM_MESES_SEL   = new Set();  // conjunto de 'YYYY-MM' activos
let ACUM_FECHA_CORTE = '';         // para reusar en refresh
let ACUM_PPTO        = {};         // presupuesto anual: 'YYYY-MM' → {promUN,promUF,escrUN,escrUF}
let ACUM_PPTO_PROY   = {};         // presupuesto por proyecto: proyecto → 'YYYY-MM' → {promUN,promUF,escrUN,escrUF}
let ACUM_CIERRE      = {};         // REAL oficial desde cierre_mensual: proyecto → 'YYYY-MM' → {promUN,promUF,escrUN,escrUF}
let ACUM_CIERRE_SUB  = {};         // REAL por subagrupación: proyecto → sub → 'YYYY-MM' → {promUN,promUF,escrUN,escrUF}
let ACUM_PPTO_SUB    = {};         // PPTO por subagrupación: proyecto → sub → 'YYYY-MM' → {promUN,promUF,escrUN,escrUF}
let ACUM_CIERRE_MESES = [];        // periodos cerrados disponibles ('YYYY-MM' ordenados)
let ACUM_MES_VIVO     = null;      // mes en curso inyectado con datos vivos (NO cerrado)
let ACUM_MESES_SIN_CIERRE = [];    // meses ya terminados reconstruidos del snapshot por falta de cierre oficial
let ACUM_RES_FLUJO    = {};        // RESERVAS flujo (gestión) por fecha_reserva: proyecto → 'YYYY-MM' → {resUN,resUF}
let ACUM_RES_FLUJO_SUB= {};        // RESERVAS flujo por subagrupación: proyecto → sub → 'YYYY-MM' → {resUN,resUF}
let ACUM_CHART       = null;       // instancia Chart.js del gráfico acumulado
let ACUM_TIPO        = 'prom';     // 'prom' | 'escr'
let ACUM_METRIC      = 'UN';       // 'UN' | 'UF' (solo afecta el gráfico)

// Orden y etiquetas del cuadro Acumulado (incluye proyectos en desarrollo con presupuesto)
const CUADRO_ORDEN = ['PLAZA LOS PINOS','TERRAZAS DE SANTA MARIA','WIND','CROMATICO','CONDELL','RAICES DE PEÑABLANCA','MIRADOR SANTA TERESITA','LILENES'];
const CUADRO_LABEL_FB = { 'MIRADOR SANTA TERESITA':'Mirador de Santa Teresita', 'LILENES':'Lilenes' };
function lblCuadro(p) { return PROY_LABEL[p] || CUADRO_LABEL_FB[p] || p; }
function semaforoCumpl(r) { const p = Math.round(r*100); return (p>=95?'🟢':p>=70?'🟡':'🔴') + ' ' + p + '%'; }

// Agrega el mes en curso (datos vivos de RESUMEN_MES_DATA) a la serie del Acumulado,
// solo si ese mes aún NO está cerrado en cierre_mensual (para no pisar lo oficial).
function injectCurrentMonthAcum(mesYM, D) {
  ACUM_MES_VIVO = null;
  if (!D || !mesYM) return;
  if ((ACUM_CIERRE_MESES || []).includes(mesYM)) return;
  const zero = () => ({ resUN:0,resUF:0,promUN:0,promUF:0,escrUN:0,escrUF:0,desUN:0,desUF:0 });
  const ensP = (p) => { if(!ACUM_CIERRE[p]) ACUM_CIERRE[p]={}; if(!ACUM_CIERRE[p][mesYM]) ACUM_CIERRE[p][mesYM]=zero(); return ACUM_CIERRE[p][mesYM]; };
  const ensS = (p,s) => { if(!ACUM_CIERRE_SUB[p]) ACUM_CIERRE_SUB[p]={}; if(!ACUM_CIERRE_SUB[p][s]) ACUM_CIERRE_SUB[p][s]={}; if(!ACUM_CIERRE_SUB[p][s][mesYM]) ACUM_CIERRE_SUB[p][s][mesYM]=zero(); return ACUM_CIERRE_SUB[p][s][mesYM]; };
  for (const pr of (D.proms||[]))     { const o=ensP(pr.p); o.promUN+=pr.promUN; o.promUF+=pr.promUF; for (const s of (pr.subs||[])) { const q=ensS(pr.p,s.sub); q.promUN+=s.promUN; q.promUF+=s.promUF; } }
  for (const er of (D.escrs||[]))     { const o=ensP(er.p); o.escrUN+=er.escrUN; o.escrUF+=er.escrUF; for (const s of (er.subs||[])) { const q=ensS(er.p,s.sub); q.escrUN+=s.escrUN; q.escrUF+=s.escrUF; } }
  for (const rr of (D.reservas||[]))  { const o=ensP(rr.p); o.resUN+=rr.resUN;  o.resUF+=rr.resUF;  for (const s of (rr.subs||[])) { const q=ensS(rr.p,s.sub); q.resUN+=s.resUN;  q.resUF+=s.resUF; } }
  ACUM_MES_VIVO = mesYM;
  ACUM_CIERRE_MESES = [...new Set([...(ACUM_CIERRE_MESES||[]), mesYM])].sort();
}

// Meses YA TERMINADOS del año que no tienen cierre oficial en cierre_mensual.
// Antes simplemente desaparecían de la serie del Acumulado (el salto jun → ago
// cuando julio no se cerró). El informe los reconstruye solo, desde el snapshot
// vivo, y los deja marcados en ACUM_MESES_SIN_CIERRE para avisarlo en la nota.
// No pisa ningún cierre oficial: solo rellena los meses que faltan.
function injectMesesSinCierre(mesRefYM) {
  ACUM_MESES_SIN_CIERRE = [];
  if (!mesRefYM) return;
  const yr = mesRefYM.substring(0, 4);
  const mesRef = parseInt(mesRefYM.split('-')[1]);
  const cerrados = (ACUM_CIERRE_MESES || []).filter(m => m.substring(0, 4) === yr)
    .map(m => parseInt(m.split('-')[1]));
  if (!cerrados.length) return;              // sin ninguna referencia: no inventamos nada
  const desde = Math.min(...cerrados);
  const faltan = [];
  for (let m = desde; m < mesRef; m++) {
    if (!cerrados.includes(m)) faltan.push(`${yr}-${String(m).padStart(2, '0')}`);
  }
  if (!faltan.length) return;

  const zero = () => ({ resUN:0,resUF:0,promUN:0,promUF:0,escrUN:0,escrUF:0,desUN:0,desUF:0 });
  const ensP = (p, ym) => { if(!ACUM_CIERRE[p]) ACUM_CIERRE[p]={}; if(!ACUM_CIERRE[p][ym]) ACUM_CIERRE[p][ym]=zero(); return ACUM_CIERRE[p][ym]; };
  const ensS = (p, s, ym) => { if(!ACUM_CIERRE_SUB[p]) ACUM_CIERRE_SUB[p]={}; if(!ACUM_CIERRE_SUB[p][s]) ACUM_CIERRE_SUB[p][s]={}; if(!ACUM_CIERRE_SUB[p][s][ym]) ACUM_CIERRE_SUB[p][s][ym]=zero(); return ACUM_CIERRE_SUB[p][s][ym]; };
  const set = new Set(faltan);

  // Cromático y Mirador Santa Teresita son venta especial: solo admiten reservas
  // (nunca traen fecha_promesa) y esa reserva se cuenta también como promesa —
  // mismo criterio que RECLAS_PROY/CM_RECLAS_PROY en el resto del informe y que la
  // corrección manual de cierre_mensual (promesas_cant = reservas_cant, sin tocar
  // reservas_cant). Sin esto, un mes ya terminado que aún no tiene cierre oficial
  // queda en blanco para estos dos proyectos en el cuadro Promesas del Acumulado Año.
  const RECLAS_PROY_SIN_CIERRE = ['CROMATICO', 'MIRADOR SANTA TERESITA'];
  for (const row of (ALL_DATA_MOV || [])) {
    const p = row.proyecto; if (!p) continue;
    const sub = row.subagrupacion || '—';
    const uf  = parseFloat(row.precio_total_operacion_uf) || 0;
    const ymR = row.fecha_reserva   ? String(row.fecha_reserva).slice(0, 7)   : null;
    const ymP = row.fecha_promesa   ? String(row.fecha_promesa).slice(0, 7)   : null;
    const ymE = row.fecha_escritura ? String(row.fecha_escritura).slice(0, 7) : null;
    const esReclas = RECLAS_PROY_SIN_CIERRE.includes(p) && row.estado_corte === 'RESERVADO';
    if (ymR && set.has(ymR)) {
      const o=ensP(p,ymR), q=ensS(p,sub,ymR);
      o.resUN++;  o.resUF+=uf;  q.resUN++;  q.resUF+=uf;
      if (esReclas) { o.promUN++; o.promUF+=uf; q.promUN++; q.promUF+=uf; }
    }
    if (ymP && set.has(ymP)) { const o=ensP(p,ymP), q=ensS(p,sub,ymP); o.promUN++; o.promUF+=uf; q.promUN++; q.promUF+=uf; }
    if (ymE && set.has(ymE)) { const o=ensP(p,ymE), q=ensS(p,sub,ymE); o.escrUN++; o.escrUF+=uf; q.escrUN++; q.escrUF+=uf; }
  }

  // Desistimientos de promesa del mes, mismo criterio que cerrar_mes()
  // FIX 07-09-2026: no se re-filtra por tipo==='PROMESA' aca -- ALL_DESIS ya viene
  // correctamente acotado desde fetchAll() (tipo=PROMESA + tipo=RESERVA con
  // fecha_promesa, ver rescatePreciosDesistimientos). Filtrar de nuevo aca
  // volvia a excluir las promesas mal etiquetadas como reserva en el origen.
  for (const d of (ALL_DESIS || [])) {
    if (!d.fecha_cancelacion) continue;
    const ym = String(d.fecha_cancelacion).slice(0, 7);
    if (!set.has(ym)) continue;
    const p = d.proyecto || '(sin proyecto)';
    const o = ensP(p, ym); o.desUN++; o.desUF += (parseFloat(d.precio_uf) || 0);
  }

  ACUM_MESES_SIN_CIERRE = faltan;
  ACUM_CIERRE_MESES = [...new Set([...(ACUM_CIERRE_MESES||[]), ...faltan])].sort();
}

// RESERVAS del Acumulado = FLUJO (gestión): reservas hechas en cada mes por fecha_reserva,
// aunque hoy ya sean promesas/escrituras. Se computa del snapshot (ALL_DATA), NO de cierre_mensual
// (que refleja el backlog de reservas que sobreviven, no el flujo).
function buildAcumResFlujo(fecha_corte) {
  const yr = String(fecha_corte).slice(0, 4);
  ACUM_RES_FLUJO = {}; ACUM_RES_FLUJO_SUB = {};
  for (const row of (ALL_DATA || [])) {
    if (!row.fecha_reserva) continue;
    const ym = String(row.fecha_reserva).slice(0, 7);
    if (ym.slice(0, 4) !== yr) continue;
    const p = row.proyecto;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    if (!ACUM_RES_FLUJO[p]) ACUM_RES_FLUJO[p] = {};
    if (!ACUM_RES_FLUJO[p][ym]) ACUM_RES_FLUJO[p][ym] = { resUN:0, resUF:0 };
    ACUM_RES_FLUJO[p][ym].resUN++; ACUM_RES_FLUJO[p][ym].resUF += uf;
    const s = (row.subagrupacion && String(row.subagrupacion).trim()) || '(Sin subagrupación)';
    if (!ACUM_RES_FLUJO_SUB[p]) ACUM_RES_FLUJO_SUB[p] = {};
    if (!ACUM_RES_FLUJO_SUB[p][s]) ACUM_RES_FLUJO_SUB[p][s] = {};
    if (!ACUM_RES_FLUJO_SUB[p][s][ym]) ACUM_RES_FLUJO_SUB[p][s][ym] = { resUN:0, resUF:0 };
    ACUM_RES_FLUJO_SUB[p][s][ym].resUN++; ACUM_RES_FLUJO_SUB[p][s][ym].resUF += uf;
  }
}

function renderAcumulado(fecha_corte) {
  ACUM_FECHA_CORTE = fecha_corte;
  const corteD = new Date(fecha_corte + 'T12:00:00');
  const yr  = corteD.getFullYear();
  const mes = corteD.getMonth(); // 0-indexed

  const NOMB = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // Meses disponibles = periodos CERRADOS (cierre_mensual) del año. Fallback: Ene..mes corte.
  let mesesDisp = (ACUM_CIERRE_MESES || []).filter(m => m.substring(0,4) === String(yr));
  if (!mesesDisp.length) {
    mesesDisp = [];
    for (let m = 0; m <= mes; m++) mesesDisp.push(`${yr}-${String(m+1).padStart(2,'0')}`);
  }

  // Inicializar selección: todos los meses cerrados disponibles
  ACUM_MESES_SEL = new Set(mesesDisp);

  // Pills de meses
  const pills = mesesDisp.map(ym => {
    const mi = parseInt(ym.split('-')[1]) - 1;
    return `<button class="mes-pill active" data-mes="${ym}" onclick="toggleMesPill(this)">${NOMB[mi]}</button>`;
  }).join('');

  return `
  <div class="section-title" style="margin-bottom:14px">Acumulado ${yr} — Año en Curso</div>
  <div class="chart-filters" style="margin-bottom:14px">
    <span class="filter-label">Tipo</span>
    <div class="filter-group">
      <button class="chart-filter-btn acum-tipo-btn ${ACUM_TIPO==='prom'?'prom-active':''}" onclick="setAcumTipo('prom',this)">Promesas</button>
      <button class="chart-filter-btn acum-tipo-btn ${ACUM_TIPO==='escr'?'escr-active':''}" onclick="setAcumTipo('escr',this)">Escrituras</button>
      <button class="chart-filter-btn acum-tipo-btn ${ACUM_TIPO==='res'?'res-active':''}" onclick="setAcumTipo('res',this)">Reservas</button>
    </div>
  </div>
  <div class="mes-pills-wrap">
    <div class="mes-pills-label">Seleccionar meses a incluir
      <button class="chart-filter-btn acum-allbtn metric-active" style="margin-left:8px;padding:2px 12px;font-size:11px" onclick="acumSelAllMeses()">Acum Año</button>
    </div>
    <div class="mes-pills">${pills}</div>
  </div>
  <div id="acum-cuadro"></div>
  <div id="acum-chart-area"></div>`;
}

function acumSelAllMeses() {
  document.querySelectorAll('.mes-pill').forEach(b => { b.classList.add('active'); ACUM_MESES_SEL.add(b.dataset.mes); });
  refreshAcumulado();
}
function toggleMesPill(btn) {
  const mes = btn.dataset.mes;
  if (ACUM_MESES_SEL.has(mes)) {
    if (ACUM_MESES_SEL.size === 1) return; // no dejar vacío
    ACUM_MESES_SEL.delete(mes);
    btn.classList.remove('active');
  } else {
    ACUM_MESES_SEL.add(mes);
    btn.classList.add('active');
  }
  refreshAcumulado();
}

function refreshAcumulado() {
  const NOMB = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const NOMB_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const yr = ACUM_FECHA_CORTE.substring(0,4);
  const tipo = ACUM_TIPO;                       // 'prom' | 'escr' | 'res'
  const esRes = tipo === 'res';                 // Reservas: solo real, sin presupuesto
  const tipoLabel = tipo === 'prom' ? 'Promesas' : tipo === 'escr' ? 'Escrituras' : 'Reservas';
  const tipoColor = tipo === 'prom' ? '#E1093F' : tipo === 'escr' ? '#006400' : '#111111';

  const mesesArr = [...ACUM_MESES_SEL].sort();
  const mesNums  = mesesArr.map(m => parseInt(m.split('-')[1]));   // 1-12
  // Brecha automática: meses que quedan para vender = del mes EN CURSO a diciembre.
  // El mes en curso cuenta como disponible aunque ya tenga ventas cargadas; no
  // depende de la selección de pills ni de que existan los cierres oficiales.
  const mesesConDato = (ACUM_CIERRE_MESES || []).filter(m => m.substring(0,4) === String(yr)).map(m => parseInt(m.split('-')[1]));
  const mesEnCurso = (ACUM_MES_VIVO && ACUM_MES_VIVO.substring(0,4) === String(yr))
    ? parseInt(ACUM_MES_VIVO.split('-')[1])
    : (mesesConDato.length ? Math.max(...mesesConDato) : Math.max(...mesNums));
  const mesesRest = Math.max(0, 13 - mesEnCurso);
  // Meses ya terminados que se reconstruyeron por falta de cierre oficial: se avisan.
  const mesesSinCierre = (ACUM_MESES_SIN_CIERRE || [])
    .filter(m => m.substring(0,4) === String(yr))
    .map(m => NOMB_LARGO[parseInt(m.split('-')[1]) - 1]);
  const primerMes = NOMB_LARGO[mesNums[0]-1];
  const ultimoMes = NOMB_LARGO[mesNums[mesNums.length-1]-1];
  const rangeLabel = mesesArr.length === 1 ? `${primerMes} ${yr}` : `${primerMes} – ${ultimoMes} ${yr}`;

  // REAL oficial = cierres mensuales (ACUM_CIERRE), NO el snapshot vivo.

  // Construye una sub-tabla (UNIDADES o MUF) del cuadro
  function buildCuadro(metric) {  // 'UN' | 'UF'
    const fPpto = tipo === 'prom' ? (metric==='UN'?'promUN':'promUF') : (metric==='UN'?'escrUN':'escrUF');
    const fReal = (esRes ? 'res' : tipo === 'prom' ? 'prom' : 'escr') + metric;  // resUN | promUN | promUF | escrUN | escrUF
    const fnum = metric === 'UN'
      ? (n => Math.round(n).toLocaleString('es-CL'))
      : (n => (n/1000).toLocaleString('es-CL', { minimumFractionDigits:1, maximumFractionDigits:1 }));
    const cell = (n) => n ? fnum(n) : '—';
    const slug = s => String(s).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'') || 'X';

    // extractores de mapas mensuales (ym → valor) por proyecto / subagrupación
    const mapFrom = (src, f) => { const o={}; for (const m in (src||{})) o[m] = src[m][f]||0; return o; };
    // Reservas = flujo por fecha_reserva (ACUM_RES_FLUJO); prom/escr = cierres oficiales (ACUM_CIERRE)
    const realSrc    = esRes ? ACUM_RES_FLUJO : ACUM_CIERRE;
    const realSrcSub = esRes ? ACUM_RES_FLUJO_SUB : ACUM_CIERRE_SUB;
    const realMapProj = (p)   => mapFrom(realSrc[p], fReal);
    const pptoMapProj = (p)   => mapFrom(ACUM_PPTO_PROY[p], fPpto);
    const realMapSub  = (p,s) => mapFrom((realSrcSub[p]||{})[s], fReal);
    const pptoMapSub  = (p,s) => mapFrom((ACUM_PPTO_SUB[p]||{})[s], fPpto);
    const anio = (map) => { let s=0; for (const m in map) s+=map[m]||0; return s; };

    // proyectos a mostrar: con presupuesto del tipo (no aplica a Reservas) o con reales en los meses seleccionados
    const projs = CUADRO_ORDEN.filter(p => {
      if (!esRes && anio(pptoMapProj(p)) > 0) return true;
      const rm = realMapProj(p); return mesesArr.some(m => (rm[m]||0) > 0);
    });

    const tot = { mes:{}, acum:0, pptoP:0, pptoA:0 };
    mesesArr.forEach(m => tot.mes[m]=0);

    // arma una fila (proyecto o subagrupación) a partir de mapas real/ppto mensuales
    function fila(labelHtml, realMap, pptoMap, trAttrs, addTot) {
      let acum=0, pptoP=0; const pptoA = anio(pptoMap);
      const cells = mesesArr.map(m => { const v=realMap[m]||0; acum+=v; if(addTot) tot.mes[m]+=v; return `<td style="text-align:right">${cell(v)}</td>`; }).join('');
      for (const m of mesesArr) pptoP += pptoMap[m]||0;
      if (addTot) { tot.acum+=acum; tot.pptoP+=pptoP; tot.pptoA+=pptoA; }
      if (esRes) {  // Reservas: solo meses + Acum (sin presupuesto)
        return `<tr ${trAttrs}><td class="left">${labelHtml}</td>${cells}<td style="text-align:right;font-weight:600">${cell(acum)}</td></tr>`;
      }
      const cumpl  = pptoP>0 ? acum/pptoP : null;
      const avance = pptoA>0 ? acum/pptoA : null;
      const brecha = (mesesRest>0 && pptoA>0) ? (pptoA-acum)/mesesRest : null;
      return `<tr ${trAttrs}>
        <td class="left">${labelHtml}</td>${cells}
        <td style="text-align:right;font-weight:600">${cell(acum)}</td>
        <td style="text-align:right">${pptoP?fnum(pptoP):'—'}</td>
        <td style="text-align:right">${cumpl!=null?semaforoCumpl(cumpl):'—'}</td>
        <td style="text-align:right">${pptoA?fnum(pptoA):'—'}</td>
        <td style="text-align:right">${avance!=null?Math.round(avance*100)+'%':'—'}</td>
        <td style="text-align:right">${brecha!=null?fnum(brecha):'—'}</td>
      </tr>`;
    }

    let filas = '';
    for (const p of projs) {
      // subagrupaciones = unión de las que tienen real (cierre) o presupuesto
      const subSet = new Set([...Object.keys(ACUM_CIERRE_SUB[p]||{}), ...Object.keys(ACUM_PPTO_SUB[p]||{})]);
      subSet.delete('(Sin subagrupación)');
      // '(desistimientos)' es una fila sintetica de cierre_mensual (solo guarda el
      // desistimiento del mes; reservas/promesas/escrituras siempre van en 0 ahi) --
      // no es una subagrupacion real y no debe listarse en el desglose de Acumulado
      // Año. Los desistimientos se ven solo en su propio apartado (Desistimientos).
      subSet.delete('(desistimientos)');
      const subs = [...subSet].sort();
      const hasMulti = subs.length > 1;
      const gid = 'acsub-' + metric + '-' + slug(p);
      const caret = hasMulti ? `<span class="toggle-icon" id="icon-${gid}">▶</span>` : '';
      const mainAttrs = hasMulti ? `class="proj-expandable" onclick="toggleSub('${gid}')"` : '';
      filas += fila(`${caret}${lblCuadro(p)}`, realMapProj(p), pptoMapProj(p), mainAttrs, true);
      if (hasMulti) {
        for (const s of subs) {
          filas += fila(`<span style="padding-left:22px;color:#666">${s}</span>`, realMapSub(p,s), pptoMapSub(p,s), `class="sub-row ${gid}" style="display:none"`, false);
        }
      }
    }
    const totCells = mesesArr.map(m => `<td style="text-align:right">${cell(tot.mes[m])}</td>`).join('');
    if (esRes) {  // Cuadro Reservas: meses + Acum, sin columnas de presupuesto
      const head = `<tr><th class="left">Proyecto</th>${mesesArr.map(m=>`<th style="text-align:right">${NOMB[parseInt(m.split('-')[1])-1]}</th>`).join('')}<th style="text-align:right">Acum</th></tr>`;
      return `<div style="font-size:12px;font-weight:700;color:#111111;margin:16px 0 6px">${metric==='UN'?'UNIDADES':'UF — Monto (MUF)'}</div>
      <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${filas}
        <tr class="total-row"><td>TOTAL</td>${totCells}<td style="text-align:right">${cell(tot.acum)}</td></tr>
      </tbody></table></div>`;
    }
    const cumplT  = tot.pptoP>0 ? tot.acum/tot.pptoP : null;
    const avanceT = tot.pptoA>0 ? tot.acum/tot.pptoA : null;
    const brechaT = (mesesRest>0 && tot.pptoA>0) ? (tot.pptoA-tot.acum)/mesesRest : null;
    const head = `<tr><th class="left">Proyecto</th>${mesesArr.map(m=>`<th style="text-align:right">${NOMB[parseInt(m.split('-')[1])-1]}</th>`).join('')}<th style="text-align:right">Acum</th><th style="text-align:right">PPTO período</th><th style="text-align:right">% Cumpl.</th><th style="text-align:right">PPTO Año</th><th style="text-align:right">% Avance Año</th><th style="text-align:right">Brecha mensual</th></tr>`;
    return `<div style="font-size:12px;font-weight:700;color:#111111;margin:16px 0 6px">${metric==='UN'?'UNIDADES':'UF — Monto (MUF)'}</div>
    <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${filas}
      <tr class="total-row"><td>TOTAL</td>${totCells}<td style="text-align:right">${cell(tot.acum)}</td><td style="text-align:right">${tot.pptoP?fnum(tot.pptoP):'—'}</td><td style="text-align:right">${cumplT!=null?Math.round(cumplT*100)+'%':'—'}</td><td style="text-align:right">${tot.pptoA?fnum(tot.pptoA):'—'}</td><td style="text-align:right">${avanceT!=null?Math.round(avanceT*100)+'%':'—'}</td><td style="text-align:right">${brechaT!=null?fnum(brechaT):'—'}</td></tr>
    </tbody></table></div>`;
  }

  const cuadroTitle = esRes ? `Cuadro Reservas — Acumulado (real) · ${rangeLabel}` : `Cuadro ${tipoLabel} vs Presupuesto · ${rangeLabel}`;
  const cuadroNota = esRes
    ? `Click en un proyecto para abrir el detalle por subagrupación. Reservas = acumulado real de reservas tomadas en cada mes (sin presupuesto). Meses cerrados desde cierre_mensual; el mes en curso se agrega con datos vivos.`
    : `Click en un proyecto para abrir el detalle por subagrupación. % Cumpl. = Acum / PPTO del período · % Avance Año = Acum / PPTO Año · Brecha mensual = (PPTO Año − Acum) / meses restantes (${mesesRest}: del mes en curso a diciembre). Real desde cierres mensuales; el mes en curso se agrega con datos vivos.${mesesSinCierre.length ? ' <b style="color:#c00030">Sin cierre oficial: ' + mesesSinCierre.join(', ') + '</b> — reconstruido desde el snapshot vivo; se fija al ejecutar su cierre.' : ''}`;
  const cuadroHTML = `
    <div class="section-title" style="color:${tipoColor};border-color:${tipoColor}">${cuadroTitle}</div>
    ${buildCuadro('UN')}
    ${buildCuadro('UF')}
    <p class="nota" style="margin-top:8px">${cuadroNota}</p>`;

  const chartHTML = `
  <div class="chart-filters" style="margin-top:18px">
    <span class="filter-label">Gráfico acumulado · Métrica</span>
    <div class="filter-group">
      <button class="chart-filter-btn acum-metric-btn ${ACUM_METRIC==='UN'?'metric-active':''}" onclick="setAcumMetric('UN',this)">Unidades</button>
      <button class="chart-filter-btn acum-metric-btn ${ACUM_METRIC==='UF'?'metric-active':''}" onclick="setAcumMetric('UF',this)">UF</button>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="acum-chart-canvas"></canvas></div>`;

  const elCuadro = document.getElementById('acum-cuadro');
  const elChart  = document.getElementById('acum-chart-area');
  if (elCuadro) elCuadro.innerHTML = cuadroHTML;
  if (elChart)  elChart.innerHTML  = chartHTML;
  setTimeout(() => renderAcumuladoChart(), 50);
}

function setAcumTipo(tipo, btn) {
  ACUM_TIPO = tipo;
  document.querySelectorAll('.acum-tipo-btn').forEach(b => b.classList.remove('prom-active','escr-active','res-active'));
  if (btn) btn.classList.add(tipo==='prom' ? 'prom-active' : tipo==='escr' ? 'escr-active' : 'res-active');
  refreshAcumulado();
}
function setAcumMetric(metric, btn) {
  ACUM_METRIC = metric;
  document.querySelectorAll('.acum-metric-btn').forEach(b => b.classList.remove('metric-active'));
  if (btn) btn.classList.add('metric-active');
  renderAcumuladoChart();   // sólo afecta al gráfico; el cuadro muestra Un y MUF siempre
}

// ───────────────────────────────────────────────────────────────────────────
// VISTA PRESUPUESTO — tablas de PPTO por proyecto × mes (Unidades y UF)
// Solo presupuesto, sin real ni cumplimiento. Permite elegir qué meses
// visualizar. Fuente: ACUM_PPTO_PROY[proyecto]['YYYY-MM'] → {promUN,promUF,escrUN,escrUF}
// ───────────────────────────────────────────────────────────────────────────
let PPTO_FECHA_CORTE = null;
let PPTO_MESES_SEL   = new Set();   // meses 'YYYY-MM' seleccionados
let PPTO_TIPO        = 'prom';      // 'prom' | 'escr'

function renderPresupuesto(fecha_corte) {
  PPTO_FECHA_CORTE = fecha_corte;
  const yr = parseInt(fecha_corte.substring(0,4));
  const NOMB = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // Año completo: Ene–Dic del año del corte (así se puede elegir cualquier mes,
  // incluso los que todavía no se cierran).
  const mesesAnio = [];
  for (let m = 1; m <= 12; m++) mesesAnio.push(`${yr}-${String(m).padStart(2,'0')}`);
  PPTO_MESES_SEL = new Set(mesesAnio);

  const pills = mesesAnio.map(ym => {
    const mi = parseInt(ym.split('-')[1]) - 1;
    return `<button class="mes-pill active" data-mes="${ym}" onclick="togglePptoMesPill(this)">${NOMB[mi]}</button>`;
  }).join('');

  return `
  <div class="section-title" style="margin-bottom:14px">Presupuesto ${yr} — por Proyecto y Mes</div>
  <div class="chart-filters" style="margin-bottom:14px">
    <span class="filter-label">Tipo de presupuesto</span>
    <div class="filter-group">
      <button class="chart-filter-btn ppto-tipo-btn ${PPTO_TIPO==='prom'?'prom-active':''}" onclick="setPptoTipo('prom',this)">Promesas</button>
      <button class="chart-filter-btn ppto-tipo-btn ${PPTO_TIPO==='escr'?'escr-active':''}" onclick="setPptoTipo('escr',this)">Escrituras</button>
    </div>
  </div>
  <div class="mes-pills-wrap">
    <div class="mes-pills-label">Seleccionar meses a visualizar
      <button class="chart-filter-btn ppto-allbtn metric-active" style="margin-left:8px;padding:2px 12px;font-size:11px" onclick="pptoSelAllMeses()">Año completo</button>
    </div>
    <div class="mes-pills" id="ppto-mes-pills">${pills}</div>
  </div>
  <div id="ppto-cuadro"></div>`;
}

function pptoSelAllMeses() {
  document.querySelectorAll('#ppto-mes-pills .mes-pill').forEach(b => {
    b.classList.add('active'); PPTO_MESES_SEL.add(b.dataset.mes);
  });
  refreshPresupuesto();
}

function togglePptoMesPill(btn) {
  const mes = btn.dataset.mes;
  if (PPTO_MESES_SEL.has(mes)) {
    if (PPTO_MESES_SEL.size === 1) return;   // no dejar vacío
    PPTO_MESES_SEL.delete(mes);
    btn.classList.remove('active');
  } else {
    PPTO_MESES_SEL.add(mes);
    btn.classList.add('active');
  }
  refreshPresupuesto();
}

function setPptoTipo(tipo, btn) {
  PPTO_TIPO = tipo;
  document.querySelectorAll('.ppto-tipo-btn').forEach(b => b.classList.remove('prom-active','escr-active'));
  if (btn) btn.classList.add(tipo === 'prom' ? 'prom-active' : 'escr-active');
  refreshPresupuesto();
}

function refreshPresupuesto() {
  if (!PPTO_FECHA_CORTE) return;
  const yr   = PPTO_FECHA_CORTE.substring(0,4);
  const tipo = PPTO_TIPO;    // 'prom' | 'escr'
  const tipoLabel = tipo === 'prom' ? 'Promesas' : 'Escrituras';
  const tipoColor = tipo === 'prom' ? '#E1093F' : '#006400';
  const NOMB  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const NOMB_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const mesesArr = [...PPTO_MESES_SEL].sort();
  const mesNums  = mesesArr.map(m => parseInt(m.split('-')[1]));
  const primerMes = NOMB_LARGO[mesNums[0]-1];
  const ultimoMes = NOMB_LARGO[mesNums[mesNums.length-1]-1];
  const rangeLabel = mesesArr.length === 1 ? `${primerMes} ${yr}`
                   : mesesArr.length === 12 ? `Año completo ${yr}`
                   : `${primerMes} – ${ultimoMes} ${yr}`;

  // Año completo: todos los meses del año (para la columna "PPTO Año")
  const mesesAnio = [];
  for (let m = 1; m <= 12; m++) mesesAnio.push(`${yr}-${String(m).padStart(2,'0')}`);

  function buildCuadro(metric) {   // 'UN' | 'UF'
    const fPpto = tipo === 'prom' ? (metric==='UN'?'promUN':'promUF') : (metric==='UN'?'escrUN':'escrUF');
    const fnum = metric === 'UN'
      ? (n => Math.round(n).toLocaleString('es-CL'))
      : (n => (n/1000).toLocaleString('es-CL', { minimumFractionDigits:1, maximumFractionDigits:1 }));
    const cell = (n) => n ? fnum(n) : '—';

    const mapFrom = (src, f) => { const o={}; for (const m in (src||{})) o[m] = src[m][f]||0; return o; };
    const pptoMapProj = (p) => mapFrom(ACUM_PPTO_PROY[p], fPpto);
    const anio = (map) => { let s=0; for (const m in map) s += map[m]||0; return s; };
    const sumMeses = (map, meses) => { let s=0; for (const m of meses) s += map[m]||0; return s; };

    // Proyectos con presupuesto > 0 en el año (para el tipo elegido)
    const projs = CUADRO_ORDEN.filter(p => anio(pptoMapProj(p)) > 0);

    const tot = { mes:{}, periodo:0, anio:0 };
    mesesArr.forEach(m => tot.mes[m]=0);

    let filas = '';
    for (const p of projs) {
      const map = pptoMapProj(p);
      const cells = mesesArr.map(m => { const v = map[m]||0; tot.mes[m] += v; return `<td style="text-align:right">${cell(v)}</td>`; }).join('');
      const totPeriodo = sumMeses(map, mesesArr);
      const totAnio    = sumMeses(map, mesesAnio);
      tot.periodo += totPeriodo;
      tot.anio    += totAnio;
      filas += `<tr>
        <td class="left">${lblCuadro(p)}</td>${cells}
        <td style="text-align:right;font-weight:600">${cell(totPeriodo)}</td>
        <td style="text-align:right">${cell(totAnio)}</td>
      </tr>`;
    }

    const totCells = mesesArr.map(m => `<td style="text-align:right">${cell(tot.mes[m])}</td>`).join('');
    const head = `<tr><th class="left">Proyecto</th>${mesesArr.map(m=>`<th style="text-align:right">${NOMB[parseInt(m.split('-')[1])-1]}</th>`).join('')}<th style="text-align:right">PPTO período</th><th style="text-align:right">PPTO Año</th></tr>`;

    return `<div style="font-size:12px;font-weight:700;color:#111111;margin:16px 0 6px">${metric==='UN'?'UNIDADES':'UF — Monto (MUF)'}</div>
    <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${filas}
      <tr class="total-row"><td>TOTAL</td>${totCells}<td style="text-align:right">${cell(tot.periodo)}</td><td style="text-align:right">${cell(tot.anio)}</td></tr>
    </tbody></table></div>`;
  }

  const cuadroHTML = `
    <div class="section-title" style="color:${tipoColor};border-color:${tipoColor}">Presupuesto ${tipoLabel} · ${rangeLabel}</div>
    ${buildCuadro('UN')}
    ${buildCuadro('UF')}
    <p class="nota" style="margin-top:8px">Solo presupuesto, sin comparar contra lo real. Fuente: tabla <code>presupuesto_comercial</code>. PPTO período = suma del presupuesto en los meses seleccionados. PPTO Año = suma del presupuesto en los 12 meses del año (${yr}).</p>`;

  const el = document.getElementById('ppto-cuadro');
  if (el) el.innerHTML = cuadroHTML;
}

function renderAcumuladoChart() {
  const canvas = document.getElementById('acum-chart-canvas');
  if (!canvas || typeof Chart === 'undefined') return;
  if (ACUM_CHART) { ACUM_CHART.destroy(); ACUM_CHART = null; }

  const NOMB = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const yr   = ACUM_FECHA_CORTE.substring(0,4);
  // Mes máximo = último periodo cerrado disponible
  const mesesCerr = (ACUM_CIERRE_MESES || []).filter(m => m.substring(0,4) === yr).map(m => parseInt(m.split('-')[1]));
  const mesActivo = mesesCerr.length ? Math.max(...mesesCerr) : parseInt(ACUM_FECHA_CORTE.substring(5,7));

  const esResChart = ACUM_TIPO === 'res';
  const field = (ACUM_TIPO === 'prom' ? 'prom' : ACUM_TIPO === 'escr' ? 'escr' : 'res') + ACUM_METRIC;

  const colorReal = ACUM_TIPO === 'prom' ? '#E1093F' : ACUM_TIPO === 'escr' ? '#006400' : '#111111';
  const tipoLabel = ACUM_TIPO === 'prom' ? 'Promesas' : ACUM_TIPO === 'escr' ? 'Escrituras' : 'Reservas';

  // Presupuesto ACUMULADO (12 meses, suma corrida)
  let cumP = 0;
  const pptoData = NOMB.map((_,i) => {
    const mes = `${yr}-${String(i+1).padStart(2,'0')}`;
    cumP += Math.round((ACUM_PPTO[mes]?.[field]) || 0);
    return cumP;
  });

  // Reales ACUMULADOS (suma corrida). Reservas = flujo (ACUM_RES_FLUJO); prom/escr = cierres (ACUM_CIERRE)
  const realSrcChart = esResChart ? ACUM_RES_FLUJO : ACUM_CIERRE;
  let cumR = 0;
  const realesData = NOMB.map((_,i) => {
    if (i+1 > mesActivo) return null; // meses aún no cerrados
    const mes = `${yr}-${String(i+1).padStart(2,'0')}`;
    let total = 0;
    for (const p in realSrcChart) { const c = realSrcChart[p][mes]; if (c) total += c[field] || 0; }
    cumR += total;
    return Math.round(cumR);
  });

  ACUM_CHART = new Chart(canvas, {
    type: 'line',
    data: {
      labels: NOMB,
      datasets: [
        ...(esResChart ? [] : [{
          label: `Presupuesto acum. ${tipoLabel}`,
          data: pptoData,
          borderColor: 'rgba(46,64,87,0.75)',
          backgroundColor: 'rgba(46,64,87,0.05)',
          borderWidth: 2,
          borderDash: [6,4],
          pointRadius: 0,
          tension: 0.25,
          fill: false,
          order: 2,
        }]),
        {
          label: `Real acum. ${tipoLabel}`,
          data: realesData,
          borderColor: colorReal,
          backgroundColor: colorReal + '22',
          borderWidth: 2.5,
          pointBackgroundColor: colorReal,
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.25,
          fill: true,
          order: 1,
          spanGaps: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font:{size:11}, boxWidth:14 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y == null) return '';
              const v = ACUM_METRIC === 'UF'
                ? Math.round(ctx.parsed.y).toLocaleString('es-CL') + ' UF'
                : ctx.parsed.y + ' un.';
              return ` ${ctx.dataset.label}: ${v}`;
            }
          }
        }
      },
      scales: {
        x: { grid:{display:false}, ticks:{font:{size:11}} },
        y: {
          beginAtZero: true,
          grid: { color:'rgba(0,0,0,0.05)' },
          ticks: {
            font:{size:10},
            callback: v => ACUM_METRIC==='UF'
              ? Math.round(v).toLocaleString('es-CL')
              : v
          }
        }
      }
    }
  });
}


// Navega a una sección del sidebar Vista por su id, sin tener el botón a mano
// ── CIERRE DE MES (dentro de Gestión Ventas) ───────────────────────────────
// Cierres mensuales congelados (cierre_mensual): fuente OFICIAL, fijada al cerrar
// cada mes — no cambia con el snapshot vivo. Filtro de meses (pills), proyecto y
// toggle Unidades/UF. Solo lectura: esta vista NO ejecuta ni modifica el cierre.
let CM_DATA  = null;
let CM_DET   = [];   // detalle de unidades del último corte por proyecto
let CM_VEND  = {};   // id_producto -> vendedor
let CM_STATE = { metric: 'UN', proy: 'TODOS', meses: null };  // meses: Set o null (=todos)
const CM_RECLAS_PROY = ['CROMATICO', 'MIRADOR SANTA TERESITA'];
const CM_MESES_L = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const cmLblMes = ym => CM_MESES_L[+ym.substring(5, 7) - 1] + ' ' + ym.substring(2, 4);

async function cmFetch() {
  if (CM_DATA) return CM_DATA;
  const yr = (CORTE_STR || '').substring(0, 4) || new Date().getFullYear();
  const desde = (yr - 1) + '-01-01';
  let out = [], off = 0, more = true;
  while (more) {
    const r = await fetch(
      `${SB_URL}/rest/v1/cierre_mensual?select=periodo,proyecto,subagrupacion,estado,origen,fecha_corte_foto,reservas_cant,reservas_uf,promesas_cant,promesas_uf,escrituras_cant,escrituras_uf,desistimientos_cant,desistimientos_uf,neto_cant,neto_uf&periodo=gte.${desde}&order=periodo.desc`,
      { headers: { ...HEADERS, 'Range': `${off}-${off + 999}`, 'Prefer': 'count=none' } }
    );
    if (!r.ok) throw new Error('Error cargando cierre_mensual: ' + r.status);
    const b = await r.json();
    out = out.concat(b); more = b.length === 1000; off += 1000;
  }
  // Detalle de unidades: cada proyecto puede tener su corte más reciente en fechas
  // distintas dentro de ventas_pok, así que se usa el último corte DE CADA PROYECTO.
  let det = [];
  try {
    const ultCorte = {};
    for (const proy0 of (typeof PROYECTOS !== 'undefined' ? PROYECTOS : [])) {
      const rP = await fetch(`${SB_URL}/rest/v1/ventas_pok?select=fecha_corte&proyecto=eq.${encodeURIComponent(proy0)}&order=fecha_corte.desc&limit=1`,
        { headers: { ...HEADERS, 'Prefer': 'count=none' } });
      if (rP.ok) { const b0 = await rP.json(); if (b0 && b0[0] && b0[0].fecha_corte) ultCorte[proy0] = b0[0].fecha_corte; }
    }
    for (const proy of Object.keys(ultCorte)) {
      let off2 = 0, more2 = true;
      while (more2) {
        const r = await fetch(
          `${SB_URL}/rest/v1/ventas_pok?select=proyecto,subagrupacion,propiedad,estacionamiento,bodega,precio_total_operacion_uf,fecha_promesa,fecha_reserva,estado_corte,id_producto&proyecto=eq.${encodeURIComponent(proy)}&fecha_corte=eq.${ultCorte[proy]}&estado_corte=in.(PROMESADO,ESCRITURADO,RESERVADO)`,
          { headers: { ...HEADERS, 'Range': `${off2}-${off2 + 999}`, 'Prefer': 'count=none' } }
        );
        if (!r.ok) break;
        const b = await r.json();
        det = det.concat(b); more2 = b.length === 1000; off2 += 1000;
      }
    }
  } catch (e) { /* si falla, det queda vacío */ }
  // Vendedor por id_producto (última extracción de reservas_pok)
  let vend = {};
  try {
    const rFe = await fetch(`${SB_URL}/rest/v1/reservas_pok?select=fecha_extraccion&order=fecha_extraccion.desc&limit=1`, { headers: HEADERS });
    const maxFe = rFe.ok ? ((await rFe.json())[0] || {}).fecha_extraccion : null;
    if (maxFe) {
      const rV = await fetch(`${SB_URL}/rest/v1/reservas_pok?select=id_producto,nombre_vendedor&tipo_producto=eq.PRINCIPAL&fecha_extraccion=eq.${maxFe}`,
        { headers: { ...HEADERS, 'Range': '0-4999', 'Prefer': 'count=none' } });
      if (rV.ok) for (const x of await rV.json()) {
        if (x.nombre_vendedor && !/VIRTUAL/i.test(x.nombre_vendedor)) vend[String(x.id_producto)] = x.nombre_vendedor;
      }
    }
  } catch (e) { /* sin vendedores si falla */ }

  CM_DATA = out;
  CM_DET = det;
  CM_VEND = vend;
  return out;
}

async function renderCierres() {
  const cont = document.getElementById('res-cierres');
  if (!cont) return;
  if (!CM_DATA) {
    cont.innerHTML = '<div class="proj-box"><p style="color:#999;padding:16px">Cargando cierres mensuales…</p></div>';
    try { await cmFetch(); }
    catch (e) { cont.innerHTML = `<div class="proj-box"><p style="color:#E1093F;padding:16px">${e.message}</p></div>`; return; }
  }
  cmPintar();
}

function cmSet(campo, valor) { CM_STATE[campo] = valor; cmPintar(); }
function cmToggleMes(ym) {
  const st = CM_STATE;
  if (!st.meses) st.meses = new Set(cmMeses());
  if (st.meses.has(ym)) st.meses.delete(ym); else st.meses.add(ym);
  cmPintar();
}
function cmTodosMeses() { CM_STATE.meses = null; cmPintar(); }
function cmMeses() { return [...new Set(CM_DATA.map(r => String(r.periodo).substring(0, 7)))].sort().reverse(); }

function cmPintar() {
  const cont = document.getElementById('res-cierres');
  if (!cont) return;
  const st = CM_STATE;
  const M = st.metric;
  const fRes = M === 'UF' ? 'reservas_uf' : 'reservas_cant';
  const fProm = M === 'UF' ? 'promesas_uf' : 'promesas_cant';
  const fEscr = M === 'UF' ? 'escrituras_uf' : 'escrituras_cant';
  const fDes = M === 'UF' ? 'desistimientos_uf' : 'desistimientos_cant';
  const fmtM = v => M === 'UF' ? (v ? fmtUF(Math.round(v)) : '—') : (v ? fmt(Math.round(v)) : '—');
  const num = v => parseFloat(v) || 0;

  const mesesAll = cmMeses();
  const mesesSel = st.meses ? [...st.meses] : mesesAll;
  const activo = ym => !st.meses || st.meses.has(ym);

  const filas = CM_DATA.filter(r =>
    (st.proy === 'TODOS' || r.proyecto === st.proy) &&
    activo(String(r.periodo).substring(0, 7)) &&
    (r.subagrupacion || '') !== '(desistimientos)'
  );

  const porMes = {};
  for (const r of CM_DATA) {
    if (st.proy !== 'TODOS' && r.proyecto !== st.proy) continue;
    const ym = String(r.periodo).substring(0, 7);
    if (!activo(ym)) continue;
    const o = porMes[ym] || (porMes[ym] = { res: 0, prom: 0, escr: 0, des: 0 });
    o.res += num(r[fRes]); o.prom += num(r[fProm]); o.escr += num(r[fEscr]); o.des += num(r[fDes]);
  }
  const meses = Object.keys(porMes).sort().reverse();

  const porProy = {};
  for (const r of filas) {
    const o = porProy[r.proyecto] || (porProy[r.proyecto] = { res: 0, prom: 0, escr: 0, des: 0 });
    o.res += num(r[fRes]); o.prom += num(r[fProm]); o.escr += num(r[fEscr]); o.des += num(r[fDes]);
  }

  const T = meses.reduce((a, m) => ({
    res: a.res + porMes[m].res, prom: a.prom + porMes[m].prom, escr: a.escr + porMes[m].escr, des: a.des + porMes[m].des
  }), { res: 0, prom: 0, escr: 0, des: 0 });

  const pills = mesesAll.map(ym =>
    `<button class="mes-pill${activo(ym) ? ' active' : ''}" onclick="cmToggleMes('${ym}')">${cmLblMes(ym)}</button>`).join('');
  const proyBtn = ['TODOS', ...PROYECTOS].map(p =>
    `<button class="chart-filter-btn${st.proy === p ? ' metric-active' : ''}" onclick="cmSet('proy','${String(p).replace(/'/g, "\\'")}')">${p === 'TODOS' ? 'Todos' : (PROY_LABEL[p] || p)}</button>`).join('');
  const mBtn = (v, t) => `<button class="chart-filter-btn${st.metric === v ? ' metric-active' : ''}" onclick="cmSet('metric','${v}')">${t}</button>`;

  const filaMes = (m, o, destacada) => `<tr${destacada ? ' class="total-row"' : ''}>
    <td class="left"><b>${destacada ? m : cmLblMes(m)}</b></td>
    <td class="c">${fmtM(o.res)}</td>
    <td class="c">${fmtM(o.prom)}</td>
    <td class="c">${fmtM(o.escr)}</td>
    <td class="c" style="color:${o.des ? '#E1093F' : '#999'}">${o.des ? '−' + fmtM(o.des) : '—'}</td>
  </tr>`;

  cont.innerHTML = `
  <div class="proj-box">
    <h3>Cierre de Mes</h3>
    <p class="nota" style="margin:2px 0 10px">Cierres oficiales congelados (tabla cierre_mensual). Cada mes se fija al cerrarse y no cambia con el snapshot vivo de las demás vistas. Solo lectura: acá no se ejecuta ni modifica ningún cierre.</p>
    <div class="chart-filters" style="margin-bottom:6px">
      <span class="filter-label">Proyecto</span><div class="filter-group">${proyBtn}</div>
      <span class="filter-label">Métrica</span><div class="filter-group">${mBtn('UN','Unidades')}${mBtn('UF','UF')}</div>
    </div>
    <div class="mes-pills-wrap">
      <div class="mes-pills-label">Meses <button class="chart-filter-btn" style="padding:1px 8px;font-size:9px" onclick="cmTodosMeses()">Todos</button></div>
      <div class="mes-pills">${pills}</div>
    </div>
  </div>

  <div class="proj-box" style="margin-top:12px">
    <h3>Por mes ${st.proy !== 'TODOS' ? '· ' + (PROY_LABEL[st.proy] || st.proy) : ''}</h3>
    <table class="sc-tip-tbl" style="width:100%">
      <thead><tr><th class="left">Mes</th><th class="c">Reservas</th><th class="c">Promesas</th><th class="c">Escrituras</th><th class="c">Desist.</th></tr></thead>
      <tbody>
        ${meses.map(m => filaMes(m, porMes[m])).join('')}
        ${filaMes('TOTAL', T, true)}
      </tbody>
    </table>
  </div>

  <div class="proj-box" style="margin-top:12px">
    <h3>Por proyecto ${st.meses ? '· ' + mesesSel.map(cmLblMes).join(', ') : '· todos los meses'}</h3>
    <table class="sc-tip-tbl" style="width:100%">
      <thead><tr><th class="left">Proyecto</th><th class="c">Reservas</th><th class="c">Promesas</th><th class="c">Escrituras</th><th class="c">Desist.</th></tr></thead>
      <tbody>
        ${Object.keys(porProy).sort().map(p => {
          const o = porProy[p];
          return `<tr>
            <td class="left"><b>${PROY_LABEL[p] || p}</b></td>
            <td class="c">${fmtM(o.res)}</td>
            <td class="c">${fmtM(o.prom)}</td>
            <td class="c">${fmtM(o.escr)}</td>
            <td class="c" style="color:${o.des ? '#E1093F' : '#999'}">${o.des ? '−' + fmtM(o.des) : '—'}</td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td class="left"><b>TOTAL</b></td>
          <td class="c"><b>${fmtM(T.res)}</b></td><td class="c"><b>${fmtM(T.prom)}</b></td>
          <td class="c"><b>${fmtM(T.escr)}</b></td>
          <td class="c" style="color:${T.des ? '#E1093F' : '#999'}"><b>${T.des ? '−' + fmtM(T.des) : '—'}</b></td>
        </tr>
      </tbody>
    </table>
    <p class="nota">Los desistimientos se muestran en negativo. "Origen": los meses cerrados por snapshot vienen del corte automático; los "manual" fueron cargados a mano.</p>
  </div>

  ${cmDetalle(mesesSel)}`;
}

// Detalle de operaciones promesadas en los meses seleccionados (una fila por unidad)
function cmDetalle(mesesSel) {
  const st = CM_STATE;
  const setMeses = new Set(mesesSel);
  const num = v => { const s = String(v == null ? '' : v).trim(); return (s && s !== '0') ? s : null; };
  // Cromático / Mirador Sta Teresita (aún en reserva, sin permiso de edificación aún)
  // muestran sus RESERVAS como promesas, fechadas por fecha_reserva; el resto usa fecha_promesa.
  const fechaEvento = d => {
    if (CM_RECLAS_PROY.includes(d.proyecto) && d.estado_corte === 'RESERVADO') return d.fecha_reserva;
    return (d.estado_corte === 'PROMESADO' || d.estado_corte === 'ESCRITURADO') ? d.fecha_promesa : null;
  };
  const filas = (CM_DET || []).map(d => ({ ...d, _fev: fechaEvento(d) })).filter(d => {
    if (st.proy !== 'TODOS' && d.proyecto !== st.proy) return false;
    const ym = String(d._fev || '').substring(0, 7);
    return ym && setMeses.has(ym);
  }).sort((a, b) => String(a._fev).localeCompare(String(b._fev)) ||
                    String(a.proyecto).localeCompare(String(b.proyecto)));

  if (!filas.length) {
    return `<div class="proj-box" style="margin-top:12px"><h3>Detalle de operaciones</h3>
      <p style="color:#999;padding:12px 0;font-size:12px">Sin promesas en los meses seleccionados para este filtro.</p></div>`;
  }
  const totUF = filas.reduce((a, d) => a + (parseFloat(d.precio_total_operacion_uf) || 0), 0);
  const rows = filas.map(d => `<tr>
    <td class="left">${PROY_LABEL[d.proyecto] || d.proyecto}</td>
    <td class="left">${d.subagrupacion || '—'}</td>
    <td class="c" style="font-weight:700">${d.propiedad || '—'}</td>
    <td class="c">${num(d.estacionamiento) || '—'}</td>
    <td class="c">${num(d.bodega) || '—'}</td>
    <td class="c" style="font-weight:700">${fmtUF(Math.round(parseFloat(d.precio_total_operacion_uf) || 0))}</td>
    <td class="left">${CM_VEND[String(d.id_producto)] || '—'}</td>
    <td class="c">${d._fev ? String(d._fev).substring(0,10).split('-').reverse().join('/') : '—'}${CM_RECLAS_PROY.includes(d.proyecto) && d.estado_corte==='RESERVADO' ? ' <span style="color:#B8860B;font-size:9px">(res→prom)</span>' : ''}</td>
  </tr>`).join('');

  return `<div class="proj-box" style="margin-top:12px">
    <h3>Detalle de operaciones · ${mesesSel.map(cmLblMes).join(', ')}</h3>
    <div style="overflow-x:auto"><table class="sc-tip-tbl" style="width:100%">
      <thead><tr>
        <th class="left">Proyecto</th><th class="left">Etapa</th><th class="c">Unidad</th><th class="c">N° Estac.</th><th class="c">N° Bodega</th>
        <th class="c">Monto UF</th><th class="left">Vendedor</th><th class="c">Fecha promesa</th>
      </tr></thead>
      <tbody>${rows}
        <tr class="total-row"><td class="left"><b>TOTAL (${filas.length} operaciones)</b></td><td></td><td></td><td></td><td></td>
          <td class="c"><b>${fmtUF(Math.round(totUF))}</b></td><td></td><td></td></tr>
      </tbody>
    </table></div>
    <p class="nota">Unidades con promesa en el/los mes(es) seleccionado(s). En Cromático y Mirador Sta Teresita las reservas se cuentan como promesas (marcadas "res→prom"). N° estac./bodega desde ventas_pok; vendedor desde reservas_pok (última extracción).</p>
  </div>`;
}

function goResSec(sec) {
  const btns = document.querySelectorAll('.sidenav-btn');
  for (const b of btns) {
    const oc = b.getAttribute('onclick') || '';
    if (oc.includes("'" + sec + "'")) {
      showResSec(sec, b);
      b.scrollIntoView({ block: 'nearest' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  }
}

async function init() {
  try {
    // 1. Catálogo de proyectos desde proyectos_pok (vigente=true)
    await fetchProyectos();

    // 2. Datos del snapshot más reciente
    const { fecha_corte, fecha_corte_actual, overrideCorte, data, data_mov, secDisp, secVendidoRaw, subConfig, vendData, desisData, hitosData, cotizData, promSinFirma } = await fetchAll();
    ALL_PROM_SIN_FIRMA = promSinFirma || [];
    CORTE_STR = fecha_corte;   // para el export PPTX (corte del informe)
    // Mapa de anclas de escrituración (inicio escrituración por proyecto+subagrupación)
    ANCLA_ESCR = {};
    for (const h of (hitosData || [])) {
      if (h.fecha_inicio_escrituracion)
        ANCLA_ESCR[h.proyecto + '|' + (h.subagrupacion || '')] = h.fecha_inicio_escrituracion;
    }
    // mapa id_producto → nombre_vendedor (excluyendo virtuales)
    const vendedorMap = {};
    for (const v of (vendData || [])) {
      if (v.nombre_vendedor && !v.nombre_vendedor.toUpperCase().includes('VIRTUAL'))
        vendedorMap[String(v.id_producto)] = v.nombre_vendedor;
    }
    setLoading('Cargando presupuesto…');

    // 3. Metas del mes y YTD desde presupuesto_comercial
    const fecha_corte_mes = corteMesInforme(fecha_corte);  // mes que reporta el informe
    METAS = await fetchMetas(fecha_corte_mes);
    METAS_YTD = await fetchMetasYTD(fecha_corte_mes);
    // Presupuesto anual completo + cierres mensuales (real oficial) para el Acumulado
    const yr_acum = fecha_corte_mes.substring(0,4);
    await fetchPresupuestoAnual(yr_acum);
    await fetchCierreMensual(yr_acum);
    await fetchMarcadas();  // reservas marcadas para la proyección de cierre (compartidas)
    await fetchTerrazas();  // superficie de terraza por unidad (UF/m² del Scanner)
    setLoading('Calculando KPIs…');

    // Fecha del header "Datos al" = fecha del último snapshot cargado (fecha_corte_actual).
    // Refleja la frescura real de los datos: aunque el corte esté congelado en junio, los
    // movimientos se actualizan con cada extracción y capturan ingresos con fecha retro.
    const _fRep = new Date((fecha_corte_actual || fecha_corte) + 'T12:00:00');
    const hd = String(_fRep.getDate()).padStart(2,'0');
    const hm = String(_fRep.getMonth()+1).padStart(2,'0');
    const hy = _fRep.getFullYear();
    document.getElementById('hdr-fecha').textContent = hd + '/' + hm + '/' + hy;

    // Calcular desistimientos de promesas por mes y YTD
    const corteD0 = new Date(fecha_corte_mes + 'T12:00:00');
    const mesYM0  = fecha_corte_mes.slice(0, 7);
    const yr0     = corteD0.getFullYear();
    const desisMes = {}, desisYtd = {};
    let totDesisMesUN = 0, totDesisMesUF = 0;
    let totDesisYtdUN = 0, totDesisYtdUF = 0;
    const desisHistoria = {}; // { 'YYYY-MM': { total: N, proyectos: { p: {UN,UF} } } }

    for (const d of (desisData || [])) {
      if (!d.fecha_cancelacion) continue;
      const fc = d.fecha_cancelacion.slice(0, 10);
      const ym = fc.slice(0, 7);
      const uf = parseFloat(d.precio_uf) || 0;
      const p  = d.proyecto || '(Sin proyecto)';

      // Acumulado historia (todos)
      if (!desisHistoria[ym]) desisHistoria[ym] = { UN: 0, UF: 0, por_proyecto: {} };
      desisHistoria[ym].UN++;
      desisHistoria[ym].UF += uf;
      if (!desisHistoria[ym].por_proyecto[p]) desisHistoria[ym].por_proyecto[p] = { UN: 0, UF: 0 };
      desisHistoria[ym].por_proyecto[p].UN++;
      desisHistoria[ym].por_proyecto[p].UF += uf;

      // Mes actual
      if (ym === mesYM0) {
        totDesisMesUN++; totDesisMesUF += uf;
        if (!desisMes[p]) desisMes[p] = { UN: 0, UF: 0 };
        desisMes[p].UN++; desisMes[p].UF += uf;
      }
      // YTD
      if (ym.slice(0, 4) === String(yr0)) {
        totDesisYtdUN++; totDesisYtdUF += uf;
        if (!desisYtd[p]) desisYtd[p] = { UN: 0, UF: 0 };
        desisYtd[p].UN++; desisYtd[p].UF += uf;
      }
    }

    ALL_DATA     = data;      // estado portafolio al cierre del período
    ALL_DATA_MOV = data_mov;  // snapshot actual para movimientos del mes
    ALL_DESIS    = desisData || [];  // cancelaciones crudas para la página Desistimientos
    ALL_COTIZ    = cotizData || [];  // cotizaciones crudas para la pestaña Cotizaciones
    CORTE_DATE = new Date(fecha_corte_mes);  // referencia para velocidad de venta
    // Set de subagrupaciones con Scanner habilitado (subagrupaciones_config.tiene_scanner)
    SC_SCANNER = new Set(
      (subConfig || [])
        .filter(sc => sc.tiene_scanner === true)
        .map(sc => sc.proyecto + '|' + sc.subagrupacion)
    );
    const { port, mov, movSub, ytd, ytdSub, agingRes, agingResSub, agingProm, agingPromSub, detalle, vel, secDispBySub, secVendidoBySub } = compute(data, data_mov, fecha_corte_mes, secDisp, subConfig, secVendidoRaw, promSinFirma);
    SEC_DISP = secDispBySub;   // expuesto para el resumen PxQ del Scanner

    // Rellena los meses ya terminados que no tienen cierre oficial, para que la
    // serie del Acumulado Año nunca salte un mes (ver injectMesesSinCierre).
    injectMesesSinCierre(fecha_corte_mes.slice(0, 7));

    setLoading('Renderizando…');
    renderResumen(fecha_corte_mes, port, mov, movSub, ytd, ytdSub, vendedorMap,
      { desisMes, desisYtd, desisHistoria, totDesisMesUN, totDesisMesUF, totDesisYtdUN, totDesisYtdUF });
    renderReservas(agingRes, agingResSub, agingProm, agingPromSub);

    // Proyectos individuales — dinámico según proyectos_pok vigente=true
    for (const nombre_pok of PROYECTOS) {
      renderProyecto('tab-' + PROY_TAB[nombre_pok], nombre_pok, detalle, port, vel, null, secDispBySub, secVendidoBySub);
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

  } catch(err) {
    document.getElementById('loading').innerHTML =
      `<div class="error-box" style="max-width:500px;margin:40px auto">
        <strong>Error al cargar datos</strong><br><br>${err.message}<br><br>
        Verifica la conexión a internet y que Supabase esté disponible.
      </div>`;
  }
}
