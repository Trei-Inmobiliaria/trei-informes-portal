<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// El informe ya no lleva ninguna llave: las consultas pasan por el worker de
// trei.cl, que agrega las credenciales del lado del servidor segun quien haya
// iniciado sesion en Microsoft. Asi la base sabe quien pregunta y puede
// filtrar por rol y por proyecto.
const SB_URL = '/informe_ventas/db';
const HEADERS = {};

// Proyectos — cargados dinámicamente desde proyectos_pok (vigente=true)
let PROYECTOS  = [];   // ['PLAZA LOS PINOS', ...]
let PROY_LABEL = {};   // { 'PLAZA LOS PINOS': 'Plaza Los Pinos', ... }
let PROY_TAB   = {};   // { 'PLAZA LOS PINOS': 'plp', ... }
let PROY_ESTADO= {};   // { 'PLAZA LOS PINOS': 'Escrituración', ... } — para el PPTX
let CORTE_STR  = '';   // fecha_corte (ISO) del informe, para el PPTX

// METAS cargado dinámicamente desde presupuesto_comercial (ver fetchMetas)
let METAS = null;
let METAS_YTD = null;

// ── Resumen Mes: datos precalculados + estado de los toggles Un/UF ────────────
let RESUMEN_MES_DATA = null;     // poblado en renderResumen()
let RES_RES_METRIC   = 'UN';     // 'UN' | 'UF' — cuadro Reservas Mes
let RES_PROM_METRIC  = 'UN';     // 'UN' | 'UF' — cuadro Promesas Mes
let RES_ESCR_METRIC  = 'UN';     // 'UN' | 'UF' — cuadro Escrituras Mes

// ── Proyección de cierre: backlog de reservas + marcas (compartidas vía Supabase) ──
let RES_BACKLOG_LIST = [];         // reservas vigentes al corte: [{id,proyecto,subagrupacion,propiedad,nombre,apellidos,uf,fecha_reserva}]
let PROY_MARCADAS    = new Set();  // id_producto de reservas marcadas como probable-promesa
let PROY_FILTER      = 'TODOS';    // filtro de proyecto en la vista Proyección Cierre

async function fetchProyectos() {
  setLoading('Cargando catálogo de proyectos…');
  const r = await fetch(
    `${SB_URL}/rest/v1/proyectos_pok?select=nombre_pok,nombre_display,tab_id,estado&vigente=eq.true&order=orden.asc`,
    { headers: HEADERS }
  );
  if (!r.ok) throw new Error('Error cargando proyectos_pok: ' + r.status);
  const rows = await r.json();

  PROYECTOS  = rows.map(p => p.nombre_pok);
  rows.forEach(p => {
    PROY_LABEL[p.nombre_pok] = p.nombre_display;
    PROY_TAB[p.nombre_pok]   = p.tab_id;
    PROY_ESTADO[p.nombre_pok]= p.estado;
  });

  // Generar el <select> de proyectos y sus content divs dinámicamente, dentro de
  // la pestaña "PROYECTOS" (#tab-proyectos / #proy-content-wrap). Ya no se genera
  // un .tab por proyecto: se navega entre proyectos con el desplegable.
  const tabsEl   = document.getElementById('tabs');
  const proySel  = document.getElementById('proy-select');
  const proyWrap = document.getElementById('proy-content-wrap');
  rows.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.tab_id;
    opt.textContent = p.nombre_display.toUpperCase();
    proySel.appendChild(opt);

    const div = document.createElement('div');
    div.id = 'tab-' + p.tab_id;
    div.className = 'proy-content';
    div.style.display = 'none';
    proyWrap.appendChild(div);
  });
  if (rows.length) { proySel.value = rows[0].tab_id; selectProyecto(rows[0].tab_id); }

}

// Cambia de proyecto dentro de la pestaña "Proyectos" (llamado por el <select>).
function selectProyecto(tabId){
  document.querySelectorAll('.proy-content').forEach(d => d.style.display = 'none');
  const el = document.getElementById('tab-' + tabId);
  if (el) el.style.display = '';
  const sel = document.getElementById('proy-select');
  if (sel && sel.value !== tabId) sel.value = tabId;
  // Chart.js dibuja a 0px si el canvas se creó oculto: forzar resize al mostrar el proyecto
  const _tid = 'tab-' + tabId;
  ['donut-un-','donut-uf-'].forEach(p=>{ const c=PROY_DONUT_CHARTS[p+_tid]; if(c) c.resize(); });
  if (HIST_CHARTS[_tid]) HIST_CHARTS[_tid].resize();
  resizePenetracion(_tid);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt  = n => n == null ? '—' : Math.round(n).toLocaleString('es-CL');
const fmtUF= n => n == null || n === 0 ? '—' : Math.round(n).toLocaleString('es-CL');
const fmtMUF=n => n == null || n === 0 ? '—' : (Math.round(n/1000)).toLocaleString('es-CL');
// Los campos "estacionamiento"/"bodega" pueden traer varios secundarios
// separados por coma (ej. "E-146, E-147, E-149") cuando el negocio tiene mas
// de uno asociado. countSecNames() cuenta cuantos hay realmente, en vez de
// tratar el campo como "una unidad, si o no".
const countSecNames = s => {
  if (s === null || s === undefined) return 0;
  const t = String(s).trim();
  if (t === '') return 0;
  return t.split(',').map(x => x.trim()).filter(Boolean).length;
};
function toggleSub(groupId) {
  const rows = document.querySelectorAll('.' + groupId);
  const icon = document.getElementById('icon-' + groupId);
  const hidden = rows[0] && rows[0].style.display === 'none';
  rows.forEach(r => r.style.display = hidden ? '' : 'none');
  if (icon) icon.textContent = hidden ? '▼' : '▶';
}
const metaBar = (val, meta, esUF) => {
  if (!meta) return '';
  const p = Math.min(100, Math.round(val / meta * 100));
  const c = p >= 80 ? '#00B050' : p >= 50 ? '#FFC000' : '#E1093F';
  const tc = p >= 80 ? '#90EE90' : p >= 50 ? '#FFD580' : '#FF8080';
  const metaLbl = esUF ? fmtUF(meta) + ' UF' : meta + ' un';
  return '<div style="margin-top:8px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
    + '<span style="font-size:10px;font-weight:500;color:' + tc + '">' + p + '%</span>'
    + '<span style="font-size:9px;opacity:0.55">/ ' + metaLbl + '</span>'
    + '</div>'
    + '<div style="background:rgba(0,0,0,0.08);border-radius:3px;height:4px;overflow:hidden">'
    + '<div style="width:' + p + '%;height:100%;background:' + c + ';border-radius:3px"></div>'
    + '</div></div>';
};
const pct  = (a,b) => b ? Math.round(a/b*100) : 0;
const daysDiff = (d1,d2) => Math.floor((d2-d1)/(1000*60*60*24));

function setLoading(msg) { document.getElementById('loading-text').textContent = msg; }

function barColor(p) {
  if (p >= 70) return '#006400';
  if (p >= 40) return '#111111';
  return '#E1093F';
}

function bar(p, color) {
  color = color || barColor(p);
  return `<div class="bar-wrap">
    <div class="bar-bg"><div class="bar-inner" style="width:${p}%;background:${color}"></div></div>
    <div class="bar-label" style="color:${color}">${p}%</div>
  </div>`;
}

// ─── FETCH ───────────────────────────────────────────────────────────────────
async function fetchMetas(fecha_corte) {
  // Consulta presupuesto_comercial filtrando por el mes del corte
  const mes   = fecha_corte.substring(0, 7);   // 'YYYY-MM'
  const desde = mes + '-01';
  // Último día real del mes (evita error con meses de 28/29/30 días)
  const _d = new Date(fecha_corte + 'T12:00:00');
  const _lastDay = new Date(_d.getFullYear(), _d.getMonth() + 1, 0).getDate();
  const hasta = mes + '-' + String(_lastDay).padStart(2, '0');
  const r = await fetch(
    `${SB_URL}/rest/v1/presupuesto_comercial?select=tipo,tipo2,venta_ppto` +
    `&fecha=gte.${desde}&fecha=lte.${hasta}`,
    { headers: HEADERS }
  );
  if (!r.ok) throw new Error('Error cargando presupuesto_comercial: ' + r.status);
  const rows = await r.json();
  // tipo='Promesas'  tipo2='UN'|'UF'  → meta promesas (Venta + Pre-Venta sumadas)
  // tipo='Escrituras' tipo2='UN'|'UF' → meta escrituras
  const sum = (t, t2) => rows
    .filter(x => x.tipo === t && x.tipo2 === t2)
    .reduce((a, x) => a + (parseFloat(x.venta_ppto) || 0), 0);
  return {
    promUN: Math.round(sum('Promesas',   'UN')),
    promUF: Math.round(sum('Promesas',   'UF')),
    escrUN: Math.round(sum('Escrituras', 'UN')),
    escrUF: Math.round(sum('Escrituras', 'UF')),
  };
}

async function fetchMetasYTD(fecha_corte) {
  // Suma el presupuesto de enero al mes anterior al corte
  const corteD   = new Date(fecha_corte + 'T12:00:00');
  const prevEnd  = new Date(corteD.getFullYear(), corteD.getMonth(), 0); // último día mes anterior
  const ytdStart = corteD.getFullYear() + '-01-01';
  const ytdEnd   = prevEnd.getFullYear() + '-'
    + String(prevEnd.getMonth()+1).padStart(2,'0') + '-'
    + String(prevEnd.getDate()).padStart(2,'0');
  const r = await fetch(
    `${SB_URL}/rest/v1/presupuesto_comercial?select=tipo,tipo2,venta_ppto` +
    `&fecha=gte.${ytdStart}&fecha=lte.${ytdEnd}`,
    { headers: HEADERS }
  );
  if (!r.ok) throw new Error('Error cargando presupuesto YTD: ' + r.status);
  const rows = await r.json();
  const sum = (t, t2) => rows
    .filter(x => x.tipo === t && x.tipo2 === t2)
    .reduce((a, x) => a + (parseFloat(x.venta_ppto) || 0), 0);
  return {
    promUN: Math.round(sum('Promesas',   'UN')),
    promUF: Math.round(sum('Promesas',   'UF')),
    escrUN: Math.round(sum('Escrituras', 'UN')),
    escrUF: Math.round(sum('Escrituras', 'UF')),
  };
}

// ── FIX 07-09-2026: canceladas_pok.tipo='PROMESA' nunca ha tenido datos ──────
// (defecto de origen en PlanOk: los 349 registros históricos de canceladas_pok
// están etiquetados tipo='RESERVA', incluidas ~135 promesas reales canceladas
// que sí tienen fecha_promesa). fetchAll() amplía el filtro para capturarlas y
// esta función rescata el precio_uf cuando viene vacío (pasa en ~92 de esos
// 135 casos), buscando el último snapshot de ventas_pok en que la unidad
// figuraba PROMESADO y cruzando por fecha_promesa exacta + que esa última
// fecha_corte coincida con la fecha_cancelacion. Solo asigna precio cuando el
// cruce da un único candidato, para no atribuir UF a la unidad equivocada —
// la unidad igual queda contada aunque no se pueda rescatar el precio.
async function rescatePreciosDesistimientos(desisData) {
  const faltantes = (desisData || []).filter(d => d.precio_uf == null && d.fecha_promesa);
  if (!faltantes.length) return desisData;

  const fechas = [...new Set(faltantes.map(d => d.fecha_promesa))];
  const listaFechas = fechas.map(f => `"${f}"`).join(',');
  const rProm = await fetch(
    `${SB_URL}/rest/v1/ventas_pok?select=proyecto,propiedad,nombre,apellidos,fecha_promesa,` +
    `precio_total_operacion_uf,fecha_corte&estado_corte=eq.PROMESADO&fecha_promesa=in.(${listaFechas})&order=fecha_corte.desc`,
    { headers: { ...HEADERS, 'Prefer': 'count=none', 'Range': '0-4999' } }
  );
  if (!rProm.ok) return desisData;
  const candidatos = await rProm.json();

  // último snapshot PROMESADO por unidad (proyecto+propiedad+nombre+apellidos+fecha_promesa)
  const ultimoPorUnidad = new Map();
  for (const c of candidatos) {
    const key = [c.proyecto, c.propiedad, c.nombre, c.apellidos, c.fecha_promesa].join('|');
    const prev = ultimoPorUnidad.get(key);
    if (!prev || c.fecha_corte > prev.fecha_corte) ultimoPorUnidad.set(key, c);
  }
  const porFechaYCorte = new Map(); // fecha_promesa+fecha_corte -> [candidatos]
  for (const c of ultimoPorUnidad.values()) {
    const k = c.fecha_promesa + '|' + c.fecha_corte;
    if (!porFechaYCorte.has(k)) porFechaYCorte.set(k, []);
    porFechaYCorte.get(k).push(c);
  }

  for (const d of faltantes) {
    const k = d.fecha_promesa + '|' + d.fecha_cancelacion;
    const cands = (porFechaYCorte.get(k) || []).filter(c => !d.proyecto || c.proyecto === d.proyecto);
    if (cands.length === 1) {
      d.precio_uf = cands[0].precio_total_operacion_uf;
      if (!d.proyecto) d.proyecto = cands[0].proyecto;
    }
  }
  return desisData;
}

async function fetchAll() {
  // 1. CORTE = último snapshot cargado (auto-sigue la actualización del pipeline).
  //    config_reporte.fecha_corte es un OVERRIDE opcional: si trae una fecha, el
  //    informe se "congela" a ese corte (para cierres de fin de mes). Si está
  //    vacío/null, el informe sigue siempre el último dato cargado.
  setLoading('Obteniendo fecha de corte…');
  const r1 = await fetch(`${SB_URL}/rest/v1/ventas_pok?select=fecha_corte&order=fecha_corte.desc&limit=1`, { headers: HEADERS });
  if (!r1.ok) throw new Error('Error conectando a Supabase: ' + r1.status);
  const [rowLast] = await r1.json();
  let fecha_corte = rowLast.fecha_corte;
  // 2. Override opcional: solo si config_reporte trae una fecha, congela el corte ahí.
  let overrideCorte = null;   // si config_reporte trae fecha => informe congelado a ese corte
  const rCfg = await fetch(`${SB_URL}/rest/v1/config_reporte?select=fecha_corte&order=id.desc&limit=1`, { headers: HEADERS });
  if (rCfg.ok) {
    const cfgRows = await rCfg.json();
    if (cfgRows.length > 0 && cfgRows[0].fecha_corte) {
      overrideCorte = cfgRows[0].fecha_corte;
      fecha_corte = overrideCorte;
    }
  }

  // 2. all data for that date — paginado para superar límite de 1.000 filas de Supabase
  setLoading(`Cargando ${fecha_corte}…`);
  const PAGE = 1000;
  let data = [], offset = 0, hasMore = true;
  while (hasMore) {
    const r2 = await fetch(
      `${SB_URL}/rest/v1/ventas_pok?select=proyecto,subagrupacion,estado_corte,precio_total_operacion_uf,precio_base_uf,precio_lista_uf,fecha_reserva,fecha_promesa,fecha_escritura,estacionamiento,bodega,precio_estacionamiento_uf,precio_bodega_uf,piso,modelo,programa,m2,m2_terraza,nombre,apellidos,propiedad,id_producto&fecha_corte=eq.${fecha_corte}`,
      { headers: { ...HEADERS, 'Range': `${offset}-${offset + PAGE - 1}`, 'Prefer': 'count=none' } }
    );
    if (!r2.ok) throw new Error('Error cargando datos: ' + r2.status);
    const batch = await r2.json();
    data = data.concat(batch);
    hasMore = batch.length === PAGE;
    offset += PAGE;
  }
  // 3. secundarios disponibles — PAGINADO (Supabase topa en 1.000 filas por request, aun con Range)
  let secDisp = [], secOffset = 0, secHasMore = true;
  while (secHasMore) {
    const rSec = await fetch(
      `${SB_URL}/rest/v1/secundarios_disponibles_pok?select=proyecto,tipo,subagrupacion,precio_lista_uf,precio_base_uf&fecha_corte=eq.${fecha_corte}`,
      { headers: { ...HEADERS, 'Range': `${secOffset}-${secOffset + PAGE - 1}`, 'Prefer': 'count=none' } }
    );
    if (!rSec.ok) throw new Error('Error cargando secundarios: ' + rSec.status);
    const batch = await rSec.json();
    secDisp = secDisp.concat(batch);
    secHasMore = batch.length === PAGE;
    secOffset += PAGE;
  }

  // 4. subagrupaciones_config — estados por subagrupación
  const rSubCfg = await fetch(
    `${SB_URL}/rest/v1/subagrupaciones_config?select=proyecto,subagrupacion,estado_comercial,tiene_scanner&vigente=eq.true`,
    { headers: HEADERS }
  );
  if (!rSubCfg.ok) throw new Error('Error cargando subagrupaciones_config: ' + rSubCfg.status);
  const subConfig = await rSubCfg.json();

  // 5. Vendedores desde reservas_pok — usar MAX(fecha_extraccion), no el corte configurado
  //    El pipeline carga reservas_pok con fecha de hoy; config_reporte puede apuntar a una fecha anterior
  const rMaxFE = await fetch(
    `${SB_URL}/rest/v1/reservas_pok?select=fecha_extraccion&order=fecha_extraccion.desc&limit=1`,
    { headers: HEADERS }
  );
  const maxFERows = rMaxFE.ok ? await rMaxFE.json() : [];
  const max_fe = maxFERows.length > 0 ? maxFERows[0].fecha_extraccion : fecha_corte;
  const rVend = await fetch(
    `${SB_URL}/rest/v1/reservas_pok?select=id_producto,nombre_vendedor&tipo_producto=eq.PRINCIPAL&fecha_extraccion=eq.${max_fe}`,
    { headers: { ...HEADERS, 'Prefer': 'count=none', 'Range': '0-1999' } }
  );
  const vendData = rVend.ok ? await rVend.json() : [];

  // 6. Desistimientos de promesas (para venta neta)
  //    FIX 07-09-2026: se amplia el filtro para incluir canceladas_pok con
  //    tipo='RESERVA' que tienen fecha_promesa (promesas reales mal etiquetadas
  //    en el origen — ver rescatePreciosDesistimientos arriba). El precio_uf
  //    vacio de esos casos se rescata desde ventas_pok despues del fetch.
  const rDesis = await fetch(
    `${SB_URL}/rest/v1/canceladas_pok?select=proyecto,etapa,fecha_cancelacion,precio_uf,accion,motivo,tipo,fecha_promesa` +
    `&or=(tipo.eq.PROMESA,and(tipo.eq.RESERVA,fecha_promesa.not.is.null))&order=fecha_cancelacion.desc`,
    { headers: { ...HEADERS, 'Prefer': 'count=none', 'Range': '0-999' } }
  );
  let desisData = rDesis.ok ? await rDesis.json() : [];
  desisData = await rescatePreciosDesistimientos(desisData);
  // 6b. Hitos de escrituración (RM / inicio escrituración) por proyecto+subagrupación
  const rHitos = await fetch(
    `${SB_URL}/rest/v1/hitos_escrituracion?select=proyecto,subagrupacion,fecha_recepcion_municipal,fecha_inicio_escrituracion`,
    { headers: HEADERS }
  );
  const hitosData = rHitos.ok ? await rHitos.json() : [];


  // 7. Snapshot más reciente para movimientos del mes
  //    Los movimientos siempre se calculan sobre la foto más actual porque
  //    las operaciones pueden ingresarse con fecha retro en el CRM.
  setLoading('Cargando movimientos del mes (snapshot actual)…');
  const rLatest = await fetch(
    `${SB_URL}/rest/v1/ventas_pok?select=fecha_corte&order=fecha_corte.desc&limit=1`,
    { headers: HEADERS }
  );
  // IMPORTANTE: los movimientos del mes SIEMPRE se calculan sobre el snapshot más
  // reciente (aunque el corte esté congelado por override), para capturar operaciones
  // ingresadas con fecha retro — p.ej. una promesa fechada en junio que se ingresa en
  // julio. El filtro por mes/fecha (inMonthFull vs fecha_corte) las mantiene dentro del
  // período congelado. Por eso NO se congela fecha_corte_actual al override.
  const fecha_corte_actual = rLatest.ok ? (await rLatest.json())[0].fecha_corte : fecha_corte;

  let data_mov = data; // por defecto usar misma data
  if (fecha_corte_actual !== fecha_corte) {
    // Hay un snapshot más nuevo — usarlo para movimientos
    let movOffset = 0, movMore = true;
    data_mov = [];
    while (movMore) {
      const rMov = await fetch(
        `${SB_URL}/rest/v1/ventas_pok?select=proyecto,subagrupacion,estado_corte,precio_total_operacion_uf,precio_base_uf,fecha_reserva,fecha_promesa,fecha_escritura,estacionamiento,bodega,precio_estacionamiento_uf,precio_bodega_uf,piso,modelo,programa,m2,m2_terraza,nombre,apellidos,propiedad,id_producto&fecha_corte=eq.${fecha_corte_actual}`,
        { headers: { ...HEADERS, 'Range': `${movOffset}-${movOffset + PAGE - 1}`, 'Prefer': 'count=none' } }
      );
      if (!rMov.ok) { data_mov = data; break; } // fallback si falla
      const movBatch = await rMov.json();
      data_mov = data_mov.concat(movBatch);
      movMore = movBatch.length === PAGE;
      movOffset += PAGE;
    }
  }

  // ── Normalización subagrupación: colapsar subagrupaciones por edificio ──
  // Mirador Sta Teresita viene de PlanOk con 15 subagrupaciones ("EDIFICIO 1..15").
  // Para el reporte se colapsan en una sola ("DEPARTAMENTOS"). La base mantiene
  // el detalle por edificio; esto es solo presentación. Si a futuro se quiere el
  // Scanner por edificio, basta no normalizar para ese proyecto.
  const COLAPSAR_SUB = { 'MIRADOR SANTA TERESITA': 'DEPARTAMENTOS' };
  const _normSub = rows => { if (Array.isArray(rows)) rows.forEach(r => {
    const dest = COLAPSAR_SUB[r.proyecto];
    // Se guarda la subagrupacion original: el Scanner de Mirador la necesita para
    // saber a que edificio pertenece cada depto. El resto del informe sigue usando
    // la colapsada, asi que no cambia nada de lo que ya se ve.
    if (dest) { r.subagrupacion_real = r.subagrupacion; r.subagrupacion = dest; }
  }); };
  _normSub(data); _normSub(data_mov); _normSub(secDisp);

  // ── EXCEPCIÓN: secundarios de la Placa Comercial (PLP) informados como
  // "disponibles" por PlanOk pero comercialmente vendidos junto con los locales.
  // Se sacan de secDisp (para que no cuenten como stock disponible) y se
  // acumulan aparte en secVendidoRaw -> compute() los suma al vendido.
  // Quitar esta regla cuando PlanOk los entregue correctamente clasificados.
  const SEC_COMO_VENDIDOS = { 'PLAZA LOS PINOS': ['PLACA COMERCIAL'] };
  const _esSecVendido = r => (SEC_COMO_VENDIDOS[r.proyecto] || []).includes(r.subagrupacion || '');
  const secVendidoRaw = (secDisp || []).filter(_esSecVendido);
  secDisp = (secDisp || []).filter(r => !_esSecVendido(r));

  // ── Valorización de DISPONIBLES a PRECIO BASE (regla Trei) ──────────────────
  // Las unidades PRINCIPALES disponibles se valorizan a precio_base_uf en TODO el
  // informe. Se sobreescribe precio_total_operacion_uf (que para disponibles traía
  // precio lista) por el precio base. Fallback a lista si base viene en 0/null
  // (hoy afecta 3 deptos de Plaza Los Pinos sin base cargada, para no mostrar 0 UF).
  // Vendidas NO se tocan (mantienen precio efectivo). Secundarios disponibles
  // quedan a precio lista (precio_base no cargado en el pipeline aún).
  const _dispABase = rows => { if (Array.isArray(rows)) rows.forEach(r => {
    if (r.estado_corte === 'DISPONIBLE') {
      const base = parseFloat(r.precio_base_uf) || 0;
      if (base > 0) r.precio_total_operacion_uf = base;
    }
  }); };
  _dispABase(data); _dispABase(data_mov);

  // 8. Cotizaciones (cotizaciones_pok) — pestaña Cotizaciones. Se usa el snapshot más
  //    reciente (fecha_extraccion), paginado igual que el resto de tablas grandes.
  setLoading('Cargando cotizaciones…');
  let cotizData = [];
  try {
    const rCotFE = await fetch(`${SB_URL}/rest/v1/cotizaciones_pok?select=fecha_extraccion&order=fecha_extraccion.desc&limit=1`, { headers: HEADERS });
    const cotFERows = rCotFE.ok ? await rCotFE.json() : [];
    const cot_fe = cotFERows.length ? cotFERows[0].fecha_extraccion : null;
    if (cot_fe) {
      let cotOffset = 0, cotMore = true;
      while (cotMore) {
        const rCot = await fetch(
          `${SB_URL}/rest/v1/cotizaciones_pok?select=proyecto,sub_agrupacion,programa,medio_llegada,fecha_cotizacion&fecha_extraccion=eq.${cot_fe}`,
          { headers: { ...HEADERS, 'Range': `${cotOffset}-${cotOffset + PAGE - 1}`, 'Prefer': 'count=none' } }
        );
        if (!rCot.ok) break;
        const cotBatch = await rCot.json();
        cotizData = cotizData.concat(cotBatch);
        cotMore = cotBatch.length === PAGE;
        cotOffset += PAGE;
      }
      // Mirador Sta Teresita: cotizaciones_pok usa el campo "sub_agrupacion" (con guión bajo);
      // se colapsa igual que en ventas_pok para consistencia de etiquetas.
      for (const r of cotizData) { if (COLAPSAR_SUB[r.proyecto]) r.sub_agrupacion = COLAPSAR_SUB[r.proyecto]; }
    }
  } catch (e) { /* cotizaciones es un nice-to-have: si falla, la pestaña queda vacía sin romper el resto del informe */ }

  // 9. Promesas emitidas cuya firma del comprador todavia no se carga en PlanOk
  //    (vista v_promesas_sin_firma). PlanOk mueve la unidad a PROMESADO recien
  //    cuando alguien carga ese hito, y eso puede tardar dias: mientras tanto la
  //    operacion sigue figurando RESERVADO en ventas_pok y el informe no la ve,
  //    aunque la promesa ya se emitio. Se suman a los movimientos del mes por su
  //    fecha de emision. Si la vista falla, queda vacio y el informe se comporta
  //    exactamente como antes.
  setLoading('Cargando promesas por firmar...');
  let promSinFirma = [];
  try {
    const rPSF = await fetch(
      SB_URL + '/rest/v1/v_promesas_sin_firma?select=id_promesa,id_producto,proyecto,subagrupacion,producto,cliente,total_venta_uf,fecha_evento,dias_sin_firma,borrador_usuario&order=fecha_evento.asc',
      { headers: { ...HEADERS, 'Range': '0-999', 'Prefer': 'count=none' } }
    );
    if (rPSF.ok) promSinFirma = await rPSF.json();
  } catch (e) { /* si falla, el informe queda como estaba */ }
  _normSub(promSinFirma);

  return { fecha_corte, fecha_corte_actual, overrideCorte, data, data_mov, secDisp, secVendidoRaw, subConfig, vendData, desisData, hitosData, cotizData, promSinFirma };
}

// ─── AGGREGATIONS ────────────────────────────────────────────────────────────


// ─── MES DE REFERENCIA DEL INFORME ───────────────────────────────────────────
// Durante los primeros DIAS_HABILES_CIERRE días hábiles (lun–vie) del mes, el
// informe sigue reportando el mes anterior: da tiempo a que entren promesas y
// escrituras con fecha retro y a que se ejecute cerrar_mes(). Al día hábil
// siguiente pasa al mes nuevo. NO altera el snapshot de datos (fecha_corte),
// solo el mes que las vistas de "mes en curso" consideran vigente.
const DIAS_HABILES_CIERRE = 3;
function corteMesInforme(fecha_corte) {
  if (!fecha_corte) return fecha_corte;
  const s = String(fecha_corte).substring(0, 10);
  const d = new Date(s + 'T12:00:00');
  let habiles = 0;
  for (let dia = 1; dia <= d.getDate(); dia++) {
    const dow = new Date(d.getFullYear(), d.getMonth(), dia).getDay();
    if (dow !== 0 && dow !== 6) habiles++;
  }
  if (habiles > DIAS_HABILES_CIERRE) return s;
  const fin = new Date(d.getFullYear(), d.getMonth(), 0);  // último día del mes anterior
  return fin.getFullYear() + '-' + String(fin.getMonth() + 1).padStart(2, '0')
       + '-' + String(fin.getDate()).padStart(2, '0');
}

function inMonthFull(dateFieldStr, corte) {
  // Movimientos del mes HASTA el corte: mismo mes Y fecha <= fecha_corte.
  // Consistente con Detalle Operaciones (inMes): los eventos posteriores al
  // corte (ej. reservas del 07-jun con corte 06-jun) NO cuentan en el cierre.
  if (!dateFieldStr) return false;
  const d = dateFieldStr.substring(0, 10);
  return d.substring(0, 7) === corte.substring(0, 7) && d <= corte.substring(0, 10);
}

function inRange(dateFieldStr, from, to) {
  // from/to son objetos Date creados con new Date(year, month, day) → locales, sin timezone issue
  if (!dateFieldStr) return false;
  const d = dateFieldStr.substring(0, 10);
  const f = from.getFullYear() + '-' + String(from.getMonth()+1).padStart(2,'0') + '-' + String(from.getDate()).padStart(2,'0');
  const t = to.getFullYear()   + '-' + String(to.getMonth()+1).padStart(2,'0')   + '-' + String(to.getDate()).padStart(2,'0');
  return d >= f && d <= t;
}

function compute(data, data_mov, fecha_corte, secDisp, subConfig, secVendidoRaw, promSinFirma) {
  const corteDate = new Date(fecha_corte);

  // ── PORTAFOLIO: por proyecto y estado ────────────────────────────────────
  const port = {};
  for (const p of PROYECTOS) port[p] = { E:0,P:0,R:0,D:0, ufE:0,ufP:0,ufR:0,ufD:0 };

  for (const row of data) {
    const p = row.proyecto;
    if (!port[p]) continue;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    if (row.estado_corte === 'ESCRITURADO') { port[p].E++; port[p].ufE += uf; }
    else if (row.estado_corte === 'PROMESADO') { port[p].P++; port[p].ufP += uf; }
    else if (row.estado_corte === 'RESERVADO') { port[p].R++; port[p].ufR += uf; }
    else { port[p].D++; port[p].ufD += uf; }
  }

  // ── MOVIMIENTOS DEL MES — usa snapshot más reciente (data_mov) ─────────────
  // data_mov = snapshot actual para capturar operaciones ingresadas con fecha retro
  const mov = {};
  for (const p of PROYECTOS) mov[p] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
  const movSub = {}; for (const p of PROYECTOS) movSub[p] = {};

  for (const row of data_mov) {
    const p = row.proyecto;
    if (!mov[p]) continue;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    // Movimientos = eventos del mes (sobre data_mov = snapshot actual)
    const sub = row.subagrupacion || '—';
    if (!movSub[p][sub]) movSub[p][sub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
    const ms = movSub[p][sub];
    if (inMonthFull(row.fecha_reserva, fecha_corte))
      { mov[p].resUN++; mov[p].resUF += uf; ms.resUN++; ms.resUF += uf; }
    if (inMonthFull(row.fecha_promesa, fecha_corte))
      { mov[p].promUN++; mov[p].promUF += uf; ms.promUN++; ms.promUF += uf; }
    if (inMonthFull(row.fecha_escritura, fecha_corte) && row.estado_corte === 'ESCRITURADO')
      { mov[p].escrUN++; mov[p].escrUF += uf; ms.escrUN++; ms.escrUF += uf; }
  }

  // ── PROMESAS EMITIDAS SIN FIRMA CARGADA ───────────────────────────────────
  // Regla acordada el 28-08-2026: la promesa cuenta desde la firma del comprador
  // y, mientras esa firma no se cargue en PlanOk, desde su fecha de emision.
  // Verificado sobre 73 casos: cuando la firma existe, ventas_pok.fecha_promesa es
  // identica a ella, asi que esto no mueve ningun mes ya reportado — solo agrega
  // las operaciones que el snapshot todavia muestra como RESERVADO.
  for (const row of (promSinFirma || [])) {
    const p = row.proyecto;
    if (!mov[p]) continue;
    if (!inMonthFull(row.fecha_evento, fecha_corte)) continue;
    const uf = parseFloat(row.total_venta_uf) || 0;
    const sub = row.subagrupacion || '—';
    if (!movSub[p][sub]) movSub[p][sub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
    mov[p].promUN++; mov[p].promUF += uf;
    movSub[p][sub].promUN++; movSub[p][sub].promUF += uf;
  }

  // ── AGING RESERVAS + PROMESAS — filtrado por subagrupaciones en Escrituración ─
  // El set escrSet se construye desde subagrupaciones_config (Supabase).
  // Clave: "proyecto|subagrupacion". Si subagrupacion es NULL en config → todo el proyecto.
  const escrSet = new Set();
  for (const sc of (subConfig || [])) {
    if (sc.estado_comercial === 'Escrituración') {
      escrSet.add(sc.proyecto + '|' + (sc.subagrupacion || ''));
    }
  }
  const isEscrituracion = (proy, sub) =>
    escrSet.has(proy + '|' + (sub || '')) || escrSet.has(proy + '|');

  const agingRes    = {};
  const agingResSub = {};  // { proyecto: { subagrupacion: {...} } }
  for (const row of data) {
    const p   = row.proyecto;
    const sub = row.subagrupacion || '—';
    if (row.estado_corte !== 'RESERVADO') continue;  // reservas: TODOS los proyectos (sin filtro escrituración)
    const zero = () => ({ tot:0,totUF:0, lt30:0,lt30UF:0, d30_60:0,d30_60UF:0, gt60:0,gt60UF:0 });
    if (!agingRes[p])              agingRes[p]       = zero();
    if (!agingResSub[p])           agingResSub[p]    = {};
    if (!agingResSub[p][sub])      agingResSub[p][sub] = zero();
    const uf   = parseFloat(row.precio_total_operacion_uf) || 0;
    const days = row.fecha_reserva ? daysDiff(new Date(row.fecha_reserva), corteDate) : 999;
    for (const obj of [agingRes[p], agingResSub[p][sub]]) {
      obj.tot++; obj.totUF += uf;
      if (days < 30)       { obj.lt30++;    obj.lt30UF    += uf; }
      else if (days <= 60) { obj.d30_60++;  obj.d30_60UF  += uf; }
      else                 { obj.gt60++;    obj.gt60UF    += uf; }
    }
  }

  const agingProm    = {};
  const agingPromSub = {};  // { proyecto: { subagrupacion: {...} } }
  for (const row of data) {
    const p   = row.proyecto;
    const sub = row.subagrupacion || '—';
    if (row.estado_corte !== 'PROMESADO' || !isEscrituracion(p, row.subagrupacion)) continue;
    const zero = () => ({ tot:0,totUF:0, lt30:0,lt30UF:0, d30_60:0,d30_60UF:0, gt60:0,gt60UF:0 });
    if (!agingProm[p])             agingProm[p]        = zero();
    if (!agingPromSub[p])          agingPromSub[p]     = {};
    if (!agingPromSub[p][sub])     agingPromSub[p][sub]  = zero();
    const uf   = parseFloat(row.precio_total_operacion_uf) || 0;
    const days = row.fecha_promesa ? daysDiff(new Date(anclaInicio(p, row.subagrupacion, row.fecha_promesa)), corteDate) : 999;
    for (const obj of [agingProm[p], agingPromSub[p][sub]]) {
      obj.tot++; obj.totUF += uf;
      if (days < 30)       { obj.lt30++;    obj.lt30UF    += uf; }
      else if (days <= 60) { obj.d30_60++;  obj.d30_60UF  += uf; }
      else                 { obj.gt60++;    obj.gt60UF    += uf; }
    }
  }

  // ── POR PROYECTO: desglose por subagrupacion ──────────────────────────────
  const detalle = {};
  for (const row of data) {
    const p = row.proyecto; const sub = row.subagrupacion || '(Sin subagrupación)';
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    if (!detalle[p]) detalle[p] = {};
    if (!detalle[p][sub]) detalle[p][sub] = { E:0,P:0,R:0,D:0, ufE:0,ufP:0,ufR:0,ufD:0 };
    const d = detalle[p][sub];
    if (row.estado_corte === 'ESCRITURADO') { d.E++; d.ufE += uf; }
    else if (row.estado_corte === 'PROMESADO') { d.P++; d.ufP += uf; }
    else if (row.estado_corte === 'RESERVADO') { d.R++; d.ufR += uf; }
    else { d.D++; d.ufD += uf; }
  }

  // ── VELOCIDAD ─────────────────────────────────────────────────────────────
  const vel = {};
  for (const p of PROYECTOS) {
    const rows = data.filter(r => r.proyecto === p && (r.estado_corte === 'PROMESADO' || r.estado_corte === 'ESCRITURADO') && r.fecha_promesa);
    const rows2026 = rows.filter(r => new Date(r.fecha_promesa) >= new Date('2026-01-01'));
    const dates = rows.map(r => new Date(r.fecha_promesa)).filter(Boolean);
    const firstProm = dates.length ? new Date(Math.min(...dates)) : null;
    const monthsHist = firstProm ? Math.max(1, (corteDate - firstProm) / (1000*60*60*24*30.44)) : null;
    const months2026 = Math.max(1, (corteDate - new Date('2026-01-01')) / (1000*60*60*24*30.44));
    vel[p] = {
      hist: monthsHist ? (rows.length / monthsHist).toFixed(1) : '—',
      y2026: (rows2026.length / months2026).toFixed(1)
    };
  }

  // ── ACUMULADO YTD: 1 ene → último día del mes anterior ───────────────────
  const ytdFrom = new Date(corteDate.getFullYear(), 0, 1);                    // 1 enero año en curso
  const ytdTo   = new Date(corteDate.getFullYear(), corteDate.getMonth(), 0); // último día mes anterior

  const ytd = {};
  const ytdSub = {}; for (const p of PROYECTOS) ytdSub[p] = {};
  for (const p of PROYECTOS) ytd[p] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };

  for (const row of data_mov) {
    const p = row.proyecto;
    if (!ytd[p]) continue;
    const uf = parseFloat(row.precio_total_operacion_uf) || 0;
    const ysub = row.subagrupacion || '—';
    if (!ytdSub[p][ysub]) ytdSub[p][ysub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
    const ys = ytdSub[p][ysub];
    if (inRange(row.fecha_reserva, ytdFrom, ytdTo))  { ytd[p].resUN++;  ytd[p].resUF  += uf; ys.resUN++;  ys.resUF  += uf; }
    if (inRange(row.fecha_promesa, ytdFrom, ytdTo))  { ytd[p].promUN++; ytd[p].promUF += uf; ys.promUN++; ys.promUF += uf; }
    if (inRange(row.fecha_escritura, ytdFrom, ytdTo) && row.estado_corte === 'ESCRITURADO')
      { ytd[p].escrUN++; ytd[p].escrUF += uf; ys.escrUN++; ys.escrUF += uf; }
  }

  // Mismas promesas emitidas sin firma, para que el acumulado del año no quede
  // por debajo de los movimientos del mes.
  for (const row of (promSinFirma || [])) {
    const p = row.proyecto;
    if (!ytd[p]) continue;
    if (!inRange(row.fecha_evento, ytdFrom, ytdTo)) continue;
    const uf = parseFloat(row.total_venta_uf) || 0;
    const ysub = row.subagrupacion || '—';
    if (!ytdSub[p][ysub]) ytdSub[p][ysub] = { resUN:0,resUF:0, promUN:0,promUF:0, escrUN:0,escrUF:0 };
    ytd[p].promUN++; ytd[p].promUF += uf;
    ytdSub[p][ysub].promUN++; ytdSub[p][ysub].promUF += uf;
  }

  // ── SECUNDARIOS DISPONIBLES por proyecto/tipo/subagrupacion ─────────────────
  // Solo disponibles — los vendidos ya están incluidos en el precio de la unidad principal
  const secDispBySub = {};
  for (const row of (secDisp||[])) {
    const p = row.proyecto; if (!p) continue;
    const tipo = row.tipo ? row.tipo.toLowerCase() : 'otros';
    const sub  = row.subagrupacion || '—';
    if (!secDispBySub[p]) secDispBySub[p] = {};
    if (!secDispBySub[p][tipo]) secDispBySub[p][tipo] = {};
    if (!secDispBySub[p][tipo][sub]) secDispBySub[p][tipo][sub] = {UN:0, UF:0};
    secDispBySub[p][tipo][sub].UN++;
    // Regla Trei: disponibles a PRECIO BASE (principales y secundarios).
    // El precio base de secundarios lo carga el pipeline vía SOAP gci_productos.
    // Fallback a lista si el producto no tiene base cargado en PlanOk.
    const _base = parseFloat(row.precio_base_uf)||0;
    secDispBySub[p][tipo][sub].UF += _base > 0 ? _base : (parseFloat(row.precio_lista_uf)||0);
  }

  // ── SECUNDARIOS "VENDIDOS" por excepción (SEC_COMO_VENDIDOS, ver fetchAll) ──
  // Misma forma que secDispBySub (proyecto->tipo->sub->{UN,UF}), pero a precio
  // lista (no hay precio_base cargado para estos productos en el pipeline).
  const secVendidoBySub = {};
  for (const row of (secVendidoRaw||[])) {
    const p = row.proyecto; if (!p) continue;
    const tipo = row.tipo ? row.tipo.toLowerCase() : 'otros';
    const sub  = row.subagrupacion || '—';
    if (!secVendidoBySub[p]) secVendidoBySub[p] = {};
    if (!secVendidoBySub[p][tipo]) secVendidoBySub[p][tipo] = {};
    if (!secVendidoBySub[p][tipo][sub]) secVendidoBySub[p][tipo][sub] = {UN:0, UF:0};
    secVendidoBySub[p][tipo][sub].UN++;
    secVendidoBySub[p][tipo][sub].UF += parseFloat(row.precio_lista_uf)||0;
  }

  return { port, mov, movSub, ytd, ytdSub, agingRes, agingResSub, agingProm, agingPromSub, detalle, vel, secDispBySub, secVendidoBySub };
}

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────
function pctEmoji(p) {
  if (p <= 10) return '🟢';
  if (p <= 40) return '🟡';
  return '🔴';
}


// ─── RENDER DESISTIMIENTOS ────────────────────────────────────────────────────
function renderDesistimientos(fecha_corte) {
  const corteD = new Date(fecha_corte + 'T12:00:00');
  const yr     = corteD.getFullYear();
  const meses  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const mesNom = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesYM    = fecha_corte.slice(0,7);
  const mesLabel = mesNom[corteD.getMonth()] + ' ' + yr;
  const fmtV  = n => n >= 1000 ? (n/1000).toFixed(1).replace('.',',') + ' MUF' : Math.round(n).toLocaleString('es-CL') + ' UF';
  const slug  = s => String(s).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'') || 'X';
  const plabel = p => PROY_LABEL[p] || p;
  const norm  = v => (v && String(v).trim()) ? String(v).trim() : null;

  // ── Agregación proyecto → etapa ────────────────────────────────────────────
  function agg(rows) {
    const byP = {};
    for (const d of rows) {
      const p  = norm(d.proyecto) || '(Sin proyecto)';
      const e  = norm(d.etapa)    || '(Sin etapa)';
      const uf = parseFloat(d.precio_uf) || 0;
      if (!byP[p]) byP[p] = { UN:0, UF:0, et:{} };
      byP[p].UN++; byP[p].UF += uf;
      if (!byP[p].et[e]) byP[p].et[e] = { UN:0, UF:0 };
      byP[p].et[e].UN++; byP[p].et[e].UF += uf;
    }
    return byP;
  }

  // Tabla expandible proyecto → etapa (ymMonthly: si viene, activa tooltip con clientes del mes)
  function tablaDetalle(byP, gidPrefix, ymMonthly) {
    const proys = Object.keys(byP).sort((a,b) => byP[b].UN - byP[a].UN);
    if (!proys.length) return '<p class="nota">Sin desistimientos en el período.</p>';
    let totUN = 0, totUF = 0;
    const filas = proys.map(p => {
      const o = byP[p];
      totUN += o.UN; totUF += o.UF;
      const etapas = Object.keys(o.et).sort((a,b) => o.et[b].UN - o.et[a].UN);
      const hasMulti = etapas.length > 1;
      const gid = gidPrefix + '-' + slug(p);
      const hov = ymMonthly ? `class="bk-clickable" data-proy="${(p+'').replace(/"/g,'&quot;')}" data-ym="${ymMonthly}" onmouseenter="showDesisTip(event,this)" onmouseleave="hideBkTip()" title="Ver clientes del mes"` : '';
      const main = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${gid}')"`:''}>
        <td ${hov}><span class="toggle-icon" id="icon-${gid}">${hasMulti?'▶':''}</span>${plabel(p)}${ymMonthly?' <span style="opacity:.5;font-size:10px">ⓘ</span>':''}</td>
        <td style="text-align:right;color:#c0392b;font-weight:600">${o.UN}</td>
        <td style="text-align:right">${o.UF?fmtV(o.UF):'—'}</td></tr>`;
      const subs = hasMulti ? etapas.map(e => {
        const s = o.et[e];
        return `<tr class="sub-row ${gid}" style="display:none">
          <td style="padding-left:26px;color:#666">${e}</td>
          <td style="text-align:right;color:#c0392b">${s.UN}</td>
          <td style="text-align:right">${s.UF?fmtV(s.UF):'—'}</td></tr>`;
      }).join('') : '';
      return main + subs;
    }).join('');
    return `<table>
      <thead><tr><th class="left">Proyecto / Etapa</th><th style="text-align:right">Promesas caídas</th><th style="text-align:right">UF (op. total)</th></tr></thead>
      <tbody>${filas}
        <tr class="total-row"><td>TOTAL</td><td style="text-align:right">${totUN}</td><td style="text-align:right">${totUF?fmtV(totUF):'—'}</td></tr>
      </tbody></table>`;
  }

  // ── Datos ───────────────────────────────────────────────────────────────────
  const rowsMes  = ALL_DESIS.filter(d => d.fecha_cancelacion && d.fecha_cancelacion.slice(0,7) === mesYM);
  const rowsHist = ALL_DESIS.filter(d => d.fecha_cancelacion);
  const byMes  = agg(rowsMes);
  const byHist = agg(rowsHist.filter(d => PROYECTOS.includes(norm(d.proyecto))));  // históricos: solo proyectos vigentes

  // KPIs (mismos criterios que el cuadro de Resumen)
  let mesUN=0, mesUF=0, ytdUN=0, ytdUF=0;
  for (const d of ALL_DESIS) {
    if (!d.fecha_cancelacion) continue;
    const ym = d.fecha_cancelacion.slice(0,7);
    const uf = parseFloat(d.precio_uf) || 0;
    if (ym === mesYM)                  { mesUN++; mesUF += uf; }
    if (ym.slice(0,4) === String(yr))  { ytdUN++; ytdUF += uf; }
  }

  // ── Tendencia 12 meses (matriz mes × proyecto) ──────────────────────────────
  const ultimos12 = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(yr, corteD.getMonth() - i, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    ultimos12.push({ ym, label: meses[d.getMonth()] + ' ' + d.getFullYear() });
  }
  const histMes = {};
  for (const d of ALL_DESIS) {
    if (!d.fecha_cancelacion) continue;
    const ym = d.fecha_cancelacion.slice(0,7);
    const p  = norm(d.proyecto) || '(Sin proyecto)';
    if (!histMes[ym]) histMes[ym] = { UN:0, porP:{} };
    histMes[ym].UN++;
    histMes[ym].porP[p] = (histMes[ym].porP[p]||0) + 1;
  }
  const proyTrend = [...new Set(ALL_DESIS.map(d => norm(d.proyecto) || '(Sin proyecto)'))]
    .filter(p => p !== '(Sin proyecto)' && PROYECTOS.includes(p)).sort();
  let thead = '<tr><th class="left">Mes</th>';
  proyTrend.forEach(p => { thead += `<th style="text-align:right">${plabel(p)}</th>`; });
  thead += '<th style="text-align:right;font-weight:700">Total</th></tr>';
  let tbody = '';
  for (const { ym, label } of ultimos12) {
    const h = histMes[ym] || { UN:0, porP:{} };
    const isMes = ym === mesYM;
    let known = 0, cells = '';
    proyTrend.forEach(p => {
      const n = h.porP[p] || 0; known += n;
      cells += n ? `<td style="text-align:right;color:#c0392b">${n}</td>` : '<td style="text-align:right;color:#ddd">—</td>';
    });
    tbody += `<tr${isMes?' style="background:#fffbe6;font-weight:600"':''}><td>${label}${isMes?' ◀':''}</td>${cells}<td style="text-align:right;font-weight:700;color:${known>0?'#c0392b':'#ccc'}">${known||'—'}</td></tr>`;
  }

  return `
  <div class="section-block">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="kpi c-rojo"><div class="kpi-label">Desistim. ${mesLabel}</div><div class="kpi-value">${mesUN}</div><div class="kpi-label">promesas caídas</div></div>
      <div class="kpi c-rojo"><div class="kpi-label">UF desistida mes</div><div class="kpi-value">${mesUF ? fmtV(mesUF) : '—'}</div><div class="kpi-label">op. total</div></div>
      <div class="kpi c-navy"><div class="kpi-label">Desistim. YTD ${yr}</div><div class="kpi-value">${ytdUN}</div><div class="kpi-label">promesas caídas</div></div>
      <div class="kpi c-navy"><div class="kpi-label">UF desistida YTD</div><div class="kpi-value">${ytdUF ? fmtV(ytdUF) : '—'}</div><div class="kpi-label">op. total</div></div>
    </div>

    <div class="section-title" style="color:#c0392b;border-color:#c0392b">Desistimientos del mes — ${mesLabel} · Detalle por proyecto y etapa</div>
    ${tablaDetalle(byMes, 'dmes', mesYM)}

    <div class="section-title" style="color:#c0392b;border-color:#c0392b;margin-top:24px">Tendencia — Últimos 12 meses
      <span style="background:#c0392b;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px">Promesas canceladas</span>
    </div>
    <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>

    <div class="section-title" style="color:#c0392b;border-color:#c0392b;margin-top:24px">Desistimientos históricos · Detalle por proyecto y etapa</div>
    ${tablaDetalle(byHist, 'dhist')}

    <p class="nota" style="margin-top:10px">
      Desistimientos de promesas reales (incluye canceladas en PlanOk con tipo mal etiquetado como "reserva" cuando tienen fecha de promesa). Click en un proyecto para desplegar el detalle por etapa.
      Históricos: solo proyectos vigentes.<br>
      <strong>Nota de origen:</strong> la base de cancelaciones de PlanOk no incluye la subagrupación comercial; se muestra la <em>etapa</em> del negocio,
      granular sólo en algunos proyectos (p. ej. Plaza Los Pinos: Departamentos/Oficinas). En el resto la etapa coincide con el nombre del proyecto.
    </p>
  </div>`;
}




// ─── RENDER RESUMEN ───────────────────────────────────────────────────────────
// ── Cuadros Resumen Mes: Promesas y Escrituras con toggle Un/UF ───────────────
// Formatea un valor según la métrica activa: 'UN' entero, 'UF' con separador de miles.
function resVal(un, uf, metric) {
  if (metric === 'UF') return uf ? fmtUF(uf) : '—';
  return un || '—';
}
// Celda de % cumplimiento (real vs presupuesto) en la métrica activa.
function resCumpl(un, uf, pun, puf, metric) {
  const real = metric === 'UF' ? uf : un;
  const meta = metric === 'UF' ? puf : pun;
  if (!meta) return `<td style="color:#bbb">—</td>`;
  const p = pct(real, meta);
  return `<td style="font-weight:700;color:${barColor(p)}">${p}%</td>`;
}

// Celda de flujo (res/prom/escr) con tooltip de clientes del mes (showMovTip).
function movCellTip(un, uf, metric, proy, sub, tipo, style) {
  const v = resVal(un, uf, metric);
  if (!un && !uf) return `<td style="${style||''}">—</td>`;
  const s = (sub || '').replace(/"/g, '&quot;'), pq = (proy || '').replace(/"/g, '&quot;');
  return `<td class="bk-clickable" style="${style||''}" data-proy="${pq}" data-sub="${s}" data-tipo="${tipo}" onmouseenter="showMovTip(event,this)" onmouseleave="hideBkTip()" title="Ver clientes">${v}</td>`;
}
// Celda de reservas vigentes (stock RESERVADO) con tooltip de clientes (showResStockTip). bucket: 'tot'|'mes'.
function resStockCellTip(un, uf, metric, proy, sub, bucket, style) {
  const v = resVal(un, uf, metric);
  if (!un && !uf) return `<td style="${style||''}">—</td>`;
  const s = (sub || '').replace(/"/g, '&quot;'), pq = (proy || '').replace(/"/g, '&quot;');
  return `<td class="bk-clickable" style="${style||''}" data-proy="${pq}" data-sub="${s}" data-bucket="${bucket}" onmouseenter="showResStockTip(event,this)" onmouseleave="hideBkTip()" title="Ver clientes">${v}</td>`;
}
// Fila principal expandible (con caret) si tiene >1 subagrupación.
function resCaret(gid, hasMulti) { return hasMulti ? `<span class="toggle-icon" id="icon-${gid}">▶</span>` : ''; }

// Construye la tabla del cuadro RESERVAS MES (gestión, sin presupuesto) para la métrica dada.
function buildCuadroReservas(metric) {
  const D = RESUMEN_MES_DATA; if (!D) return '';
  const uni = metric === 'UF' ? 'UF' : 'Un';
  let rows = D.reservas.map(r => {
    const hasMulti = r.subs.length > 1;
    const main = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${r.gid}')"`:''}>
      <td class="left">${resCaret(r.gid, hasMulti)}${r.label}</td>
      ${movCellTip(r.resUN, r.resUF, metric, r.p, '', 'res', 'font-weight:700;color:#111111')}
    </tr>`;
    const subRows = hasMulti ? r.subs.map(s => `
      <tr class="sub-row ${r.gid}" style="display:none">
        <td class="left">${s.sub}</td>
        ${movCellTip(s.resUN, s.resUF, metric, r.p, s.sub, 'res', '')}
      </tr>`).join('') : '';
    return main + subRows;
  }).join('');
  const t = D.reservasTot;
  let totalRow = `
    <tr class="total-row">
      <td class="left">TOTAL</td>
      <td>${resVal(t.resUN, t.resUF, metric)}</td>
    </tr>`;
  return `
    <table>
      <thead><tr>
        <th class="left">Proyecto</th>
        <th style="background:#243446">Reservas del Mes (${uni})</th>
      </tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>
    <div style="font-size:10px;color:#888;margin-top:4px">
      Reservas tomadas en el mes del corte (gestión comercial) · sin comparación a presupuesto ·
      clic en ▶ para abrir por subagrupación · pasa el cursor sobre una celda para ver los clientes.
    </div>`;
}

// FIX 08-09-2026: "% Avance Año" en Resumen Mes (pedido de Francisco Vivanco).
// El "% Cumpl." de la tabla mide solo el mes del corte — un mes bueno en Raíces o
// Mirador Sta. Teresita puede leerse como "vamos bien" aunque el acumulado del año
// siga bajo el presupuesto original. Esta columna es una referencia ESTABLE: usa
// ACUM_CIERRE (cierres oficiales del año + meses reconstruidos + el mes en curso,
// ya poblados por injectMesesSinCierre/injectCurrentMonthAcum antes de que este
// cuadro se arme) sobre ACUM_PPTO_PROY (presupuesto anual completo del proyecto).
// No depende del mes seleccionado: por eso puede vivir siempre en Resumen Mes, sin
// que el usuario tenga que ir a la pestaña Acumulado Año a buscarla.
function avanceAnioProy(p, metric) {
  const cierre = (typeof ACUM_CIERRE !== 'undefined' && ACUM_CIERRE[p]) || {};
  const ppto   = (typeof ACUM_PPTO_PROY !== 'undefined' && ACUM_PPTO_PROY[p]) || {};
  // Corte YTD: solo meses hasta (e incluido) el mes que reporta Resumen Mes —
  // mismo criterio "acumulado ene-mes" del correo de cierre mensual. Sin este
  // tope, el denominador sumaría el presupuesto de meses futuros que aún ni
  // empiezan, inflando el denominador y subestimando el avance real.
  const corte = (typeof RES_AVANCE_ANIO_MES !== 'undefined' && RES_AVANCE_ANIO_MES) || '9999-99';
  const f = metric === 'UF' ? 'promUF' : 'promUN';
  let acum = 0, pptoA = 0;
  for (const m in cierre) { if (m <= corte) acum  += cierre[m][f] || 0; }
  for (const m in ppto)   { if (m <= corte) pptoA += ppto[m][f]   || 0; }
  return { acum, pptoA };
}
function cellAvanceAnio(proy, metric) {
  const { acum, pptoA } = avanceAnioProy(proy, metric);
  if (!pptoA) return `<td style="color:#bbb" title="Sin presupuesto acumulado a la fecha para este proyecto">—</td>`;
  const p = pct(acum, pptoA);
  const acumTxt = resVal(acum, acum, metric);
  const pptoTxt = resVal(pptoA, pptoA, metric);
  return `<td style="font-weight:700;color:${barColor(p)}" title="Acumulado del año a la fecha: ${acumTxt} de ${pptoTxt} de presupuesto acumulado (ene–${RES_AVANCE_ANIO_MES||''}) — referencia estable, no cambia según el resultado puntual del mes">${p}%</td>`;
}
// FIX 08-09-2026 (pedido de Seba): columna con el valor del presupuesto acumulado
// ene-mes en UF/Un — el mismo denominador que ya usaba % Avance Acum. (antes solo
// visible en su tooltip). Va inmediatamente a la izquierda de % Avance Acum.
function cellPptoAcum(proy, metric) {
  const { pptoA } = avanceAnioProy(proy, metric);
  if (!pptoA) return `<td style="color:#bbb" title="Sin presupuesto acumulado a la fecha para este proyecto">—</td>`;
  const pptoTxt = resVal(pptoA, pptoA, metric);
  return `<td style="color:#111111" title="Presupuesto acumulado ene–${RES_AVANCE_ANIO_MES||''} del proyecto — mismo denominador de % Avance Acum.">${pptoTxt}</td>`;
}

// Construye la tabla del cuadro RESUMEN PROMESAS para la métrica dada ('UN'|'UF').
function buildCuadroPromesas(metric) {
  const D = RESUMEN_MES_DATA; if (!D) return '';
  const uni = metric === 'UF' ? 'UF' : 'Un';
  const blankRes = `<td style="color:#bbb" title="Venta especial: la reserva se cuenta como promesa">—<span style="color:#E1093F">*</span></td><td style="color:#bbb">—<span style="color:#E1093F">*</span></td>`;
  let hasEspecial = false;
  let rows = D.proms.map(r => {
    if (r.especial) hasEspecial = true;
    const hasMulti = r.subs.length > 1;
    const resCells = r.especial ? blankRes
      : `${resStockCellTip(r.resTotUN, r.resTotUF, metric, r.p, '', 'tot', '')}${resStockCellTip(r.resMesUN, r.resMesUF, metric, r.p, '', 'mes', '')}`;
    const main = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${r.gid}')"`:''}>
      <td class="left">${resCaret(r.gid, hasMulti)}${r.label}${r.especial ? ' <span style="color:#E1093F;font-weight:700">*</span>' : ''}</td>
      ${resCells}
      ${movCellTip(r.promUN, r.promUF, metric, r.p, '', 'prom', 'font-weight:700;color:#E1093F')}
      <td style="color:#111111">${resVal(r.pptoPromUN, r.pptoPromUF, metric)}</td>
      ${resCumpl(r.promUN, r.promUF, r.pptoPromUN, r.pptoPromUF, metric)}
      ${cellPptoAcum(r.p, metric)}
      ${cellAvanceAnio(r.p, metric)}
    </tr>`;
    const subRows = hasMulti ? r.subs.map(s => {
      const sRes = r.especial ? blankRes
        : `${resStockCellTip(s.resTotUN, s.resTotUF, metric, r.p, s.sub, 'tot', '')}${resStockCellTip(s.resMesUN, s.resMesUF, metric, r.p, s.sub, 'mes', '')}`;
      return `<tr class="sub-row ${r.gid}" style="display:none">
        <td class="left">${s.sub}</td>
        ${sRes}
        ${movCellTip(s.promUN, s.promUF, metric, r.p, s.sub, 'prom', '')}
        <td>${resVal(s.pptoPromUN, s.pptoPromUF, metric)}</td>
        ${resCumpl(s.promUN, s.promUF, s.pptoPromUN, s.pptoPromUF, metric)}
        <td style="color:#ccc" title="Presupuesto Acum. se muestra solo a nivel de proyecto">—</td>
        <td style="color:#ccc" title="% Avance Acum. se muestra solo a nivel de proyecto">—</td>
      </tr>`;
    }).join('') : '';
    return main + subRows;
  }).join('');
  const t = D.promTot;
  let totAcumAnio = 0, totPptoAnio = 0;
  for (const r of D.proms) { const a = avanceAnioProy(r.p, metric); totAcumAnio += a.acum; totPptoAnio += a.pptoA; }
  const totPptoAcumCell = totPptoAnio
    ? `<td style="font-weight:700">${resVal(totPptoAnio,totPptoAnio,metric)}</td>`
    : `<td style="color:#bbb">—</td>`;
  const totAvAnioCell = totPptoAnio
    ? `<td style="font-weight:700;color:${barColor(pct(totAcumAnio,totPptoAnio))}">${pct(totAcumAnio,totPptoAnio)}%</td>`
    : `<td style="color:#bbb">—</td>`;
  let totalRow = `
    <tr class="total-row">
      <td class="left">TOTAL</td>
      <td>${resVal(t.resTotUN, t.resTotUF, metric)}</td>
      <td>${resVal(t.resMesUN, t.resMesUF, metric)}</td>
      <td>${resVal(t.promUN, t.promUF, metric)}</td>
      <td>${resVal(t.pptoPromUN, t.pptoPromUF, metric)}</td>
      ${resCumpl(t.promUN, t.promUF, t.pptoPromUN, t.pptoPromUF, metric)}
      ${totPptoAcumCell}
      ${totAvAnioCell}
    </tr>`;
  // Desistimientos del mes + Neto (solo afectan Promesas)
  let desisRows = '';
  if (D.desis.mesUN > 0) {
    const dv  = metric === 'UF' ? (D.desis.mesUF ? fmtUF(D.desis.mesUF) : '—') : D.desis.mesUN;
    const netUN = t.promUN - D.desis.mesUN, netUF = t.promUF - D.desis.mesUF;
    const nv  = metric === 'UF' ? fmtUF(netUF) : netUN;
    desisRows = `
      <tr style="background:#fff5f5;cursor:pointer" onclick="goResSec('desist')" title="Ver detalle de desistimientos">
        <td class="left" style="color:#c0392b;font-weight:600">⬇ Desistimientos <span style="font-size:10px;font-weight:400;opacity:.7">(ver detalle ›)</span></td>
        <td>—</td><td>—</td>
        <td style="color:#c0392b;font-weight:600">−${dv}</td>
        <td>—</td><td>—</td><td>—</td><td>—</td>
      </tr>
      <tr style="background:#f0faf0;font-weight:700;border-top:2px solid #00B050">
        <td class="left" style="color:#006400">✓ NETO MES</td>
        <td>—</td><td>—</td>
        <td style="color:#006400;font-size:15px">${nv}</td>
        <td>—</td><td>—</td><td>—</td><td>—</td>
      </tr>`;
  }
  return `
    <table>
      <thead><tr>
        <th class="left">Proyecto</th>
        <th>Reservas Meses Anteriores (${uni})</th>
        <th>Reservas Mes (${uni})</th>
        <th style="background:#a80730">Promesas (${uni})</th>
        <th>Presupuesto (${uni})</th>
        <th>% Cumpl.</th>
        <th style="background:#555" title="Presupuesto acumulado ene-mes del proyecto — mismo criterio que el correo de cierre mensual; es el denominador que usa % Avance Acum.">Presupuesto Acum. (${uni})</th>
        <th style="background:#3a3a3a" title="Acumulado real ene-mes ÷ presupuesto acumulado ene-mes del proyecto — 100% = exactamente al ritmo del plan (mismo criterio que el correo de cierre mensual). No confundir con el % Avance Año de la pestaña Acumulado Año, que divide por el presupuesto del año completo (ene-dic).">% Avance Acum.</th>
      </tr></thead>
      <tbody>${rows}${totalRow}${desisRows}</tbody>
    </table>
    <div style="font-size:10px;color:#888;margin-top:4px">
      Reservas = stock vigente al corte (Totales = reservadas en meses anteriores · Mes = reservadas en el mes) ·
      Promesas = firmadas en el mes · Presupuesto = meta del mes · % Cumpl. = solo contra el mes ·
      <b>Presupuesto Acum.</b> = presupuesto acumulado ene–mes del proyecto (el denominador de % Avance Acum.) ·
      <b>% Avance Acum.</b> = acumulado real ene–mes ÷ presupuesto acumulado ene–mes del proyecto (100% = al
      ritmo del plan; mismo criterio del correo de cierre mensual) — referencia estable que no cambia según
      el resultado puntual del mes (solo a nivel de proyecto, no por subagrupación). No confundir con el
      <i>% Avance Año</i> de la pestaña Acumulado Año, que divide por el presupuesto del año completo ·
      clic en ▶ para abrir por subagrupación · cursor sobre una celda para ver los clientes.
    </div>
    ${hasEspecial ? `<div style="font-size:10px;color:#E1093F;margin-top:2px">
      <b>*</b> Cromático y Mirador Santa Teresita son proyectos en <b>venta especial</b>: solo admiten reservas, y esa reserva se contabiliza como <b>promesa</b> (en Un y UF). Por eso no se muestran sus reservas como stock en este cuadro; su gestión de reservas se ve en la vista <b>Reservas Mes</b>.
    </div>` : ''}`;
}

// Construye la tabla del cuadro ESCRITURAS para la métrica dada ('UN'|'UF').
function buildCuadroEscrituras(metric) {
  const D = RESUMEN_MES_DATA; if (!D) return '';

  let rows = D.escrs.map(r => {
    const hasMulti = r.subs.length > 1;
    const main = `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${r.gid}')"`:''}>
      <td class="left">${resCaret(r.gid, hasMulti)}${r.label}</td>
      ${movCellTip(r.escrUN, r.escrUF, metric, r.p, '', 'escr', 'font-weight:700;color:#006400')}
      <td style="color:#111111">${resVal(r.pptoEscrUN, r.pptoEscrUF, metric)}</td>
      ${resCumpl(r.escrUN, r.escrUF, r.pptoEscrUN, r.pptoEscrUF, metric)}
    </tr>`;
    const subRows = hasMulti ? r.subs.map(s => `
      <tr class="sub-row ${r.gid}" style="display:none">
        <td class="left">${s.sub}</td>
        ${movCellTip(s.escrUN, s.escrUF, metric, r.p, s.sub, 'escr', '')}
        <td>${resVal(s.pptoEscrUN, s.pptoEscrUF, metric)}</td>
        ${resCumpl(s.escrUN, s.escrUF, s.pptoEscrUN, s.pptoEscrUF, metric)}

  return `
    <table>
      <thead><tr>
        <th class="left">Proyecto</th>
        <th style="background:#044d04">Escrituras (${uni})</th>
        <th>Presupuesto (${uni})</th>
        <th>% Cumpl.</th>
      </tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>
    <div style="font-size:10px;color:#888;margin-top:4px">
      Escrituras = firmadas en el mes del corte · Presupuesto = meta del mes ·
      clic en ▶ para abrir por subagrupación · cursor sobre una celda para ver los clientes.
    </div>`;
}

// Cambia la métrica de un cuadro (Un/UF) y re-renderiza solo ese cuadro.
function setResMetric(which, metric, btn) {
  const wrap = btn ? btn.parentElement : null;
  if (wrap) wrap.querySelectorAll('.chart-filter-btn').forEach(b => b.classList.remove('metric-active'));
  if (btn) btn.classList.add('metric-active');
  if (which === 'res') {
    RES_RES_METRIC = metric;
    const c = document.getElementById('cuadro-reservas');
    if (c) c.innerHTML = buildCuadroReservas(metric);
  } else if (which === 'prom') {
    RES_PROM_METRIC = metric;
    const c = document.getElementById('cuadro-promesas');
    if (c) c.innerHTML = buildCuadroPromesas(metric);
  } else {
    RES_ESCR_METRIC = metric;
    const c = document.getElementById('cuadro-escrituras');
    if (c) c.innerHTML = buildCuadroEscrituras(metric);
  }
}

// ── PROYECCIÓN DE CIERRE ──────────────────────────────────────────────────────
// Reservas marcadas (probable-promesa) agregadas por proyecto.
function marcadasPorProyecto() {
  const marc = {};
  for (const p of PROYECTOS) marc[p] = { un: 0, uf: 0 };
  for (const r of (RES_BACKLOG_LIST || [])) {
    if (!PROY_MARCADAS.has(String(r.id))) continue;
    if (!marc[r.proyecto]) marc[r.proyecto] = { un: 0, uf: 0 };
    marc[r.proyecto].un++; marc[r.proyecto].uf += r.uf;
  }
  return marc;
}

// Cuadro Proyección de Cierre del Mes = Promesas del mes + Reservas marcadas (por proyecto).
function buildCuadroProyeccion() {
  const D = RESUMEN_MES_DATA; if (!D) return '';
  const marc = marcadasPorProyecto();
  let tPUN = 0, tPUF = 0, tMUN = 0, tMUF = 0;
  const rows = D.proms.map(pr => {
    const m = marc[pr.p] || { un: 0, uf: 0 };
    const pjUN = pr.promUN + m.un, pjUF = pr.promUF + m.uf;
    tPUN += pr.promUN; tPUF += pr.promUF; tMUN += m.un; tMUF += m.uf;
    if (!pr.promUN && !pr.promUF && !m.un && !m.uf) return '';
    return `<tr>
      <td class="left">${pr.label}</td>
      <td style="color:#E1093F">${pr.promUN || '—'}</td><td style="color:#E1093F">${pr.promUF ? fmtUF(pr.promUF) : '—'}</td>
      <td style="color:#b8860b">${m.un || '—'}</td><td style="color:#b8860b">${m.uf ? fmtUF(m.uf) : '—'}</td>
      <td style="font-weight:700;color:#111111">${pjUN || '—'}</td><td style="font-weight:700;color:#111111">${pjUF ? fmtUF(pjUF) : '—'}</td>
    </tr>`;
  }).join('');
  const pjTUN = tPUN + tMUN, pjTUF = tPUF + tMUF;
  const totalRow = `<tr class="total-row">
    <td class="left">TOTAL</td>
    <td>${tPUN || '—'}</td><td>${tPUF ? fmtUF(tPUF) : '—'}</td>
    <td>${tMUN || '—'}</td><td>${tMUF ? fmtUF(tMUF) : '—'}</td>
    <td>${pjTUN || '—'}</td><td>${pjTUF ? fmtUF(pjTUF) : '—'}</td>
  </tr>`;
  return `
    <table>
      <thead><tr>
        <th class="left">Proyecto</th>
        <th style="background:#a80730">Promesas Mes (Un)</th><th style="background:#a80730">Promesas Mes (UF)</th>
        <th style="background:#8a6d0b">Reservas Marcadas (Un)</th><th style="background:#8a6d0b">Reservas Marcadas (UF)</th>
        <th style="background:#243446">Proy. Cierre (Un)</th><th style="background:#243446">Proy. Cierre (UF)</th>
      </tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>
    <div style="font-size:10px;color:#888;margin-top:4px">
      Proyección de Cierre = Promesas firmadas en el mes + Reservas marcadas como probable-promesa por el área comercial.
      Las reservas se marcan en la vista <b>Proyección Cierre</b> y se comparten entre usuarios.
    </div>`;
}

// Texto resumen (marcadas de total) para la vista Proyección Cierre.
function proySummaryText() {
  const tot = (RES_BACKLOG_LIST || []).length;
  let n = 0, uf = 0;
  for (const r of (RES_BACKLOG_LIST || [])) if (PROY_MARCADAS.has(String(r.id))) { n++; uf += r.uf; }
  return `<b style="color:#111111">${n}</b> de ${tot} reservas marcadas · <b>${fmtUF(uf)}</b> UF`;
}

// Filas de la tabla de selección de reservas backlog (según filtro de proyecto).
function buildProyTable() {
  const list = (RES_BACKLOG_LIST || []).filter(r => PROY_FILTER === 'TODOS' || r.proyecto === PROY_FILTER);
  if (!list.length) return '<div style="padding:18px;color:#aaa;text-align:center">Sin reservas vigentes para el filtro seleccionado.</div>';
  const corteD = CORTE_DATE || new Date();
  const dias = (fr) => fr ? Math.max(0, Math.floor((corteD - new Date(String(fr).substring(0, 10) + 'T12:00:00')) / 86400000)) : null;
  const proyShort = (p) => (p || '').replace('TERRAZAS DE SANTA MARIA', 'TSM').replace('PLAZA LOS PINOS', 'PLP').replace('RAICES DE PEÑABLANCA', 'RAÍCES').replace('CROMATICO', 'CROMÁTICO').replace('MIRADOR SANTA TERESITA', 'M. STA TERESITA');
  const rows = list.map(r => {
    const marc = PROY_MARCADAS.has(String(r.id));
    const cli = ((r.nombre || '').trim() + ' ' + (r.apellidos || '').trim()).trim() || '—';
    const d = dias(r.fecha_reserva);
    const fv = r.fecha_reserva ? String(r.fecha_reserva).substring(0, 10).split('-').reverse().join('/') : '—';
    return `<tr style="${marc ? 'background:#fffbe9' : ''}">
      <td style="text-align:center"><input type="checkbox" ${marc ? 'checked' : ''} onchange="toggleMarcaReserva('${r.id}',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>
      <td><span style="background:#EEF2F7;color:#111111;border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700">${proyShort(r.proyecto)}</span></td>
      <td>${r.subagrupacion}</td>
      <td class="c" style="font-weight:700">${r.propiedad}</td>
      <td>${cli}</td>
      <td class="r" style="font-weight:700">${r.uf ? Math.round(r.uf).toLocaleString('es-CL') : '—'}</td>
      <td class="c">${fv}</td>
      <td class="c">${d != null ? d + ' d' : '—'}</td>
    </tr>`;
  }).join('');
  return `<div class="ops-tbl-wrap"><table class="ops-tbl">
    <thead><tr>
      <th class="c" style="width:44px">Marcar</th><th>Proyecto</th><th>Subagrupación</th>
      <th class="c">Unidad</th><th>Cliente</th><th class="r">UF Total</th><th class="c">F. Reserva</th><th class="c">Antigüedad</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// Vista Proyección Cierre: selección de reservas backlog (marcas compartidas vía Supabase).

  const opts = ['<option value="TODOS">Todos los proyectos</option>']
    .concat(PROYECTOS.map(p => `<option value="${(p || '').replace(/"/g, '&quot;')}" ${PROY_FILTER === p ? 'selected' : ''}>${PROY_LABEL[p] || p}</option>`)).join('');
  return `
  <div class="section-block">

      <span>Proyección de Cierre — Selección de Reservas</span>
      <span id="proy-summary" style="font-size:12px;color:#666;font-weight:400">${proySummaryText()}</span>

}

// Cambia el filtro de proyecto en la vista Proyección Cierre.

  PROY_FILTER = v;
