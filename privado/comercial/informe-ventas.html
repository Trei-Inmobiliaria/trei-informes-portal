// ─── EXPORT DETALLE DE VENTAS (XLSX) ──────────────────────────────────────────
// Botón bajo "Desistimientos" en el sidebar de Gestión Ventas. Descarga, en un
// solo Excel: el detalle de Reservas/Promesas/Escrituras de unidades PRINCIPALES
// (una fila por evento real, no por foto diaria), unidades PRINCIPALES aún
// Disponibles (stock, hoja aparte), Secundarios Disponibles sueltos (bodegas/
// estacionamientos sin unidad principal vendida, desde secundarios_disponibles_pok),
// Secundarios vendidos por separado (estacionamientos/bodegas, derivado de
// ventas_pok — ver nota mas abajo) + Desistimientos, más hojas resumen tipo tabla
// dinámica (mes, proyecto, vendedor), y una hoja de Alertas de Consistencia
// (unidades entregadas en seguimiento_legal_pok sin escritura reflejada en
// ventas_pok). Fetch independiente — no reutiliza ALL_DATA para no acoplarse
// al resto del informe.
// Nota: cuando un Secundario está atado a la misma operación que una unidad
// PRINCIPAL, su UF también puede venir sumada en "Precio Bodega/Estac. (UF)"
// de esa fila en Detalle Ventas (mismo ID Negocio) — no sumar ambas hojas a ciegas.
async function exportarDetalleVentasXLSX(){
  if (typeof XLSX === 'undefined'){ alert('La librería de Excel aún se está cargando. Reintenta en unos segundos.'); return; }
  const btn = document.getElementById('btn-export-ventas-xlsx');
  const btnTxt = btn ? btn.innerHTML : '';
  if (btn){ btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ Generando…'; }
  try {
    const PAGE = 1000;
    async function fetchAllPages(pathAndQuery){
      let out = [], offset = 0, more = true;
      while (more){
        const r = await fetch(`${SB_URL}/rest/v1/${pathAndQuery}`,
          { headers: { ...HEADERS, 'Range': `${offset}-${offset + PAGE - 1}`, 'Prefer': 'count=none' } });
        if (!r.ok) throw new Error('Error consultando ' + pathAndQuery.split('?')[0] + ': ' + r.status);
        const batch = await r.json();
        out = out.concat(batch);
        more = batch.length === PAGE;
        offset += PAGE;
      }
      return out;
    }
    const num = v => (v === null || v === undefined || v === '') ? '' : Number(v);
    const round2 = n => Math.round(n * 100) / 100;
    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio',
                    'Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const periodoDe = f => { const d = new Date(f + 'T12:00:00');
      return { anio: d.getFullYear(), mes: MESES[d.getMonth()], mesAno: MESES[d.getMonth()] + ' ' + d.getFullYear(),
        trimestre: 'Q' + Math.ceil((d.getMonth()+1)/3), clave: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') }; };

    // 1. Fecha de corte más reciente (snapshot vigente del portafolio)
    const rCorte = await fetch(`${SB_URL}/rest/v1/ventas_pok?select=fecha_corte&order=fecha_corte.desc&limit=1`, { headers: HEADERS });
    if (!rCorte.ok) throw new Error('Error obteniendo fecha de corte: ' + rCorte.status);
    const corteRows = await rCorte.json();
    if (!corteRows.length) throw new Error('No hay datos en ventas_pok.');
    const fecha_corte = corteRows[0].fecha_corte;

    // 2. Snapshot de ventas al corte más reciente — una fila por unidad PRINCIPAL.
    //    Incluye estacionamiento/bodega (texto, separado por coma cuando hay más de
    //    uno) — es la fuente completa y corregida para armar "Secundarios Vendidos"
    //    (ver punto 4): reservas_pok/tipo_producto=SECUNDARIO por sí solo NO alcanza,
    //    /reservas (REST) no cubre el 100% de los negocios historicos.
    const ventas = await fetchAllPages(
      `ventas_pok?select=id_producto,proyecto,etapa,subagrupacion,propiedad,piso,modelo,programa,m2,m2_terraza,` +
      `nombre,apellidos,rut_cliente,precio_depto_uf,precio_bodega_uf,precio_estacionamiento_uf,precio_total_operacion_uf,` +
      `estacionamiento,bodega,estado_corte,fecha_reserva,fecha_promesa,fecha_escritura&fecha_corte=eq.${fecha_corte}`
    );

    // 3. Vendedor por unidad PRINCIPAL (reservas_pok, última extracción disponible).
    //    Se reutiliza el mismo mapa para atribuir vendedor a los secundarios del
    //    punto 4 (un secundario se vende dentro del mismo negocio que su principal).
    const rMaxFE = await fetch(`${SB_URL}/rest/v1/reservas_pok?select=fecha_extraccion&order=fecha_extraccion.desc&limit=1`, { headers: HEADERS });
    const maxFERows = rMaxFE.ok ? await rMaxFE.json() : [];
    const vendMap = {};
    if (maxFERows.length){
      const vend = await fetchAllPages(
        `reservas_pok?select=id_producto,nombre_vendedor,rut_vendedor&tipo_producto=eq.PRINCIPAL&fecha_extraccion=eq.${maxFERows[0].fecha_extraccion}`
      );
      for (const v of vend){
        if (v.nombre_vendedor && !v.nombre_vendedor.toUpperCase().includes('VIRTUAL'))
          vendMap[String(v.id_producto)] = { nombre: v.nombre_vendedor, rut: v.rut_vendedor || '' };
      }
    }

    // 4. Secundarios vendidos (estacionamientos, bodegas — derivados de ventas_pok,
    //    NO de reservas_pok/tipo_producto=SECUNDARIO).
    //    Por qué el cambio: reservas_pok se arma desde /reservas (REST), que solo
    //    cubre los negocios que Planok expone por ese endpoint -- en Terrazas Sta
    //    Maria, por ejemplo, cubre 41 de 94 negocios vendidos (auditado 22-07-2026:
    //    reservas_pok traía 75 secundarios TSM vs. 166 reales en ventas_pok). El
    //    campo estacionamiento/bodega de ventas_pok ya trae la lista completa y
    //    corregida (separada por coma cuando el negocio tiene más de un secundario
    //    del mismo tipo), así que ahora es la fuente única de verdad para esta hoja.
    //    El precio de cada secundario individual no está desglosado en ventas_pok
    //    (solo el total del conjunto por unidad) -- se prorratea en partes iguales
    //    entre los nombres del conjunto y se deja explícito en la columna de precio.
    const splitNombres = s => {
      if (s === null || s === undefined) return [];
      const t = String(s).trim();
      if (t === '') return [];
      return t.split(',').map(x => x.trim()).filter(Boolean);
    };
    const ventasVendidas = ventas.filter(r =>
      r.estado_corte === 'ESCRITURADO' || r.estado_corte === 'PROMESADO' || r.estado_corte === 'RESERVADO');
    const secundarios = [];
    for (const r of ventasVendidas){
      const fecha = r.fecha_reserva || r.fecha_promesa || r.fecha_escritura || '';
      const ven = vendMap[String(r.id_producto)] || {};
      for (const [campo, tipo, precioTot] of [
        ['estacionamiento', 'Estacionamiento', num(r.precio_estacionamiento_uf)],
        ['bodega', 'Bodega', num(r.precio_bodega_uf)],
      ]){
        const nombres = splitNombres(r[campo]);
        if (!nombres.length) continue;
        const precioProrrateado = precioTot ? round2(precioTot / nombres.length) : 0;
        for (const nombre of nombres){
          secundarios.push({
            fecha_reserva: fecha, proyecto: r.proyecto, etapa: r.etapa, sub_agrupacion: r.subagrupacion,
            unidad_principal: r.propiedad, nombre_unidad: nombre, tipo_producto: tipo,
            precio_venta_uf: precioProrrateado, precio_total_conjunto_uf: precioTot,
            n_en_conjunto: nombres.length,
            nombre_cliente: [r.nombre, r.apellidos].filter(Boolean).join(' '),
            rut_cliente: r.rut_cliente, nombre_vendedor: ven.nombre || '', rut_vendedor: ven.rut || '',
            estado_reserva: r.estado_corte,
          });
        }
      }
    }

    // 5. Alertas de consistencia: unidades marcadas como ENTREGADAS en seguimiento_legal_pok
    //    pero sin fecha_escritura/estado ESCRITURADO en ventas_pok (desfase entre el
    //    seguimiento legal y el estado comercial — típicamente significa que la escritura
    //    sí se firmó pero ventas_pok no se actualizó).
    const rCorteLegal = await fetch(`${SB_URL}/rest/v1/seguimiento_legal_pok?select=fecha_corte&order=fecha_corte.desc&limit=1`, { headers: HEADERS });
    const corteLegalRows = rCorteLegal.ok ? await rCorteLegal.json() : [];
    let seguimiento = [];
    if (corteLegalRows.length){
      seguimiento = await fetchAllPages(
        `seguimiento_legal_pok?select=id_producto,proyecto,subagrupacion,propiedad,nombre_cliente,apellido_paterno,apellido_materno,` +
        `fecha_de_entrega,fecha_finalizado&fecha_corte=eq.${corteLegalRows[0].fecha_corte}&fecha_de_entrega=not.is.null`
      );
    }

    // 6. Desistimientos (histórico completo — promesas y reservas)
    const desist = await fetchAllPages(
      `canceladas_pok?select=fecha_cancelacion,tipo,accion,proyecto,etapa,cliente,rut_cliente,precio_uf,motivo,fecha_promesa,id_negocio&order=fecha_cancelacion.desc`
    );

    // ── Eventos: una fila por evento real de unidad PRINCIPAL (Reserva/Promesa/
    //    Escritura). USO INTERNO: alimenta los resúmenes tipo tabla dinámica, que
    //    cuentan eventos por mes/proyecto/vendedor. Ya NO se exporta como hoja.
    const filasEventos = [];
    for (const r of ventas){
      for (const [campo, tipo] of [['fecha_reserva','Reserva'],['fecha_promesa','Promesa'],['fecha_escritura','Escritura']]){
        const f = r[campo];
        if (!f) continue;
        const per = periodoDe(f);
        const ven = vendMap[String(r.id_producto)] || {};
        const apellidos = (r.apellidos && r.apellidos !== 'None None') ? r.apellidos : '';
        filasEventos.push({
          'Fecha': f, 'Año': per.anio, 'Mes': per.mes, 'Mes-Año': per.mesAno, 'Trimestre': per.trimestre,
          'Tipo Evento': tipo,
          'Proyecto': r.proyecto || '', 'Etapa': r.etapa || '', 'Subagrupación': r.subagrupacion || '',
          'Unidad': r.propiedad || '', 'Piso': r.piso || '', 'Tipología': r.modelo || '', 'Programa': r.programa || '',
          'M2 Útil': num(r.m2), 'M2 Terraza': num(r.m2_terraza),
          'Nombre': r.nombre || '', 'Apellidos': apellidos, 'RUT Cliente': r.rut_cliente || '',
          'Precio Depto (UF)': num(r.precio_depto_uf), 'Precio Bodega (UF)': num(r.precio_bodega_uf),
          'Precio Estac. (UF)': num(r.precio_estacionamiento_uf), 'Precio Total (UF)': num(r.precio_total_operacion_uf),
          'Estado': r.estado_corte || '', 'Vendedor': ven.nombre || '', 'RUT Vendedor': ven.rut || '',
          'ID Producto': r.id_producto || '',
        });
      }
    }
    if (!filasEventos.length) throw new Error('No hay eventos de venta (Reserva/Promesa/Escritura) para exportar.');
    filasEventos.sort((a, b) => (a['Fecha'] < b['Fecha'] ? 1 : (a['Fecha'] > b['Fecha'] ? -1 : 0)));

    // ── Hoja "Detalle Ventas": una fila por OPERACIÓN, en su ÚLTIMO estado ──────
    //    Antes una operación escriturada aparecía 3 veces (su reserva, su promesa y
    //    su escritura), lo que obligaba a deduplicar a mano antes de usar el archivo.
    //    Ahora aparece una sola vez, con la fecha de cada hito en su propia columna
    //    y con el desglose de estacionamientos/bodegas del negocio. Los campos
    //    ventas_pok.estacionamiento / .bodega ya traen la lista completa separada por
    //    coma (misma fuente que la hoja "Secundarios Vendidos"), asi que se reutiliza
    //    splitNombres() y no hace falta consultar nada nuevo.
    const MAX_SEC_COLS = 3;
    const colsSecundarios = (arr, etq) => {
      const o = {};
      for (let i = 0; i < MAX_SEC_COLS; i++) o[etq + ' ' + (i + 1)] = arr[i] || '';
      o[etq + 's Adicionales'] = arr.slice(MAX_SEC_COLS).join(', ');
      o['N° ' + etq + 's'] = arr.length;
      return o;
    };
    const filasDetalle = [];
    for (const r of ventas){
      // El hito mas avanzado alcanzado. Se toma por presencia de fecha y no por
      // estado_corte, para que una operacion con estado ESCRITURADO pero sin
      // fecha_escritura cargada igual quede con una fecha valida.
      const hitos = ['fecha_reserva','fecha_promesa','fecha_escritura'].filter(c => r[c]);
      if (!hitos.length) continue;
      const f = r[hitos[hitos.length - 1]];
      const per = periodoDe(f);
      const ven = vendMap[String(r.id_producto)] || {};
      const apellidos = (r.apellidos && r.apellidos !== 'None None') ? r.apellidos : '';
      filasDetalle.push({
        'Fecha Último Estado': f,
        'Fecha Reserva': r.fecha_reserva || '', 'Fecha Promesa': r.fecha_promesa || '', 'Fecha Escritura': r.fecha_escritura || '',
        'Año': per.anio, 'Mes': per.mes, 'Mes-Año': per.mesAno, 'Trimestre': per.trimestre,
        'Proyecto': r.proyecto || '', 'Etapa': r.etapa || '', 'Subagrupación': r.subagrupacion || '',
        'Unidad': r.propiedad || '', 'Piso': r.piso || '', 'Tipología': r.modelo || '', 'Programa': r.programa || '',
        'M2 Útil': num(r.m2), 'M2 Terraza': num(r.m2_terraza),
        'Nombre': r.nombre || '', 'Apellidos': apellidos, 'RUT Cliente': r.rut_cliente || '',
        'Precio Depto (UF)': num(r.precio_depto_uf), 'Precio Bodega (UF)': num(r.precio_bodega_uf),
        'Precio Estac. (UF)': num(r.precio_estacionamiento_uf), 'Precio Total (UF)': num(r.precio_total_operacion_uf),
        ...colsSecundarios(splitNombres(r.estacionamiento), 'Estacionamiento'),
        ...colsSecundarios(splitNombres(r.bodega), 'Bodega'),
        'Estado': r.estado_corte || '', 'Vendedor': ven.nombre || '', 'RUT Vendedor': ven.rut || '',
        'ID Producto': r.id_producto || '',
      });
    }
    filasDetalle.sort((a, b) => (a['Fecha Último Estado'] < b['Fecha Último Estado'] ? 1
                              : (a['Fecha Último Estado'] > b['Fecha Último Estado'] ? -1 : 0)));

    // ── Secundarios vendidos: una fila por secundario individual (estacionamiento/
    // bodega), derivado de ventas_pok. Precio Venta (UF) es el total del conjunto
    // (todos los secundarios del mismo tipo en ese negocio) prorrateado en partes
    // iguales entre los nombres -- no es un precio individual real de Planok, se
    // deja explícito en "Precio Total Conjunto (UF)" y "N° en Conjunto" para que
    // quede claro. Los totales/conteos SÍ son exactos: consistentes con Detalle de
    // Unidades y Ratio de Secundarios del informe web.
    const filasSecundarios = secundarios.filter(s => s.fecha_reserva).map(s => {
      const per = periodoDe(s.fecha_reserva);
      return {
        'Fecha': s.fecha_reserva, 'Año': per.anio, 'Mes': per.mes, 'Mes-Año': per.mesAno, 'Trimestre': per.trimestre,
        'Proyecto': s.proyecto || '', 'Etapa': s.etapa || '', 'Subagrupación': s.sub_agrupacion || '',
        'Unidad Principal': s.unidad_principal || '', 'Secundario': s.nombre_unidad || '', 'Tipo': s.tipo_producto || '',
        'Precio Venta (UF)': num(s.precio_venta_uf),
        'Precio Total Conjunto (UF)': num(s.precio_total_conjunto_uf), 'N° en Conjunto': s.n_en_conjunto || 1,
        'Cliente': s.nombre_cliente || '', 'RUT Cliente': s.rut_cliente || '',
        'Vendedor': s.nombre_vendedor || '', 'RUT Vendedor': s.rut_vendedor || '',
        'Estado': s.estado_reserva || '',
      };
    });
    filasSecundarios.sort((a, b) => (a['Fecha'] < b['Fecha'] ? 1 : (a['Fecha'] > b['Fecha'] ? -1 : 0)));

    // ── Alertas: entregado en seguimiento_legal_pok pero sin escritura en ventas_pok ──
    const ventasMap = {};
    for (const r of ventas) ventasMap[String(r.id_producto)] = r;
    const filasAlertas = [];
    const vistos = new Set();
    for (const s of seguimiento){
      if (!s.id_producto) continue; // entrega de secundario sin producto principal asociado — no aplica
      const key = String(s.id_producto);
      if (vistos.has(key)) continue; // seguimiento_legal_pok puede traer duplicados por unidad
      vistos.add(key);
      const v = ventasMap[key];
      const tieneEscritura = v && v.fecha_escritura && v.estado_corte === 'ESCRITURADO';
      if (tieneEscritura) continue;
      const cliente = [s.nombre_cliente, s.apellido_paterno, s.apellido_materno].filter(Boolean).join(' ');
      filasAlertas.push({
        'Proyecto': s.proyecto || (v && v.proyecto) || '',
        'Subagrupación': s.subagrupacion || (v && v.subagrupacion) || '',
        'Unidad': s.propiedad || (v && v.propiedad) || '',
        'Cliente': cliente || (v ? [v.nombre, v.apellidos].filter(Boolean).join(' ') : ''),
        'Fecha Entrega (seguimiento_legal_pok)': s.fecha_de_entrega || '',
        'Fecha Finalizado': s.fecha_finalizado || '',
        'Estado en ventas_pok': v ? v.estado_corte : 'No encontrado en ventas_pok',
        'Fecha Escritura (ventas_pok)': (v && v.fecha_escritura) || '',
        'Fecha Promesa (ventas_pok)': (v && v.fecha_promesa) || '',
        'ID Producto': s.id_producto,
      });
    }
    filasAlertas.sort((a, b) => (a['Fecha Entrega (seguimiento_legal_pok)'] < b['Fecha Entrega (seguimiento_legal_pok)'] ? 1 : -1));

    // ── Disponibles: unidades PRINCIPALES en stock (estado_corte = DISPONIBLE) ──
    // Mismo snapshot de 'ventas' (punto 2), sin fetch adicional. Precio Total (UF)
    // es a precio base/lista (no hay operacion), por eso Precio Bodega/Estac. van
    // vacios -- esos secundarios (si existen) se ven aparte en el informe web
    // (Detalle de Unidades > Secundarios), no estan desglosados por unidad aqui.
    const filasDisponibles = ventas.filter(r => r.estado_corte === 'DISPONIBLE').map(r => ({
      'Proyecto': r.proyecto || '', 'Etapa': r.etapa || '', 'Subagrupación': r.subagrupacion || '',
      'Unidad': r.propiedad || '', 'Piso': r.piso || '', 'Tipología': r.modelo || '', 'Programa': r.programa || '',
      'M2 Útil': num(r.m2), 'M2 Terraza': num(r.m2_terraza),
      'Precio Depto (UF)': num(r.precio_depto_uf), 'Precio Total (UF)': num(r.precio_total_operacion_uf),
      'ID Producto': r.id_producto || '',
    }));
    filasDisponibles.sort((a, b) => (a['Proyecto'] || '').localeCompare(b['Proyecto'] || '') ||
      String(a['Unidad']).localeCompare(String(b['Unidad']), 'es', { numeric: true }));

    // ── Secundarios Disponibles: bodegas/estacionamientos SUELTOS (sin unidad
    // principal vendida asociada), desde secundarios_disponibles_pok -- misma tabla
    // que usa el informe web para el conteo agregado de Detalle de Unidades >
    // Secundarios y el Ratio de Secundarios. Aquí se lista uno por uno.
    // Precio (UF) = precio base si existe, si no precio de lista (misma regla que el
    // informe web: "disponibles a precio base, fallback a lista").
    const secDisp = await fetchAllPages(
      `secundarios_disponibles_pok?select=proyecto,etapa,subagrupacion,tipo,producto,piso,precio_lista_uf,precio_base_uf,id_producto&fecha_corte=eq.${fecha_corte}`
    );
    const filasSecDisponibles = secDisp.map(r => {
      const base = num(r.precio_base_uf), lista = num(r.precio_lista_uf);
      return {
        'Proyecto': r.proyecto || '', 'Etapa': r.etapa || '', 'Subagrupación': r.subagrupacion || '',
        'Tipo': r.tipo || '', 'Secundario': r.producto || '', 'Piso': r.piso || '',
        'Precio (UF)': (base || lista || ''), 'Precio Lista (UF)': lista, 'Precio Base (UF)': base,
        'ID Producto': r.id_producto || '',
      };
    });
    filasSecDisponibles.sort((a, b) => (a['Proyecto'] || '').localeCompare(b['Proyecto'] || '') ||
      (a['Tipo'] || '').localeCompare(b['Tipo'] || '') ||
      String(a['Secundario']).localeCompare(String(b['Secundario']), 'es', { numeric: true }));

    // ── Resúmenes tipo tabla dinámica (Principal + Secundarios) ────────────────
    function agrupar(campo){
      const g = {};
      const ensure = k => (g[k] = g[k] || { Reserva:{cant:0,uf:0}, Promesa:{cant:0,uf:0}, Escritura:{cant:0,uf:0}, Secundario:{cant:0,uf:0} });
      for (const f of filasEventos){
        const o = ensure(f[campo]);
        o[f['Tipo Evento']].cant++;
        o[f['Tipo Evento']].uf += Number(f['Precio Total (UF)']) || 0;
      }
      for (const s of filasSecundarios){
        const o = ensure(s[campo]);
        o.Secundario.cant++;
        o.Secundario.uf += Number(s['Precio Venta (UF)']) || 0;
      }
      return g;
    }
    function filasResumen(g, etiqueta, orden){
      const claves = orden || Object.keys(g).sort();
      const out = claves.map(k => {
        const o = g[k];
        return {
          [etiqueta]: k,
          'Reservas (Cant.)': o.Reserva.cant, 'Reservas (UF)': round2(o.Reserva.uf),
          'Promesas (Cant.)': o.Promesa.cant, 'Promesas (UF)': round2(o.Promesa.uf),
          'Escrituras (Cant.)': o.Escritura.cant, 'Escrituras (UF)': round2(o.Escritura.uf),
          'Secundarios (Cant.)': o.Secundario.cant, 'Secundarios (UF)': round2(o.Secundario.uf),
          // Total (Cant.) SI incluye secundarios (actividad real). Total (UF) NO suma
          // Secundario.uf: ese monto ya viene incluido en 'Precio Total (UF)' de la
          // unidad principal del mismo negocio (Reservas/Promesas/Escrituras UF) --
          // sumarlo de nuevo duplicaria ~7-8% del valor del portafolio. 'Secundarios (UF)'
          // queda como columna informativa aparte.
          'Total (Cant.)': o.Reserva.cant + o.Promesa.cant + o.Escritura.cant + o.Secundario.cant,
          'Total (UF)': round2(o.Reserva.uf + o.Promesa.uf + o.Escritura.uf),
        };
      });
      const cols = ['Reservas (Cant.)','Reservas (UF)','Promesas (Cant.)','Promesas (UF)','Escrituras (Cant.)','Escrituras (UF)',
        'Secundarios (Cant.)','Secundarios (UF)','Total (Cant.)','Total (UF)'];
      const tot = { [etiqueta]: 'TOTAL' };
      cols.forEach(c => tot[c] = round2(out.reduce((s, r) => s + (Number(r[c]) || 0), 0)));
      out.push(tot);
      return out;
    }
    // Orden cronológico real para Mes-Año (no alfabético) — combina principal + secundarios
    const periodos = {};
    for (const f of filasEventos) periodos[periodoDe(f['Fecha']).clave] = f['Mes-Año'];
    for (const s of filasSecundarios) periodos[periodoDe(s['Fecha']).clave] = s['Mes-Año'];
    const mesesOrden = Object.keys(periodos).sort().map(k => periodos[k]);

    function resumenVendedor(){
      const g = {};
      const add = (v, uf) => { if (!v) return; if (!g[v]) g[v] = { cant: 0, uf: 0 }; g[v].cant++; g[v].uf += uf; };
      for (const f of filasEventos) add(f['Vendedor'], Number(f['Precio Total (UF)']) || 0);
      // Secundarios: cuentan como evento/actividad del vendedor (Eventos Cant.) pero
      // SIN sumar su UF de nuevo -- ese monto ya esta incluido en 'Precio Total (UF)'
      // de la unidad principal del mismo negocio. Sumarlo aqui tambien duplicaria el
      // monto (mismo problema que en filasResumen/Total (UF)).
      for (const s of filasSecundarios) add(s['Vendedor'], 0);
      const out = Object.keys(g).sort().map(k => ({
        'Vendedor': k, 'Eventos (Cant.)': g[k].cant, 'Total (UF)': round2(g[k].uf),
        'UF Promedio por Evento': g[k].cant ? round2(g[k].uf / g[k].cant) : 0,
      }));
      const totCant = out.reduce((s, r) => s + r['Eventos (Cant.)'], 0);
      const totUf = round2(out.reduce((s, r) => s + r['Total (UF)'], 0));
      out.push({ 'Vendedor': 'TOTAL', 'Eventos (Cant.)': totCant, 'Total (UF)': totUf,
        'UF Promedio por Evento': totCant ? round2(totUf / totCant) : 0 });
      return out;
    }

    const filasDesist = desist.map(d => {
      let anio = '', mesAno = '';
      if (d.fecha_cancelacion){ const per = periodoDe(d.fecha_cancelacion); anio = per.anio; mesAno = per.mesAno; }
      return {
        'Fecha Cancelación': d.fecha_cancelacion || '', 'Año': anio, 'Mes-Año': mesAno,
        'Tipo': d.tipo || '', 'Acción / Motivo': d.accion || '', 'Proyecto': d.proyecto || '',
        'Etapa': d.etapa || '', 'Cliente': d.cliente || '', 'RUT Cliente': d.rut_cliente || '',
        'Precio (UF)': num(d.precio_uf), 'Fecha Promesa Original': d.fecha_promesa || '',
        'ID Negocio': d.id_negocio || '',
      };
    });

    // ── Construcción del workbook ──────────────────────────────────────────────
    const wb = XLSX.utils.book_new();
    const addSheet = (rows, name, widths) => {
      const ws = XLSX.utils.json_to_sheet(rows);
      if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    addSheet(filasDetalle, 'Detalle Ventas',
      [16,13,13,13,6,10,13,8,20,16,14,16,7,20,24,9,9,16,16,13,13,13,13,13,
       18,18,18,26,11,13,13,13,20,11,13,16,13,10]);
    addSheet(filasDisponibles, 'Disponibles',
      [24,10,16,10,6,16,14,9,9,14,13,11]);
    addSheet(filasSecDisponibles, 'Secundarios Disponibles',
      [24,10,16,14,20,7,11,14,14,11]);
    addSheet(filasSecundarios, 'Secundarios Vendidos',
      [11,6,10,13,8,20,16,14,14,12,14,14,20,13,26,13,20,13,11]);
    addSheet(filasResumen(agrupar('Mes-Año'), 'Mes-Año', mesesOrden), 'Resumen Mensual',
      [15,14,12,14,12,14,12,14,12,11,12]);
    addSheet(filasResumen(agrupar('Proyecto'), 'Proyecto'), 'Resumen por Proyecto',
      [24,14,12,14,12,14,12,14,12,12]);
    addSheet(resumenVendedor(), 'Resumen por Vendedor', [26,14,12,18]);
    addSheet(filasAlertas, 'Alertas de Consistencia', [20,14,10,26,18,14,20,16,16,10]);
    addSheet(filasDesist, 'Desistimientos', [15,7,13,10,40,20,16,28,13,10,18,11]);

    const hoy = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Detalle_Ventas_Trei_${hoy}.xlsx`);

  } catch(err){
    alert('Error al generar el Excel: ' + (err && err.message ? err.message : err));
    console.error(err);
  } finally {
    if (btn){ btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = btnTxt; }
  }
}

init();
</script>

<style>

.pcats{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid #e1e0d9;overflow-x:auto;background:#fff}
.pcat{padding:11px 12px;font-size:12px;font-weight:640;color:#898781;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}

/* ── Vista de Proyectos: mas separacion entre tarjetas y bloques ── */

   estaban: lo que faltaba era aire entre elementos, no escala. */

<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

  /* ---------- pestana PROYECTOS: lista lateral + categorias ---------- */
  var PN={plp:"PLAZA LOS PINOS",tsm:"TERRAZAS DE SANTA MARIA",wind:"WIND",condell:"CONDELL",
          raices:"RAICES DE PENABLANCA",cromatico:"CROMATICO",mirador:"MIRADOR SANTA TERESITA"};
  var CATS=[["ventas","Ventas Totales"],["detalle","Detalle Unidades"],["precios","Scanner de Precios"],
            ["pricing","Pricing"],["velocidad","Velocidad de Venta"],["secundarios","Secundarios"]];
  var pcat={};
  function montarProy(){
    var wrap=document.getElementById("proy-content-wrap");
    var selp=document.getElementById("proy-select");
    if(!wrap||!selp) return;
    if(document.getElementById("proy-grid")){ llenarLista(); return }
    selp.parentElement.style.display="none";
    var grid=document.createElement("div"); grid.id="proy-grid"; grid.className="rbx";
    var side=document.createElement("div"); side.id="proy-side";
    var main=document.createElement("div"); main.id="proy-main";
    wrap.parentNode.insertBefore(grid, wrap);
    grid.appendChild(side); grid.appendChild(main); main.appendChild(wrap);
    llenarLista();
    var cats=document.createElement("div"); cats.className="pcats"; cats.id="pcats";
    main.insertBefore(cats, wrap);
    side.addEventListener("click",function(e){
      var it=e.target.closest(".pitem"); if(!it) return;
      selp.value=it.dataset.v; try{selectProyecto(it.dataset.v)}catch(err){}
      marcarProy(); setTimeout(pintarCats,80);
    });
    cats.addEventListener("click",function(e){
      var c=e.target.closest(".pcat"); if(!c) return;
      var tid="tab-"+selp.value; pcat[tid]=c.dataset.s;
      try{switchProySec(tid,c.dataset.s)}catch(err){}
      pintarCats();
    });
    marcarProy(); pintarCats();
  }
  function llenarLista(){
    var side=document.getElementById("proy-side"), selp=document.getElementById("proy-select");
    if(!side||!selp||!selp.options.length) return;
    if(side.querySelectorAll(".pitem").length===selp.options.length) return;
    side.innerHTML='<h4>Proyectos</h4>'+[].slice.call(selp.options).map(function(o){
      return '<div class="pitem" data-v="'+o.value+'">'+esc(o.text||PN[o.value]||o.value)+'</div>'}).join("");
    marcarProy();
  }
  function marcarProy(){
    var selp=document.getElementById("proy-select"); if(!selp) return;
    [].forEach.call(document.querySelectorAll("#proy-side .pitem"),function(e){
      e.classList.toggle("on", e.dataset.v===selp.value)});
  }
  function pintarCats(){
    var cats=document.getElementById("pcats"), selp=document.getElementById("proy-select");
    if(!cats||!selp) return;
    var tid="tab-"+selp.value, act=pcat[tid]||"ventas";
    cats.innerHTML=CATS.map(function(c){
      return '<div class="pcat'+(c[0]===act?" on":"")+'" data-s="'+c[0]+'">'+c[1]+'</div>'}).join("");
  }

  function init(){
    montarProy();
    setInterval(montarProy, 2000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else setTimeout(init,1400);
})();
</script>
