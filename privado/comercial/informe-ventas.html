function switchProySec(tabId, sec) {
  ['ventas','detalle','precios','pricing','cotizaciones','marketing','velocidad','secundarios'].forEach(s => {
    const el = document.getElementById(tabId+'-'+s);
    if (el) el.style.display = (s===sec) ? '' : 'none';
  });
  document.querySelectorAll('#'+tabId+' .psnav').forEach(btn => {
    btn.classList.toggle('ps-active', btn.dataset.sec === sec);
  });
  // Chart.js no dibuja bien si el canvas estaba oculto al crearse: forzar resize al mostrar
  if (sec === 'velocidad') {
    const ch = VEL_CHARTS['velchart-' + tabId];
    if (ch) ch.resize();
  }
  if (sec === 'ventas') {
    const hc = HIST_CHARTS[tabId];
    if (hc) hc.resize();
  }
  if (sec === 'secundarios') resizePenetracion(tabId);
  if (sec === 'precios') resizeScannerCharts(tabId);
  if (sec === 'cotizaciones') {
    const c1 = COTIZ_CHARTS['cotiz-canal-' + tabId], c2 = COTIZ_CHARTS['cotiz-tipo-' + tabId];
    if (c1) c1.resize(); if (c2) c2.resize();
  }
}

// ─── DETALLE DE UNIDADES (mix principales + secundarios, cuadra con PxQ) ──────
function renderDetalleUnidades(proyecto, secDispBySub, secVendidoBySub) {
  const rows = (ALL_DATA || []).filter(r => r.proyecto === proyecto);
  const num  = v => parseFloat(v) || 0;
  const countNames = countSecNames;
  const isSold = r => r.estado_corte === 'ESCRITURADO' || r.estado_corte === 'PROMESADO' || r.estado_corte === 'RESERVADO';
  // Principal: vendido = precio total − estac − bodega (efectivo) ; disponible = precio total (lista)
  const princUf = r => isSold(r)
    ? (num(r.precio_total_operacion_uf) - num(r.precio_estacionamiento_uf) - num(r.precio_bodega_uf))
    : num(r.precio_total_operacion_uf);

  const safe = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'') || 'X';

  // Agrupar Principales: Etapa (subagrupación) → Mix (modelo · tipología/programa)
  const bySub = {};
  for (const r of rows) {
    const sub = (r.subagrupacion && String(r.subagrupacion).trim()) || '(Sin etapa)';
    const modelo = (r.modelo && String(r.modelo).trim()) || '';
    const prog   = (r.programa && String(r.programa).trim()) || '';
    const mix = [modelo, prog].filter(Boolean).join(' · ') || '(Sin modelo)';
    if (!bySub[sub]) bySub[sub] = { tot:{dUn:0,dUf:0,vUn:0,vUf:0}, mixes:{} };
    if (!bySub[sub].mixes[mix]) bySub[sub].mixes[mix] = {dUn:0,dUf:0,vUn:0,vUf:0};
    const o = bySub[sub].mixes[mix], t = bySub[sub].tot, uf = princUf(r);
    if (isSold(r)) { o.vUn++; o.vUf+=uf; t.vUn++; t.vUf+=uf; }
    else           { o.dUn++; o.dUf+=uf; t.dUn++; t.dUf+=uf; }
  }
  const subKeys = Object.keys(bySub).sort((a,b)=>(bySub[b].tot.vUn+bySub[b].tot.dUn)-(bySub[a].tot.vUn+bySub[a].tot.dUn));

  // Secundarios VENDIDOS (embebidos en las unidades principales vendidas).
  // "un" = numero total de secundarios vendidos (una unidad puede llevar mas
  // de un estacionamiento/bodega), no el numero de unidades principales que
  // llevan al menos uno.
  const secV = { estacionamiento:{un:0,uf:0}, bodega:{un:0,uf:0} };
  for (const r of rows) {
    if (!isSold(r)) continue;
    const e = num(r.precio_estacionamiento_uf), b = num(r.precio_bodega_uf);
    const nE = countNames(r.estacionamiento), nB = countNames(r.bodega);
    if (e > 0) { secV.estacionamiento.un += (nE || 1); secV.estacionamiento.uf += e; }
    if (b > 0) { secV.bodega.un += (nB || 1);          secV.bodega.uf += b; }
  }
  // EXCEPCIÓN: secundarios reclasificados como vendidos (SEC_COMO_VENDIDOS, ver fetchAll)
  const svp = (secVendidoBySub || {})[proyecto] || {};
  for (const tipo of Object.keys(svp)) {
    if (!secV[tipo]) secV[tipo] = { un:0, uf:0 };
    for (const s of Object.keys(svp[tipo])) {
      const o = svp[tipo][s];
      secV[tipo].un += o.UN||0; secV[tipo].uf += o.UF||0;
    }
  }
  // Secundarios DISPONIBLES (precio lista) por tipo
  const sdp = (secDispBySub || {})[proyecto] || {};
  const secD = {};
  for (const tipo of ['estacionamiento','bodega','otros']) {
    let un=0, uf=0; const bs = sdp[tipo] || {};
    for (const s in bs) { un += bs[s].UN||0; uf += bs[s].UF||0; }
    secD[tipo] = { un, uf };
  }
  const secLbl = { estacionamiento:'Estacionamientos', bodega:'Bodegas', otros:'Otros secundarios' };
  const tiposSec = ['estacionamiento','bodega','otros'].filter(t =>
    (secV[t] && (secV[t].un||secV[t].uf)) || (secD[t] && (secD[t].un||secD[t].uf)));

  // Totales
  const pT = subKeys.reduce((a,s)=>({dUn:a.dUn+bySub[s].tot.dUn,dUf:a.dUf+bySub[s].tot.dUf,vUn:a.vUn+bySub[s].tot.vUn,vUf:a.vUf+bySub[s].tot.vUf}),{dUn:0,dUf:0,vUn:0,vUf:0});
  const sT = tiposSec.reduce((a,t)=>({dUn:a.dUn+((secD[t]||{}).un||0),dUf:a.dUf+((secD[t]||{}).uf||0),vUn:a.vUn+((secV[t]||{}).un||0),vUf:a.vUf+((secV[t]||{}).uf||0)}),{dUn:0,dUf:0,vUn:0,vUf:0});
  const gT = { dUn:pT.dUn+sT.dUn, dUf:pT.dUf+sT.dUf, vUn:pT.vUn+sT.vUn, vUf:pT.vUf+sT.vUf };

  const cU = n => n || '—';
  const cF = n => n ? fmtUF(n) : '—';
  const cells = (o,bold) => `<td>${cU(o.dUn)}</td><td>${cF(o.dUf)}</td><td>${cU(o.vUn)}</td><td>${cF(o.vUf)}</td><td>${bold?'<strong>':''}${cU(o.dUn+o.vUn)}${bold?'</strong>':''}</td><td>${bold?'<strong>':''}${cF(o.dUf+o.vUf)}${bold?'</strong>':''}</td>`;
  const secHdr = txt => `<tr><td colspan="7" style="background:#111111;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 8px">${txt}</td></tr>`;

  let body = secHdr('Principales — por etapa y mix (clic ▶ para abrir)');
  for (const s of subKeys) {
    const g = bySub[s];
    const mixKeys = Object.keys(g.mixes).sort((a,b)=>(g.mixes[b].vUn+g.mixes[b].dUn)-(g.mixes[a].vUn+g.mixes[a].dUn));
    const hasMulti = mixKeys.length > 1;
    const gid = 'du-'+safe(proyecto)+'-'+safe(s);
    body += `<tr class="${hasMulti?'proj-expandable':''}" ${hasMulti?`onclick="toggleSub('${gid}')"`:''}>
      <td class="left"><span class="toggle-icon" id="icon-${gid}">${hasMulti?'▶':''}</span>${s}</td>${cells(g.tot, true)}</tr>`;
    if (hasMulti) for (const mx of mixKeys)
      body += `<tr class="sub-row ${gid}" style="display:none"><td class="left">${mx}</td>${cells(g.mixes[mx])}</tr>`;
  }
  body += `<tr class="total-row"><td class="left">Subtotal Principales</td>${cells(pT, true)}</tr>`;
  if (tiposSec.length) {
    body += secHdr('Secundarios — estacionamientos y bodegas');
    body += tiposSec.map(t => `<tr><td class="left">${secLbl[t]||t}</td>${cells({dUn:(secD[t]||{}).un||0,dUf:(secD[t]||{}).uf||0,vUn:(secV[t]||{}).un||0,vUf:(secV[t]||{}).uf||0})}</tr>`).join('');
    body += `<tr class="total-row"><td class="left">Subtotal Secundarios</td>${cells(sT, true)}</tr>`;
  }
  body += `<tr class="total-row" style="border-top:2px solid #111111;background:#e3ebf3"><td class="left"><strong>TOTAL PROYECTO (PxQ)</strong></td>${cells(gT, true)}</tr>`;

  return `
  <div class="proj-box">
    <h3>${PROY_LABEL[proyecto]||proyecto} — Detalle de Unidades</h3>
    <div style="overflow-x:auto"><table style="box-shadow:none">
      <thead>
        <tr><th class="left" rowspan="2">Etapa / Mix</th><th colspan="2" style="text-align:center">Disponible</th><th colspan="2" style="text-align:center">Vendido</th><th colspan="2" style="text-align:center">Total</th></tr>
        <tr><th style="text-align:center">Un</th><th style="text-align:center">UF</th><th style="text-align:center">Un</th><th style="text-align:center">UF</th><th style="text-align:center">Un</th><th style="text-align:center">UF</th></tr>
      </thead>
      <tbody>${body}</tbody>
    </table></div>
    <p class="nota" style="margin-top:8px">Principales agrupados por etapa (subagrupación) → clic en ▶ para abrir por mix (modelo · tipología). Vendidas a precio efectivo, disponibles a precio base. Secundarios: vendidos = estac.+bodega embebidos en las unidades vendidas; disponibles a precio base. El TOTAL PROYECTO (Un+UF) cuadra con el PxQ del proyecto (Ventas Totales).</p>
  </div>`;
}

// ─── RENDER PROYECTO ─────────────────────────────────────────────────────────
function renderProyecto(tabId, proyecto, detalle, port, vel, velRows, secDispBySub, secVendidoBySub) {
  const pp = port[proyecto];
  // EXCEPCIÓN: secundarios reclasificados como vendidos (SEC_COMO_VENDIDOS, ver fetchAll)
  const svp = (secVendidoBySub||{})[proyecto] || {};
  const svBySub = {};
  let svUN = 0, svUF = 0;
  for (const tipo of Object.keys(svp))
    for (const sb of Object.keys(svp[tipo])) {
      const o = svp[tipo][sb];
      svUN += o.UN||0; svUF += o.UF||0;
      if (!svBySub[sb]) svBySub[sb] = { un:0, uf:0 };
      svBySub[sb].un += o.UN||0; svBySub[sb].uf += o.UF||0;
    }
  const inv  = pp.E+pp.P+pp.R+pp.D;
  const vend = pp.E+pp.P+pp.R + svUN;
  const ufTot  = pp.ufE+pp.ufP+pp.ufR+pp.ufD;
  const ufVend = pp.ufE+pp.ufP+pp.ufR + svUF;
  const ufEscr = pp.ufE;
  const back   = pp.P+pp.R; const ufBack = pp.ufP+pp.ufR;
  const subs   = Object.keys(detalle[proyecto]||{}).sort();

  // Secundarios disponibles (estac./bodega) del proyecto — UF de lista + conteo (total y por subagrupación)
  let secUN = 0, secUF = 0;
  const secBySub = {};
  const sdpKpi = (secDispBySub||{})[proyecto] || {};
  for (const tipo of Object.keys(sdpKpi))
    for (const s of Object.keys(sdpKpi[tipo])) {
      const o = sdpKpi[tipo][s];
      secUN += o.UN||0; secUF += o.UF||0;
      if (!secBySub[s]) secBySub[s] = { un:0, uf:0 };
      secBySub[s].un += o.UN||0; secBySub[s].uf += o.UF||0;
    }
  const ufCompleto = ufTot + secUF + svUF;   // principales + secundarios disponibles + secundarios de la placa (vendidos, excepción)

  // ── KPIs Ventas Totales ──────────────────────────────────────────────────
  const kpiHTML = `
  <div class="proy-kpi-row">
    <div class="proy-kpi c-navy">
      <div class="proy-kpi-label">UF Total del Proyecto</div>
      <div class="proy-kpi-value">${fmtUF(ufCompleto)}</div>
      <div class="proy-kpi-sub">Principales ${fmtUF(ufTot)} + Secundarios ${fmtUF(secUF+svUF)} · ${fmt(inv+secUN+svUN)} uds</div>
    </div>
    <div class="proy-kpi c-red">
      <div class="proy-kpi-label">UF Unidades Vendidas</div>
      <div class="proy-kpi-value">${fmtUF(ufVend)}</div>
      <div class="proy-kpi-sub">${pct(ufVend,ufTot)}% del total · ${fmt(vend)} un</div>
    </div>
    <div class="proy-kpi c-green">
      <div class="proy-kpi-label">UF Unidades Escrituradas</div>
      <div class="proy-kpi-value">${fmtUF(ufEscr)}</div>
      <div class="proy-kpi-sub">${pct(ufEscr,ufTot)}% del total · ${fmt(pp.E)} un</div>
    </div>
  </div>`;

  // ── Tabla combinada Unidades + UF ─────────────────────────────────────────
  const un = (s,k) => detalle[proyecto][s][k]||0;
  const uf = (s,k) => detalle[proyecto][s]['uf'+k]||0;

  // Encabezado de 2 niveles: por subagrupación → (Un | UF)
  const h1 = '<tr><th class="left" rowspan="2">Estado</th>' + subs.map(s=>`<th colspan="2">${s}</th>`).join('') + '<th colspan="2">Total</th></tr>';
  const h2 = '<tr>' + subs.map(()=>'<th>Un</th><th>UF</th>').join('') + '<th>Un</th><th>UF</th></tr>';

  // Celdas (por subagrupación + total) para un conjunto de estados (ks)
  const cellsFor = (ks) => {
    const uns = subs.map(s => ks.reduce((a,k)=>a+un(s,k),0));
    const ufs = subs.map(s => ks.reduce((a,k)=>a+uf(s,k),0));
    const totUn = uns.reduce((a,b)=>a+b,0), totUf = ufs.reduce((a,b)=>a+b,0);
    let cells = '';
    subs.forEach((s,i) => { cells += `<td>${uns[i]||'—'}</td><td>${ufs[i]?fmtUF(ufs[i]):'—'}</td>`; });
    cells += `<td><strong>${totUn||'—'}</strong></td><td><strong>${totUf?fmtUF(totUf):'—'}</strong></td>`;
    return cells;
  };
  const rowFor = (lbl, badgeCls, ks) => `<tr><td><span class="badge ${badgeCls}">${lbl}</span></td>${cellsFor(ks)}</tr>`;

  // Vendido = R+P+E, EXPANDIBLE (clic ▶) → Reservado / Promesado / Escriturado
  const gidV = 'vt-' + String(PROY_TAB[proyecto] || proyecto).replace(/[^a-z0-9]/gi,'');
  const vendidoRow = `<tr class="proj-expandable" onclick="toggleSub('${gidV}')">
    <td><span class="toggle-icon" id="icon-${gidV}">▶</span><span class="badge b-vend">Vendido</span></td>${cellsFor(['R','P','E'])}</tr>`;
  const vendSubRows = [
    { lbl:'Reservado',   cls:'b-res',  k:'R' },
    { lbl:'Promesado',   cls:'b-prom', k:'P' },
    { lbl:'Escriturado', cls:'b-escr', k:'E' },
  ].map(x => `<tr class="sub-row ${gidV}" style="display:none"><td class="left"><span class="badge ${x.cls}">${x.lbl}</span></td>${cellsFor([x.k])}</tr>`).join('');

  // Disponible = D
  let bodyRows = vendidoRow + vendSubRows + rowFor('Disponible','b-disp',['D']);

  // Totales por subagrupación (principales) — para el TOTAL PROYECTO
  const colTotUn = subs.map(s => ['R','P','E','D'].reduce((a,k)=>a+un(s,k),0));
  const colTotUf = subs.map(s => ['R','P','E','D'].reduce((a,k)=>a+uf(s,k),0));

  // Secundarios disponibles (estac./bodega) — como "botón" gris, mismo formato
  const sdp = (secDispBySub||{})[proyecto] || {};
  const tiposOrden = ['estacionamiento','bodega','otros'];
  const tiposLabel = {estacionamiento:'Disponible Estacionamientos', bodega:'Disponible Bodega', otros:'Disponible Otros'};
  tiposOrden.forEach(tipo => {
    const bySub = sdp[tipo]; if (!bySub) return;
    const uns = subs.map(s => (bySub[s]||{UN:0}).UN);
    const ufs = subs.map(s => (bySub[s]||{UF:0}).UF);
    const totUn = uns.reduce((a,b)=>a+b,0); if (totUn===0) return;
    const totUf = ufs.reduce((a,b)=>a+b,0);
    let cells = '';
    subs.forEach((s,i) => { cells += `<td>${uns[i]||'—'}</td><td>${ufs[i]>0?fmtUF(ufs[i]):'—'}</td>`; });
    cells += `<td><strong>${totUn}</strong></td><td><strong>${fmtUF(totUf)}</strong></td>`;
    bodyRows += `<tr class="sec-disp-row"><td><span class="badge b-disp">${tiposLabel[tipo]||tipo}</span></td>${cells}</tr>`;
  });

  // EXCEPCIÓN: secundarios de la placa comercial informados como vendidos (SEC_COMO_VENDIDOS) — fila propia
  if (svUN > 0) {
    let cells = '';
    subs.forEach(s => {
      const o = svBySub[s] || { un:0, uf:0 };
      cells += `<td>${o.un||'—'}</td><td>${o.uf?fmtUF(o.uf):'—'}</td>`;
    });
    cells += `<td><strong>${svUN}</strong></td><td><strong>${fmtUF(svUF)}</strong></td>`;
    bodyRows += `<tr class="sec-disp-row"><td><span class="badge b-vend">Estac. + Bodegas Placa (vendidos)</span></td>${cells}</tr>`;
  }

  // Fila final: TOTAL PROYECTO (principales + secundarios disponibles + secundarios placa vendidos) = PxQ del proyecto
  {
    let gtCells = '';
    subs.forEach((s,i) => {
      const su = colTotUn[i] + ((secBySub[s]||{}).un||0) + ((svBySub[s]||{}).un||0);
      const sf = colTotUf[i] + ((secBySub[s]||{}).uf||0) + ((svBySub[s]||{}).uf||0);
      gtCells += `<td><strong>${su}</strong></td><td><strong>${fmtUF(sf)}</strong></td>`;
    });
    gtCells += `<td><strong>${inv+secUN+svUN}</strong></td><td><strong>${fmtUF(ufCompleto)}</strong></td>`;
    bodyRows += `<tr class="total-row" style="border-top:2px solid #111111"><td>TOTAL PROYECTO</td>${gtCells}</tr>`;
  }

  const tablesHTML = `
  <div class="proj-box">
    <h3>${PROY_LABEL[proyecto]||proyecto} — Unidades &amp; UF</h3>
    <div style="overflow-x:auto"><table style="box-shadow:none"><thead>${h1}${h2}</thead><tbody>${bodyRows}</tbody></table></div>
  </div>`;

  // ── Donuts Vendido vs Disponible ─────────────────────────────────────────
  const donutSubData = {};
  subs.forEach(s => {
    const c = detalle[proyecto][s] || {};
    donutSubData[s] = {
      vUn:(c.R||0)+(c.P||0)+(c.E||0), dUn:(c.D||0),
      vUf:(c.ufR||0)+(c.ufP||0)+(c.ufE||0), dUf:(c.ufD||0)
    };
  });
  PROY_DONUT[tabId] = { subs, bySub:donutSubData };
  const donutFiltHTML = subs.length > 1
    ? `<div class="donut-filters" id="donutfilt-${tabId}">
         <button class="chart-filter-btn metric-active" onclick="setProyDonutSub('${tabId}','__all__',this)">Todas</button>
         ${subs.map(s=>`<button class="chart-filter-btn" onclick="setProyDonutSub('${tabId}','${(s+'').replace(/'/g,"\\'")}',this)">${s}</button>`).join('')}
       </div>` : '';
  const donutCell = (metric, id) => `
      <div class="donut-cell">
        <div class="donut-title">${metric}</div>
        <div class="donut-canvas-wrap"><canvas id="${id}"></canvas></div>
        <div class="donut-foot" id="foot-${id}"></div>
      </div>`;
  const donutHTML = `
  <div class="proj-box" style="margin-top:14px">
    <h3>Vendido vs Disponible</h3>
    ${donutFiltHTML}
    <div class="donut-grid">
      ${donutCell('Unidades','donut-un-'+tabId)}
      ${donutCell('UF','donut-uf-'+tabId)}
    </div>
  </div>`;

  // ── Histórico Mensual del año en curso (Reservas+Promesas vs Ppto) ────────
  const yrHist = (ACUM_CIERRE_MESES[0] || (new Date().getFullYear()+'-01')).substring(0,4);
  const proyEsc = (proyecto+'').replace(/'/g,"\\'");
  const histHTML = `
  <div class="proj-box" style="margin-top:14px">
    <h3>Histórico Mensual ${yrHist} — Promesas vs Presupuesto</h3>
    <div class="chart-filters" id="histfilt-${tabId}" style="margin-bottom:6px">
      <span class="filter-label">Métrica</span>
      <div class="filter-group">
        <button class="chart-filter-btn metric-active" onclick="setHistMetric('${tabId}','${proyEsc}','UN',this)">Unidades</button>
        <button class="chart-filter-btn" onclick="setHistMetric('${tabId}','${proyEsc}','UF',this)">MUF</button>
      </div>
    </div>
    <div style="position:relative;height:320px"><canvas id="histchart-${tabId}"></canvas></div>
    <p style="font-size:11px;color:#888;margin-top:8px">Barra hacia arriba = <strong>promesas del mes</strong>. En Cromático y Mirador de Santa Teresita la reserva cuenta como promesa. Barras hacia abajo: resciliaciones (desistimientos). Línea punteada, por encima de las barras: presupuesto de ventas. Real desde cierres mensuales ${yrHist}; el mes con <strong>*</strong> está en curso (datos vivos, en desarrollo).</p>
  </div>`;

  // ── Penetración de Secundarios (de lo vendido) ────────────────────────────
  const slugP = x => String(x).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'') || 'X';
  const penBy = {};
  for (const d of ALL_DATA) {
    if (d.proyecto !== proyecto) continue;
    if (d.estado_corte === 'DISPONIBLE') continue;
    if (/LOCAL|PLACA/i.test(d.subagrupacion||'')) continue;
    const s = d.subagrupacion || '—';
    if (!penBy[s]) penBy[s] = { vend:0, est:0, bod:0, estN:0, bodN:0 };
    penBy[s].vend++;
    const e = d.estacionamiento, b = d.bodega;
    // est/bod = booleano (unidad lleva al menos uno) -> usado en Penetracion (%, tope 100%).
    // estN/bodN = conteo real de secundarios (una unidad puede llevar varios) -> usado en
    // el Ratio de Secundarios (Colocacion actual), que si puede superar 1.
    if (e!=null && String(e).trim()!=='' && String(e).trim()!=='0') penBy[s].est++;
    if (b!=null && String(b).trim()!=='' && String(b).trim()!=='0') penBy[s].bod++;
    penBy[s].estN += countSecNames(e);
    penBy[s].bodN += countSecNames(b);
  }
  const penSubs = Object.keys(penBy).filter(s => penBy[s].vend > 0).sort();
  const penSpecs = [];
  const gaugeCanvas = (id, label, n, tot) => `<div class="pen-gauge"><div class="pen-canvas-wrap"><canvas id="${id}"></canvas></div><div class="pen-cap">${label}: ${n}/${tot}</div></div>`;
  const penCards = penSubs.map(s => {
    const o = penBy[s];
    const pe = o.vend ? Math.round(o.est/o.vend*100) : 0;
    const pb = o.vend ? Math.round(o.bod/o.vend*100) : 0;
    const idE = 'pen-est-'+tabId+'-'+slugP(s), idB = 'pen-bod-'+tabId+'-'+slugP(s);
    penSpecs.push({ id:idE, pct:pe, label:'Estac' });
    penSpecs.push({ id:idB, pct:pb, label:'Bodega' });
    return `<div class="pen-card">
      <div class="pen-sub">${s} <span style="color:#999;font-weight:400">· ${o.vend} vendidas</span></div>
      <div class="pen-gauges">${gaugeCanvas(idE,'Estac',o.est,o.vend)}${gaugeCanvas(idB,'Bodega',o.bod,o.vend)}</div>
    </div>`;
  }).join('');

  // Ratio de secundarios por unidad principal: Oferta (proyecto) vs Colocación actual.
  // Usa el conteo REAL de secundarios vendidos (estN/bodN), no el booleano est/bod
  // (ese es solo para la Penetración). El ratio puede superar 1 sin problema: es
  // normal que un proyecto tenga más estacionamientos que unidades principales.
  const princTot  = (ALL_DATA||[]).filter(d => d.proyecto===proyecto && !/LOCAL|PLACA/i.test(d.subagrupacion||'')).length;
  const princVend = Object.values(penBy).reduce((a,o)=>a+o.vend,0);
  const estVend = Object.values(penBy).reduce((a,o)=>a+o.estN,0);
  const bodVend = Object.values(penBy).reduce((a,o)=>a+o.bodN,0);
  const sumUN = (obj) => Object.values(obj||{}).reduce((a,o)=>a+(o.UN||0),0);
  const estDisp = sumUN(sdpKpi['estacionamiento']), bodDisp = sumUN(sdpKpi['bodega']);
  const estTot = estVend + estDisp, bodTot = bodVend + bodDisp;
  const r2 = (n,d) => d>0 ? (n/d).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';

  // ── Avance de Venta por Etapa — Principales, Estacionamientos y Bodegas ───
  // % del STOCK TOTAL de cada tipo que ya está vendido (no confundir con la
  // Penetración de abajo, que es % de unidades vendidas que llevan secundario).
  // Una fila/columna por etapa (subagrupación, excluye locales y placa — mismo
  // universo que penBy) + una columna TOTAL PROYECTO.
  const avanceSpecs = [];
  const avanceCardHTML = (label, keySlug, destacado, vend, tot, eVend, eTot, bVend, bTot) => {
    const idP = 'av-prin-'+tabId+'-'+keySlug, idE = 'av-est-'+tabId+'-'+keySlug, idB = 'av-bod-'+tabId+'-'+keySlug;
    const pP = tot  ? Math.round(vend/tot*100)   : 0;
    const pE = eTot ? Math.round(eVend/eTot*100) : 0;
    const pB = bTot ? Math.round(bVend/bTot*100) : 0;
    avanceSpecs.push({ id:idP, pct:pP, label:'Ppal.' });
    avanceSpecs.push({ id:idE, pct:pE, label:'Estac.' });
    avanceSpecs.push({ id:idB, pct:pB, label:'Bodegas' });
    return `<div class="pen-card"${destacado ? ' style="border:2px solid #1A1A2E"' : ''}>
      <div class="pen-sub">${destacado ? '<strong>'+label+'</strong>' : label}</div>
      <div class="pen-gauges">${gaugeCanvas(idP,'Ppal.',vend,tot)}${gaugeCanvas(idE,'Estac.',eVend,eTot)}${gaugeCanvas(idB,'Bodegas',bVend,bTot)}</div>
    </div>`;
  };
  const avanceCards = Object.keys(penBy).sort().map(s => {
    const o = penBy[s];
    const totalPrinc = (ALL_DATA||[]).filter(d => d.proyecto===proyecto && (d.subagrupacion||'—')===s).length;
    const eD = ((sdpKpi['estacionamiento']||{})[s]||{UN:0}).UN || 0;
    const bD = ((sdpKpi['bodega']||{})[s]||{UN:0}).UN || 0;
    return avanceCardHTML(s, slugP(s), false, o.vend, totalPrinc, o.estN, o.estN+eD, o.bodN, o.bodN+bD);
  }).join('') + avanceCardHTML('TOTAL PROYECTO', 'TOTAL', true, princVend, princTot, estVend, estTot, bodVend, bodTot);
  const avanceHTML = Object.keys(penBy).length ? `
  <div class="proj-box">
    <h3>Avance de Venta por Etapa — Principales, Estacionamientos y Bodegas</h3>
    <p class="nota" style="margin-bottom:12px">% del stock total de cada tipo ya vendido (vendido = reservado + promesado + escriturado). Total de secundarios = vendidos + disponibles en stock. Excluye locales y placa comercial.</p>
    <div class="pen-grid">${avanceCards}</div>
  </div>` : '';
  PEN_SPECS[tabId] = penSpecs.concat(avanceSpecs);
  const ratioBox = (princTot>0 && (estTot>0 || bodTot>0)) ? `
  <div class="proj-box">
    <h3>Ratio de Secundarios por Unidad Principal</h3>
    <table style="box-shadow:none">
      <thead><tr><th class="left">Tipo</th><th>Oferta (proyecto)</th><th>Colocación actual</th></tr></thead>
      <tbody>
        <tr><td>Estacionamiento</td><td>${r2(estTot,princTot)} <span style="color:#999;font-size:11px">/ und. (${estTot} de ${princTot})</span></td><td>${r2(estVend,princVend)} <span style="color:#999;font-size:11px">/ vendida (${estVend} de ${princVend})</span></td></tr>
        <tr><td>Bodega</td><td>${r2(bodTot,princTot)} <span style="color:#999;font-size:11px">/ und. (${bodTot} de ${princTot})</span></td><td>${r2(bodVend,princVend)} <span style="color:#999;font-size:11px">/ vendida (${bodVend} de ${princVend})</span></td></tr>
      </tbody>
    </table>
    <p class="nota">Oferta = secundarios totales (vendidos + disponibles) ÷ unidades principales. Colocación actual = secundarios vendidos ÷ unidades vendidas. Conteo real de secundarios (una unidad puede llevar más de uno); puede ser mayor a 1. Excluye locales y placa.</p>
  </div>` : '';
  const gaugesBox = penSubs.length ? `
  <div class="proj-box" style="margin-top:14px">
    <h3>Penetración de Secundarios (de lo vendido)</h3>
    <p class="nota" style="margin-bottom:12px">% de unidades vendidas que llevan estacionamiento y bodega. Verde ≥80% · ámbar ≥50% · rojo &lt;50%. Excluye locales y placa comercial.</p>
    <div class="pen-grid">${penCards}</div>
  </div>` : '';
  const penHTML = avanceHTML + ratioBox + gaugesBox;

  // ── Velocidad (sección 3) ────────────────────────────────────────────────
  // Cromático y Mirador Sta. Teresita están en RESERVA (sin permiso de edificación):
  // su velocidad de venta se mide con RESERVAS, no promesas.
  const velRes = proyecto === 'CROMATICO' || proyecto === 'MIRADOR SANTA TERESITA';
  const velFld = velRes ? 'fecha_reserva' : 'fecha_promesa';
  const velWord = velRes ? 'reservas' : 'promesas';
  const velWord1 = velRes ? 'reserva' : 'promesa';
  // Anio del corte: el grafico acumulado y el presupuesto se acotan a ese anio.
  const velYr = ((typeof MOV_CORTE === 'string' && MOV_CORTE) ? MOV_CORTE : String(new Date().getFullYear())).slice(0,4);
  const velRowsData = ALL_DATA_MOV.filter(d =>
    d.proyecto === proyecto &&
    d[velFld] &&
    (velRes ? d.estado_corte === 'RESERVADO'
            : (d.estado_corte === 'PROMESADO' || d.estado_corte === 'ESCRITURADO')) &&
    !/LOCAL|PLACA/i.test(d.subagrupacion || '')

  const velTotal = velCalc(velRowsData, CORTE_DATE, velFld);
  // Stock principal disponible (excl. locales/placa) y MAO = stock ÷ velocidad 2026
  const stockDisp = (ALL_DATA || []).filter(d =>
    d.proyecto === proyecto && d.estado_corte === 'DISPONIBLE' && !/LOCAL|PLACA/i.test(d.subagrupacion || '')
  ).length;
  const mao = (velTotal.y2026n > 0) ? (stockDisp / velTotal.y2026n).toFixed(1) : null;
  // Stock principal disponible por subagrupación (para el MAO de cada una)
  const stockDispSub = {};
  for (const d of (ALL_DATA || [])) {
    if (d.proyecto !== proyecto || d.estado_corte !== 'DISPONIBLE' || /LOCAL|PLACA/i.test(d.subagrupacion || '')) continue;
    const s = d.subagrupacion || 'Sin subagrupación';
    stockDispSub[s] = (stockDispSub[s] || 0) + 1;
  }
  const velSubs  = [...new Set(velRowsData.map(d => d.subagrupacion || 'Sin subagrupación'))].sort();
  const vV = x => `<span class="vel-sub-val" style="width:50px"><b>${x}</b></span>`;
  const maoCell = txt => `<span class="vel-sub-val" style="width:54px;color:#E1093F"><b>${txt}</b></span>`;
  // Filas por subagrupación (solo si hay más de una)
  const perSubRows = velSubs.length > 1
    ? velSubs.map(sub => {
        const vc = velCalc(velRowsData.filter(d => (d.subagrupacion||'Sin subagrupación') === sub), CORTE_DATE, velFld);
        const maoSub = (vc.y2026n > 0) ? (stockDispSub[sub]||0) / vc.y2026n : null;
        return `<div class="vel-sub-row"><span class="vel-sub-name">${sub}</span>${vV(vc.hist)}${vV(vc.w12)}${vV(vc.w6)}${vV(vc.w3)}${vV(vc.y2026)}${maoCell(maoSub!=null?maoSub.toFixed(1):'—')}</div>`;
      }).join('')
    : '';
  // Fila TOTAL del proyecto (se incluye siempre que haya datos, también para mono-subagrupación)
  const totalRow = velSubs.length >= 1
    ? `<div class="vel-sub-row" style="border-top:2px solid #111111"><span class="vel-sub-name" style="font-weight:700">TOTAL</span>${vV(velTotal.hist)}${vV(velTotal.w12)}${vV(velTotal.w6)}${vV(velTotal.w3)}${vV(velTotal.y2026)}${maoCell(mao!=null?mao:'—')}</div>`
    : '';
  const velSubHTML = perSubRows + totalRow;
  const velChip = (lbl,val) => `<span style="background:#f0f3f7;border-radius:12px;padding:3px 11px;font-size:11px;color:#111111;white-space:nowrap"><span style="color:#888">${lbl}</span> <b>${val}</b></span>`;

  // ── Meses para agotar el stock — por etapa (selector de velocidad + modo manual) ──
  const maoEtapas = velSubs.length > 1 ? velSubs : [];
  const maoBuild = (nombre, rows, stock) => {
    const vc = velCalc(rows, CORTE_DATE, velFld);
    return { nombre, stock, vel: { w3:+vc.w3, w6:+vc.w6, w12:+vc.w12, hist:+vc.hist, y2026:+vc.y2026 } };
  };
  const maoRowsEtapas = maoEtapas.map(sub => maoBuild(sub, velRowsData.filter(d => (d.subagrupacion||'Sin subagrupación')===sub), stockDispSub[sub]||0));
  const maoTotal = maoBuild('TOTAL', velRowsData, stockDisp);
  MAO_DATA[tabId] = { etapas: maoRowsEtapas, total: maoTotal, corte: CORTE_DATE ? CORTE_DATE.toISOString().substring(0,10) : null, velWord };

  const mesesAgotarHTML = `
  <div class="proj-box" style="margin-top:14px">
    <h3>Meses para agotar el stock — por etapa</h3>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.6px;margin-right:2px">Velocidad</span>
      <div class="filter-group" id="maobtns-${tabId}">
        <button class="chart-filter-btn" onclick="setMAOMode('${tabId}','w3',this)">3 meses</button>
        <button class="chart-filter-btn" onclick="setMAOMode('${tabId}','w6',this)">6 meses</button>
        <button class="chart-filter-btn" onclick="setMAOMode('${tabId}','w12',this)">12 meses</button>
        <button class="chart-filter-btn" onclick="setMAOMode('${tabId}','hist',this)">Histórica</button>
        <button class="chart-filter-btn metric-active" onclick="setMAOMode('${tabId}','y2026',this)">2026</button>
        <button class="chart-filter-btn" onclick="setMAOMode('${tabId}','manual',this)">✎ Manual</button>
      </div>
      <span id="maomanual-wrap-${tabId}" style="display:none;align-items:center;gap:6px;margin-left:8px">
        <span style="font-size:11px;color:#888">Vender todo el stock antes de</span>
        <input type="date" id="maomanual-date-${tabId}" onchange="applyMAOManual('${tabId}')" style="border:1.5px solid #d0d0d8;border-radius:4px;padding:3px 6px;font-size:11px">
      </span>
    </div>
    <div id="maotbl-${tabId}" style="margin-top:12px"></div>
    <p class="nota" style="margin-top:6px">Meses p/agotar = stock disponible ÷ velocidad seleccionada. "Manual" invierte el cálculo: dada una fecha objetivo, muestra a qué velocidad mensual hay que vender para agotar el stock antes de esa fecha.</p>
  </div>`;

  const velSecHTML = `
  <div class="proj-box">
    <h3>Velocidad de Venta — un/mes (${velWord})${velRes?' · proyecto en reserva':''}</h3>
    <div class="vel-row" style="margin-top:8px">
      <div class="vel-item"><div class="vel-num">${velTotal.y2026}</div><div class="vel-label">Velocidad 2026<br>(acum. año)</div></div>
      <div class="vel-item"><div class="vel-num">${velTotal.hist}</div><div class="vel-label">Velocidad Histórica<br>(desde 1ª ${velWord1})</div></div>
      <div class="vel-item"><div class="vel-num" style="color:${mao!=null?'#E1093F':'#bbb'}">${mao!=null?mao:'—'}</div><div class="vel-label">MAO · meses p/agotar<br>stock (${stockDisp} disp.)</div></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.6px;margin-right:2px">Velocidad móvil (un/mes)</span>
      ${velChip('Histórica',velTotal.hist)}${velChip('12m',velTotal.w12)}${velChip('6m',velTotal.w6)}${velChip('3m',velTotal.w3)}${velChip('2026',velTotal.y2026)}
    </div>
    ${velSubHTML ? `<div class="vel-sub-wrap">
      <div class="vel-sub-head"><span>Subagrupación</span><span style="width:50px">Hist.</span><span style="width:50px">12m</span><span style="width:50px">6m</span><span style="width:50px">3m</span><span style="width:50px">2026</span><span style="width:54px">MAO</span></div>
      ${velSubHTML}
    </div>` : ''}
    <p class="nota" style="margin-top:10px">MAO = stock principal disponible ÷ velocidad 2026. Ventanas móviles = ${velWord} de los últimos N meses ÷ N. Excluye locales y placa comercial.${velRes?' Proyecto en reserva (sin permiso de edificación): la venta se mide con reservas.':''}</p>
  </div>
  ${mesesAgotarHTML}
  <div class="proj-box" style="margin-top:14px">
    <h3>${velRes?'Reservas':'Promesas'} acumuladas ${velYr} — Departamentos</h3>
    <div class="chart-filters" style="margin:2px 0 4px">
      <span class="filter-label">Métrica</span>
      <div class="filter-group">
        <button class="chart-filter-btn metric-active" onclick="velSetMetric('velchart-${tabId}','${proyecto}','UN',this)">Unidades</button>
        <button class="chart-filter-btn" onclick="velSetMetric('velchart-${tabId}','${proyecto}','UF',this)">UF</button>
      </div>
    </div>
    <div style="position:relative;height:340px;margin-top:10px">
      <canvas id="velchart-${tabId}"></canvas>
    </div>
    <p style="font-size:11px;color:#888;margin-top:8px">Acumulado de ${velWord} mes a mes durante ${velYr}, contra el presupuesto comercial del mismo período. Vista agrupada de Departamentos: excluye locales, placa comercial y oficinas.${velRes?' Este proyecto aún no promesa: la venta se cierra con la reserva, así que su acumulado se compara contra la misma meta del presupuesto.':''}</p>
  </div>
  <div class="proj-box" style="margin-top:14px">
    <h3>Ventas por Período — Departamentos</h3>
    <div class="chart-filters" id="vpp-filt-${tabId}" style="margin:2px 0 4px">
      <span class="filter-label">Período</span>
      <div class="filter-group">
        <button class="chart-filter-btn metric-active" data-g="periodo" data-v="meses" onclick="setVPP('${tabId}','${proyEsc}','periodo','meses',this)">Meses</button>
        <button class="chart-filter-btn" data-g="periodo" data-v="trimestres" onclick="setVPP('${tabId}','${proyEsc}','periodo','trimestres',this)">Trimestres</button>
        <button class="chart-filter-btn" data-g="periodo" data-v="semestres" onclick="setVPP('${tabId}','${proyEsc}','periodo','semestres',this)">Semestres</button>
        <button class="chart-filter-btn" data-g="periodo" data-v="anios" onclick="setVPP('${tabId}','${proyEsc}','periodo','anios',this)">Años</button>
      </div>
      <span class="filter-label">Ventana</span>
      <div class="filter-group">
        <button class="chart-filter-btn metric-active" data-g="ventana" data-v="historica" onclick="setVPP('${tabId}','${proyEsc}','ventana','historica',this)">Histórica</button>
        <button class="chart-filter-btn" data-g="ventana" data-v="24m" onclick="setVPP('${tabId}','${proyEsc}','ventana','24m',this)">24 meses</button>
        <button class="chart-filter-btn" data-g="ventana" data-v="12m" onclick="setVPP('${tabId}','${proyEsc}','ventana','12m',this)">12 meses</button>
      </div>
      <span class="filter-label">Métrica</span>
      <div class="filter-group">
        <button class="chart-filter-btn metric-active" data-g="metrica" data-v="UN" onclick="setVPP('${tabId}','${proyEsc}','metrica','UN',this)">Unidades</button>
        <button class="chart-filter-btn" data-g="metrica" data-v="UF" onclick="setVPP('${tabId}','${proyEsc}','metrica','UF',this)">MUF</button>
      </div>
    </div>
    <div style="position:relative;height:300px;margin-top:10px">
      <canvas id="vppchart-${tabId}"></canvas>
    </div>
    <p style="font-size:11px;color:#888;margin-top:8px">Venta del período (no acumulada). En vista "Meses" la barra se apila: abajo las <span style="color:#E1093F"><b>promesas</b></span> (por fecha de promesa) y encima las <span style="color:#b07800"><b>reservas que todavía no pasan a promesa</b></span> (por fecha de reserva). Cada unidad entra <b>una sola vez</b>, según su estado actual. La <b>línea punteada</b> es el presupuesto comercial del mismo período; solo hay presupuesto cargado del año en curso, así que en períodos anteriores no aparece. Vista agrupada de Departamentos: excluye locales, placa comercial y oficinas.</p>
  </div>`;

  // ── Ensamblado final ──────────────────────────────────────────────────────
  document.getElementById(tabId).innerHTML = `
  <div class="proy-subnav">
    <select class="proy-select" onchange="switchProySec('${tabId}', this.value)">
      <option value="ventas">Ventas Totales</option>
      <option value="detalle">Detalle Unidades</option>
      <option value="precios">Scanner de Precios</option>
      <option value="pricing">Pricing</option>
      <option value="velocidad">Velocidad de Venta</option>
      <option value="secundarios">Secundarios</option>
    </select>
    <!-- Cotizaciones y Marketing: pestañas ocultas por ahora (se van a trabajar en otro
         entorno más adelante). El código (renderCotizacionesProyecto, renderMarketingProyecto,

// ─── PENETRACIÓN DE SECUNDARIOS (gauges por subagrupación) ───────────────────
const PEN_SPECS = {};   // tabId -> [{id, pct, label}]
const PEN_CHARTS = {};  // canvasId -> instancia Chart
function renderPenetracion(tabId){
  const specs = PEN_SPECS[tabId] || [];
  for (const sp of specs){
    const cv = document.getElementById(sp.id);
    if (!cv || typeof Chart === 'undefined') continue;
    if (PEN_CHARTS[sp.id]) PEN_CHARTS[sp.id].destroy();
    const col = sp.pct>=80 ? '#00B050' : sp.pct>=50 ? '#f0b429' : '#E1093F';
    PEN_CHARTS[sp.id] = new Chart(cv, {
      type:'doughnut',
      data:{ datasets:[{ data:[sp.pct, 100-sp.pct], backgroundColor:[col,'#ECECEC'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', animation:{duration:300},
        plugins:{ legend:{display:false}, tooltip:{enabled:false} } },
      plugins:[{ id:'c_'+sp.id, afterDraw(ch){
        const a=ch.chartArea; if(!a) return;
        const x=(a.left+a.right)/2, y=(a.top+a.bottom)/2, ctx=ch.ctx;
        ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=col; ctx.font='800 17px Calibri,Segoe UI,sans-serif';
        ctx.fillText(sp.pct+'%', x, y-3);
        ctx.fillStyle='#999'; ctx.font='700 8px Calibri,Segoe UI,sans-serif';
        ctx.fillText(sp.label.toUpperCase(), x, y+12);
        ctx.restore();
      }}]
    });
  }
}
function resizePenetracion(tabId){
  for (const sp of (PEN_SPECS[tabId]||[])) { const c=PEN_CHARTS[sp.id]; if(c) c.resize(); }
}

// ─── HISTÓRICO MENSUAL (año en curso) por proyecto ───────────────────────────
const HIST_METRIC = {};   // tabId -> 'UN' | 'UF'
const HIST_CHARTS = {};   // tabId -> instancia Chart
function setHistMetric(tabId, proyecto, metric, btn){
  HIST_METRIC[tabId] = metric;
  const wrap = document.getElementById('histfilt-' + tabId);
  if (wrap) wrap.querySelectorAll('.chart-filter-btn').forEach(b => b.classList.remove('metric-active'));
  if (btn) btn.classList.add('metric-active');
  renderHistMensual(tabId, proyecto);
}
function renderHistMensual(tabId, proyecto){
  const cv = document.getElementById('histchart-' + tabId);
  if (!cv || typeof Chart === 'undefined') return;
  if (HIST_CHARTS[tabId]) { HIST_CHARTS[tabId].destroy(); HIST_CHARTS[tabId] = null; }
  const metric = HIST_METRIC[tabId] || 'UN';
  const NOMB = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const yr  = (ACUM_CIERRE_MESES[0] || (new Date().getFullYear()+'-01')).substring(0,4);
  const cier = ACUM_CIERRE[proyecto] || {};
  const ppto = ACUM_PPTO_PROY[proyecto] || {};
  const div = metric === 'UF' ? 1000 : 1;
  const fRes = metric==='UF'?'resUF':'resUN', fProm = metric==='UF'?'promUF':'promUN';
  const fDes = metric==='UF'?'desUF':'desUN', fPp = metric==='UF'?'promUF':'promUN';
  const unit = metric==='UF' ? 'MUF' : 'un';
  // Mes en curso (no cerrado aún) → se calcula desde datos vivos
  const currentYM = (typeof MOV_CORTE === 'string' ? MOV_CORTE : '').slice(0,7);
  const curIdx = (currentYM && currentYM.slice(0,4) === yr && !cier[currentYM]) ? (parseInt(currentYM.slice(5,7))-1) : -1;
  // Cálculo vivo de un mes (reservas/promesas desde ALL_DATA_MOV, desistimientos desde ALL_DESIS)
  function liveMes(ym) {
    let rUn=0,rUf=0,pUn=0,pUf=0,dUn=0,dUf=0;
    for (const row of (ALL_DATA_MOV||[])) {
      if (row.proyecto !== proyecto) continue;
      const uf = parseFloat(row.precio_total_operacion_uf)||0;
      if (row.fecha_reserva && row.fecha_reserva.slice(0,7)===ym) { rUn++; rUf+=uf; }
      if (row.fecha_promesa && row.fecha_promesa.slice(0,7)===ym) { pUn++; pUf+=uf; }
    }
    for (const c of (ALL_DESIS||[])) {
      if (c.proyecto !== proyecto) continue;
      if (c.fecha_cancelacion && c.fecha_cancelacion.slice(0,7)===ym) { dUn++; dUf+=parseFloat(c.precio_uf)||0; }
    }
    return { r:(metric==='UF'?rUf:rUn)/div, pr:(metric==='UF'?pUf:pUn)/div, d:(metric==='UF'?dUf:dUn)/div };
  }
  // Unidades que se reservaron Y promesaron dentro del MISMO mes. La promesa ya
  // las representa, así que la reserva no debe volver a sumar: si no, la barra
  // cuenta dos veces el mismo negocio (Plaza Los Pinos junio marcaba 16 cuando
  // se movieron 10 unidades). Se calcula del snapshot, que es el único lugar con
  // fecha_reserva y fecha_promesa de la misma unidad; cierre_mensual solo guarda
  // los totales por separado.
  function solapeMes(ym) {
    let un=0, uf=0;
    for (const row of (ALL_DATA_MOV||[])) {
      if (row.proyecto !== proyecto) continue;
      if (!row.fecha_reserva || !row.fecha_promesa) continue;
      if (row.fecha_reserva.slice(0,7) !== ym || row.fecha_promesa.slice(0,7) !== ym) continue;
      un++; uf += parseFloat(row.precio_total_operacion_uf)||0;
    }
    return (metric==='UF'?uf:un)/div;
  }
  const res=[],prom=[],des=[],pp=[],tot=[],sol=[];
  NOMB.forEach((_,i) => {
    const ym = `${yr}-${String(i+1).padStart(2,'0')}`;
    const p = ppto[ym]||{};
    let r, pr, d;
    if (i === curIdx) { const lv = liveMes(ym); r=lv.r; pr=lv.pr; d=lv.d; }
    else { const c = cier[ym]||{}; r=(c[fRes]||0)/div; pr=(c[fProm]||0)/div; d=(c[fDes]||0)/div; }
    const s = Math.min(solapeMes(ym), r);   // no puede descontar más reservas de las que hubo
    const rNeta = Math.max(r - s, 0);
    res.push(rNeta); prom.push(pr); sol.push(s);
    des.push(d>0?-d:0); tot.push(pr);
    pp.push((p[fPp]||0)/div);
  });
  // Etiquetas: marcar el mes en curso con *
  const labels = NOMB.map((m,i) => i===curIdx ? m+'*' : m);
  // Colores: el mes en curso va en tono más claro (en desarrollo)
  const bg = (base, soft) => NOMB.map((_,i) => i===curIdx ? soft : base);
  const fnum = n => metric==='UF' ? Math.abs(n).toLocaleString('es-CL',{maximumFractionDigits:1}) : Math.round(Math.abs(n)).toLocaleString('es-CL');
  HIST_CHARTS[tabId] = new Chart(cv, {
    data:{ labels:labels, datasets:[
      {type:'bar', label:'Promesas', data:prom, backgroundColor:bg('#9cc1ec','#d2e3f6'), stack:'gestion', order:3},
      {type:'bar', label:'Resciliaciones', data:des, backgroundColor:bg('#c0392b','#e3a59e'), stack:'des', order:3},
      {type:'line', label:'Ppto ventas', data:pp, borderColor:'#2E4057', backgroundColor:'rgba(46,64,87,.05)', borderDash:[5,4], borderWidth:2.5, pointRadius:0, tension:.25, order:0}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'top', labels:{ font:{size:11}, boxWidth:12 } },
        tooltip:{ callbacks:{
          label:c => ` ${c.dataset.label}: ${fnum(c.parsed.y)} ${unit}`,
          afterBody:(items) => {
            const i = items && items.length ? items[0].dataIndex : -1;
            if (i < 0) return '';
            const out = [];
            // Deja explícito por qué la reserva convertida no vuelve a sumar.
            if (sol[i] > 0) out.push(`↳ ${fnum(sol[i])} ${unit} reservó y promesó en el mes: cuenta una sola vez, en Promesas`);
            return out;
          } } } },
      scales:{ x:{ stacked:true, grid:{display:false}, ticks:{font:{size:11}} },
        y:{ stacked:true, grid:{color:'rgba(0,0,0,.05)'}, ticks:{font:{size:10}, callback:v=>fnum(v)} } } },
    plugins:[{ id:'histtot_'+tabId, afterDatasetsDraw(ch){
      // Con las barras lado a lado el total va centrado sobre el grupo, no sobre una sola.
      const metas = ch.data.datasets.map(function(d,i){ return d.type==='bar' ? ch.getDatasetMeta(i) : null; })
                      .filter(Boolean);
      if (!metas.length) return;
      const ctx = ch.ctx; ctx.save();
      ctx.font='700 10px Calibri,Segoe UI,sans-serif'; ctx.fillStyle='#1A1A2E'; ctx.textAlign='center';
      tot.forEach(function(t,i){
        if (!(t>0)) return;
        const pts = metas.map(function(m){ return m.data[i]; }).filter(Boolean);
        if (!pts.length) return;
        const x = pts.reduce(function(a,p){ return a+p.x; },0)/pts.length;
        const y = Math.min.apply(null, pts.map(function(p){ return p.y; }));
        ctx.fillText(fnum(t), x, y - 6);
      });
      ctx.restore();
    }}]
  });
}

// ─── DONUTS: Vendido vs Disponible (Ventas Totales) ──────────────────────────
const PROY_DONUT = {};          // tabId -> { subs, bySub }
const PROY_DONUT_CHARTS = {};   // canvasId -> instancia Chart
function buildDonut(canvasId, vendido, disp, fmtFn){
  const cv = document.getElementById(canvasId);
  if(!cv || typeof Chart === 'undefined') return;
  const total = vendido + disp;
  const pctV  = total>0 ? (vendido/total*100) : 0;
  if (PROY_DONUT_CHARTS[canvasId]) PROY_DONUT_CHARTS[canvasId].destroy();
  PROY_DONUT_CHARTS[canvasId] = new Chart(cv, {
    type:'doughnut',
    data:{ labels:['Vendido','Disponible'],
      datasets:[{ data:[vendido,disp], backgroundColor:['#00B050','#D9D9D9'],
        borderColor:'#fff', borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', animation:{duration:400},
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:c=>{
          const v=c.parsed; const p=total>0?(v/total*100):0;
          return c.label+': '+fmtFn(v)+' ('+p.toFixed(1)+'%)'; } } } } },
    plugins:[{ id:'ctr_'+canvasId, afterDraw(ch){
        const a=ch.chartArea; if(!a) return;
        const x=(a.left+a.right)/2, y=(a.top+a.bottom)/2, ctx=ch.ctx;
        ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#00B050'; ctx.font='800 21px Calibri,Segoe UI,sans-serif';
        ctx.fillText(Math.round(pctV)+'%', x, y-6);
        ctx.fillStyle='#999'; ctx.font='700 9px Calibri,Segoe UI,sans-serif';
        ctx.fillText('VENDIDO', x, y+12);
        ctx.restore();
      } }]
  });
  // Leyenda dinámica bajo el donut (valor + %)
  const foot = document.getElementById('foot-'+canvasId);
  if(foot){
    const pv = total>0 ? vendido/total*100 : 0;
    const pd = total>0 ? disp/total*100 : 0;
    foot.innerHTML =
      `<div class="lg"><span class="nm"><span class="sw" style="background:#00B050"></span>Vendido</span><span class="vl">${fmtFn(vendido)} \u00b7 ${pv.toFixed(0)}%</span></div>`+
      `<div class="lg"><span class="nm"><span class="sw" style="background:#D9D9D9"></span>Disponible</span><span class="vl">${fmtFn(disp)} \u00b7 ${pd.toFixed(0)}%</span></div>`;
  }
}
function renderProyDonuts(tabId, sub){
  const d = PROY_DONUT[tabId]; if(!d) return;
  let vUn=0,dUn=0,vUf=0,dUf=0;
  const keys = (sub && sub!=='__all__') ? [sub] : d.subs;
  keys.forEach(s=>{ const x=d.bySub[s]; if(!x) return;
    vUn+=x.vUn; dUn+=x.dUn; vUf+=x.vUf; dUf+=x.dUf; });
  buildDonut('donut-un-'+tabId, vUn, dUn, fmt);
  buildDonut('donut-uf-'+tabId, vUf, dUf, fmtUF);
}
function setProyDonutSub(tabId, sub, btn){
  const wrap = document.getElementById('donutfilt-'+tabId);
  if(wrap) wrap.querySelectorAll('.chart-filter-btn').forEach(b=>b.classList.remove('metric-active'));
  if(btn) btn.classList.add('metric-active');
  renderProyDonuts(tabId, sub);
}

const VEL_METRIC = {};                 // canvasId -> 'UN' | 'UF' (metrica del acumulado)
// Cambia la metrica del grafico acumulado y lo vuelve a dibujar.

const VEL_COLORS = ['#E1093F','#006400','#2E4057','#00B050','#B8860B','#7B2D8E','#1F77B4','#FF7F0E'];
let MAO_DATA = {};        // tabId -> { etapas:[{nombre,stock,vel:{w3,w6,w12,hist,y2026}}], total:{...}, corte, velWord }
let VEL_MONTH_CHARTS = {}; // canvasId -> instancia Chart (Ventas por Período)

// ── Meses para agotar el stock: tabla por etapa según la ventana de velocidad elegida ──
const MESES_MES_MS = 1000*60*60*24*30.44;
function fmtMesesAgotar(meses){
  if (meses == null || !isFinite(meses)) return { txt:'—', eq:'—', fecha:'—' };
  const txt = meses.toFixed(1);
  const eq = meses >= 24 ? (meses/12).toFixed(1)+' años' : meses.toFixed(1)+' meses';
  let fecha = '—';
  if (CORTE_DATE) {
    const d = new Date(CORTE_DATE.getTime() + meses*MESES_MES_MS);
    const MESES_ES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    fecha = MESES_ES3[d.getMonth()] + ' ' + d.getFullYear();
  }
  return { txt, eq, fecha };
}
function renderMAOTable(tabId, mode){
  const box = document.getElementById('maotbl-' + tabId);
  const md = MAO_DATA[tabId];
  if (!box || !md) return;
  const rows = [...md.etapas, md.total];
  let h = `<table style="box-shadow:none"><thead><tr>
    <th class="left">Etapa</th><th>Stock disp.</th><th>Velocidad<br>(${md.velWord}/mes)</th>
    <th>Meses p/agotar</th><th>Equivale a</th><th>Se agota &gt;</th></tr></thead><tbody>`;
  for (const r of rows) {
    const vel = r.vel[mode] || 0;
    const meses = vel > 0 ? r.stock / vel : (r.stock > 0 ? Infinity : null);
    const f = fmtMesesAgotar(meses);
    const isTot = r.nombre === 'TOTAL';
    h += `<tr${isTot ? ' class="total-row"' : ''}><td>${r.nombre}</td><td>${r.stock}</td><td>${vel.toFixed(2)}</td>` +
      `<td style="color:#E1093F;font-weight:700">${f.txt}</td><td>${f.eq}</td><td>${f.fecha}</td></tr>`;
  }
  h += '</tbody></table>';
  box.innerHTML = h;
}
function setMAOMode(tabId, mode, btn){
  const wrap = document.getElementById('maomanual-wrap-' + tabId);
  if (btn && btn.parentElement) {
    [...btn.parentElement.children].forEach(b => b.classList.remove('metric-active'));
    btn.classList.add('metric-active');
  }
  if (mode === 'manual') {
    if (wrap) wrap.style.display = 'inline-flex';
    applyMAOManual(tabId);
  } else {
    if (wrap) wrap.style.display = 'none';
    renderMAOTable(tabId, mode);
  }
}
function applyMAOManual(tabId){
  const box = document.getElementById('maotbl-' + tabId);
  const md = MAO_DATA[tabId];
  const dateInput = document.getElementById('maomanual-date-' + tabId);
  if (!box || !md) return;
  const target = dateInput && dateInput.value ? new Date(dateInput.value) : null;
  if (!target || !CORTE_DATE || isNaN(target)) {
    box.innerHTML = '<p class="nota">Elige una fecha objetivo para calcular la velocidad requerida.</p>';
    return;
  }
  const mesesRestantes = Math.max((target - CORTE_DATE) / MESES_MES_MS, 0.01);
  const rows = [...md.etapas, md.total];
  let h = `<table style="box-shadow:none"><thead><tr>
    <th class="left">Etapa</th><th>Stock disp.</th><th>Meses restantes</th>
    <th>Velocidad requerida<br>(${md.velWord}/mes)</th><th>Velocidad actual (2026)</th><th>¿Alcanza?</th></tr></thead><tbody>`;
  for (const r of rows) {
    const velReq = r.stock > 0 ? r.stock / mesesRestantes : 0;
    const velAct = r.vel.y2026 || 0;
    const alcanza = r.stock === 0 ? true : velAct >= velReq;
    const isTot = r.nombre === 'TOTAL';
    h += `<tr${isTot ? ' class="total-row"' : ''}><td>${r.nombre}</td><td>${r.stock}</td><td>${mesesRestantes.toFixed(1)}</td>` +
      `<td style="color:#E1093F;font-weight:700">${velReq.toFixed(2)}</td><td>${velAct.toFixed(2)}</td>` +
      `<td class="${alcanza?'ok':'crit'}">${alcanza?'Sí':'No'}</td></tr>`;
  }
  h += '</tbody></table>';
  box.innerHTML = h;
}

// ── Velocidad Mensual (no acumulada, doble eje): promesa / reserva sin promesa ──
// ── Ventas por Período — Departamentos (Período / Ventana / Métrica) ──────────
const VPP_STATE = {}; // tabId -> { periodo:'meses'|'trimestres'|'semestres'|'anios', ventana:'historica'|'24m'|'12m', metrica:'UN'|'UF' }
function setVPP(tabId, proyecto, grupo, valor, btn){
  const st = VPP_STATE[tabId] || (VPP_STATE[tabId] = { periodo:'meses', ventana:'historica', metrica:'UN' });
  st[grupo === 'metrica' ? 'metrica' : grupo] = valor;
  const wrap = document.getElementById('vpp-filt-' + tabId);
  if (wrap && btn) {
    wrap.querySelectorAll(`.chart-filter-btn[data-g="${grupo}"]`).forEach(b => b.classList.remove('metric-active'));
    btn.classList.add('metric-active');
  }
  renderVPPChart(tabId, proyecto);
}
function renderVPPChart(tabId, proyecto){
  const canvasId = 'vppchart-' + tabId;
  const cv = document.getElementById(canvasId);
  if (!cv || typeof Chart === 'undefined') return;
  const st = VPP_STATE[tabId] || (VPP_STATE[tabId] = { periodo:'meses', ventana:'historica', metrica:'UN' });
  const velRes = proyecto === 'CROMATICO' || proyecto === 'MIRADOR SANTA TERESITA';
  const velFld = velRes ? 'fecha_reserva' : 'fecha_promesa';
  // Cada unidad entra UNA sola vez, por su estado actual: si ya promesó va por
  // fecha_promesa; si sigue en reserva, por fecha_reserva. Como el criterio es el
  // estado vigente y no el evento, no hay forma de que una unidad se cuente dos
  // veces (a diferencia del Histórico Mensual, que sí es por evento).
  const esResSinProm = d => !velRes && d.estado_corte === 'RESERVADO' && d.fecha_reserva && !d.fecha_promesa;
  const fechaDe = d => esResSinProm(d) ? d.fecha_reserva : d[velFld];
  // Vista "Departamentos" agrupada: excluye locales, placa comercial y oficinas.
  let filas = ALL_DATA_MOV.filter(d =>
    d.proyecto === proyecto &&
    !/LOCAL|PLACA|OFICINA/i.test(d.subagrupacion || '') &&
    ( velRes
        ? (d.estado_corte === 'RESERVADO' && d.fecha_reserva)
        : ( (d.fecha_promesa && (d.estado_corte === 'PROMESADO' || d.estado_corte === 'ESCRITURADO'))
            || esResSinProm(d) ) )
  );
  if (!filas.length) { cv.parentElement.innerHTML = `<p style="color:#999;font-size:12px;padding:20px 0">Sin ${velRes?'reservas':'promesas'} registradas para graficar.</p>`; return; }

  // Ventana: recorta al rango de meses antes de agrupar por período
  const hoy = CORTE_DATE || new Date();
  if (st.ventana !== 'historica') {
    const nMeses = st.ventana === '24m' ? 24 : 12;
    const desdeCorte = new Date(hoy.getTime()); desdeCorte.setMonth(desdeCorte.getMonth() - nMeses);
    const desdeStr = desdeCorte.toISOString().substring(0,10);
    filas = filas.filter(d => fechaDe(d) >= desdeStr);
  }
  if (!filas.length) { cv.parentElement.innerHTML = `<p style="color:#999;font-size:12px;padding:20px 0">Sin datos en la ventana seleccionada.</p>`; return; }

  // Clave de período (bucket) según selector
  const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const bucketOf = (fechaStr) => {
    const [y, m] = fechaStr.substring(0,7).split('-').map(Number);
    if (st.periodo === 'meses')      return { key:`${y}-${String(m).padStart(2,'0')}`, label: MESES_ES[m-1]+' '+String(y).substring(2), sortY:y, sortSub:m };
    if (st.periodo === 'trimestres') { const q = Math.ceil(m/3); return { key:`${y}-Q${q}`, label:`T${q} ${String(y).substring(2)}`, sortY:y, sortSub:q }; }
    if (st.periodo === 'semestres')  { const s = m<=6?1:2; return { key:`${y}-S${s}`, label:`S${s} ${String(y).substring(2)}`, sortY:y, sortSub:s }; }
    return { key:`${y}`, label:`${y}`, sortY:y, sortSub:1 };
  };

  const val = d => st.metrica === 'UF' ? (parseFloat(d.precio_total_operacion_uf)||0)/1000 : 1;

  const buckets = {}; // key -> { label, sortY, sortSub, res, prom }
  for (const d of filas) {
    const b = bucketOf(fechaDe(d));
    if (!buckets[b.key]) buckets[b.key] = { label:b.label, sortY:b.sortY, sortSub:b.sortSub, res:0, prom:0 };
    const v = val(d);
    if (velRes || esResSinProm(d)) buckets[b.key].res += v;
    else buckets[b.key].prom += v;
  }
  // Los periodos sin ventas deben verse como 0, no desaparecer del eje.
  (function rellenarPeriodosVacios(){
    const corteStr = hoy.toISOString().substring(0,10);
    let desdeFill = null;
    if (st.ventana !== 'historica') {
      const nM = st.ventana === '24m' ? 24 : 12;
      const dd = new Date(hoy.getTime()); dd.setMonth(dd.getMonth() - nM);
      desdeFill = dd.toISOString().substring(0,10);
    } else {
      for (const d of filas) { const f = fechaDe(d); if (f && (desdeFill === null || f < desdeFill)) desdeFill = f; }
    }
    if (!desdeFill) return;
    let y = Number(desdeFill.substring(0,4)), m = Number(desdeFill.substring(5,7));
    const yF = Number(corteStr.substring(0,4)), mF = Number(corteStr.substring(5,7));
    let guard = 0;
    while ((y < yF || (y === yF && m <= mF)) && guard++ < 1200) {
      const b = bucketOf(y + '-' + String(m).padStart(2,'0') + '-01');
      if (!buckets[b.key]) buckets[b.key] = { label:b.label, sortY:b.sortY, sortSub:b.sortSub, res:0, prom:0 };
      m++; if (m > 12) { m = 1; y++; }
    }
  })();
  const keys = Object.keys(buckets).sort((a,b) => {
    const A=buckets[a], B=buckets[b];
    return A.sortY - B.sortY || A.sortSub - B.sortSub;
  });
  const labels = keys.map(k => buckets[k].label);
  const dReserva = keys.map(k => Math.round(buckets[k].res*10)/10);
  const dPromesa = keys.map(k => Math.round(buckets[k].prom*10)/10);
  const showStatus = st.periodo === 'meses';   // el desglose promesa/reserva solo aporta a nivel mensual

  // ── Línea de presupuesto del período ──
  // Mismo universo que las barras (Departamentos, sin locales/placa/oficinas) y
  // misma fuente que el gráfico acumulado: ACUM_PPTO_SUB. Solo hay presupuesto
  // cargado del año en curso, así que los períodos de otros años quedan en null
  // y la línea simplemente no se dibuja ahí.
  const pptoSub = (typeof ACUM_PPTO_SUB === 'object' && ACUM_PPTO_SUB[proyecto]) || {};
  const campoPpto = st.metrica === 'UF' ? 'promUF' : 'promUN';
  const divPpto = st.metrica === 'UF' ? 1000 : 1;
  const pptoBucket = {};
  Object.keys(pptoSub).forEach(function(sub){
    if (/LOCAL|PLACA|OFICINA/i.test(sub || '')) return;
    Object.keys(pptoSub[sub]).forEach(function(ym){
      const celda = pptoSub[sub][ym]; if (!celda) return;
      const v = (celda[campoPpto] || 0) / divPpto;
      if (!v) return;
      const b = bucketOf(ym + '-01');
      pptoBucket[b.key] = (pptoBucket[b.key] || 0) + v;
    });
  });
  const dPpto = keys.map(k => (k in pptoBucket) ? Math.round(pptoBucket[k]*10)/10 : null);
  const hayPpto = dPpto.some(v => v != null);

  const datasets = [];
  if (velRes) {
    datasets.push({ type:'bar', label:'Reservas', data:dReserva, backgroundColor:'#b07800' });
  } else if (showStatus) {
    // Abajo lo cerrado (promesa), encima lo que todavia esta en reserva: se lee
    // de una cuanto del periodo ya promeso y cuanto sigue pendiente de convertir.
    datasets.push({ type:'bar', label:'Promesas', data:dPromesa, backgroundColor:'#E1093F', stack:'s' });
    datasets.push({ type:'bar', label:'Reservas sin promesa', data:dReserva, backgroundColor:'#b07800', stack:'s' });
  } else {
    const dTot = keys.map((k,i) => dPromesa[i] + dReserva[i]);
    datasets.push({ type:'bar', label:'Departamentos', data:dTot, backgroundColor:'#E1093F', stack:'s' });
  }
  datasets.forEach(function(ds){ if (ds.type === 'bar') ds.order = 3; });
  if (hayPpto) datasets.push({ type:'line', label:'Ppto ventas', data:dPpto,
    borderColor:'#2E4057', backgroundColor:'rgba(46,64,87,.05)', borderDash:[5,4],
    borderWidth:2, pointRadius:0, tension:.25, spanGaps:false, order:1 });

  const unit = st.metrica === 'UF' ? 'MUF' : 'un';
  if (VEL_MONTH_CHARTS[canvasId]) VEL_MONTH_CHARTS[canvasId].destroy();
  VEL_MONTH_CHARTS[canvasId] = new Chart(cv, {
    data: { labels, datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'top', labels:{ font:{size:11}, boxWidth:14 } },
        tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${c.parsed.y} ${unit}` } } },
      scales:{
        x:{ stacked:true, ticks:{ font:{size:10}, maxRotation:60, minRotation:0 }, grid:{ display:false } },
        y:{ stacked:true, beginAtZero:true, title:{ display:true, text:unit }, ticks:{ font:{size:10} } }
      }
    }
  });
}

// Acumulado del anio en curso: real vs presupuesto, en unidades o en UF.
// El presupuesto vive en ACUM_PPTO_SUB[proyecto][subagrupacion]['YYYY-MM'] y solo
// existe para el anio presupuestado, por eso el grafico se acota a ese anio.
function renderVelChart(canvasId, proyecto){
  const cv = document.getElementById(canvasId);
  if(!cv || typeof Chart === 'undefined') return;
  const metric = VEL_METRIC[canvasId] || 'UN';
  const esUF = metric === 'UF';

  // Cromatico / Mirador Sta. Teresita: en reserva -> se grafica con reservas, no promesas
  const velRes = proyecto === 'CROMATICO' || proyecto === 'MIRADOR SANTA TERESITA';
  const velFld = velRes ? 'fecha_reserva' : 'fecha_promesa';
  // Vista "Departamentos": excluye locales, placa comercial y oficinas.
  const esDepto = function(sub){ return !/LOCAL|PLACA|OFICINA/i.test(sub || ''); };

  // Manda el anio del corte: es el anio que tiene presupuesto cargado.
  const corte = (typeof MOV_CORTE === 'string' && MOV_CORTE) ? MOV_CORTE : '';
  const yr = corte ? corte.slice(0,4) : String(new Date().getFullYear());
  const cutYM = corte.slice(0,7);

  const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const meses = [];
  for (let i = 1; i <= 12; i++) meses.push(yr + '-' + String(i).padStart(2,'0'));
  const labels = meses.map(function(m){ return MESES_ES[+m.slice(5) - 1] + ' ' + yr.slice(2); });

  // ── Serie real: acumulado del anio, cortada en el mes del corte ──
  const porMes = {}; meses.forEach(function(m){ porMes[m] = 0; });
  (ALL_DATA_MOV || []).forEach(function(d){
    if (d.proyecto !== proyecto) return;
    if (!esDepto(d.subagrupacion)) return;
    if (!d[velFld]) return;
    const ok = velRes ? d.estado_corte === 'RESERVADO'
                      : (d.estado_corte === 'PROMESADO' || d.estado_corte === 'ESCRITURADO');
    if (!ok) return;
    const k = d[velFld].substring(0,7);
    if (!(k in porMes)) return;
    porMes[k] += esUF ? (parseFloat(d.precio_total_operacion_uf) || 0) : 1;
  });
  // Hasta donde dibujar: el ultimo mes con movimiento, o el del corte si es posterior.
  // No se usa solo MOV_CORTE porque puede quedar en el cierre del mes anterior.
  let ultimo = cutYM;
  meses.forEach(function(m){ if (porMes[m] > 0 && m > ultimo) ultimo = m; });
  let accR = 0;
  const real = meses.map(function(m){
    accR += porMes[m];
    // Los meses sin movimiento todavia quedan en null para que la linea se corte ahi.
    return (ultimo && m > ultimo) ? null : Math.round(accR);
  });

  // ── Serie presupuesto: mismas subagrupaciones, acumulado del anio ──
  const pptoSub = (typeof ACUM_PPTO_SUB === 'object' && ACUM_PPTO_SUB[proyecto]) || {};
  const campo = esUF ? 'promUF' : 'promUN';
  const pptoMes = {}; meses.forEach(function(m){ pptoMes[m] = 0; });
  Object.keys(pptoSub).forEach(function(sub){
    if (!esDepto(sub)) return;
    meses.forEach(function(m){
      const celda = pptoSub[sub][m];
      if (celda) pptoMes[m] += (celda[campo] || 0);
    });
  });
  let accP = 0;
  const ppto = meses.map(function(m){ accP += pptoMes[m]; return Math.round(accP); });
  // El presupuesto viene rotulado como "Promesas", pero es la meta de venta comercial.
  // En los proyectos que todavia no pueden promesar la venta se cierra con la reserva,
  // asi que su acumulado de reservas se compara igual contra esa meta.
  const hayPpto = accP > 0;

  if (!accR && !hayPpto){
    cv.parentElement.innerHTML = '<p style="color:#999;font-size:12px;padding:20px 0">Sin '
      + (velRes ? 'reservas' : 'promesas') + ' ni presupuesto de departamentos en ' + yr + '.</p>';
    return;
  }

  const datasets = [{
    label: velRes ? 'Reservas' : 'Promesas',
    data: real,
    borderColor: VEL_COLORS[0], backgroundColor: VEL_COLORS[0],
    tension: 0.25, borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, spanGaps: false
  }];
  if (hayPpto) datasets.push({
    label: 'Presupuesto',
    data: ppto,
    borderColor: '#2E4057', backgroundColor: '#2E4057',
    borderDash: [6,4], tension: 0.25, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4
  });

  const unidad = esUF ? 'UF acum.' : 'un. acum.';
  const fmt = function(n){ return Math.round(n).toLocaleString('es-CL'); };

  if (VEL_CHARTS[canvasId]) VEL_CHARTS[canvasId].destroy();
  VEL_CHARTS[canvasId] = new Chart(cv, {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 14 } },
        tooltip: { callbacks: { label: function(c){
          return c.dataset.label + ': ' + (c.parsed.y == null ? '—' : fmt(c.parsed.y) + ' ' + unidad);
        } } }
      },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 60, minRotation: 0 }, grid: { display: false } },
        y: { beginAtZero: true,
             title: { display: true, text: esUF ? 'UF acumuladas' : 'Unidades acumuladas' },
             ticks: { precision: 0, font: { size: 10 } } }
      }
    }
  });
}

let ALL_COTIZ    = [];  // cotizaciones_pok crudo → pestaña Cotizaciones (canal / tipología)

                               // (mismo mes que reporta Resumen Mes — ver avanceAnioProy más abajo)

                          // cuando difiere de MOV_CORTE real (mes reabierto sin cierre oficial).
                          // Los tooltips showMovTip/showResStockTip usan este en vez de MOV_CORTE
                          // para no romper el indicador de "mes en curso" del tab Proyectos.
let SEC_DISP     = {};  // secundarios disponibles: proyecto → tipo → sub → {UN,UF} (para el resumen PxQ del Scanner)
let TERRAZA_BY_ID = {}; // id_producto → sup_terraza (m²), para el UF/m² del Scanner (m² útil + ½ terraza)

let CONV_ESCR_TIP_HTML = '';  // tooltip conversión Promesa→Escritura por proyecto (Backlog)
let CORTE_DATE = null;   // fecha del último corte (Date), poblada en init()
let ANCLA_ESCR = {};     // 'proyecto|subagrupacion' → fecha_inicio_escrituracion (ancla del backlog de promesas)
// Inicio efectivo del reloj de escrituración para una promesa: máx(fecha_promesa, inicio_escrituración).
// Si no hay fecha de inicio cargada en hitos_escrituracion, cae a la fecha de promesa.
function anclaInicio(proyecto, sub, fechaPromesa) {
  const ini = ANCLA_ESCR[proyecto + '|' + (sub || '')];
  if (ini && fechaPromesa && ini > fechaPromesa) return ini;
  return fechaPromesa;
}

// Velocidad de promesas: histórica (desde 1ª promesa del set) y acumulada 2026.
// rows = unidades con fecha_promesa (promesadas/escrituradas). refDate = fecha de corte.
function velCalc(rows, refDate, field){
  field = field || 'fecha_promesa';   // Cromático/Mirador: 'fecha_reserva' (venta = reserva)
  const EMPTY = { hist:'—', w12:'—', w6:'—', w3:'—', y2026:'—', y2026n:0 };
  if(!rows || !rows.length) return EMPTY;
  const ref = refDate || new Date();
  const fechas = rows.map(r => new Date(r[field])).filter(d => !isNaN(d));
  if(!fechas.length) return EMPTY;
  const primera = new Date(Math.min(...fechas));
  const MS_MES = 1000*60*60*24*30.44;
  const mesesHist = Math.max(1, (ref - primera) / MS_MES);
  const meses2026 = Math.max(1, (ref - new Date('2026-01-01')) / MS_MES);
  const rows2026 = rows.filter(r => (r[field] || '') >= '2026-01-01');
  // Ventana móvil: eventos en los últimos N meses ÷ N
  const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const win = (months) => {
    const from = new Date(ref); from.setMonth(from.getMonth() - months);
    const fromStr = ymd(from);
    const n = rows.filter(r => (r[field] || '') > fromStr).length;
    return (n / months).toFixed(1);
  };
  return {
    hist:  (rows.length / mesesHist).toFixed(1),
    w12:   win(12),
    w6:    win(6),
    w3:    win(3),
    y2026: (rows2026.length / meses2026).toFixed(1),
    y2026n: rows2026.length / meses2026   // numérico, para MAO
  };
}
// Set de "proyecto|subagrupacion" que SÍ llevan Scanner de Precios.
// Se llena en init() desde subagrupaciones_config.tiene_scanner (Supabase).
// Solo edificios en altura (departamentos/oficinas/torres). Locales, OfficeHome,
// Placa Comercial y Casas quedan fuera porque no tienen estructura piso x modelo.
let SC_SCANNER = new Set();
const SC_UNITS = {};
let   SC_UIDX  = 0;
let   SC_GIDX  = 0;
// UF/m² por tipología en el tiempo: tabId -> [{ canvasId, labels, datasets }, ...]
const SC_UFM2_SPECS  = {};
const SC_UFM2_CHARTS = {};   // canvasId -> instancia Chart
function renderScannerCharts(tabId){
  const specs = SC_UFM2_SPECS[tabId] || [];
  for (const spec of specs) {
    const cv = document.getElementById(spec.canvasId);
    if (!cv || typeof Chart === 'undefined') continue;
    if (SC_UFM2_CHARTS[spec.canvasId]) SC_UFM2_CHARTS[spec.canvasId].destroy();
    // Vista por defecto: solo la primera tipología visible (evita saturar el gráfico con todas las líneas).
    spec.datasets.forEach((ds,i) => { ds.hidden = spec.datasets.length > 1 && i !== 0; });
    SC_UFM2_CHARTS[spec.canvasId] = new Chart(cv, {
      type: 'line',

          tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${c.parsed.y!=null?('UF '+fmtUF(Math.round(c.parsed.y))+'/m²'):'—'}` } } },
        scales:{
          x:{ ticks:{ font:{size:9}, maxRotation:60, minRotation:0 }, grid:{display:false} },
          y:{ title:{display:true, text:'UF/m²'}, ticks:{ font:{size:10} } }
        }
      }
    });
  }
}
function resizeScannerCharts(tabId){
  for (const spec of (SC_UFM2_SPECS[tabId] || [])) {
    const c = SC_UFM2_CHARTS[spec.canvasId];
    if (c) c.resize();
  }
}
// Filtro de tipología del gráfico UF/m² en el tiempo: idx=-1 (Todas) muestra solo el Promedio
// ponderado del proyecto; idx>=0 aísla esa tipología (oculta el Promedio).
function scUfm2Filter(canvasId, idx, btn){
  const ch = SC_UFM2_CHARTS[canvasId];
  if (!ch) return;
  ch.data.datasets.forEach((ds,i) => {
    ds.hidden = idx === -1 ? !ds.isPromedio : (i !== idx);
  });
  ch.update();
  const wrap = btn ? btn.closest('.filter-group') : null;
  if (wrap) wrap.querySelectorAll('.chart-filter-btn').forEach(b => b.classList.remove('metric-active'));
  if (btn) btn.classList.add('metric-active');
}

function scProm(d){return d.estado_corte==='PROMESADO'||d.estado_corte==='PROMESA'}
function scRes(d) {return d.estado_corte==='RESERVADO'}

function scCls(e) {

// Tooltip
let scTip = null; // lazy-init: se asigna la primera vez que se usa
document.addEventListener('mousemove', e=>{
  if(!scTip) scTip = document.getElementById('sc-tip');
  if(scTip&&scTip.style.display!=='none'){
    scTip.style.left=Math.min(e.clientX+14,window.innerWidth-255)+'px';
    scTip.style.top=(e.clientY+14)+'px';

function scShowTip(el, evt){
  if(!scTip) scTip = document.getElementById('sc-tip');
  const suid = el.getAttribute('data-suid');
  if(!suid) return;
  const u=SC_UNITS[suid];if(!u||!scTip)return;
  const vendida = scVend(u);
  const nombre=(vendida&&u.nombre&&u.nombre.trim()&&u.nombre.trim()!=='Disponible')
    ?u.nombre.trim().split(' ')[0]+' '+(u.apellidos||'').trim().split(' ')[0]:'';
  // Precio tooltip: vendida → unidad principal (sin bodega/estac.) | disponible → precio base
  // Para disponibles se usa precio_total_operacion_uf, que en carga ya trae el precio
  // base (con fallback a lista si base=0). El precio es el mismo que muestra la celda.
  const precPrincipal = vendida
    ? Math.round((u.precio_total_operacion_uf||0)-(u.precio_bodega_uf||0)-(u.precio_estacionamiento_uf||0))
    : (u.precio_total_operacion_uf || 0);
  const est = Math.round(u.precio_estacionamiento_uf||0);
  const bod = Math.round(u.precio_bodega_uf||0);
  const tot = Math.round(u.precio_total_operacion_uf||0);
  const terrU = (parseFloat(u.m2_terraza)||0) || (TERRAZA_BY_ID[String(u.id_producto)]||0);  // terraza: ventas_pok o cotizaciones
  const m2efU = (parseFloat(u.m2)||0) + terrU/2;
  let precioHTML;
  if (vendida) {
    precioHTML = `Precio unidad principal: <strong>UF ${fmtUF(precPrincipal)}</strong><br>`
      + (est>0 ? `+ Estacionamiento: UF ${fmtUF(est)}<br>` : '')
      + (bod>0 ? `+ Bodega: UF ${fmtUF(bod)}<br>` : '')
      + ((est>0||bod>0) ? `<span style="border-top:1px solid rgba(255,255,255,.25);display:inline-block;margin-top:2px;padding-top:2px">Precio total operación: <strong>UF ${fmtUF(tot)}</strong></span><br>` : '');
  } else {
    precioHTML = `Precio Base: <strong>UF ${fmtUF(precPrincipal)}</strong><br>`;
  }
  scTip.innerHTML=`<strong>Und. ${u.propiedad||'—'} — Modelo ${u.modelo||'—'}</strong><br>
    Estado: <strong>${u.estado_corte}</strong><br>
    ${precioHTML}
    ${u.programa?'Tipología: '+u.programa+'<br>':''}
    ${u.m2?('Sup. útil: '+u.m2+' m²'+(terrU>0?(' · Terraza: '+terrU+' m²'):'')+'<br>'):''}
    ${(precPrincipal>0 && m2efU>0)?('UF/m² (útil + ½ terraza): <strong>'+(precPrincipal/m2efU).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})+' UF/m²</strong><br>'):''}
    ${nombre?'Cliente: '+nombre+'<br>':''}

function raMarcadores(gid){
  const st = RA_STATE[gid];
  const us = st.units.slice().sort((a,b)=>RA_COORDS[a.casa][1]-RA_COORDS[b.casa][1]);
  const vals = us.filter(u=>!u.bloq).map(u=>u.ufm2).filter(v=>v);
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  return us.map(u=>{
    const c = RA_COORDS[u.casa];
    if(u.bloq && !scVend(u.raw)){   // solo Etapa 2 sin vender

function raSectores(units){
  const hay = {};

  const lineas=[], chips=[];
  RA_SECTORES.forEach(s=>{
    const lx=s.lb[0]*RA_W, ly=s.lb[1]*RA_H;
    let mejor=null, dmin=Infinity;
    for(let n=s.de;n<=s.a;n++){
      if(!hay[n]||!RA_COORDS[n]) continue;
      const px=RA_COORDS[n][0]*RA_W, py=RA_COORDS[n][1]*RA_H;
      const d=(px-lx)*(px-lx)+(py-ly)*(py-ly);
      if(d<dmin){dmin=d;mejor=[px,py];}
    }
    if(!mejor) return;
    lineas.push('<line x1="'+lx.toFixed(1)+'" y1="'+ly.toFixed(1)+'" x2="'+mejor[0].toFixed(1)+'" y2="'+mejor[1].toFixed(1)+'"/>');
