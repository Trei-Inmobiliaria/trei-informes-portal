name: Informe de facturas (diario)

# Genera el informe de facturas recibidas con los datos de IConstruye, Softland y los eventos del SII
# (estos últimos los carga cada mañana el agente que corre en el PC de Control de Gestión) y publica los
# HTML en el bucket privado de Supabase. NO sube artefactos ni imprime cifras: este registro es público.
on:
  schedule:
    - cron: '30 11 * * *'   # 11:30 UTC = 08:30 hora de Chile (verano); 07:30 en invierno
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: informe-facturas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas psycopg2-binary openpyxl requests
      - name: Generar informe
        env:
          IC_DB_URL: ${{ secrets.IC_DB_URL }}
          SF_DB_URL: ${{ secrets.SF_DB_URL }}
          TZ: America/Santiago
        run: |
          # Hasta 3 intentos (las bases pueden estar ocupadas con sus cargas diarias). El detalle del error se oculta
          # porque este registro es público: solo se imprime la clase de la excepción.
          for i in 1 2 3; do
            if python herramientas/facturas/cruce_facturas_iconstruye_softland.py \
                 --plantilla herramientas/facturas/plantilla_facturas.html --salida salida --silencioso 2>err.txt; then
              exit 0
            fi
            echo "Intento $i falló: $(grep -oE '^[A-Za-z_.]*(Error|Exception)[A-Za-z]*' err.txt | tail -1)"
            [ "$i" -lt 3 ] && sleep 120
          done
          echo 'Falló la generación tras 3 intentos (detalle oculto: este registro es público)'
          exit 1
      - name: Publicar en Supabase (bucket privado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python herramientas/facturas/publicar_en_supabase.py salida/Facturas_Recibidas.html salida/Facturas_Recibidas_VCB.html
